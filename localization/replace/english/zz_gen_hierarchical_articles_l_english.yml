 ACTIVITY_GUEST_ARCHBISHOP_MINOR_HOST_REASON:0 "A [archbishop|E] has little time for minor [rulers|E]: $VALUE|=+0$"
 action_can_make_external_clerical_puppet_desc:0 "As a [ecclesiastical|E] or [theocratic|E] [ruler|E] of your [faith|E], [recipient.GetShortUIName] would accept being made into your [external_clerical_puppet|E].\n\n#help By using the $make_external_clerical_puppet_interaction$ [interaction|E], you gain access to powerful actions only available to [clergy|E].\n\nIf you are [christian|E], this may include being able to manipulate [ecumenical_councils|E] and the distribution of [clerical_titles|E].#!"
 catalyst_clergy_archbishop_murdered_desc:0 "A [archbishop|E] is killed"
 catalyst_clergy_attended_feast_desc:0 "A [archbishop|E] or [cardinal|E] attends a [ruler|E]'s [GetActivityType('activity_feast').GetName]"
 ecclesiastic_grant_claim_interaction_desc:0 "Create a [claim|E] on one of [recipient.GetShortUINamePossessive] titles with the aid of a [ecclesiastical|E] [ruler|E] or your [head_of_faith|E]"
 ecclesiastic_transfer_land_interaction_desc:0 "Gain [recipient.GetShortUINamePossessive] [vassals|E] or [titles|E] you [claim|E] or have [de_jure|E] [titles|E] rights over, using the aid of a [ecclesiastical|E] [ruler|E]"
 ecclesiastical_government_potential_domicile:0 "$potential_domicile$\nRise through the ranks to become a [archbishop|E] and be granted your own [domicile|E]."
 fervor_loss_pam_archbishop_deposed:0 "Deposed a [archbishop|E] of another [rite|E]"
 game_concept_clerical_region_capital_desc:0 "The Clerical Region Capital is the [county|E] a [clerical_region|E] was founded upon with a [ecclesiastical_estate|E], serving as the seat of the [clerical_title|E] that governs the region. Unlike a [de_jure_capital|E], it is fixed to the region and cannot be relocated."
 game_concept_external_clerical_puppet_desc:0 "A powerful member of the [clergy|E] — a [archbishop|E] or even the [head_of_faith|E] — that has become the [puppet|E] of another [ruler|E].\n\nThe mightier the cleric, the greater the reach: a puppeted Head of Faith can [excommunicate|E] your enemies, appoint [cardinals|E], grant a [pressed_claim|E], or incite a [holy_war|E] on your behalf."
 game_concept_grand_cathedral_desc:0 "A Grand Cathedral is a [great_building|E] raised through a [great_project|E] in the capital of a [archdiocese|E], the seat of its [archbishop|E].\n\nRaising the first Cathedral is a monumental act of devotion: its founder gains lasting [piety|E], [legitimacy|E] and [spiritual_fulfillment|E], an additional [personal_tenet|E] slot, and a standing bonus to their same-[faith|E] [opinion|E]. Once raised, it draws Christian pilgrims from across [christendom|E], expands the holder's [cathedral_complex|E], and may later be enlarged into a [GetBuilding('great_project_cathedral_02').GetName|V] or [GetBuilding('great_project_cathedral_03').GetName|V]."
 game_concept_monastic_order_patron_desc:0 "A Monastic Order Patron is a [ecclesiastical|E] or secular [ruler|E] of [duchy|E] [title_tier|E] or higher who sustains a [monastic_holy_order|E], most often the ruler who founded it. A patron endows the order with worldly wealth, leasing it [temple_holdings|E] and donating [gold|E] to its coffers.\n\nIn return for this generosity, the patron earns [piety|E] and [spiritual_fulfillment|E]. They may also take control of the Order's leader, and have them execute [clerical|E] interactions as a [puppet|E]."
 game_concept_player_heir_desc:0 "The $game_concept_player_heir$ is the [heir|E] that a player will keep playing as on [succession|E].\n\nThe $game_concept_player_heir$ is usually the same as the [primary_heir|E], but if the [succession_law|E] of your [primary_title|E] dictates that it should go to a character outside of your [dynasty|E], you will instead keep playing as the dynastic heir to your second highest-tier title (or third, fourth, etc.).\n\nThis situation is common when your $game_concept_player_heir$ is voted out under an Elective Succession Law. If you are [house_head|E] of a [noble_family|E] in an [administrative|E] [realm|E] you may lose your Realm to Primary Heirs outside of your [house|E] but retain your Noble Family Title.\n\nIf you are [ecclesiastical|e], your $game_concept_player_heir$ is the character who is set to inherit your [primary_title|e], usually a [archdiocese|e]."
 grant_ecclesiastical_title_interaction_desc:0 "Grant an existing [clerical_title|E] to [recipient.GetShortUIName], deposing its current [holder|E] if the seat is not vacant\n\n#weak Deposing a [archbishop|E] who follows another [rite|E] demands greater [learning|E] than theirs, far more [piety|E], and weakens your [faith|E]'s [fervor|E]#!"
 pam_mass_rite_conversion_founder_clergy_tt:0 "Must hold a [clerical_title|E], have [ecclesiastical|E] [government|E], be a member of the [clergy|E], or have a [archbishop|E] or higher as your [puppet|E]"
 pam_proclaim_living_word_decision_archbishop_tt:0 "You are a [archbishop|E]"
 pam_proclaim_living_word_decision_puppet_tt:0 "One of your [puppets|E] is a [archbishop|E] or higher"
 pam_shape_the_christian_church_decision_archbishop_tt:0 "You hold a [archdiocese|E]"
 reactive_advice_clerical_regions_5_desc:0 "The [rite|e] of a [clerical_region|e]'s [holder|e] will gradually spread to the counties within the region.\n\nIf you would like to keep your lands from converting it may be wise to try to find a [archbishop|e] who shares your $game_concept_rite$. As a [secular_ruler|e], you could accomplish this by ordering a [puppet|e] to ask their [head_of_faith|e] for a [clerical_title|e]."
 reactive_advice_ecclesiastical_ruler_archdiocese_succession:0 "Becoming a $game_concept_archbishop$"
 reactive_advice_ecclesiastical_ruler_archdiocese_succession_desc:0 "When playing as a [ecclesiastical|e] character, and especially if you are not already a [archbishop|e], you might want to keep an eye on the [succession|e] of the [title|e].\n\nTo acquire a $game_concept_archdiocese$, you can use the #V $influence_clerical_candidacy_interaction$#! Interaction on yourself. This increases your [candidate_score|e] for the [title|e].\n\nClerical $game_concept_candidate_score$ can also be increased by several other means, such as a high [learning|e] [skill|e], or by having [virtuous|e] traits."
 reactive_advice_ecclesiastical_ruler_desc:0 "As a [ecclesiastical|e] character, you are part of the [clergy|e] of your [faith|e].\n\nWhen playing as this government type, your [heir|e] is the person first in line to inherit your [primary_title|e], regardless of their [dynasty|e]."
 reactive_advice_ecclesiastical_ruler_map_mode_desc:0 "Your [faith|e] divides its lands into [clerical_regions|e] called [archdioceses|e], each one held by a member of [clergy|e].\n\nAs a [ecclesiastical|e] [ruler|e], you can only ever hold one $game_concept_archdiocese$ at a time.\n\nLet's take a look at them!"
 reactive_advice_ecclesiastical_ruler_open_archdiocese:0 "Inspect a $game_concept_archdiocese$"
 reactive_advice_ecclesiastical_ruler_open_archdiocese_desc:0 "These are all the [clerical_regions|e] within your [faith|e]. Holding a [archdiocese|e] gives you access to a [cathedral_complex|e], a special kind of [domicile|e].\n\nIf you're not already a [archbishop|e], becoming one would be a good first goal. Either way, let's take a look at the $game_concept_clerical_region$ view."
 replace_ecclesiastical_title_holder_interaction_desc:0 "Depose [recipient.GetShortUIName] and grant [recipient.GetHerHis] [clerical_title|E] to a worthier cleric\n\n#weak Deposing a [archbishop|E] who follows another [rite|E] demands greater [learning|E] than theirs, far more [piety|E], and weakens your [faith|E]'s [fervor|E]#!"
 target_char_must_be_clerical_subordinate_tt:0 "As a [ecclesiastical|E] or [theocratic|E] [ruler|E], [target_char.GetShortUIName] must be [excommunicator.GetShortUINamePossessive] [vassal|E], [subordinate|E] or below"
