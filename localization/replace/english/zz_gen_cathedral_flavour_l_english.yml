l_english:
 # Cathedral stories for procedural content only. Choices and rewards retain their native meaning.
 pam_great_projects_events.0002.a:0 "Seekers beholding a revelation of [ROOT.Char.GetFaith.HighGodName]."
 pam_great_projects_events.0002.b:0 "[ROOT.Char.Custom('GenCathedralSaint')|U] in solitary contemplation."
 pam_great_projects_events.0002.c:0 "The first faithful journeying toward their sacred homeland."
 pam_great_projects_events.0002.d:0 "A vision announcing the blessing of [ROOT.Char.GetFaith.HighGodName]."
 pam_great_projects_events.0002.desc:0 "Our priests teach the traditions of [ROOT.Char.GetFaith.GetName], but sacred images make those teachings visible to all.\n\nWith the necessary funds gathered and painters assembled, I must decide which scenes will adorn the vaults, walls, and ceilings."
 pam_great_projects_events.0002.e:0 "[ROOT.Char.Custom('GenCathedralSaint')|U] teaching those who seek wisdom."
 pam_great_projects_events.0002.f:0 "A revered teacher serving the poorest of the faithful."
 pam_great_projects_events.0003.a:0 "A sacred tree honoring the ancestors of [ROOT.Char.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0003.a.flavor:0 "Its roots embrace our ancestors, its branches their descendants: a reminder of the duties that bind each generation to the next."
 pam_great_projects_events.0003.d:0 "A window honoring [ROOT.Char.Custom('GenCathedralSaint')], with a perpetual lamp."
 pam_great_projects_events.0003.d.flavor:0 "The lamp and candles will keep the saint's example bright before all who enter."
 pam_great_projects_events.0005.desc.intro:0 "The first stone is laid! Like an acorn preceding an oak, the seat of [owner.GetTitledFirstName] will grow into a monument to [ROOT.Char.GetFaith.HighGodName]. Each stone and timber will speak to the [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] of [owner.GetPrimaryTitle.GetNameNoTier] and beyond.\n\n[CharMyFirstNames(founder)|U] generosity in funding the construction will be remembered by every worshiper."
 pam_great_projects_events.0006.c:0 "[ROOT.Char.GetFaith.HighGodName] alone can guide the proceedings."
 pam_great_projects_events.0006.desc.intro:0 "a series of wooden stakes, with rope drawn taut between them tracing the sacred halls of the building to come."
 pam_great_projects_events.0007.b:0 "Preach a sermon of repentance and renewal."
 pam_great_projects_events.0007.desc.outro:0 "\n\nAs I rest my gaze on a bay of completed vaulting, the stone ribs seem to carry the weight of an entire mountain. Beneath them, the faithful will find shelter and a place to contemplate [ROOT.Char.GetFaith.HighGodName]."
 pam_great_projects_events.0008.b:0 "He could be an instrument of [ROOT.Char.GetFaith.HighGodName]."
 pam_great_projects_events.0008.b.flavor:0 "Our sacred tales are filled with humble souls whose courage overcame impossible odds."
 pam_great_projects_events.0008.t:0 "$game_concept_grand_cathedral$: Casting the Voice of [ROOT.Char.GetFaith.HighGodName]"
 pam_great_projects_events.0009.a:0 "Let the [province.Custom('GetTerrainType')|l] of [province.GetNameNoTooltip] hear [ROOT.Char.GetFaith.HighGodNamePossessive] voice."
 pam_great_projects_events.0009.desc.success_end:0 "\n\nThe molten bronze eases into the mold as if guided by [ROOT.Char.GetFaith.HighGodNamePossessive] hand, and emerges complete. It is then hoisted and rings out a clarion call to all [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n"Come to the house of [ROOT.Char.GetFaith.HighGodName]!""
 pam_great_projects_events.0009.t:0 "$game_concept_grand_cathedral$: And [ROOT.Char.GetFaith.HighGodName] Spoke"
 pam_great_projects_events.0011.c:0 "Impressive, but I would leave such deeds to [ROOT.Char.GetFaith.HighGodName]."
 pam_great_projects_events.0011.desc.outro:0 "\n\nAs if by the hand of [ROOT.Char.GetFaith.HighGodName], its ropes and pulleys hoist massive pieces of freshly cut [Glossary('ashlar','ASHLAR_GLOSS')] and buckets of mortar up to the in-progress roof. I stare in awe at the load which would have broken the backs of hodmen in the yard below."
 pam_great_projects_events.0011.t:0 "$game_concept_grand_cathedral$: As If By [ROOT.Char.GetFaith.HighGodName]'s Hand"
 pam_great_projects_events.0012.a:0 "Let reconciliation overcome hatred."
 pam_great_projects_events.0012.a.flavor:0 "Peace begins with those willing to lay aside a grievance."
 pam_great_projects_events.0012.b:0 "Honor the faithful work of every hand."
 pam_great_projects_events.0012.b.flavor:0 "No great sanctuary rises through idleness; each day's honest labor lays another stone."
 pam_great_projects_events.0012.c:0 "Stand together as one community."
 pam_great_projects_events.0012.c.flavor:0 "Shared purpose binds the faithful more firmly than quarrels divide them."
 pam_great_projects_events.0012.d:0 "Find joy in devotion to [ROOT.Char.GetFaith.HighGodName]."
 pam_great_projects_events.0012.d.flavor:0 "Give thanks for what sustains us, and let hope strengthen those who struggle."
 pam_great_projects_events.0012.desc:0 "The west face is complete! Its portal stands ready to welcome worshipers. The [cathedral_building.GetName] may take a lifetime to finish, but the [owner.GetFaith.GetAdherentNamePluralNoTooltip] of [owner.GetPrimaryTitle.GetNameNoTier] already gather beneath its arches.\n\nI speak of our sacred teachings and the responsibilities we share before [ROOT.Char.GetFaith.HighGodName]. What lesson shall they carry home?"
 pam_great_projects_events.0012.e:0 "Persevere when the path grows difficult."
 pam_great_projects_events.0012.e.flavor:0 "A worthy undertaking asks patience of every generation that carries it forward."
 pam_great_projects_events.0012.f:0 "Open your hands to those in need."
 pam_great_projects_events.0012.f.flavor:0 "Devotion is made visible when we feed the hungry and shelter the weary."
 pam_great_projects_events.0012.t:0 "$game_concept_grand_cathedral$: A Lesson for the Faithful"
 pam_great_projects_events.0013.castrato:0 "Preserve this voice for [ROOT.Char.GetFaith.HighGodName]'s cantoria."
 pam_great_projects_events.0013.desc:0 "The thunk of the carpenter's mallets echo out above us, a foretelling of the acoustics that will soon bathe worshipers in the Word of [ROOT.Char.GetFaith.HighGodName].\n\n[architect.GetFirstName] explains, "It is to be a modest loft where the canons will lead the liturgy, our own [Glossary('cantoria','CANTORIA_GLOSS')]! Indeed, we must use a different voice when we address [ROOT.Char.GetFaith.HighGodName] than when we speak to men." [architect.GetSheHe|U] then beckons a young choir boy, [choir_boy.GetFirstName], forward.\n\nThe child scampers up the scaffold and breathes forth an angelic note; as it rings round the walls and enters my body, it is as if [ROOT.Char.GetFaith.HighGodName] has passed through me."
 pam_great_projects_events.0020.desc:0 "At long last, the sacred emblems are affixed to the spires. They proclaim our devotion to [ROOT.Char.GetFaith.HighGodName] above the roofs of [province.GetName].\n\nSince construction began, children became parents, and parents grew old. Their toil, their sweat and sacrifice, are now immortalized in stone.\n\nEmpires may fall, but the [cathedral_building.GetName] will stand as a sanctuary for generations of the faithful."
 gen_cathedral_saint_name:0 "[gen_cathedral_saint.GetTitledFirstName]"
 gen_cathedral_saint_fallback:0 "a revered saint of [ROOT.Char.GetFaith.GetName]"
 pam_cathedral_sermon_peace_ruler_modifier_desc:0 "This ruler was moved by a cathedral sermon on reconciliation and peace."
 pam_cathedral_sermon_unity_ruler_modifier_desc:0 "This ruler was moved by a cathedral sermon on fellowship among the faithful."
