l_simp_chinese:
 bm_japan_two_courts:0 "一天二帝"
 bm_japan_two_courts_desc:0 "1337年，日本的南朝与北朝各奉天皇，武家与公卿的忠诚交错。足利氏在京都建立权力，后醍醐天皇则于吉野继续抵抗。天下将归于谁手？"
 bm_japan_courts_takauji:0 "足利尊氏"
 bm_japan_courts_takauji_subheading:0 "征夷大将军"
 bm_japan_courts_takauji_desc:0 "足利尊氏掌握幕府的力量。南朝仍在抵抗，而武家同盟的忠诚远非牢不可破。"
 bm_japan_courts_tadayoshi:0 "足利直义"
 bm_japan_courts_tadayoshi_subheading:0 "幕府的治理者"
 bm_japan_courts_tadayoshi_desc:0 "足利尊氏之弟直义参与治理武家政权。如何在兄长与各家武士之间维系权力？"
 bm_japan_courts_moronao:0 "高师直"
 bm_japan_courts_moronao_subheading:0 "足利家的重臣"
 bm_japan_courts_moronao_desc:0 "高师直是足利家的重臣。他在乱世中掌握军事与政治力量，也必须面对武家内部的竞争。"
 bm_japan_courts_doyo:0 "佐佐木道誉"
 bm_japan_courts_doyo_subheading:0 "婆娑罗大名"
 bm_japan_courts_doyo_desc:0 "佐佐木道誉，又称京极道誉，在朝廷与武家之间纵横。动荡时代正为雄心与机谋提供舞台。"
 bm_japan_courts_go_daigo:0 "后醍醐天皇"
 bm_japan_courts_go_daigo_subheading:0 "南朝天皇"
 bm_japan_courts_go_daigo_desc:0 "后醍醐天皇在吉野坚持自己的朝廷，与京都的北朝对立。南朝的存续有赖于忠臣和武士的支持。"
 bm_japan_courts_masatsura:0 "楠木正行"
 bm_japan_courts_masatsura_subheading:0 "楠木家的继承者"
 bm_japan_courts_masatsura_desc:0 "楠木正行继承了父亲的事业。南朝需要忠诚的武士，而家族的未来仍待他亲手书写。"
 bm_japan_courts_yoshisada:0 "新田义贞"
 bm_japan_courts_yoshisada_subheading:0 "南朝的武将"
 bm_japan_courts_yoshisada_desc:0 "新田义贞支持后醍醐天皇，与足利方争夺天下。战局多变，他能否为南朝赢得转机？"
 bm_japan_courts_akiie:0 "北畠显家"
 bm_japan_courts_akiie_subheading:0 "奥羽的统帅"
 bm_japan_courts_akiie_desc:0 "北畠显家在奥羽拥有势力，是南朝的重要武将。面对漫长的道路和强敌，他将如何支援朝廷？"
 bm_japan_courts_tokiyuki:0 "北条时行"
 bm_japan_courts_tokiyuki_subheading:0 "擅长逃跑的殿下"
 bm_japan_courts_tokiyuki_desc:0 "镰仓幕府覆灭后，北条时行仍在乱世中求生。如今，年少的北条家继承人将如何重振家族？"
