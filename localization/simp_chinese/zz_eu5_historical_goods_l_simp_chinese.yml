l_simp_chinese:
 eu5_goods_alpujarras_silk_base:0 "阿尔普哈拉斯丝绸"
 eu5_goods_alpujarras_silk_base_desc:0 "内华达山脉南麓阿尔普哈拉斯诸村的桑林与蚕舍，为格拉纳达和阿尔梅里亚的织机提供原丝，这些生丝须经严格的 #italic ḥisba #! 督察机构检验分级，再由热那亚商人收购运往佛兰德与英格兰的市场。"
 eu5_goods_amber_coast_base:0 "琥珀海岸"
 eu5_goods_amber_coast_base_desc:0 "该地区的海岸线蕴藏着大量琥珀矿藏。"
 eu5_goods_bengal_cotton_base:0 "孟加拉棉花种植"
 eu5_goods_bengal_cotton_base_desc:0 "孟加拉温暖湿润的气候非常适合种植优质棉花，使其成为世界上棉花产量最高的地区之一。"
 eu5_goods_coffee_yemen_base:0 "阿拉比卡咖啡"
 eu5_goods_coffee_yemen_base_desc:0 "也门的土壤能够生产大量咖啡豆。"
 eu5_goods_england_wool_base:0 "英格兰羊毛产区"
 eu5_goods_england_wool_base_desc:0 "该区域生产的羊毛在世界范围内亦属上乘，受到欧洲各地布料商人的追捧。"
 eu5_goods_flanders_fine_cloth_base:0 "佛兰德纺织传统"
 eu5_goods_flanders_fine_cloth_base_desc:0 "佛兰德织工数代人以来一直在改进他们的工艺，生产出的品质卓越的精纺品，在欧洲各地都能卖出高价。"
 eu5_goods_granada_pottery_base:0 "格拉纳达陶器"
 eu5_goods_granada_pottery_base_desc:0 "达罗河与赫尼尔河沿岸的黏土层，为阿尔拜辛区的虹彩陶器与#italic 干绳法#!工坊供应原料。这些工坊出产瓷砖、陶罐与餐具，其釉面工艺之精，自开罗至布鲁日无不赞美，其中上品则装点着阿尔罕布拉宫的殿宇本身。"
 eu5_goods_gujarat_cotton_base:0 "古吉拉特棉花种植"
 eu5_goods_gujarat_cotton_base_desc:0 "古吉拉特肥沃的平原盛产棉花，这是该地区纺织品贸易的基石。"
 eu5_goods_malaga_sweet_wine_base:0 "马拉加葡萄园和制糖厂"
 eu5_goods_malaga_sweet_wine_base_desc:0 "马拉加的沿海#italic 灌溉平原#!上的甘蔗种植园与葡萄园，自10世纪以来由安达卢斯工程师精心耕作，不仅供应本地市场，也经由热那亚商人家族将产品运往布鲁日和亚历山大港。"
 eu5_goods_newfoundland_fishing_grounds_base:0 "纽芬兰大浅滩渔场"
 eu5_goods_newfoundland_fishing_grounds_base_desc:0 "纽芬兰岛周边海域堪称全球最丰饶的渔场。"
 eu5_goods_skane_herring_market:0 "斯科讷鲱鱼市场"
 eu5_goods_skane_herring_market_desc:0 "建于约1200年，是整个斯堪的纳维亚的最大的鲱鱼交易市场。"
 eu5_goods_spice_islands_base:0 "香料群岛丁香"
 eu5_goods_spice_islands_base_desc:0 "这座岛屿上广泛种植着备受青睐的香料——丁香。"
 eu5_goods_tuscany_fine_cloth_base:0 "托斯卡纳纺织传统"
 eu5_goods_tuscany_fine_cloth_base_desc:0 "佛罗伦萨和卢卡长期以来一直是意大利著名的精纺品生产中心，其行会的技术令欧洲羡慕不已。"
 eu5_goods_venice_glass_base:0 "穆拉诺玻璃制造传统"
 eu5_goods_venice_glass_base_desc:0 "穆拉诺的玻璃制造商掌握了世代相传的技术，能生产出质量无与伦比的玻璃器。"
 eu5_goods_yorkshire_cloth_base:0 "约克纺织业"
 eu5_goods_yorkshire_cloth_base_desc:0 "约克郡和中英格兰东部的城镇发展出了繁荣的纺织业，这里的织工擅长生产优质的羊毛布。"
