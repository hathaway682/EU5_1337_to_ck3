l_simp_chinese:
 # === 修正 ===
 phx_black_death_outbreak_county_modifier:0 "黑死病阴霾"
 phx_black_death_outbreak_county_modifier_desc:0 "寂静的街巷、紧闭的集市与昼夜不停的丧钟，昭示着此地正深陷大瘟疫的煎熬。"
 phx_black_death_quarantine_modifier:0 "封港锁城检疫令"
 phx_black_death_quarantine_modifier_desc:0 "严守的城门、四十日海港停泊隔离与巡夜烽火虽令商旅暂歇，却有效遏止了疫疠蔓延。"
 phx_black_death_post_plague_boom_modifier:0 "疫后工商复兴"
 phx_black_death_post_plague_boom_modifier_desc:0 "劳力稀缺催生了更自由的租佃契约、兴盛的市镇行会与更精明的商业投资。"
 phx_schism_avignon_obedience_modifier:0 "奉阿维尼翁教廷正朔"
 phx_schism_avignon_obedience_modifier_desc:0 "本朝承认罗讷河畔的教宗法统，由此换得财政特许与外交便利，却也招致分裂教会中的非议。"
 phx_schism_roman_obedience_modifier:0 "奉罗马教廷正朔"
 phx_schism_roman_obedience_modifier_desc:0 "本国恪守罗马圣彼得宝座的正统，凝聚了忠直主教与虔诚臣民的拥护。"
 phx_schism_conciliar_unity_modifier:0 "大公会议合一护法"
 phx_schism_conciliar_unity_modifier_desc:0 "因引领拉丁教会走出长达数十年的大分裂，君主在天主教诸国间享有崇高声望。"
 phx_timur_scourge_modifier:0 "河中铁蹄之剑"
 phx_timur_scourge_modifier_desc:0 "严酷军纪、疾如雷霆的草原奔袭与令人胆寒的威名，正驱策这位征服者的旌旗席卷欧亚。"
 phx_timur_samarkand_renaissance_modifier:0 "撒马尔罕松石盛世"
 phx_timur_samarkand_renaissance_modifier_desc:0 "汇集自四海的大匠、书家与丝路商队，将撒马尔罕装点为举世仰望的明珠之城。"
 phx_ibe_strait_mastery_modifier:0 "海格力斯之柱主宰"
 phx_ibe_strait_mastery_modifier_desc:0 "扼守海峡两岸的烽燧与战船牢牢掌控着地中海与大西洋之间的咽喉航道。"
 phx_ibe_atlantic_pioneers_modifier:0 "大西洋航海学派"
 phx_ibe_atlantic_pioneers_modifier_desc:0 "天文学家、航海针经与三角帆卡拉维尔船正推动罗盘与海图驶向未知的浩瀚洋面。"
 phx_gra_alhambra_golden_age_modifier:0 "阿尔罕布拉黄金时代"
 phx_gra_alhambra_golden_age_modifier_desc:0 "精雕灰泥庭院、潺潺喷泉与博学诗人令格拉纳达成为西部伊斯兰世界最璀璨的明珠。"
 phx_ita_early_renaissance_patron_modifier:0 "早期文艺复兴庇护者"
 phx_ita_early_renaissance_patron_modifier_desc:0 "人文藏书馆、雕塑工坊与商业银行源源不断地将意大利最杰出的头脑吸引至本朝宫廷。"
 phx_ita_condottieri_contracts_modifier:0 "雇佣兵团战契"
 phx_ita_condottieri_contracts_modifier_desc:0 "久经战阵的自由佣兵团在契约旗帜下集结，为领地征伐注入冷酷而老练的战力。"
 phx_mam_red_sea_monopoly_modifier:0 "红海香料专营霸权"
 phx_mam_red_sea_monopoly_modifier_desc:0 "卡里米商帮与马穆鲁克税关在开罗印玺之下，牢牢扼住自亚丁至亚历山大里亚的胡椒与香料命脉。"
 phx_dlh_tughluq_turmoil_modifier:0 "图格鲁克朝局动荡"
 phx_dlh_tughluq_turmoil_modifier_desc:0 "激进的财政试验、铜币代银风波与遥远行省的叛乱正严重消耗着德里苏丹国的威权。"
 phx_dlh_reformed_diwan_modifier:0 "重整图格鲁克度支衙门"
 phx_dlh_reformed_diwan_modifier_desc:0 "恢复稳健银币税册、整肃行省审计与审慎授封伊克塔采邑，令德里帝国重振筋骨。"
 phx_vij_hampi_bulwark_modifier:0 "栋格珀德拉堡垒"
 phx_vij_hampi_bulwark_modifier_desc:0 "花岗岩群山、神庙战旗与坚毅的德干将领在亨比周围筑起不可动摇的南方屏障。"
 phx_maj_palapa_oath_modifier:0 "帕拉帕大誓"
 phx_maj_palapa_oath_modifier_desc:0 "怀着一统努山塔拉的庄严宏愿，满者伯夷战船与使节正将曼陀罗天威播撒于香料群海。"
 phx_kor_late_goryeo_reform_modifier:0 "高丽末年新政宪章"
 phx_kor_late_goryeo_reform_modifier_desc:0 "重用清流士大夫、清理田籍与加固沿海烽燧，令高丽得以抵御权臣倾轧与倭寇侵扰。"
 phx_mal_sankore_scholars_modifier:0 "桑科雷学院之光"
 phx_mal_sankore_scholars_modifier_desc:0 "法学家、天文学家与抄经大师云集尼日尔河湾，使廷巴克图成为声闻遐迩的学问与财富灯塔。"
 phx_eth_solomonic_zeal_modifier:0 "犹大之狮圣旗"
 phx_eth_solomonic_zeal_modifier_desc:0 "高原修道院与王室编年史传颂着不绝的所罗门圣约，激励着埃塞俄比亚将士与万千信众。"

 # === 部队名称 ===
 phx_timur_samarkand_guard_name:0 "撒马尔罕御前万人队"
 phx_timur_iranian_host_name:0 "古尔汗西征大军"
 phx_timur_gurkani_tumen_name:0 "跛子铁木儿先锋营"
 phx_timur_gurkani_vanguard_name:0 "河中古尔汗铁骑"
 phx_iran_frontier_garrison_name:0 "扎格罗斯边防军"
 phx_delhi_elephant_host_name:0 "苏丹国战象军团"
 phx_eur_strait_vanguard_name:0 "海峡先锋军"
 phx_ita_condottieri_company_name:0 "特许自由佣兵团"
 phx_mam_royal_mamluks_name:0 "开罗城堡御前马穆鲁克"
 phx_kor_coastal_garrison_name:0 "高丽镇海守备军"
 phx_eth_solomonic_guard_name:0 "阿姆哈拉高原卫队"

 # === 决议 (12) ===
 phx_plague_enact_quarantine_decision:0 "颁布封港与锁城检疫令"
 phx_plague_enact_quarantine_decision_desc:0 "一艘艘半数水手暴毙舱底的商船漂进港湾，惊惶逃难的行旅正沿着大道将黑斑瘟疫四处播散。拉起横江铁链、紧闭城门并令入港商船孤悬锚地四十日，或许能为国都挡住大瘟疫最凶猛的浪头。"
 phx_plague_enact_quarantine_decision_tooltip:0 "封闭港口与城门实施严格检疫，护持国都免受黑死病重创。"
 phx_plague_enact_quarantine_decision_confirm:0 "颁行封港锁城令"
 phx_plague_enact_quarantine_effect_tt:0 "在领地内推行严密检疫隔离，并缓解都城正在肆虐的瘟疫灾情。"

 phx_schism_convene_constance_council_decision:0 "倡议召开康斯坦茨大公会议"
 phx_schism_convene_constance_council_decision_desc:0 "罗马与阿维尼翁的两位对立教宗互颁绝罚令，整个西方基督教世界随之裂为壁垒森严的阵营。唯有凭借强盛王权担保召开普世大公会议，方能迫使争位者退位，使教会重归一位无可争议的牧者。"
 phx_schism_convene_constance_council_decision_tooltip:0 "主持召开普世大公会议，终结西方教会大分裂并重聚天主教世界。"
 phx_schism_convene_constance_council_decision_confirm:0 "召集普世大公会议"
 phx_schism_convene_constance_council_effect_tt:0 "在世界范围内终结西方教会大分裂，并令你作为教会合一护法受各国敬仰。"

 phx_ibe_secure_strait_of_gibraltar_decision:0 "主宰海格力斯之柱"
 phx_ibe_secure_strait_of_gibraltar_decision_desc:0 "数代以来，大军与战船反复争夺这条衔接伊比利亚与马格里布的狭长水道。牢牢掌控海峡要港，便决定了谁能手握西地中海门户并收揽欧非两洲的往来关津。"
 phx_ibe_secure_strait_of_gibraltar_decision_tooltip:0 "在直布罗陀海峡建立稳固的海军与要塞霸权。"
 phx_ibe_secure_strait_of_gibraltar_decision_confirm:0 "宣告海峡霸权"
 phx_ibe_secure_strait_of_gibraltar_effect_tt:0 "强化海上投送能力，并带动直布罗陀海峡沿岸重镇繁荣兴盛。"

 phx_ibe_sponsor_atlantic_navigators_decision:0 "赞助大西洋航海学派"
 phx_ibe_sponsor_atlantic_navigators_decision_desc:0 "海格力斯之柱以外是苍茫未知的“幽暗绿海”，无畏船长们低语着远方群岛、信风航道与南方黄金的传说。由王室颁诏延揽制图师、星盘匠与造船名家，便能将狂暴大洋化作帝国通途。"
 phx_ibe_sponsor_atlantic_navigators_decision_tooltip:0 "兴办王室航海学院与波托兰海图工坊，开拓大西洋远航之路。"
 phx_ibe_sponsor_atlantic_navigators_decision_confirm:0 "颁诏兴办航海学院"
 phx_ibe_sponsor_atlantic_navigators_effect_tt:0 "推进远洋航海针经革新，为领地开启远洋探险与海上霸业铺平道路。"

 phx_gra_complete_alhambra_palaces_decision:0 "落成格拉纳达红堡宫阙"
 phx_gra_complete_alhambra_palaces_decision_desc:0 "达罗河畔高崖之上，纳斯里德王朝的红墙宫堡巍然耸立；雕花灰泥柱廊、雪松藻井与镜面水池昭示着安达卢斯文明依然熠熠生辉。完成王宫诸殿，必将令友邦与强敌同为格拉纳达的气度折服。"
 phx_gra_complete_alhambra_palaces_decision_tooltip:0 "建成宏伟的阿尔罕布拉王宫群，开启纳斯里德王朝的黄金时代。"
 phx_gra_complete_alhambra_palaces_decision_confirm:0 "揭幕红堡新宫"
 phx_gra_complete_alhambra_palaces_effect_tt:0 "圆满落成阿尔罕布拉宫阙，大幅提升格拉纳达的威望、学风与守土决心。"

 phx_ita_patronize_humanist_renaissance_decision:0 "庇护意大利早期文艺复兴"
 phx_ita_patronize_humanist_renaissance_decision_desc:0 "在托斯卡纳的画坊与伦巴第的修院间，学者们正拭去古典拉丁手稿上的尘埃，画师与建筑师亦以全新目光丈量透视与比例。敞开府库资助人文硕儒与大匠，将令我城成为新时代最耀眼的中心。"
 phx_ita_patronize_humanist_renaissance_decision_tooltip:0 "资助人文学者、建筑巨匠与艺术家，引领早期文艺复兴风潮。"
 phx_ita_patronize_humanist_renaissance_decision_confirm:0 "兴建学苑与工坊"
 phx_ita_patronize_humanist_renaissance_effect_tt:0 "确立本朝作为人文学术、市政建筑与金融兴盛的首善庇护者地位。"

 phx_mam_red_sea_spice_hegemony_decision:0 "巩固红海香料专营霸权"
 phx_mam_red_sea_spice_hegemony_decision_desc:0 "每一捆运往威尼斯或热那亚商船的马拉巴尔胡椒与摩鹿加丁香，都须经开罗税吏严密查验。正式确立王室与卡里米香料商帮的盟约，将使埃及国库牢牢坐稳印度洋与地中海之间无可替代的黄金桥梁。"
 phx_mam_red_sea_spice_hegemony_decision_tooltip:0 "将卡里米香料贸易与亚历山大里亚关税牢牢系于马穆鲁克王权。"
 phx_mam_red_sea_spice_hegemony_decision_confirm:0 "御批香料专营宪章"
 phx_mam_red_sea_spice_hegemony_effect_tt:0 "巩固埃及对红海香料财源的垄断，并推动开罗与亚历山大里亚商埠兴旺。"

 phx_dlh_stabilize_tughluq_sultanate_decision:0 "整顿图格鲁克度支衙门"
 phx_dlh_stabilize_tughluq_sultanate_decision_desc:0 "好大喜功的政令、强推铜币代银与仓促南迁已令地方总督离心、两河农夫逃散。在德里重新确立稳健的银币税籍与可稽查的财政书吏体系，方能平息诸省怨言、稳固印度斯坦皇座。"
 phx_dlh_stabilize_tughluq_sultanate_decision_tooltip:0 "整顿德里财政中枢，终结图格鲁克王朝的行政与财政动荡。"
 phx_dlh_stabilize_tughluq_sultanate_decision_confirm:0 "颁布度支整顿条例"
 phx_dlh_stabilize_tughluq_sultanate_effect_tt:0 "解除“图格鲁克朝局动荡”，在德里重建稳健有序的帝国财政中枢。"

 phx_maj_proclaim_palapa_oath_decision:0 "宣誓加查·马达的帕拉帕大誓"
 phx_maj_proclaim_palapa_oath_decision_desc:0 "在特罗乌兰庄严的朝会之上，大宰相立誓在一统群岛诸邦、令努山塔拉共仰满者伯夷曼陀罗威光之前，绝不享香料珍馐。由王座亲自背书此誓，必将凝聚爪哇水师与诸藩共赴群海霸业。"
 phx_maj_proclaim_palapa_oath_decision_tooltip:0 "背书庄严的帕拉帕大誓，将满者伯夷霸权远播努山塔拉群海。"
 phx_maj_proclaim_palapa_oath_decision_confirm:0 "宣读帕拉帕大誓"
 phx_maj_proclaim_palapa_oath_effect_tt:0 "以帕拉帕大誓激励满者伯夷水师与诸侯，大幅提升特罗乌兰王廷威仪。"

 phx_mal_expand_sankore_university_decision:0 "兴建大清真寺与桑科雷学院"
 phx_mal_expand_sankore_university_decision_desc:0 "撒哈拉的岩盐板与布雷的沙金在尼日尔河湾交汇，来自非斯、开罗与麦加的学者于灯下潜心抄录典籍。扩建廷巴克图的经学院与藏书馆，将令马里的威名超越任何一季商队而传诸千秋。"
 phx_mal_expand_sankore_university_decision_tooltip:0 "重资扶持廷巴克图桑科雷学者与书院，打造伊斯兰学术重镇。"
 phx_mal_expand_sankore_university_decision_confirm:0 "敕建桑科雷学院"
 phx_mal_expand_sankore_university_effect_tt:0 "将廷巴克图建设为法学、天文与跨撒哈拉贸易交相辉映的学术圣地。"

 phx_eth_affirm_solomonic_chronicle_decision:0 "颁行《众王之荣耀》圣典"
 phx_eth_affirm_solomonic_chronicle_decision_desc:0 "在阿姆哈拉的凿岩教堂与高原修院中，书吏已编纂成溯源所罗门王与约柜正统的王室圣典。向贵族与教士庄严宣读《众王之荣耀》，将以不可动摇的神圣法统凝聚埃塞俄比亚全境。"
 phx_eth_affirm_solomonic_chronicle_decision_tooltip:0 "庄严颁行《众王之荣耀》，确立埃塞俄比亚神圣的所罗门王统。"
 phx_eth_affirm_solomonic_chronicle_decision_confirm:0 "宣读众王之荣耀"
 phx_eth_affirm_solomonic_chronicle_effect_tt:0 "在阿比西尼亚全境弘扬所罗门圣约，极大振奋高原士气与王室正统。"

 phx_timur_claim_samarkand_throne_decision:0 "登临撒马尔罕古尔汗宝座"
 phx_timur_claim_samarkand_throne_decision_desc:0 "从粟特绿洲的果园到阿姆河畔的草原前线，各方伯克与衰微的察合台宗王彼此倾轧。在撒马尔罕高悬帝国牦尾旗，便是向天下宣告崭新的古尔汗大统——以铁骑立威，以松石穹顶加冕。"
 phx_timur_claim_samarkand_throne_decision_tooltip:0 "确立撒马尔罕为古尔汗帝国之都，开创河中霸业。"
 phx_timur_claim_samarkand_throne_decision_confirm:0 "登临撒马尔罕宝座"
 phx_timur_claim_samarkand_throne_effect_tt:0 "正式宣告撒马尔罕古尔汗王权，并开启这座名城的建筑与商贸复兴。"

 # === 全球危机事件 (phx_glb) ===
 phx_glb.0001.t:0 "卡法港的黑船"
 phx_glb.0001.desc:0 "令人毛骨悚然的急报自克里米亚商埠卡法传遍各处航道。围城之下，一种令人一夜毙命、通体发黑的怪疫肆虐全城；仓皇南逃的商船已将病魔携过博斯普鲁斯海峡，悄然播入地中海诸港。\n\n教士们自黎明至薄暮狂敲警钟，商行掌柜惊恐地紧锁栈房。一场前所未闻的大瘟疫已然挣脱枷锁，席卷人间。"
 phx_glb.0001.a:0 "唯愿上苍垂怜我们的港湾与城镇。"
 phx_glb.0001.b:0 "即刻拉起封港铁链——严禁外船擅自靠岸！"
 phx_glb_0001_quarantine_hint_tt:0 "在大瘟疫肆虐期间，现可启用“颁布封港与锁城检疫令”决议。"

 phx_glb.0002.t:0 "商道上的低语"
 phx_glb.0002.desc:0 "抵达关卡的骡夫与行商压低声音诉说着邻邦见闻：空无一人的客栈、无人收割的麦田，以及市镇墙外仓促掘就的万人坑。御医们争论着腐浊瘴气与凶星交会，但满朝文武皆心知肚明——那片黑影正一步步逼近我们的城门。"
 phx_glb.0002.a:0 "提前储备药草、醋液与巡防栅木以备检疫。"
 phx_glb.0002.b:0 "通谕全境斋戒祈祷，祈求天地庇佑。"
 phx_glb_0002_prepare_tt:0 "令全境进入高度戒备状态，并可立即推行封港锁城检疫。"

 phx_glb.0003.t:0 "瘟疫叩响城门"
 phx_glb.0003.desc:0 "大劫终究降临了。一夜之间，药师回报河岸坊间已有患者腋下生出黑肿，及至正午，运尸木车便已吱呀碾过石板街巷。行会首领力主挥剑驱逐一切外来客商，教士恳请王室施粥济病，而惊慌的廷臣则低声劝你速速退往深山行宫避祸。"
 phx_glb.0003.a:0 "行铁腕检疫——封锁城门并严格隔离病患。"
 phx_glb.0003.b:0 "开仓放粮并资助施医堂，与臣民共渡时艰。"
 phx_glb.0003.c:0 "率宫廷迁往僻静山庄暂避毒瘴。"

 phx_glb.0004.t:0 "封港铁链与检疫院"
 phx_glb.0004.desc:0 "如今每座偏门皆有守卒守在松脂与杜松烟火旁，入港驳船一律须在浅滩外孤泊四十日方可起卸。商贾虽对腐坏货物怨声载道，但都城内凄厉的丧钟声确已渐渐稀疏。"
 phx_glb.0004.a:0 "严密防微，方能于惊涛骇浪中保境安民。"

 phx_glb.0005.t:0 "人手匮乏的时代"
 phx_glb.0005.desc:0 "当乱葬岗重新覆上新绿，劫后余生的王国却迎来了一场出人意料的变局。田畴因缺人耕作而荒芜，幸存的工匠与佃农纷纷要求更高的工钱、更轻的劳役与成文的市镇特许状。旧贵族敦促你以严法锁死农奴，而市政执事则断言更自由的契约必将点燃更兴旺的商潮。"
 phx_glb.0005.a:0 "颁赐更自由的租佃与市镇宪章，广开商路。"
 phx_glb.0005.b:0 "严申古老庄园法度，强令农奴恪守旧役。"

 phx_glb.0006.t:0 "夜巷中的苦行游行"
 phx_glb.0006.desc:0 "高举火把、面容枯槁的苦行者列队穿过夜巷，高唱凄厉圣歌，将天降大疫归咎于商贾、外乡人与城中罪人。惶恐的市民紧闭窗板，翘首盼望王权决断究竟由法度还是狂热主宰街头。"
 phx_glb.0006.a:0 "派城防卫队维持秩序，驱散骚动人群。"
 phx_glb.0006.b:0 "只要不致流血，便任其祈祷赎罪。"
 phx_glb.0006.c:0 "颁布王室护身诏书，严加保护受威胁的商人与工坊。"

 phx_glb.0007.t:0 "御医的疫病专论"
 phx_glb.0007.desc:0 "历经数月对检疫院与封港关卡的细致观察，一位老成御医呈上一部手稿，详录洁净引水、焚毁旧衣与四十日隔离日志之法。尽管大疫之谜仍深不可测，这卷用血泪换来的记录必将惠及后世。"
 phx_glb.0007.a:0 "命人誊抄专论，并将其编入市政卫生条例。"
 phx_glb.0007.b:0 "厚赏御医，将此卷珍藏于王家书库。"

 phx_glb.0021.t:0 "撒马尔罕的跛足铁骑"
 phx_glb.0021.desc:0 "自河中地区南下的商队带来惊人消息：一位身负战伤的巴鲁剌思统帅帖木儿已夺得撒马尔罕大权，将突厥—蒙古铁骑与定居波斯文官凝聚在同一铁腕之下。他自号古尔汗，公然宣称要重铸成吉思汗破碎的帝国，其前锋斥候已在西境山口频频现身。"
 phx_glb.0021.a:0 "严查边疆堡垒，令征召兵马枕戈待旦。"
 phx_glb.0021.b:0 "遣使携厚礼前往撒马尔罕，探明其虚实。"

 phx_glb.0022.t:0 "世界之明珠：撒马尔罕"
 phx_glb.0022.desc:0 "琉璃瓦匠、织锦名师、甲胄大匠与天文学家正循着你的旌旗涌入撒马尔罕城门。宽阔通衢两旁，青绿松石穹顶拔地而起，俯瞰着重修水渠灌溉的果园，向自德里至大马士革的各方使节宣告：天下中心如今坐落于泽拉夫尚河畔。"
 phx_glb.0022.a:0 "让四海八荒皆在撒马尔罕的荣光下战栗！"

 phx_glb.0023.t:0 "席卷伊朗与两河的沙暴"
 phx_glb.0023.desc:0 "来自呼罗珊与阿塞拜疆的败兵跌跌撞撞冲入朝堂，回报黑沉沉的牦尾战旗正自河中排山倒海般向西压来。帖木儿迅疾如风的万人队已强渡阿姆河，击溃四分五裂的伊利汗国残部，锋芒直指大不里士与巴格达诸城。"
 phx_glb.0023.a:0 "传檄集结边军——我等绝不向撒马尔罕俯首！"
 phx_glb.0023.b:0 "遣使奉上丰厚贡礼，设法引开这场风暴。"

 phx_glb.0024.t:0 "印度河外的惊雷"
 phx_glb.0024.desc:0 "旁遮普山口烽火连天，急报直抵印度斯坦朝廷：帖木儿的铁骑已翻越关隘，正朝恒河—印度河平原疾驰而来。宿将警告，这位北方征服者的严密军纪与火攻奇谋，足以令德里引以为傲的战象与高墙面临严峻考验。"
 phx_glb.0024.a:0 "列阵战象大军，北上迎击强敌！"
 phx_glb.0024.b:0 "收缩府库固守重城，准备死战到底。"

 phx_glb.0025.t:0 "草原与安纳托利亚的铁砧"
 phx_glb.0025.desc:0 "从伏尔加草原到小亚细亚高原，诸王与大汗无不屏息注视着帖木儿大军惊人的机动锋芒。无论他的雷霆最终劈向萨莱抑或奥斯曼的安纳托利亚边疆，多瑙河与里海之间的任何君主皆无法置身事外。"
 phx_glb.0025.a:0 "按剑观变，严密戒备四方边陲。"
 phx_glb.0025.b:0 "遣使纵横捭阖，借天下剧变谋取外交先机。"

 phx_glb.0026.t:0 "撒马尔罕古尔汗宝座"
 phx_glb.0026.desc:0 "在低沉战鼓与万千埃米尔山呼海啸般的欢呼声中，黑色牦尾大旗升上撒马尔罕城堡之巅。文官以波斯语与突厥语齐声宣读你的尊号：河中主宰、草原大札撒的继承者、以及令万代敬畏的帝国缔造者。"
 phx_glb.0026.a:0 "自撒马尔罕始，天下皆当称量于吾掌！"

 phx_glb.0030.t:0 "两柄圣钥，两座圣座"
 phx_glb.0030.desc:0 "秘密会议刚刚散场，激烈的争吵便将枢机团撕成两半。离心的红衣主教斥责罗马选举受暴民胁迫，转而在阿维尼翁另立教宗；双方皆佩戴渔人权戒，号令列国称臣。拉丁基督教世界钟声惶乱，两座教廷竟同时宣称独占天国圣钥。"
 phx_glb.0030.a:0 "寸步不让，坚守罗马使徒磐石之正统。"
 phx_glb.0030.b:0 "聚拢教廷财源与盟邦，以阿维尼翁为依托。"

 phx_glb.0031.t:0 "西方教会大分裂"
 phx_glb.0031.desc:0 "同一清晨，两位敌对教廷使节竟先后立于御前——一人手捧罗马封印的教宗诏书，另一人则高举阿维尼翁颁发的反绝罚敕令。本国主教纷纷仰望王座定夺，因为归顺何方正朔将牵动合纵连横、教会什一税与万千臣民的良心。"
 phx_glb.0031.a:0 "奉罗马教宗为基督在世唯一正统牧者。"
 phx_glb.0031.b:0 "宣告本国归顺阿维尼翁教廷正朔。"
 phx_glb.0031.c:0 "暂行“撤回服从”，静候普世大公会议公断。"

 phx_glb.0033.t:0 "三教宗并立的丑闻"
 phx_glb.0033.desc:0 "绵延数十年的分裂如今已沦为天下笑柄：一场原本旨在弥合裂痕的会议竟又生出第三位教宗，令西方基督教世界在彼此攻讦的敕令与苛捐间疲惫不堪。大学硕儒与虔诚诸侯纷纷恳求欧洲大国出面，在康斯坦茨主持一场决定性的大公会议。"
 phx_glb.0033.a:0 "基督教世界呼唤唯一牧者——筹备大公会议！"
 phx_glb_0033_constance_hint_tt:0 "符合条件的天主教君主现可通过“倡议召开康斯坦茨大公会议”决议终结西方教会大分裂。"

 phx_glb.0035.t:0 "唯一牧者，唯一羊群"
 phx_glb.0035.desc:0 "历经数月不懈斡旋、庄严废黜与王室护卫下的深夜选举，大公会议厅上空终于升起白烟。诸般对立宣称尽数落幕，一位万众公认的新教宗登临圣彼得宝座，欧洲诸国使节齐声颂扬你的王冠挽狂澜于既倒，重续教会大一统。"
 phx_glb.0035.a:0 "赞美主恩——教会终于重归完整！"

 # === 欧亚与非洲区域风味事件 (phx_eur) ===
 phx_eur.0001.t:0 "海峡三雄"
 phx_eur.0001.desc_castile:0 "1337年春，卡斯蒂利亚王冠正立于刀锋之上。安达卢西亚边疆外，格拉纳达游骑频频试探要塞防线，马林王朝战船亦在海峡对岸集结；而国内骄横的大贵族仍在试探王权锋芒。若能稳住南方边疆，整个伊比利亚的命运便将握于你手。"
 phx_eur.0001.desc_granada:0 "在皑皑内华达雪山与碧波大海之间，坐落着安达卢斯最后的独立明珠——格拉纳达。北方有卡斯蒂利亚铁骑虎视眈眈，海峡南岸的马林苏丹虽递来援手却难测深浅。唯有高超外交、险峻山城与宫廷文治，方能让纳斯里德旌旗长存。"
 phx_eur.0001.desc_morocco:0 "从非斯的雪松殿堂到遥望直布罗陀的海岸堡垒，马林王朝的旌旗主宰着马格里布。海峡对岸，卡斯蒂利亚君王妄图永封水道，而格拉纳达正南望乞援。果敢横渡海格力斯之柱，西地中海必将再度铭记马林铁骑之威。"
 phx_eur.0001.a:0 "砥砺兵锋——海峡终归勇者所有。"
 phx_eur.0001.b:0 "先充实国库，加固沿海重镇。"

 phx_eur.0005.t:0 "萨拉多河畔的战鼓"
 phx_eur.0005.desc:0 "非洲与安达卢西亚之间的狭海帆樯蔽日，各方大军正沿着南方河岸集结。无论基督徒还是穆斯林统帅皆深知：直布罗陀近郊的一场决战，便足以定鼎未来一整代人的海峡霸权。"
 phx_eur.0005.a:0 "征召边疆轻骑，全军开赴海峡前线！"
 phx_eur.0005.b:0 "举行庄严祷告，激励万千信众共赴圣战。"

 phx_eur.0010.t:0 "布尔戈斯之血：卡斯蒂利亚王位风波"
 phx_eur.0010.desc:0 "尖锐的流言将王廷撕为两派：一方力主以严酷法度维系嫡统王权，另一方大贵族则暗中靠拢野心勃勃的特拉斯塔马拉支系宗亲。每次御前会议皆暗藏杀机，迫使君主在铁血立威与破财安抚间做出抉择。"
 phx_eur.0010.a:0 "折断豪门的傲骨——卡斯蒂利亚只容一尊王冠。"
 phx_eur.0010.b:0 "召集等级议会，以特许宪章换取贵族归心。"

 phx_eur.0020.t:0 "佛罗林、大理石与人文篇章"
 phx_eur.0020.desc:0 "在北意大利喧闹的广场上，钱庄账簿的算筹声与石匠凿音、书肆谈论交织成曲。诗人重新拾起古罗马的韵律，而城邦领主与商业共和国早已领悟：真正的权势不只藏在长枪阵里，更闪耀于金佛罗林、市政建筑与千秋文名之中。"
 phx_eur.0020.a:0 "重资赞助本城的学者与建筑大匠。"
 phx_eur.0020.b:0 "扩张银行钱庄与行会商税网络。"

 phx_eur.0025.t:0 "雇佣兵团的战旗"
 phx_eur.0025.desc:0 "久经沙场的自由佣兵队长——麾下混杂着德意志骑士、布列塔尼弩手与伦巴第老兵——已在城外扎营，愿以一纸契约换取丰厚月饷。受雇兵团可即刻带来凌厉战力，但元老院却警告：佣兵效忠的从来是钱袋而非城旗。"
 phx_eur.0025.a:0 "签下雇佣兵战契，令其归于我方旗帜之下。"
 phx_eur.0025.b:0 "谢绝外佣——本城子弟与封臣足堪重任。"

 phx_eur.0030.t:0 "开罗城堡的黄金朝廷"
 phx_eur.0030.desc:0 "在开罗高耸的宣礼塔下，满载东方珍货的商船沿尼罗河络绎卸载，城堡下方的演武场上马穆鲁克埃米尔纵马驰射。然而盛世繁华亦滋生了兵营派系间的暗斗，唯有运筹帷幄方能兼顾商路、外交与兵权。"
 phx_eur.0030.a:0 "兴修开罗巴扎与尼罗河税关商栈。"
 phx_eur.0030.b:0 "检阅御前兵营，扩充精锐马穆鲁克卫队。"

 phx_eur.0035.t:0 "旭烈兀破碎的战旗"
 phx_eur.0035.desc:0 "自不赛因绝嗣而崩，昔日雄踞伊朗的伊利汗国已在大不里士与巴格达之间四分五裂。札剌亦儿、楚邦与呼罗珊诸派埃米尔各拥黄金家族傀儡称雄，逼迫宝座证明蒙古波斯是否尚有重归一统的可能。"
 phx_eur.0035.a:0 "高举大汗威权，令跋扈埃米尔知所敬畏。"
 phx_eur.0035.b:0 "暗中与巴格达及大不里士周旋，争取喘息之机。"

 phx_eur.0040.t:0 "德里朝廷的奇谋与风暴"
 phx_eur.0040.desc:0 "放眼天下，鲜有宫廷如德里般光彩夺目——来自波斯、非洲与印度斯坦的硕儒在鎏金拱廊下纵论哲理。然而激进的税改、铜币代银风潮与南征迁都令地方怨声载道，考验着君主的奇才究竟能驾驭风暴还是被其反噬。"
 phx_eur.0040.a:0 "强推王室新税——治大帝国岂容畏首畏尾。"
 phx_eur.0040.b:0 "减轻两河赋役，先安抚京师市肆人心。"

 phx_eur.0045.t:0 "栋格珀德拉河上的烽火"
 phx_eur.0045.desc_delhi:0 "德干急递飞鸽传书入京：南方土邦酋长与桑伽马兄弟已在栋格珀德拉河畔树起自立大旗，将一座座山间石城筑成抗拒德里威令的坚固堡垒。"
 phx_eur.0045.desc_vijayanagara:0 "栋格珀德拉河畔巍峨的花岗岩群峰间，亨比新筑的城垛燃起通明烽火。趁德里苏丹国对南方的掌控日渐松弛，卡纳塔克武士与神庙庇护者正汇聚于桑伽马大旗下，誓要铸就一座屹立德干的南方铁壁。"
 phx_eur.0045.a:0 "高扬战旗，固守高原险隘！"
 phx_eur.0045.b:0 "先结盟邻邦并充实军资。"

 phx_eur.0050.t:0 "特里布瓦娜与努山塔拉宏图"
 phx_eur.0050.desc:0 "特罗乌兰红砖宫阙之外，来自巴厘、苏门答腊与东方香料群岛的商帆络绎不绝，朝堂重臣更畅言要将整个群海纳入满者伯夷的曼陀罗光辉。有精锐水师与干练良佐辅政，爪哇正蓄势主宰南洋波涛。"
 phx_eur.0050.a:0 "采纳一统努山塔拉群岛的宏伟谋略。"
 phx_eur.0050.b:0 "先充盈特罗乌兰王家粮仓与商港码头。"

 phx_eur.0055.t:0 "开京：大元宗主与半岛新政之间"
 phx_eur.0055.desc:0 "开京殿阁之内，众臣步步维艰：北面须周旋于大元宗主朝廷的政治风向，国内则日渐响起重振王纲、裁抑权门豪族与复兴儒佛文教的呼声。"
 phx_eur.0055.a:0 "起用锐意革新之士，整肃王室朝政。"
 phx_eur.0055.b:0 "审慎平衡外交大局，同时充实国库度支。"

 phx_eur.0056.t:0 "抵御倭寇的沿海烽燧"
 phx_eur.0056.desc:0 "南方海湾浓烟蔽空，迅捷的倭寇海盗船队接连劫掠沿海粮仓与驶往开京的漕运税船。前线将领疾呼整编守军与精锐弓手，而清流谏官更提醒：唯有吏治清明，漫长海岸方能永保太平。"
 phx_eur.0056.a:0 "编练角弓精兵，颁行沿海防务新宪章。"
 phx_eur.0056.b:0 "整修内陆官仓，加强开京外围防备。"

 phx_eur.0060.t:0 "布雷黄金，廷巴克图墨香"
 phx_eur.0060.desc:0 "距离马里那场震动开罗与麦加的传奇朝觐虽已过去多年，跨撒哈拉驼队依旧源源不断南下，以岩盐、铜器与珍贵典籍换取西非黄金。尼日尔河畔，万千学者与建筑匠正翘首期盼王室资助，将廷巴克图铸为传世学府。"
 phx_eur.0060.a:0 "慷慨资助廷巴克图的清真寺与书坊。"
 phx_eur.0060.b:0 "加征商队关市之税，充盈帝国府库。"

 phx_eur.0065.t:0 "犹大之狮：阿姆达·塞永的凯歌"
 phx_eur.0065.desc:0 "从云雾缭绕的阿姆哈拉高原到通往红海的商路峡谷，王室战鼓回荡于埃塞俄比亚群山之间。修道院编年史盛赞所罗门王统乃上主钦定之盾，而边疆宿将已整装待发，准备高举十字战旗扫平非洲之角的诸般强敌。"
 phx_eur.0065.a:0 "在所罗门圣旗下集结高原精锐武士！"
 phx_eur.0065.b:0 "厚赐高原修道院与王室史官。"

 phx_eur.0101.t:0 "海格力斯之柱的主宰"
 phx_eur.0101.desc:0 "俯瞰狭海的峭壁要塞燃起通明烽火，往来商船无不向你的税关战船降帆致礼。自此以后，任何穿梭于地中海与大西洋之间的舰队，都不得不先仰望你的旌旗。"
 phx_eur.0101.a:0 "两片大洋皆俯首于海峡守护者之前。"

 phx_eur.0102.t:0 "驶向天际线的卡拉维尔船"
 phx_eur.0102.desc:0 "新敕建的航海学院内，老练领航员摊开密布风向罗盘线的羊皮纸波托兰海图，河口船坞的匠人们正试水更锐利的龙骨与三角帆。苍茫大西洋不再是世界的尽头，而是静待远征的通衢大道。"
 phx_eur.0102.a:0 "校准罗盘——崭新的地平线正呼唤我等风帆！"

 phx_eur.0103.t:0 "红堡宫阙的绝世华彩"
 phx_eur.0103.desc:0 "阳光斜穿纤细大理石柱与繁复书法拱门，洒落在桃金娘与潺潺流水环绕的静谧庭院中。来自基督教王国与马格里布的使节步入阿尔罕布拉诸殿，无不屏息赞叹安达卢斯文明的巅峰华彩。"
 phx_eur.0103.a:0 "除真主外别无胜者——愿格拉纳达长存！"

 phx_eur.0104.t:0 "意大利文艺复兴的曙光"
 phx_eur.0104.desc:0 "光彩照人的新柱廊拆下脚手架，人文演说家在欢呼的市民与远道而来的银行家面前朗诵新译古典名篇。放眼整座半岛，诸侯与共和国无不仰望我城，视之为艺术与理性重生的典范。"
 phx_eur.0104.a:0 "愿美与学问比任何刀剑更为长久。"

 phx_eur.0105.t:0 "红海香料航道之主"
 phx_eur.0105.desc:0 "从苏伊士到亚历山大里亚，胡椒、生姜与肉桂的芬芳弥漫于王家拱顶商栈之中。威尼斯与热那亚商馆代表手提沉甸甸的金杜卡特列队购货，牢牢奠定了埃及对东方商贸的绝对掌控。"
 phx_eur.0105.a:0 "印度群洋之财富，尽汇于开罗城门。"

 phx_eur.0106.t:0 "图格鲁克度支重归清明"
 phx_eur.0106.desc:0 "成色十足的新铸银币在德里巴扎叮当作响，各省税吏井然有序地向整肃一新的度支衙门呈交账册。随着轻率政令废止、干练官吏复位，印度斯坦庞大的帝国机器再度稳健运转。"
 phx_eur.0106.a:0 "良币与平税，乃维系大帝国之根本。"

 phx_eur.0107.t:0 "努山塔拉的帕拉帕大誓"
 phx_eur.0107.desc:0 "特罗乌兰的金伞与袅袅檀香之下，宏伟大誓在群岛藩臣与海师将领面前回荡不息。港湾之上战鼓雷鸣，满者伯夷舰队升起红白相间的战旗，誓要践履一统群海的庄严诺言。"
 phx_eur.0107.a:0 "直至整个努山塔拉尽归吾曼陀罗光辉！"

 phx_eur.0108.t:0 "桑科雷与廷巴克图的明灯"
 phx_eur.0108.desc:0 "廷巴克图温润的夯土高塔之下，成千上万学子汇聚于绿荫庭院，聆听硕儒讲授律法、医道与星象。黄金固然引来穿越大漠的商队，但唯有桑科雷的墨香令马里美名传扬四海。"
 phx_eur.0108.a:0 "黄金终会散尽，唯有智慧长明千秋。"

 phx_eur.0109.t:0 "众王之荣耀：《克布拉·纳加斯特》"
 phx_eur.0109.desc:0 "锦绣圣伞之下，古老的吉兹语颂诗回荡高原，贵族、修道院长与各省总督齐声向所罗门王座重申效忠。埃塞俄比亚如同一座古老信仰的铁壁，巍然屹立于群山之巅。"
 phx_eur.0109.a:0 "犹大之狮的圣约万世长存！"
