l_simp_chinese:
 innovation_eu5_patronage:0 "赞助人"
 innovation_eu5_patronage_desc:0 "君主、教会与富有的市民资助学者钻研技艺和知识，使学问得以在宫廷与城市中蓬勃发展。"
 eu5_patronage_scholar_tt:0 "可以任命宫廷科学家"
 eu5_sponsor_research_decision:0 "资助研究"
 eu5_sponsor_research_decision_desc:0 "学问的进步离不开慷慨的赞助。让我们的学者获得所需的资源，探寻新知识吧。"
 eu5_sponsor_research_decision_tooltip:0 "资助宫廷科学家开展研究"
 eu5_research_failure_tt:0 "研究未取得突破"
 eu5_research_success_tt:0 "研究取得成功：获得一项尚未发现的本时代通用革新；如果已全部发现，则随机获得一项持续30年的家族研究修正，或获得威望"
 eu5_research_critical_tt:0 "研究取得重大突破：获得一项尚未发现的下时代通用革新；在大革命时代则获得一项尚未发现的特殊革新。若可获得的革新已全部发现，则随机获得一项持续30年的家族研究修正，或获得威望"
 eu5_court_scholar_court_position:0 "宫廷科学家"
 eu5_court_scholar_court_position_desc:0 "宫廷科学家研习知识，协助领主推动文化革新。"
 eu5_research_treatise_on_prosperity_modifier: "行政论文"
 eu5_research_treatise_on_prosperity_modifier_desc: "一篇关于官僚体制价值的论文，就如何确保从皇室到地方一级的适当沟通提供了几点建议。"
 eu5_research_treatise_on_building_modifier: "管理论述"
 eu5_research_treatise_on_building_modifier_desc: "一部关于如何管理资源以使效率最大化的专著。"
 eu5_research_treatise_on_control_modifier: "权威论"
 eu5_research_treatise_on_control_modifier_desc: "一篇关于领导者应该如何处理统治事务和镇压叛乱的论文。"
 eu5_research_treatise_on_mathematics_modifier: "数学专著"
 eu5_research_treatise_on_mathematics_modifier_desc: "这是一篇关于数学的专业论文，其中有一些关于如何在日常生活中使用数学的注释。"
 eu5_research_treatise_on_taxation_modifier: "税收论"
 eu5_research_treatise_on_taxation_modifier_desc: "这是一篇冗长的关于税收的论文，以及可以采取哪些措施来最好地解决税收问题。"
 eu5_research_treatise_on_light_warfare_modifier: "遭遇战指南"
 eu5_research_treatise_on_light_warfare_modifier_desc: "一篇关于轻步兵价值的简短论文，以及如何最好地利用这个兵种。"
 eu5_research_treatise_on_heavy_warfare_modifier: "防御战手册"
 eu5_research_treatise_on_heavy_warfare_modifier_desc: "这是一篇关于重步兵相关阵型的论文，最后有一个小指南，告诉你可以通过什么样的训练来提高军队的凝聚力。"
 eu5_research_treatise_on_cavalry_modifier: "骑兵战争史"
 eu5_research_treatise_on_cavalry_modifier_desc: "一篇关于骑兵冲锋历史的长篇论文，重点是如何在马背上扭转战局。"
 eu5_research_treatise_on_siege_modifier: "围攻手册"
 eu5_research_treatise_on_siege_modifier_desc: "一本简短而精炼的手册，关于围攻的本质，以及在有或没有攻城武器的情况下如何接近敌人。"
 eu5_research_treatise_on_strategy_modifier: "战略的历史"
 eu5_research_treatise_on_strategy_modifier_desc: "这是一篇关于战略和战术历史的长篇但平易近人的论文，其中的例子可以追溯到几个世纪以前。"
 innovation_eu5_congreve_rocket:0 "康格里夫火箭"
 innovation_eu5_congreve_rocket_desc:0 "火药火箭经过不断改良，能够成批发射，在战场和守城作战中发挥威力。"
 innovation_eu5_newcomen_steam_engine:0 "纽可门蒸汽机"
 innovation_eu5_newcomen_steam_engine_desc:0 "利用蒸汽驱动的抽水机械可以排出矿井深处的积水，使矿工得以开采更深处的矿藏。"
 eu5_scientific_experimentation_research_tt:0 "资助研究灵感每月进度概率：#P +10%#!"
 eu5_confessionalism_rite_tt:0 "允许创建新礼仪"
 eu5_rite_creation_innovation_requirement_tt:0 "文化已发现认信主义，你是宗教改革者，或你的信仰尚未改革"
 eu5_religious_toleration_laws:0 "宗教宽容"
 eu5_religious_toleration_off:0 "宗教事务惯例"
 eu5_religious_toleration_off_desc:0 "领主和封臣按照各自的信仰和契约处理宗教事务。"
 eu5_religious_toleration_on:0 "宗教宽容法"
 eu5_religious_toleration_on_desc:0 "领地内不同信仰的臣民应能安宁地遵循自己的信仰。"
 eu5_religious_toleration_on_effects:0 "符合条件的异教直属封臣获得宗教保护；法律生效期间不得撤销。"
 eu5_religious_toleration_unlock_tt:0 "允许采用宗教宽容法"
 EU5_OVERSEAS_COUNTY_CONQUEST_CB_NAME:0 "海外伯国征服"
 EU5_OVERSEAS_DUCHY_CONQUEST_CB_NAME:0 "海外公国征服"
 eu5_overseas_county_conquest_cb:0 "海外伯国征服"
 eu5_overseas_duchy_conquest_cb:0 "海外公国征服"
 eu5_overseas_expeditions_unlock_tt:0 "允许对首都位于不同大洲的统治者发动海外伯国和公国征服战争"
 eu5_sponsor_research_decision_confirm:0 "资助研究"
 eu5_research_project_start_tt:0 "你的宫廷科学家将开始进行一项研究"
 eu5_research_inspiration:0 "研究灵感"
 eu5_research_inspiration_desc:0 "有赞助人的资助，学者便能着手开展新的研究。研究过程与结果取决于学者的能力以及获得的投入。"
 eu5_research_improved_chance_tt:0 "研究成功的机会提高"
 eu5_research_reduced_chance_tt:0 "研究成功的机会降低"
 eu5_research.0001.t:0 "新的研究"
 eu5_research.0001.desc:0 "我的宫廷科学家抱着一摞书卷和仪器跑来找我，后面还跟着几个抱满手抄本和材料的仆人。\n\n“只要给够时间、资金和墨水，这次一定能研究出些名堂！”"
 eu5_research.0001.a:0 "好好把握机会。"
 eu5_research.0002.t:0 "研究：添置书卷与材料"
 eu5_research.0002.desc:0 "[inspiration_owner.GetTitledFirstName]又拿着清单来抱怨手头的藏书和材料太少。\n\n“这些旧书早就跟不上如今的思路了，材料也快见底。没有像样的工具和典籍，叫我怎么接着往下推算呢？”"
 eu5_research.0002.a:0 "需要什么就去置办吧。"
 eu5_research.0002.b:0 "手头现有的就已经够用了。"
 eu5_research.0004.t:0 "研究：废弃"
 eu5_research.0004.desc:0 "负责这项研究的学者已经没法再干下去了。桌上还堆着没翻完的书和写了一半的笔记，但这项研究只能到此为止。"
 eu5_research.0004.a:0 "那好吧。"
 eu5_research.0100.t:0 "研究：失败"
 eu5_research.0100.desc:0 "“一点用都没有！”[inspiration_owner.GetTitledFirstName]朝我嚷道，[inspiration_owner.GetHerHis]因为接连熬夜而眼圈发黑。\n\n“这堆推算怎么都对不上号，材料也全耗光了。我只能先把这个项目停下来，至少眼下是这样。”"
 eu5_research.0100.a:0 "那好吧。"
 eu5_research.0101.t:0 "研究：新的发现"
 eu5_research.0101.desc:0 "“[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]！我的研究总算完成了。”\n\n[inspiration_owner.GetTitledFirstName]站在面前，滔滔不绝地讲起[inspiration_owner.GetHerHis]的发现，以及这番成果将来能如何用在领地上。我想插嘴问几句，却根本插不进话。\n\n等[inspiration_owner.GetSheHe]好不容易停下来，我环顾四周，从侍臣们的眼神里看出了和我一样的困惑——但事已至此，我也只能给出唯一拿得出手的答复："
 eu5_research.0101.a:0 "干得好，[inspiration_owner.GetShortUINameNoTooltip]。"
 eu5_research.0102.t:0 "研究：重大突破"
 eu5_research.0102.desc:0 "“[ROOT.Char.Custom2('RelationToMeAddress', inspiration_owner)|U]！”我转过身，看见[inspiration_owner.GetTitledFirstName]虽然满眼疲惫，脸上却掩不住兴奋，袖口和手上还沾着墨迹——[inspiration_owner.GetHerHis]的钻研终于成了。\n\n也许要再过很多年，人们才会真正明白这项发现究竟改变了什么。但眼下，我只想说："
 eu5_research.0102.a:0 "干得太好了！"
 eu5_scientific_revolution_success_tt:0 "资助研究失败概率：#P -10%#!\n· 资助研究重大成功概率：#P +10%#!"
