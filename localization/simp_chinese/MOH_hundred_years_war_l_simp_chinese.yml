 moh_hyw_catalyst_border_raid_desc:0 "百年战争的参与者赢得了一场边境劫掠[war|E]"
 Hundred_Years_War_struggle_ender_name:0 "$game_concept_Hundred_Years_War_struggle$的终结"
 Hundred_Years_War_struggle_ender_desc:0 "英格兰人与法兰西人之间的百年冲突终于落下了帷幕，而[struggle_ender.GetFirstName]已经领导[struggle_ender.GetHerHis]的人民统治了整个[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]地区的所有族群。"
 struggle_england_france_ending_total_victory_decision_region_tt:0 "没有其他领地控制多于20%的[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]"
 struggle_france_england_ending_regional_decision_region_tt:0 "控制至少75%的[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]"
 struggle_france_england_ending_france_decision:0 "法兰西的完全胜利"
 struggle_france_england_ending_france_decision_desc:0 "诺曼底、加斯科涅与曼恩已重归我们的治下，英格兰在大陆的主要据点相继失守。如今，我们终于可以让对岸的王冠放下对法兰西的争夺，为这场漫长的战争画上句号。"
 struggle_france_england_ending_france_decision_tooltip:0 "终结[Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_france_decision_confirm:0 "终结[Hundred_Years_War_struggle|E]"
 struggle_england_france_house_war_modifier:1 "军事霸权"
 struggle_england_france_house_war_modifier_desc:1 "由于该家族的努力，[Hundred_Years_War_struggle|E]得以结束。之后，他们在[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]以建立不可阻挡的军事优势取得了绝对的军事霸权。"
 struggle_england_france_house_culture_modifier:1 "文化霸权"
 struggle_england_france_house_culture_modifier_desc:1 "由于该家族的努力，[Hundred_Years_War_struggle|E]得以结束。之后，他们在[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]以传播和促进他们人民的生活方式取得了绝对的文化霸权。"
 struggle_england_france_house_politics_modifier:1 "政治霸权"
 struggle_england_france_house_politics_modifier_desc:1 "由于该家族的努力，[Hundred_Years_War_struggle|E]得以结束。之后，他们在[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]以对周边较小政治实体的坚决控制和影响取得了绝对的政治霸权。"
 struggle_england_france_modifier_list_tt:0 "为你的[house|E]选择以下之一修正：\n$EFFECT_LIST_BULLET$[GetStaticModifier('struggle_england_france_house_war_modifier').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetStaticModifier('struggle_england_france_house_culture_modifier').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetStaticModifier('struggle_england_france_house_politics_modifier').GetNameWithTooltip|L]"
 struggle_france_england_ending_england_decision:0 "英格兰的完全胜利"
 struggle_france_england_ending_england_decision_desc:0 "一个多世纪以来，英格兰与法兰西的血腥冲突从未停歇，没有一方能够彻底占据上风。如今，金雀花家族的旗帜飘扬在巴黎的城墙上，瓦卢瓦王朝的梦想正在瓦解。现在是时候彻底终结这场永不休止的战争了——我们将证明英格兰的王冠高于法兰西的王冠！"
 struggle_france_england_ending_england_decision_tooltip:0 "终结[Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_england_decision_confirm:0 "终结[Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_union_decision:0 "英法共治"
 struggle_france_england_ending_union_decision_desc:0 "一个多世纪以来，法兰西与英格兰的血腥冲突从未停歇，没有一方能够彻底占据上风。然而，在这漫长的战争中，我们逐渐意识到——英格兰人与法兰西人注定不应是敌人，而应该是兄弟。两个王国，同一顶王冠，同一个命运。让海峡成为连接而非分隔，让我们建立一个横跨两岸的伟大王国！"
 struggle_france_england_ending_union_decision_tooltip:0 "终结[Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_union_decision_confirm:0 "建立英法联合王国"
 struggle_england_france_ending_total_victory_conversion_tt:0 "[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]内的$task_conversion$和/或$task_promote_culture$[councillor_tasks|E]速度：#P +50%#!"
 struggle_france_england_ending_regional_decision_heritage_tt:0 "你必须同时拥有[GetTitleByKey('k_england').GetName]和[GetTitleByKey('k_france').GetName][title|E]至少10年"
 france_england_union_tt:0 "你将成立一个合并[GetTitleByKey('k_england').GetName]和[GetTitleByKey('k_france').GetName]的[empire|E][title|E]，并创建英法混合的崭新[culture|E]。新[empire|E][title|E]将成为你所有[kingdoms|E][title|E]的[de_jure|E][liege|E]"
 struggle_england_france_ending_outsider_decision:0 "取代英格兰人与法兰西人"
 struggle_england_france_ending_outsider_decision_desc:0 "一个多世纪以来，英格兰人与法兰西人一直在无休止地互相残杀，没有一方能够占据上风。他们在无尽的仇恨中变得骄傲而疲惫，国力早已枯竭。现在，正是我们利用他们播下的混乱出击的时候——在他们的核心地带推翻他们，让这片饱受战火摧残的土地迎来真正的新主人！"
 struggle_england_france_ending_outsider_decision_tooltip:0 "终结[Hundred_Years_War_struggle|E]"
 struggle_england_france_ending_outsider_decision_confirm:0 "终结[Hundred_Years_War_struggle|E]"
 struggle_england_france_empire_tt:0 "你不能持有英格兰或法兰西的[kingdom|E]或[empire|E][title|E]"
 struggle_england_france_uninvolved_or_external_tt:0 "你不直接参与百年战争，且[capital|E]位于[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]之外"
 france_england_union_held_france_years:0 "持有[temp_scope.GetName]#V 10#!年#weak （当前[SCOPE.ScriptValue('MOH_french_held_value')|0V]）#!"
 france_england_union_held_england_years:0 "持有[temp_scope.GetName]#V 10#!年#weak （当前[SCOPE.ScriptValue('MOH_england_held_value')|0V]）#!"
 struggle_france_england_ending_total_victory_decision_region_tt:0 "其他[realm|E]在[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]内的控制区域不超过20%"
