 moh_hundred_years_war_border_raid_victory_desc:0 "进攻方按目标[county|E]的[prosperity|E]获得战利品。当地损失[county_control|E]和繁荣度，五年内无法再次成为边境劫掠的目标。头衔归属不变。"
 moh_hundred_years_war_border_raid_white_peace_desc:0 "进攻方撤军，失去[prestige|E]。"
 moh_hundred_years_war_border_raid_defeat_desc:0 "进攻方劫掠失败，失去[prestige|E]并向防守方支付赔款。"
 moh_hyw_truce_of_tours:0 "图尔停战"
 moh_hyw_maine_truce:0 "曼恩和议"
 moh_hyw_maine_lapsed_option:0 "这桩事已经谈不成了。"
 moh_hyw_maine_proposal_tt:0 "向[moh_hyw_england.GetTitledFirstName]提出以交还曼恩换取三年[truce|E]"
 moh_hyw_maine_accept_offer_tt:0 "将你的答复送往法国宫廷。法国同意后，曼恩将归入法国，双方缔结为期三年的[truce|E]"
 moh_hyw_maine_delay_tt:0 "交涉暂告一段落，法国日后可以再提此事"
 moh_hyw_maine_refusal_tt:0 "法国可以据此公开提出对曼恩的[claim|E]"
 moh_hyw_maine_to_anjou_tt:0 "请勒内接纳曼恩。若他同意，曼恩将归入法国，英法缔结为期三年的[truce|E]"
 moh_hyw_maine_back_to_france_tt:0 "由[moh_hyw_france.GetTitledFirstName]决定是否直接接收曼恩"
 moh_hyw_maine_interlude_tt:0 "百年战争进入[struggle_england_france_phase_interlude|E]阶段"
 Hundred_Years_War_struggle.1100.t:0 "勒芒的钥匙"
 Hundred_Years_War_struggle.1100.desc:0 "使节摊开了从曼恩带来的信。勒芒的城门仍由效忠英格兰的人把守，城外的村镇却在向我们请愿。图尔的印玺让两国暂且放下了兵器，这几封信却没有地方可送。\n\n「陛下，」使节问道，「若我们肯再给对岸三年，他们可肯把城门的钥匙交出来？」"
 Hundred_Years_War_struggle.1100.a:0 "去问问英格兰宫廷。"
 Hundred_Years_War_struggle.1100.b:0 "眼下还不是开价的时候。"
 Hundred_Years_War_struggle.1101.t:0 "曼恩的价码"
 Hundred_Years_War_struggle.1101.desc:0 "[moh_hyw_france.GetTitledFirstName]的使节带来一份文书：交出曼恩，换取三年停战。掌印官把文书念了两遍，席间依旧无人开口。\n\n终于有人问起那些凭王室的文书在勒芒持有田产、领取俸禄的人。坐在我身边的议事官压低声音说：「陛下，签了这份文书，我们总得给他们一个交代。」"
 Hundred_Years_War_struggle.1101.a:0 "三年和平，值得用曼恩来换。"
 Hundred_Years_War_struggle.1101.b:0 "让他们等我们的回信。"
 Hundred_Years_War_struggle.1101.c:0 "我的印玺不会落在这份文书上。"
 Hundred_Years_War_struggle.1102.t:0 "两份文书"
 Hundred_Years_War_struggle.1102.desc:0 "英方愿意交出曼恩，只等我们把停战文书一并封缄。书记已经备好两份正本，交接令上却还留着一处空白：英王的人该把勒芒交到谁手里？"
 Hundred_Years_War_struggle.1102.a:0 "以王室的名义接收曼恩。"
 Hundred_Years_War_struggle.1102.b:0 "请勒内来接手。"
 Hundred_Years_War_struggle.1102.c:0 "这份文书先不要用印。"
 Hundred_Years_War_struggle.1103.t:0 "勒芒开门"
 Hundred_Years_War_struggle.1103.desc:0 "交接文书已经送抵勒芒，城门的钥匙也已交到法方手中。英格兰的使节带着盖好印的停战文书启程回国。"
 Hundred_Years_War_struggle.1103.a:0 "愿两边都记得自己的印玺。"
 Hundred_Years_War_struggle.1104.t:0 "一封尚未写好的回信"
 Hundred_Years_War_struggle.1104.desc:0 "我的使节空手而归。[moh_hyw_england.GetTitledFirstName]说这件事还须听取议事会的意见。至于议事会何时再议，使节没能问到。"
 Hundred_Years_War_struggle.1104.a:0 "我们等得起。"
 Hundred_Years_War_struggle.1105.t:0 "英方拒绝交出曼恩"
 Hundred_Years_War_struggle.1105.desc:0 "英方把文书原样退回，折缝上连印泥都没沾。「曼恩仍听命于英格兰。」我的使节只带回来这一句话。"
 Hundred_Years_War_struggle.1105.a:0 "把文书收起来。"
 Hundred_Years_War_struggle.1105.b:0 "叫书记把我们对曼恩的权利写下来。"
 Hundred_Years_War_struggle.1106.t:0 "安茹与曼恩"
 Hundred_Years_War_struggle.1106.desc:0 "[moh_hyw_france.GetTitledFirstName]的信到了。英格兰愿交出曼恩，法国宫廷想让我接管勒芒。那些在两边都有田产的人，已经开始打听今后该到哪里陈诉旧案。"
 Hundred_Years_War_struggle.1106.a:0 "告诉他们，我会在勒芒听取陈诉。"
 Hundred_Years_War_struggle.1106.b:0 "请陛下亲自接管曼恩。"
 MOH_Hundred_Years_War_struggle_region:0 "法兰西与不列颠"
 game_concept_Hundred_Years_War_struggle:0 "百年战争"
 game_concept_Hundred_Years_War_struggle_desc:0 "$game_concept_Hundred_Years_War_struggle$指的是英格兰王国和法兰西王国之间长达百年的王朝冲突，战争始于1337年，当金雀花王朝的爱德华三世以法兰西国王外孙的身份，宣称拥有法兰西王位继承权，以对抗瓦卢瓦王朝的腓力六世。在仇恨引发的暴力、外交斡旋的休战以及不同[cultures|E]与[faiths|E]人们之间基于利益的联盟等的影响下，[struggle|E]的[struggle_phase_phases|E]不断转换。"
 game_concept_struggle_england_france_phase_interlude:0 "间歇"
 game_concept_struggle_england_france_phase_interlude_desc:0 "战事暂歇，使节往返于海峡两岸，领主们得以恢复田庄和城镇。议和与购买[truce|E]更为容易，停战也维持得更久。\n\n然而，两顶王冠之间的争端仍在。新的宣称、加固的城堡与破裂的停战，都可能使斗争重回[struggle_england_france_phase_contention|E]。"
 game_concept_struggle_england_france_phase_contention:0 "拉锯"
 game_concept_struggle_england_france_phase_contention_desc:0 "边境的守军与袭扰部队反复交锋，领主们以劫掠削弱对手，同时依靠城堡和本土补员守住领地。\n\n边境劫掠会逐渐加深冲突。英法君主对关键领地的争夺更可能把斗争推向[struggle_england_france_phase_campaign|E]；停战、赎回俘虏与和解则推动[struggle_england_france_phase_interlude|E]。"
 game_concept_struggle_england_france_phase_campaign:0 "会战"
 game_concept_struggle_england_france_phase_campaign_desc:0 "两国君主集结军队，争夺王冠与大陆据点。战争费用降低，停战缩短，佣兵和围城更易组织，城镇的发展也随之受损。\n\n持续的消耗使斗争逐渐退回[struggle_england_france_phase_contention|E]。若领主们达成停战、释放俘虏并恢复往来，则可能迎来[struggle_england_france_phase_interlude|E]。"
 Hundred_Years_War_struggle.0501.t:0 "英法百年战争"
 Hundred_Years_War_struggle.0501.desc:0 "自诺曼底公爵威廉征服英格兰以来，法兰西与不列颠这两个隔海相望的王国就注定要纠缠不休。然而，真正的冲突之火，始于1337年——当金雀花王朝的爱德华三世，以法兰西国王查理四世外孙的身份，公开宣称拥有法兰西王位的继承权，挑战瓦卢瓦王朝的腓力六世。\n\n随后的一个多世纪里风云突变，黑太子在普瓦捷与克雷西的箭雨摧毁了法兰西骑士的骄傲，而阿金库尔的泥泞则见证了亨利五世的辉煌胜利。然而，局势并非一成不变——圣女贞德的横空出世扭转了战局，法兰西在逆境中重燃斗志。\n\n如今，战争已持续百年，双方都精疲力竭。英王仍自称法兰西国王，但他的旗帜在诺曼底与加斯科涅的土地上日渐褪色。这片被称为[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]的土地上的动乱，只有在英法合为一体、一方彻底征服另一方、或者出现更强大的第三方插手时才会结束。\n \n"
 Hundred_Years_War_struggle.0501.a:0 "我们将彻底战胜宿敌！"
