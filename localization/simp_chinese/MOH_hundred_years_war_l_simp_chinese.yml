 Hundred_Years_War_struggle.1000.t:0 "$struggle_france_england_ending_france_decision$"
 Hundred_Years_War_struggle.1000.desc:0 "诺曼底、加斯科涅与曼恩的收复文书已经归档。如今送到我面前的，是两国使节共同拟定的停战文书。\n\n英格兰王室将放下对法兰西王位的宣称，双方的印玺也将为此后的和平作保。书记念到最后一行，厅中才响起低低的交谈声。那些曾在地图上争论一座城堡、一处渡口的领主，终于可以谈一谈回家的路了。"
 Hundred_Years_War_struggle.1000.a:0 "百年战争终于结束了！"
 Hundred_Years_War_struggle.1000.desc.no_english_crown:0 "诺曼底、加斯科涅与曼恩的收复文书已经归档。英格兰的王冠已无人持有，曾经以它的名义争夺法兰西的军队，也失去了大陆的主要据点。\n\n我让书记拟好宣告，送往各处城镇与诸侯的宫廷。这场漫长的王位争端，终于可以结束了。"
 truce_hundred_years_war_ended:0 "百年战争的终结"
 Hundred_Years_War_struggle.1001.t:0 "$struggle_france_england_ending_france_decision$"
 Hundred_Years_War_struggle.1001.desc:0 "[struggle_ender.GetTitledFirstName]宣布法兰西取得了百年战争的胜利。诺曼底、加斯科涅与曼恩均已收复，英格兰在大陆的主要据点也已失守。\n\n英格兰王室放下了对法国王位的宣称，双方缔结了长期停战。"
 Hundred_Years_War_struggle.1001.desc.closing:0 "\n\n对法兰西的诸侯而言，如何恢复饱经战乱的领地，是摆在面前的下一桩事。"
 Hundred_Years_War_struggle.1001.a:0 "百年战争现在只是历史了……"
 Hundred_Years_War_struggle.1001.desc.no_english_crown:0 "[struggle_ender.GetTitledFirstName]宣布法兰西取得了百年战争的胜利。诺曼底、加斯科涅与曼恩均已收复，而英格兰的王冠已无人持有。\n\n宣告被送往各处宫廷，宣布这场漫长的王位争端已经结束。"
 Hundred_Years_War_struggle.1002.t:0 "$struggle_france_england_ending_england_decision$"
 Hundred_Years_War_struggle.1002.desc:1 "结束了。\n\n我们赢了，法兰西人被打败了。\n\n自爱德华三世宣称法兰西王位以来，英格兰与法兰西之间的血腥冲突已经持续了一个多世纪。在经历了黑太子的辉煌胜利、亨利五世的阿金库尔奇迹，以及无数次的围城与突击之后，我们英格兰人终于从这场漫长的战争中胜出。如果我们的先辈——征服者威廉或狮心王理查——能看到我们所取得的成功就好了！几乎没人认为这一天会到来，但我们坚持着，而[ROOT.Char.GetFaith.HighGodName]授予了我们这来之不易的胜利。\n\n在决定了要如何延续我们的统治之后，剩下来要做的就只是宣布胜利而已。"
 Hundred_Years_War_struggle.1002.a:0 "建立无人可当的军事霸权"
 Hundred_Years_War_struggle.1002.b:0 "传播并发扬我们的先进文化"
 Hundred_Years_War_struggle.1002.c:0 "建立不可动摇的王权"
 Hundred_Years_War_struggle.1003.t:0 "$struggle_france_england_ending_england_decision$"
 Hundred_Years_War_struggle.1003.desc:1 "这一切#italic 终于#!结束了。\n\n一个多世纪以来，英格兰与法兰西第一次不再交战或准备开战。在[struggle_ender.GetTitledFirstName]的领导下，英格兰人已经战胜了法兰西人。如今，英格兰是[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]最强大的力量，[struggle_ender.GetSheHe]无疑将作为英格兰最伟大的君主之一被铭记，甚至可能超越征服者威廉。\n\n"
 Hundred_Years_War_struggle.1003.desc.closing.war:1 "[struggle_ender.GetTitledFirstNameNoTooltip]打算继续利用已经证明优势的英格兰军队来长期统治这个地区。只有通过武力，英格兰才能确保没有人像曾经的法兰西人那样挑战他们的权威。"
 Hundred_Years_War_struggle.1003.desc.closing.culture:1 "[struggle_ender.GetTitledFirstNameNoTooltip]打算传播和推广[struggle_ender.GetHerHis]人民的英格兰文化以长期主宰这个地区。[struggle_ender.GetSheHe|U]相信，从百年战争的灰烬中，一个新的英格兰世界将成长发育。"
 Hundred_Years_War_struggle.1003.desc.closing.politics:1 "[struggle_ender.GetTitledFirstNameNoTooltip]打算利用阴谋和政治上的狡猾，使较小的国家屈服于英格兰的意志，长期统治这一地区。为了长期保持对这一地区的控制，毕竟需要采取坚定而谨慎的方法。"
 Hundred_Years_War_struggle.1003.desc.closing:1 "\n\n新时代到来了。未来的形状，世界的命运……这一切都属于#bold 英格兰#!。"
 Hundred_Years_War_struggle.1003.a:0 "$Hundred_Years_War_struggle.1002.a$"
 Hundred_Years_War_struggle.1004.t:0 "$struggle_france_england_ending_union_decision$"
 Hundred_Years_War_struggle.1004.desc:1 "结束了。\n\n我们赢了，战争结束了——#italic 永远地#!结束了。\n\n一个多世纪以来，英格兰人和法兰西人彼此厮杀，血流成河。他们为了一顶王冠、几块土地而互相屠杀，在无尽的暴力循环中摧毁了彼此的王国与社会。然而，[struggle_ender.GetTitledFirstName]看到了一个超越仇恨的未来——英格兰与法兰西不应是敌人，而应该是兄弟。\n\n如今，海峡两岸第一次真正地团结在一起。如果我们的先辈能看到我们所取得的成功就好了！几乎没人认为这一天会到来，但我们坚持着，而[ROOT.Char.GetFaith.HighGodName]授予了我们这来之不易的胜利。\n\n在决定了要如何延续我们的统治之后，剩下来要做的就只是宣布胜利而已。"
 angevin_decision_hybrid_tt:0 "你创造了安茹混合文化——融合英格兰与法兰西的独特文明。"
 innovation_angevin_chivalry:0 "安茹骑士精神"
 innovation_angevin_chivalry_desc:0 "融合了英格兰长弓手与法兰西重骑兵的军事传统，安茹骑士在战场上兼具远程压制与冲锋破阵的能力。"
 innovation_angevin_administration:0 "安茹行政体系"
 innovation_angevin_administration_desc:0 "结合了英格兰议会传统与法兰西王权权威，安茹帝国的治理艺术在效率与合法之间取得了平衡。"
 name_list_angevin:0 "安茹"
 angevin:0 "安茹"
 Hundred_Years_War_struggle.1004.a:0 "$Hundred_Years_War_struggle.1002.a$"
 Hundred_Years_War_struggle.1004.b:0 "$Hundred_Years_War_struggle.1002.b$"
 Hundred_Years_War_struggle.1004.c:0 "$Hundred_Years_War_struggle.1002.c$"
 Hundred_Years_War_struggle.1005.t:0 "$struggle_france_england_ending_union_decision$"
 Hundred_Years_War_struggle.1005.desc:1 "这一切#italic 终于#!结束了。\n\n一个多世纪以来，英格兰与法兰西第一次不再交战或准备开战——不仅是因为一方战胜了另一方，而是因为#italic 仇恨本身#!已经被战胜了。[struggle_ender.GetTitledFirstName]领导下的联合王国，将海峡两岸的人民凝聚成一个伟大的共同体。[struggle_ender.GetSheHe|U]无疑将作为历史上最伟大的君主之一而被铭记——作为两个古老民族的和解者与统一者。\n\n"
 Hundred_Years_War_struggle.1005.desc.closing.war:1 "[struggle_ender.GetTitledFirstNameNoTooltip]打算继续利用已经证明优势的联合王国军队来捍卫这个新生的帝国。只有通过武力，才能确保没有人胆敢挑战海峡两岸的联合。"
 Hundred_Years_War_struggle.1005.desc.closing.culture:1 "[struggle_ender.GetTitledFirstNameNoTooltip]打算融合英格兰与法兰西的文化，在两岸之间孕育出一个崭新的、统一的文明。[struggle_ender.GetSheHe|U]相信，从百年战争的灰烬中，一个全新的盎格鲁-法兰西世界将成长发育。"
 Hundred_Years_War_struggle.1005.desc.closing.politics:1 "[struggle_ender.GetTitledFirstNameNoTooltip]打算利用智慧与外交手腕，将两岸的贵族与封臣凝聚在联合王冠之下。为了长期保持对这一伟大事业的忠诚，毕竟需要坚定而谨慎的治理。"
 Hundred_Years_War_struggle.1005.desc.closing:1 "\n\n新时代到来了。未来的形状，世界的命运……这一切都属于#bold [struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip]#!。"
 Hundred_Years_War_struggle.1005.a:0 "$Hundred_Years_War_struggle.1002.a$"
 Hundred_Years_War_struggle.1006.t:0 "[struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip]取代了英格兰人与法兰西人"
 Hundred_Years_War_struggle.1006.desc:1 "这一切#italic 终于#!结束了。\n\n一个多世纪以来，英格兰人和法兰西人彼此厮杀，为了几块土地与一顶王冠而流血漂橹。他们如此专注于彼此之间的仇恨，以至于从未注意到#italic 我们#!——[struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip]的[struggle_ender.GetCulture.GetCollectiveNoun]人——正在从阴影中崛起。\n\n如今，这两个曾经强大的王国在漫长的战争中耗尽了自己的力量，而我们渔翁得利。[struggle_ender.GetTitledFirstName]将这个饱经战火的地区置于[struggle_ender.GetHerHis]的统治之下，终结了这场永无休止的纷争。\n\n那些自负的英格兰人和傲慢的法兰西人彼此交战数百年，却看不到他们自己即将到来的衰落。他们的愚蠢，将被我们世代传扬。\n\n在决定了要如何延续我们的统治之后，剩下来要做的就只是宣布胜利而已。"
 Hundred_Years_War_struggle.1006.a:0 "荣耀归于[struggle_ender.GetFaith.HighGodName]、荣耀归于我们的新帝国！"
 Hundred_Years_War_struggle.1007.t:0 "$Hundred_Years_War_struggle.1006.t$"
 Hundred_Years_War_struggle.1007.desc:1 "一个多世纪以来，英格兰人和法兰西人彼此战斗；一个多世纪以来，这两个王国为了几块土地而互相屠杀，血流漂橹；一个多世纪以来，英格兰人和法兰西人及他们的走狗在无尽的暴力循环中摧毁了彼此的村庄与城镇。\n\n现在？他们只有灰烬残存。\n\n多么讽刺啊，最终没人取得胜利：而是[struggle_ender.GetTitledFirstName]的[struggle_ender.GetCulture.GetCollectiveNoun]人，从这两个古老而衰败的王国手中夺走了对[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]的控制，并在这里建立了新的强权！\n\n英格兰人和法兰西人彼此交战数百年，却看不到他们自己即将到来的衰落。他们的愚蠢，将为我们所取代。\n\n新时代到来了。未来的形状，世界的命运……这一切都属于#bold [struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip]#!。"
 struggle_england_france_outsider_victory_tt:0 "你的[empire|E][title|E]成为[GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]内所有你控制的[kingdom|E]的[de_jure|E][liege|E]"
