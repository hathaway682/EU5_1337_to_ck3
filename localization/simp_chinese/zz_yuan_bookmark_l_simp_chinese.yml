l_simp_chinese:
 bm_yuan_dynasty:0 "堂堂大元"
 bm_yuan_dynasty_desc:0 "1337年，元朝仍统治着广袤的中国。朝廷权臣、地方忠臣、盐商与未来的红巾领袖生活在同一个帝国之下；数十年后，天下将迎来巨变。"
 bm_yuan_koke:0 "扩廓帖木儿"
 bm_yuan_chen_youliang:0 "陈友谅"
 bm_yuan_bayan:0 "伯颜"
 bm_yuan_bayan_subheading:0 "元朝中书右丞相"
 bm_yuan_bayan_desc:0 "伯颜位居中书省，辅佐元廷执掌政务。庞大帝国的统治依赖朝廷重臣，也面临复杂的内外挑战。"
 bm_yuan_han:0 "韩山童"
 bm_yuan_han_subheading:0 "白莲教领袖"
 bm_yuan_han_desc:0 "韩山童在民间传播弥勒信仰。此时红巾军尚未起事，他的未来仍掌握在自己手中。"
 bm_yuan_zhu:0 "朱元璋"
 bm_yuan_zhu_subheading:0 "凤阳少年"
 bm_yuan_zhu_desc:0 "朱元璋尚年幼，远未成为日后的明朝开国皇帝。他将在乱世中开辟怎样的道路？"
 bm_yuan_xu:0 "徐寿辉"
 bm_yuan_xu_subheading:0 "未来的天完之主"
 bm_yuan_xu_desc:0 "徐寿辉在此时尚未建立政权。追随者陈友谅就在身边，他们的命运将如何交织？"
 bm_yuan_zhang:0 "张士诚"
 bm_yuan_zhang_subheading:0 "淮东盐商"
 bm_yuan_zhang_desc:0 "张士诚以盐商身份谋生。未来的江南霸主如今要先在元朝的商业世界中立足。"
 bm_yuan_chaghan:0 "察罕帖木儿"
 bm_yuan_chaghan_subheading:0 "元廷忠臣"
 bm_yuan_chaghan_desc:0 "察罕帖木儿出身河南，与家人一起生活在元朝统治下。他日后将成为元廷抵御红巾军的重要将领。"
 bm_yuan_he:0 "何真"
 bm_yuan_he_subheading:0 "岭南的忠臣"
 bm_yuan_he_desc:0 "何真在岭南的元朝家族中起步。时代动荡将给他带来机遇，也将考验他对元廷的忠诚。"
 BM_YUAN_RELATION_FOLLOWER:0 "追随者"
