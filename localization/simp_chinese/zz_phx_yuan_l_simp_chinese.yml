 # === 决议（共 13 项 — 严格遵循 AGENTS.md 纯叙事风味风格） ===
 phx_yuan_zhizheng_reform_decision:0 "推行至正新政"
 phx_yuan_zhizheng_reform_decision_desc:0 "权臣专断、科举废弛与交钞泛滥已不断掏空大都的威信。唯有任用务实能臣整饬财政、重开科举以安抚士心，天子方能在大乱爆发之前稳住天下大局。"
 phx_yuan_zhizheng_reform_decision_tooltip:0 "结束严苛权臣摄政与钞法困局，推行全面朝政革新。"
 phx_yuan_zhizheng_reform_decision_confirm:0 "颁布至正新政诏书"
 phx_yuan_zhizheng_reform_effect_tt:0 "解除“权臣伯颜专政”与“至正交钞贬值”困局，开启至正新政。"

 phx_yuan_tame_yellow_river_decision:0 "征发治河工役"
 phx_yuan_tame_yellow_river_decision_desc:0 "河南堤坝溃决已令昔日膏腴之地沦为泽国，直抵京师的漕粮运输亦告中断。命水利干吏兴修堤防、挽回河道，虽能挽救灾区民生，却也须警惕大兴民夫所激起的暗流。"
 phx_yuan_tame_yellow_river_decision_tooltip:0 "拨款兴修重大水利工程，堵复开封一带黄河决口。"
 phx_yuan_tame_yellow_river_decision_confirm:0 "敕令兴工治河"
 phx_yuan_tame_yellow_river_effect_tt:0 "堵复开封黄河决口，恢复中原农桑与朝廷威望。"

 phx_yuan_commission_loyalist_armies_decision:0 "敕授勤王平叛义军"
 phx_yuan_commission_loyalist_armies_decision_desc:0 "江淮与长江沿岸红旗四起，单凭各路零散卫戍已难遏其势。唯当便宜行事，敕封忠勇地方统帅并征调精锐骑军，方能组建足以平叛的决胜之师。"
 phx_yuan_commission_loyalist_armies_decision_tooltip:0 "组建平叛勤王大军，并加恩激励忠于朝廷的地方统帅。"
 phx_yuan_commission_loyalist_armies_decision_confirm:0 "颁授平叛兵符"
 phx_yuan_commission_loyalist_armies_effect_tt:0 "于京畿编组精锐平叛军，并强化察罕帖木儿与扩廓帖木儿等勤王将领实力。"

 phx_yuan_northern_retreat_decision:0 "北狩上都·延续北元"
 phx_yuan_northern_retreat_decision_desc:0 "倘若中原财赋尽失、大都城门难守，黄金家族的汗统绝不必随宫阙同烬。退驻塞外夏都上都、收拢漠北诸部铁骑，尚可为大汗江山留存再起之基。"
 phx_yuan_northern_retreat_decision_tooltip:0 "将朝廷迁驻上都并集结草原铁骑，保全漠北基业。"
 phx_yuan_northern_retreat_decision_confirm:0 "车驾北狩上都"
 phx_yuan_northern_retreat_effect_tt:0 "迁都上都，并召募一支精锐草原怯薛护卫军。"

 phx_rtr_raise_red_banner_decision:0 "高举红巾义旗"
 phx_rtr_raise_red_banner_decision_desc:0 "水患频仍、徭役繁重加之贪官盘剥，已将江淮与长江流域的黎民逼至绝境。失地农夫、运河民夫与私盐豪杰早已头裹红巾，只待振臂一呼便将星火燎原。"
 phx_rtr_raise_red_banner_decision_tooltip:0 "号召天下豪杰裹红巾起义，拉起一支反元义师。"
 phx_rtr_raise_red_banner_decision_confirm:0 "揭竿起义，高悬红旗"
 phx_rtr_raise_red_banner_effect_tt:0 "集结红巾义军并点燃席卷江淮的反元浪潮。"

 phx_rtr_high_walls_grain_decision:0 "高筑墙，广积粮，缓称王"
 phx_rtr_high_walls_grain_decision_desc:0 "群雄皆急于披黄袍、僭尊号，却纵兵劫掠而失尽民心。谋士进言：唯当固守城池、广储粮草、严束军纪、礼贤下士，待大势已成再图天命，方为百胜之道。"
 phx_rtr_high_walls_grain_decision_tooltip:0 "奉行稳健治政与后勤积蓄国策，在群雄逐鹿中厚积薄发。"
 phx_rtr_high_walls_grain_decision_confirm:0 "确立大计，厚积薄发"
 phx_rtr_high_walls_grain_effect_tt:0 "显著提升首府发展、领地治理与军民归心。"

 phx_rtr_proclaim_new_dynasty_decision:0 "驱逐胡虏·光复中华"
 phx_rtr_proclaim_new_dynasty_decision_desc:0 "江南既定，中原重光，连年水旱兵燹的乱世终告落幕。登坛祭天、改元建号，自此华夏衣冠重振、万民归心。"
 phx_rtr_proclaim_new_dynasty_decision_tooltip:0 "宣告中原光复，以赫赫功业建立新朝天命。"
 phx_rtr_proclaim_new_dynasty_decision_confirm:0 "登坛祭天，开创大统"
 phx_rtr_proclaim_new_dynasty_effect_tt:0 "获得“承天启运·新朝天命”加持，推动红巾局势迈向终局定鼎。"

 phx_rtr_seize_yingtian_capital_decision:0 "定鼎应天·龙蟠虎踞"
 phx_rtr_seize_yingtian_capital_decision_desc:0 "金陵背倚钟山、俯临长江，自古便有龙蟠虎踞之称。在此高筑城垣、营建官署与江防船厂，足可为席卷江南、经略中原铸就万世帝基。"
 phx_rtr_seize_yingtian_capital_decision_tooltip:0 "迁都应天府，将金陵营建为固若金汤的帝王之都。"
 phx_rtr_seize_yingtian_capital_decision_confirm:0 "定都金陵，营建帝京"
 phx_rtr_seize_yingtian_capital_effect_tt:0 "迁都应天，赋予其“应天龙蟠虎踞帝都”加持并开启洪武清吏治政。"

 phx_rtr_recruit_huaisi_generals_decision:0 "延揽淮西勋贵与浙东贤士"
 phx_rtr_recruit_huaisi_generals_decision_desc:0 "匹夫之勇可胜一战，开创大统则须文武并济。遣使招揽淮西悍将与浙东宿儒，方能于乱世之中组建百战百胜的帷幄班底。"
 phx_rtr_recruit_huaisi_generals_decision_tooltip:0 "礼聘淮西名将与浙东谋臣入幕，壮大核心班底。"
 phx_rtr_recruit_huaisi_generals_decision_confirm:0 "颁书礼聘四方贤才"
 phx_rtr_recruit_huaisi_generals_effect_tt:0 "延揽李善长、刘基、徐达、常遇春入朝效力并显著强化统军能力。"

 phx_rtr_proclaim_great_han_decision:0 "称帝九江·肇建大汉"
 phx_rtr_proclaim_great_han_decision_desc:0 "手握长江中游膏腴之地与巍峨楼船水师，寄人篱下之日已成过往。自立国号大汉，挥师东下，便可与天下群雄争锋长江！"
 phx_rtr_proclaim_great_han_decision_tooltip:0 "建号大汉，整编威震长江的楼船水师。"
 phx_rtr_proclaim_great_han_decision_confirm:0 "登基建号，扬帆东征"
 phx_rtr_proclaim_great_han_effect_tt:0 "获得“大汉长江巨舰”加持并召募精锐长江水师。"

 phx_rtr_proclaim_great_zhou_decision:0 "据守平江·开国大周"
 phx_rtr_proclaim_great_zhou_decision_desc:0 "姑苏丝绸甲于天下，两淮盐场日进斗金。建号大周、广交东南士绅商贾，即可凭雄厚财赋在江南自立不败之地。"
 phx_rtr_proclaim_great_zhou_decision_tooltip:0 "于姑苏建号大周，坐收两淮盐利与江南商贸之富。"
 phx_rtr_proclaim_great_zhou_decision_confirm:0 "建号大周，坐镇吴越"
 phx_rtr_proclaim_great_zhou_effect_tt:0 "获得“大周两淮盐利”加持，充实府库并编组平江卫队。"

 phx_rtr_proclaim_great_song_decision:0 "奉小明王·复兴大宋"
 phx_rtr_proclaim_great_song_decision_desc:0 "中原黎民思念赵宋旧德久矣，白莲明王之说更令万众归心。正式建号大宋、挥师北进，足以号令诸路红巾共覆元廷！"
 phx_rtr_proclaim_great_song_decision_tooltip:0 "宣告大宋复兴，激发席卷中原的红巾狂热。"
 phx_rtr_proclaim_great_song_decision_confirm:0 "建号大宋，兴师北伐"
 phx_rtr_proclaim_great_song_effect_tt:0 "获得“大宋弥勒狂热”加持并召募庞大的北方红巾大军。"

 phx_yuan_grand_canal_dredging_decision:0 "疏浚大运河漕运"
 phx_yuan_grand_canal_dredging_decision_desc:0 "运河闸口淤塞、沿途仓驿残破已令大都米价腾贵、人心惶惶。趁河患初平疏通南北漕运，可使江南粮船复抵京畿、重振国计。"
 phx_yuan_grand_canal_dredging_decision_tooltip:0 "疏浚大运河并恢复直抵大都的漕粮水路。"
 phx_yuan_grand_canal_dredging_decision_confirm:0 "敕令重开运河漕道"
 phx_yuan_grand_canal_dredging_effect_tt:0 "令辖下运河重镇获得“大运河漕运重通”加持，并稳固朝政局势。"

 # === 事件（共 32 项 — 严格遵循 AGENTS.md 纯叙事风味风格） ===
 phx_yuan.0001.t:0 "大都殿阁间的暗云"
 phx_yuan.0001.desc:0 "1337年春，大元疆域虽仍北抵林海、南临沧溟，大都朱红殿柱之下却已暗生裂隙。南方市井交钞日贬，诸部为漕运粮饷争执不休，铁腕权臣[bayan.GetTitledFirstName]更独揽中书大权。\n\n此番大元江山是能重振天命，还是滑向倾覆剧变，全看今后十年朝堂如何运筹。"
 phx_yuan.0001.a:0 "韬光养晦，暗中培植可托重任的革新干吏。"
 phx_yuan.0001.b:0 "暂借严刑峻法震慑四方，先稳财赋。"

 phx_yuan.0005.t:0 "江淮风雷起于微末"
 phx_yuan.0005.desc:0 "1337年的茶肆、盐场与渡口之间，人们低声议论着飞涨的米价、苛酷的税吏与黄河异象。无论你志在效忠朝廷平定四方，还是欲待旧序崩解时逐鹿中原，这片暂时的平静都注定不会长久。"
 phx_yuan.0005.a:0 "静观天下风云，早作万全准备。"

 phx_yuan.0010.t:0 "权臣倾覆与新政契机"
 phx_yuan.0010.desc:0 "深宫密议终于迎来决断之刻。[toghtogha.GetTitledFirstName]联合近臣上陈利害，力请罢黜权臣专政、重开科举取士，并在民变酝酿之前安抚离心的地方士民。"
 phx_yuan.0010.a:0 "支持[toghtogha.GetFirstNameNoTooltip]变法革新，重整朝纲。"
 phx_yuan.0010.b:0 "维持旧勋旧制——退让只会助长觊觎之心。"

 phx_yuan.0020.t:0 "黄河决口与“石人一只眼”"
 phx_yuan.0020.desc:0 "浑身泥浆的急递驿卒接连奔入大都：黄河于河南大决，州县沦为汪洋，盐场尽毁，大运河漕道淤塞中断。更令人心惊的是，治河工地与州县坊间悄然流传起一首童谣——“石人一只眼，挑动黄河天下反。”"
 phx_yuan.0020.a:0 "急开官仓赈济灾民，竭力安抚中原。"
 phx_yuan.0020.b:0 "强征各路民夫奔赴河堤抢险堵口。"
 phx_yuan_yellow_river_unrest_tt:0 "引发江淮与黄河流域剧烈动荡，开启红巾军起义浪潮并解锁“贾鲁治河大工”伟大工程。"

 phx_yuan.0030.t:0 "石人一只眼，天下动风雷"
 phx_yuan.0030.desc:0 "昔日窃窃私语的谶语如今响彻江淮与长江沿岸的每一座州城。流离失所的灾民、散落的治河役夫与四方豪杰纷纷以红巾裹首，誓言扫荡贪墨苛政、重整乾坤。"
 phx_yuan.0030.a:0 "裹起红巾——改天换地就在今朝！"
 phx_yuan.0030.b:0 "暂且隐忍蓄力，先广聚粮饷兵甲。"

 phx_yuan.0035.t:0 "江淮红旗遍地起"
 phx_yuan.0035.desc:0 "插满羽毛的八百里加急军报雪片般飞入中书省：头裹红巾的武装已自颍州席卷至长江中游，沿途拦截运往大都的漕船，并传檄四方号召反元。"
 phx_yuan.0035.a:0 "传令诸路整军备战——大元绝不轻言退让！"

 phx_yuan.0100.t:0 "至正新政昭告天下"
 phx_yuan.0100.desc:0 "贴满各路州府大门的诏书正式宣布重开科举、彻查府库积弊并重修常平义仓。久违的务实之风令士林与商贾对大都重燃一丝期许。"
 phx_yuan.0100.a:0 "愿清明政令令四海重归安宁。"

 phx_yuan.0110.t:0 "黄河复归故道"
 phx_yuan.0110.desc:0 "历经数月沉船筑埽、垒石固堤的艰苦工役，开封一带奔腾肆虐的决口终于合龙。南来漕船重新驶入疏通后的水道，北上接济京师。"
 phx_yuan.0110.a:0 "水患既平，愿天佑中原。"

 phx_yuan.0120.t:0 "平叛勤王之师出征"
 phx_yuan.0120.desc:0 "手捧御赐兵符与新补战马，各地忠勇统帅迅速于北方州郡整编精骑，立誓击破乱军、重通南北官道。"
 phx_yuan.0120.a:0 "速速进兵，平定四方烽烟。"

 phx_yuan.0130.t:0 "御驾重归夏都上都"
 phx_yuan.0130.desc:0 "长城以北，塞外长风掠过上都辽阔的牧场，大汗旌旗再度高悬于草原之上。纵使江南殿阁已远，草原铁骑的脊梁仍未折断。"
 phx_yuan.0130.a:0 "漠北草原永远是我们的根基所在。"

 phx_yuan.0200.t:0 "红巾如海，义旗猎猎"
 phx_yuan.0200.desc:0 "自水乡市镇至群山营寨，万千义士闻风响应，额系红巾，手执长矛、劲弩与火铳汇聚麾下。昔日民间私语，终化作撼动乾坤的雄师。"
 phx_yuan.0200.a:0 "全军挺进——令腐朽旧序为之震颤！"

 phx_yuan.0210.t:0 "帷幄大计"
 phx_yuan.0210.desc:0 "军帐孤灯之下，幕僚为你铺开长远筹划：深挖高垒、严禁扰民、广储秋粮并礼聘四方贤士，坐看急于称帝的群雄彼此消耗。"
 phx_yuan.0210.a:0 "唯有厚积薄发，方能笑到最后。"

 phx_yuan.0220.t:0 "受命于天，再造华夏"
 phx_yuan.0220.desc:0 "圜丘祭坛之上香烟缭绕，百官身着礼服拜贺新朝肇建。数十年水旱兵戈的阴霾一朝散尽，统一而焕发新生的大好河山自此启幕。"
 phx_yuan.0220.a:0 "愿新朝国祚绵延万世！"

 phx_yuan.0230.t:0 "龙蟠虎踞，定鼎金陵"
 phx_yuan.0230.desc:0 "自紫金山麓至长江江畔，崭新的砖石城垣与衙署在旗帜簇拥下巍然矗立。应天府已不再是寻常州城，而是俯瞰江南、剑指中原的帝王之都。"
 phx_yuan.0230.a:0 "大业根基，自此深植金陵。"

 phx_yuan.0240.t:0 "淮西虎将，浙东名士"
 phx_yuan.0240.desc:0 "身经百战的淮西诸将与博学多谋的浙东大儒齐聚一堂。众志成城之下，昔日草莽义军终于蜕变为法度森严的王师。"
 phx_yuan.0240.a:0 "文武同心，何愁天下不定！"

 phx_yuan.0250.t:0 "楼船蔽江，大汉肇基"
 phx_yuan.0250.desc:0 "武昌与九江江面上战鼓轰鸣，漆红的巍峨楼船纷纷升起大汉龙旗。长江中游尽入掌握，下游诸侯闻风色变。"
 phx_yuan.0250.a:0 "控扼大江者，必掌天下权柄！"

 phx_yuan.0260.t:0 "丝绸盐利，大周兴盛"
 phx_yuan.0260.desc:0 "平江城内钟鼓齐鸣，商贾士绅与两淮盐舟首领共庆大周建号。仓廪丰盈、市井繁华，俨然乱世江南一方乐土。"
 phx_yuan.0260.a:0 "先富吴越，静待群雄自耗。"

 phx_yuan.0270.t:0 "明王出世，大宋复兴"
 phx_yuan.0270.desc:0 "白莲檀香缭绕于数万肃立将士之上，复宋兴汉的旗号迎风舒展。万众高呼明王降世，誓言饮马黄河、重光汴京。"
 phx_yuan.0270.a:0 "明王既出，全军直指中原！"

 phx_yuan.0280.t:0 "千帆北上，漕运重通"
 phx_yuan.0280.desc:0 "新近疏浚的大运河水闸次第开启，满载江南漕米的船队再度浩荡北上直抵大都。京师米价回落，朝野顿感久违的安稳。"
 phx_yuan.0280.a:0 "漕道畅通一日，大元江山便多一分生机。"

 phx_yuan.0300.t:0 "投身濠州与马氏结缘"
 phx_yuan.0300.desc:0 "江淮大饥、烽烟四起之际，濠州红巾统帅[guo_zixing.GetTitledFirstName]一眼看中你沉稳果敢的器量。其营中义女[lady_ma.GetFirstName]贤明仁厚、识见不凡，深得军中敬重。"
 phx_yuan.0300.desc_fallback:0 "江淮大饥、烽烟四起之际，濠州红巾诸将一眼看中你沉稳果敢的器量，愿与你结盟联姻、共举义旗。"
 phx_yuan.0300.a:0 "投效濠州义军，并缔结良缘。"
 phx_yuan.0300.b:0 "不寄人篱下，自立旗号闯出一番天地。"

 phx_yuan.0305.t:0 "兵出淮西，经略凤阳"
 phx_yuan.0305.desc:0 "流民、铁匠与乡老络绎奔赴营前，沿淮元军卫戍早已军心涣散。众将指向凤阳与滁州城郭：唯有早日夺取立足州县，方能跳出流寇樊笼、成就霸业。"
 phx_yuan.0305.a:0 "誓师出击，挥兵直取凤阳！"
 phx_yuan.0305.b:0 "暂且整训士卒，蓄势以待更佳战机。"

 phx_yuan.0310.t:0 "帷幄群贤，开国柱石"
 phx_yuan.0310.desc:0 "你严束军纪、秋毫无犯之名传遍江淮与浙东。四位惊世奇才相继慕名来投：精于粮饷吏治的李善长、料事如神的浙东名士刘基、沉毅善谋的大将徐达，以及勇冠三军的先锋猛将常遇春。"
 phx_yuan.0310.a:0 "延入中军大帐——得此四杰，何愁大业不成！"
 phx_yuan_0310_recruited_tt:0 "延揽李善长、刘基、徐达与常遇春入幕效力，并缔结赤诚忠心。"

 phx_yuan.0315.t:0 "飞渡采石，直取应天"
 phx_yuan.0315.desc:0 "浩荡长江南岸，烟雨笼罩下的金陵山色历历在目。探马回报采石矶江防空虚，若能乘风疾渡，便可一举兵临应天城下。"
 phx_yuan.0315.a:0 "千帆竞渡——金陵非我莫属！"
 phx_yuan.0315.b:0 "先固守江北根基，再图南渡之策。"

 phx_yuan.0320.t:0 "鄱阳湖血战，烈火破楼船"
 phx_yuan.0320.desc:0 "[chen_youliang.GetTitledFirstName]率领铁索连环的大汉巨舰压境鄱阳湖，桅樯蔽日、杀气冲霄。面对敌众我寡之势，帐中众将遥望骤起的东北劲风，备下满载芦苇火油与火药的敢死火船。"
 phx_yuan.0320.desc_fallback:0 "铁索连环的长江巨舰压境鄱阳湖，桅樯蔽日、杀气冲霄。面对敌众我寡之势，帐中众将遥望骤起的东北劲风，备下满载芦苇火油与火药的敢死火船。"
 phx_yuan.0320.a:0 "借东北风势，纵火船冲阵！"
 phx_yuan.0320.b:0 "死守湖口水道，绝其粮道以逸待劳。"

 phx_yuan.0325.t:0 "平定姑苏，收服吴越"
 phx_yuan.0325.desc:0 "大江上游强敌既挫，唯有财富甲天下的姑苏与浙西尚在敌手。诸将磨刀霍霍，力请挥师东进平江，尽收江南膏腴之地。"
 phx_yuan.0325.a:0 "整备攻城器械，进取姑苏与杭州。"
 phx_yuan.0325.b:0 "以商旅恩威招抚江南士绅，缓图兼并。"

 phx_yuan.0330.t:0 "北伐中原檄文"
 phx_yuan.0330.desc:0 "大江北岸旌旗蔽空，使者高声宣读传遍四海的北伐檄文：“驱逐胡虏，恢复中华，立纲陈纪，救济斯民！”三军将士与夹道百姓无不热泪盈眶，通往汴梁与大都的征途豁然洞开。"
 phx_yuan.0330.a:0 "金鼓齐鸣——全军北伐，光复燕云中原！"
 phx_yuan.0330.b:0 "先充实淮北军粮，再发雷霆一击。"

 phx_yuan.0340.t:0 "察罕父子勤王，铁骑卫中原"
 phx_yuan.0340.desc:0 "正当南方诸省烽火连天之际，北方名将[chaghan_temur.GetTitledFirstName]与[koke_temur.GetTitledFirstName]于河南、山西整编出纪律严明的精锐铁骑，愿为大都朝廷力挽狂澜。"
 phx_yuan.0340.desc_fallback:0 "正当南方诸省烽火连天之际，忠勇的北方统帅们于河南、山西整编出纪律严明的精锐铁骑，愿为大都朝廷力挽狂澜。"
 phx_yuan.0340.a:0 "颁赐节钺重权，大力扩充勤王铁骑。"
 phx_yuan.0340.b:0 "须防地方藩镇坐大，仅予有限兵权。"

 phx_yuan.0350.t:0 "贾鲁河工合龙，石人余波未息"
 phx_yuan.0350.desc:0 "开封新筑的巨型石堤之上欢声雷动，奔腾肆虐多年的黄河终于在贾鲁督导下驯服归槽。然而宫廷尚在庆贺奇功之际，密报却称工地泥沙间掘出独目石人，无数精疲力竭的民夫正于夜色中悄然裹起红巾四散而去。"
 phx_yuan.0350.a:0 "大加赏赐治河有功之臣，并严密戒备江淮。"
 phx_yuan.0350.b:0 "散银赈米优抚返乡役夫，竭力消弭怨气。"
 phx_yuan_0350_labor_spark_tt:0 "开封河患虽告平息，但大规模征夫留下的星火仍在江淮间迅速蔓延。"

 phx_yuan.0360.t:0 "颍州焚香，红巾初起"
 phx_yuan.0360.desc:0 "淮北夜幕之下，[liu_futong.GetTitledFirstName]率数万义众杀白马黑牛誓师天地，额系红巾，宣称明王降世、复立大宋。近在咫尺的亳州与颍州城防已摇摇欲坠。"
 phx_yuan.0360.desc_fallback:0 "淮北夜幕之下，数万义众杀白马黑牛誓师天地，额系红巾，宣称明王降世、复立大宋。近在咫尺的亳州与颍州城防已摇摇欲坠。"
 phx_yuan.0360.a:0 "星夜奇袭亳州，点燃北方大起义！"
 phx_yuan.0360.b:0 "暗中广传明王教义，待聚众十万再行举事。"

 phx_yuan.0370.t:0 "长江风雷与天完异心"
 phx_yuan.0370.desc:0 "自蕲水至武昌江畔，无数船夫铁匠高呼口号投奔天完红巾旗帜。然身侧骁将[chen_youliang.GetTitledFirstName]目光深沉，每克一城便悄然培植私党，其志显非久居人下。"
 phx_yuan.0370.desc_fallback:0 "自蕲水至武昌江畔，无数船夫铁匠高呼口号投奔天完红巾旗帜，而军中骄将却已暗生异心、图谋自立江汉。"
 phx_yuan.0370.a:0 "乘胜挥师直下武昌重镇！"
 phx_yuan.0370.b:0 "先收拢兵权、裁抑骄将，再图进取。"

 phx_yuan.0380.t:0 "十八条扁担，泰州盐枭举事"
 phx_yuan.0380.desc:0 "饱受官盐苛政与贪吏盘剥之苦，十八位悍勇盐舟头领齐聚高邮盐场誓死相随。手握充沛私盐银两与江海舟楫，富甲东南的平江姑苏城近在眼前。"
 phx_yuan.0380.a:0 "焚毁官盐税簿，挥师进取姑苏！"
 phx_yuan.0380.b:0 "广屯私盐军械，静观元廷溃败再发兵。"

 phx_yuan.0390.t:0 "夜出健德门，北狩漠北"
 phx_yuan.0390.desc:0 "南郊烽烟照彻夜空，大都城池终告失守。黎明前的寒风中，怯薛护卫于北门备齐骏马，护送天子退往塞外上都与辽阔草原，延续黄金家族未竟之统。"
 phx_yuan.0390.a:0 "北狩上都——大汗铁骑仍驰骋于漠北草原！"
 phx_yuan.0390.b:0 "对着塞外长风立誓，来日必复中原大都！"
