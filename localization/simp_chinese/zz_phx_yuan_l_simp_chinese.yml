l_simp_chinese:
 # === 原生局势：红巾军大起义 ===
 situation_phx_red_turban_rebellion:0 "红巾烽烟·逐鹿中原"
 situation_phx_red_turban_rebellion_desc:0 "黄河决口、交钞贬值与大都朝堂党争正将百年大元推向倾覆边缘。自淮西白莲焚香至江南群雄并起，天命归属再度悬于兵戈之间。"
 situation_type_phx_red_turban_rebellion:0 "红巾烽烟·逐鹿中原"
 situation_type_phx_red_turban_rebellion_desc:0 "$situation_phx_red_turban_rebellion_desc$"
 phx_red_turban_rebellion:0 "红巾烽烟·逐鹿中原"
 phx_red_turban_rebellion_desc:0 "$situation_phx_red_turban_rebellion_desc$"

 phx_red_turban_rebellion_sub_region_core:0 "中原与江南腹地"
 phx_red_turban_rebellion_sub_region_core_desc:0 "北起大都燕蓟、南至江淮吴越的华夏核心之地，大元朝廷与各路红巾群雄在此决断天命。"

 # 局势阵营
 phx_red_turban_rebellion_participant_group_phx_rtr_yuan_court:0 "大元朝廷与勤王藩镇"
 phx_red_turban_rebellion_participant_group_phx_rtr_yuan_court_desc:0 "大都元廷、中书省诸臣及察罕帖木儿、扩廓帖木儿等勤王将帅，力图挽回大元国祚。"
 phx_red_turban_rebellion_participant_group_phx_rtr_northern_turbans:0 "北系红巾·韩宋"
 phx_red_turban_rebellion_participant_group_phx_rtr_northern_turbans_desc:0 "韩山童、刘福通等人于江淮中原高举白莲明王与复宋大旗，燃起席卷北方的起义烈焰。"
 phx_red_turban_rebellion_participant_group_phx_rtr_southern_contenders:0 "江南群雄·朱明/大汉/大周"
 phx_red_turban_rebellion_participant_group_phx_rtr_southern_contenders_desc:0 "朱元璋、徐寿辉、陈友谅、张士诚等雄踞江汉吴越的群雄，各自整军经武以图一统天下。"
 phx_red_turban_rebellion_phx_rtr_yuan_court:0 "红巾乱局 #weak ($PARTICIPANT_GROUP$)#!"
 phx_red_turban_rebellion_phx_rtr_northern_turbans:0 "红巾乱局 #weak ($PARTICIPANT_GROUP$)#!"
 phx_red_turban_rebellion_phx_rtr_southern_contenders:0 "红巾乱局 #weak ($PARTICIPANT_GROUP$)#!"

 # 局势阶段
 phx_rtr_phase_simmering:0 "积弊暗涌"
 phx_rtr_phase_simmering_desc:0 "大都殿阁尚存昔日威仪，然交钞日贬、科举停废与江淮暗流早已埋下大乱之根。"
 phx_rtr_phase_flood_spark:0 "河决民变"
 phx_rtr_phase_flood_spark_desc:0 "黄河大决河南，十五万治河民夫聚于堤岸，“石人一只眼”谶语传遍四方，红巾烽火骤然点燃。"
 phx_rtr_phase_warring_factions:0 "群雄割据"
 phx_rtr_phase_warring_factions_desc:0 "大元南疆分崩离析，大宋、大汉、大周与淮西朱明诸部各据重镇、血战江湖，天下进入群雄逐鹿之秋。"
 phx_rtr_phase_resolution:0 "逐鹿定鼎"
 phx_rtr_phase_resolution_desc:0 "决胜中原的大战终见分晓，久经战火的州县渐次止戈息兵，迎来新朝秩序或帝国中兴。"
 phx_red_turban_rebellion_phx_rtr_phase_simmering_situation_phase:0 "$phx_rtr_phase_simmering$"
 phx_red_turban_rebellion_phx_rtr_phase_flood_spark_situation_phase:0 "$phx_rtr_phase_flood_spark$"
 phx_red_turban_rebellion_phx_rtr_phase_warring_factions_situation_phase:0 "$phx_rtr_phase_warring_factions$"
 phx_red_turban_rebellion_phx_rtr_phase_resolution_situation_phase:0 "$phx_rtr_phase_resolution$"

 # 局势修正组与参数
 phx_rtr_realm_effects:0 "朝政与民生影响"
 phx_rtr_military_effects:0 "军备与动员影响"
 situation_parameter_phx_rtr_param_simmering_unrest:0 "大都新政与黄河灾变将决定红巾大乱何时全面爆发。"
 situation_parameter_phx_rtr_param_flood_spark:0 "红巾诸路豪杰可高举义旗并启用“红巾光复起义”宣战理由。"
 situation_parameter_phx_rtr_param_warring_contenders:0 "江南诸雄与大元勤王军于中原全面交锋，争夺天下正统。"
 situation_parameter_phx_rtr_param_mandate_decided:0 "天命重归定局，中原与江南逐步转入休养生息。"

 # 局势催化剂
 catalyst_phx_rtr_yellow_river_breach:0 "黄河大决口"
 catalyst_phx_rtr_yellow_river_breach_desc:0 "河南堤坝溃决淹没州县，大元朝廷威信急剧动摇。"
 catalyst_phx_rtr_jialu_corvee_spark:0 "征夫治河·石人现世"
 catalyst_phx_rtr_jialu_corvee_spark_desc:0 "大规模征发治河民夫令“石人一只眼”民谣广为流传，引爆民变。"
 catalyst_phx_rtr_red_banner_raised:0 "红巾举义"
 catalyst_phx_rtr_red_banner_raised_desc:0 "义军领袖裹红巾揭竿而起，号召四方反元。"
 catalyst_phx_rtr_contender_seized_base:0 "群雄攻克重镇"
 catalyst_phx_rtr_contender_seized_base_desc:0 "红巾义师夺取江淮或长江沿岸核心州府，割据之势已成。"
 catalyst_phx_rtr_contender_proclaimed_realm:0 "群雄建号称王"
 catalyst_phx_rtr_contender_proclaimed_realm_desc:0 "一方霸主正式建立国号，天下大势加速走向决战。"
 catalyst_phx_rtr_imperial_reform_stabilization:0 "朝廷变法平叛"
 catalyst_phx_rtr_imperial_reform_stabilization_desc:0 "整顿朝政、重通漕运或击退乱军暂时稳住了朝廷局势。"
 catalyst_phx_rtr_dynastic_mandate_decided:0 "新朝登坛受命"
 catalyst_phx_rtr_dynastic_mandate_decided_desc:0 "得胜雄主登坛祭天、肇建新朝，终结末世纷争。"
 catalyst_phx_rtr_northern_retreat:0 "元廷北狩漠北"
 catalyst_phx_rtr_northern_retreat_desc:0 "大都失守、御驾退往草原上都，中原易主大局已定。"

 # === 伟大工程：贾鲁治河大工 ===
 great_project_type_phx_jialu_yellow_river_works:0 "贾鲁治河大工"
 great_project_type_phx_jialu_yellow_river_works_desc:0 "奉诏于开封一线兴修的宏大水利工程，集疏浚故道、沉船筑埽与石堤合龙于一体，以挽黄河狂澜、重通大都漕运——然大征民夫亦难免在江淮间激起烽火暗流。"
 great_project_type_tooltip_phx_jialu_yellow_river_works:0 "于开封主持贾鲁治河大工，彻底堵复黄河决口并振兴中原水土。"
 great_project_type_phx_jialu_yellow_river_works_possessive:0 "贾鲁治河大工的"
 great_project_type_phx_jialu_yellow_river_works_contribution_stone_gabions:0 "石笼柳埽与筑堤料材"
 great_project_type_phx_jialu_yellow_river_works_contribution_stone_gabions_desc:0 "以巨石竹笼、编柳草埽与沉船合龙抵御滔天河水所需的庞大工料。"
 great_project_type_phx_jialu_yellow_river_works_contribution_corvee_labor_corps:0 "河防征发民夫营"
 great_project_type_phx_jialu_yellow_river_works_contribution_corvee_labor_corps_desc:0 "自河南、河北诸路调集的数以万计治河丁壮，昼夜开挖引河故道。"
 great_project_type_phx_jialu_yellow_river_works_contribution_hydraulic_surveyors:0 "贾鲁水工勘测司"
 great_project_type_phx_jialu_yellow_river_works_contribution_hydraulic_surveyors_desc:0 "精通水势地形的河防工官与测绘能手，主持修筑减水坝闸以固长久之安。"

 # === 故事循环 ===
 story_phx_zhu_rise:0 "潜龙在渊·洪武崛起"
 story_phx_zhu_rise_desc:0 "自濠州军中一介布衣，历淮西举旗、礼聘群贤、血战鄱阳至北伐中原，朱元璋改天换地的帝王之路正徐徐展开。"
 STORY_PHX_ZHU_RISE_INFO:0 "见证朱元璋自投身郭子兴营、延揽淮西浙东贤才、决胜鄱阳湖直至北伐定鼎的传奇征程。"
 STORY_PHX_ZHU_STAGE_LABEL:0 "洪武大业进程"
 STORY_PHX_ZHU_STAGE_MIN:0 "濠州初起"
 STORY_PHX_ZHU_STAGE_MAX:0 "北伐中原"

 story_phx_yuan_twilight:0 "大元残阳·至正风云"
 story_phx_yuan_twilight_desc:0 "伯颜专政、黄河决口、红巾蜂起与察罕铁骑勤王接踵而至，大都天子正面临忽必烈开国以来最严峻的生死考验。"
 STORY_PHX_YUAN_TWILIGHT_INFO:0 "在宫廷倾轧、黄河水患、红巾浪潮与勤王将帅之间力挽狂澜——或为黄金家族保全漠北草原基业。"
 STORY_PHX_YUAN_STAGE_LABEL:0 "至正危局进程"
 STORY_PHX_YUAN_STAGE_MIN:0 "大都摄政"
 STORY_PHX_YUAN_STAGE_MAX:0 "大都存亡"

 # === 宣战理由 ===
 phx_rtr_uprising_seizure_cb:0 "红巾光复起义"
 PHX_RTR_UPRISING_CB_NAME:0 "红巾起义光复[TITLE.GetBaseNameNoTier]"
 PHX_RTR_UPRISING_WAR_NAME:0 "[ATTACKER.GetFirstName]光复[TITLE.GetBaseNameNoTier]之红巾起义"
 PHX_RTR_UPRISING_WAR_NAME_BASE:0 "红巾光复起义"
 phx_rtr_uprising_seizure_cb_victory_desc:0 "[attacker.GetShortUIName]夺取目标华夏州土，自立根基并重创大元在中原的统治。"
 phx_rtr_uprising_seizure_cb_white_peace_desc:0 "双方暂息兵戈、互有顾忌，目标州县仍由[defender.GetShortUIName]控驭。"
 phx_rtr_uprising_seizure_cb_defeat_desc:0 "[defender.GetShortUIName]击破义军攻势，迫使[attacker.GetShortUIName]赔款退兵并重振朝廷威势。"
 phx_rtr_uprising_seizure_cb_invalidated_desc:0 "目标州县归属已变，此番起义战事随之终结。"

 # === 修正（共 20 项） ===
 phx_yuan_bayan_regency_modifier:0 "权臣伯颜专政"
 phx_yuan_bayan_regency_modifier_desc:0 "篾儿乞氏右丞相以铁腕独断大都朝政，废止科举、严苛压制南方士民，令朝野离心日深。"
 phx_yuan_chao_inflation_modifier:0 "至正交钞贬值"
 phx_yuan_chao_inflation_modifier_desc:0 "朝廷滥印纸钞令江南商市物价飞腾，国库实收赋税日益萎缩。"
 phx_yuan_zhizheng_reforms_modifier:0 "至正新政"
 phx_yuan_zhizheng_reforms_modifier_desc:0 "重开科举、清理财赋并任用干吏，令大元朝政焕发出久违的清明气象。"
 phx_yuan_yellow_river_flood_modifier:0 "黄河大决口"
 phx_yuan_yellow_river_flood_modifier_desc:0 "溃决的河堤将中原州县化为泽国，盐运漕道断绝，流民四散。"
 phx_yuan_jialu_waterworks_modifier:0 "贾鲁治河功成"
 phx_yuan_jialu_waterworks_modifier_desc:0 "新修的石堤与疏浚河道令黄河重归故道，中原田亩与漕运渐次复苏。"
 phx_yuan_northern_retreat_modifier:0 "北狩上都·草原续统"
 phx_yuan_northern_retreat_modifier_desc:0 "御驾退驻塞外上都，大汗麾下铁骑得以在漠北草原重新集结存续。"
 phx_rtr_red_turban_zeal_modifier:0 "红巾义师锐气"
 phx_rtr_red_turban_zeal_modifier_desc:0 "怀着改天换地之志与对苛政的滔天怒火，各地义士裹红巾而起，士气如虹。"
 phx_rtr_zhu_virtuous_discipline_modifier:0 "高筑墙·广积粮"
 phx_rtr_zhu_virtuous_discipline_modifier_desc:0 "军纪严明、府库充实、广纳贤才的方略深得江南士绅与百姓归心。"
 phx_rtr_loyalist_banner_modifier:0 "勤王平叛义军"
 phx_rtr_loyalist_banner_modifier_desc:0 "久经战阵的地方豪杰与铁骑部众奉诏勤王，力图扼守关隘、平定四方。"
 phx_rtr_new_dynasty_mandate_modifier:0 "承天启运·新朝天命"
 phx_rtr_new_dynasty_mandate_modifier_desc:0 "随着中原与江南重归清平，新立王朝以赫赫功业昭告天下、受命于天。"
 phx_rtr_ming_hongwu_admin_modifier:0 "洪武清吏治政"
 phx_rtr_ming_hongwu_admin_modifier_desc:0 "严惩贪墨、编造黄册与鱼鳞图册、整饬田赋，令新立汉家政权根基磐固。"
 phx_rtr_great_han_river_fleet_modifier:0 "大汉长江巨舰"
 phx_rtr_great_han_river_fleet_modifier_desc:0 "高耸如楼、满载强弩与火器的朱漆战船纵横长江中游，声威震慑东南。"
 phx_rtr_great_zhou_salt_wealth_modifier:0 "大周两淮盐利"
 phx_rtr_great_zhou_salt_wealth_modifier_desc:0 "坐拥两淮盐场与姑苏丝绸商市，源源不断的财赋令江南府库充盈。"
 phx_rtr_song_maitreya_fervor_modifier:0 "大宋弥勒狂热"
 phx_rtr_song_maitreya_fervor_modifier_desc:0 "笃信明王出世、复宋兴汉的红巾信众前赴后继，在中原战场上所向披靡。"
 phx_yuan_koke_iron_guard_modifier:0 "扩廓帖木儿铁骑"
 phx_yuan_koke_iron_guard_modifier_desc:0 "由察罕帖木儿与扩廓帖木儿统率的精锐北方铁骑，乃大元朝廷最具锋芒的支柱。"
 phx_rtr_poyang_victory_modifier:0 "鄱阳湖大捷威声"
 phx_rtr_poyang_victory_modifier_desc:0 "于鄱阳湖烈火浓烟间一举击溃强敌楼船，将士百战余威令江南望风披靡。"
 phx_rtr_huaisi_generals_modifier:0 "淮西虎将与浙东群贤"
 phx_rtr_huaisi_generals_modifier_desc:0 "骁勇善战的淮西勋贵与运筹帷幄的浙东名士珠联璧合，共襄帝业。"
 phx_rtr_northern_expedition_modifier:0 "北伐中原檄文"
 phx_rtr_northern_expedition_modifier_desc:0 "“驱逐胡虏，恢复中华”的慷慨檄文传遍南北，北伐雄师军威鼎盛。"
 phx_yuan_grand_canal_restored_modifier:0 "大运河漕运重通"
 phx_yuan_grand_canal_restored_modifier_desc:0 "疏浚后的河闸与纤道令南粮北调重归畅通，沿河州县商税兴旺。"
 phx_rtr_nanjing_imperial_capital_modifier:0 "应天龙蟠虎踞帝都"
 phx_rtr_nanjing_imperial_capital_modifier_desc:0 "钟山龙蟠、石城虎踞，巍峨城垣与新建宫阙使应天成为号令东南的帝王之都。"

