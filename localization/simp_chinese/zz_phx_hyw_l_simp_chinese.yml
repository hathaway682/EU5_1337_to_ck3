l_simp_chinese:
 # === 宣战理由 ===
 PHX_HYW_FRENCH_THRONE_WAR_NAME:0 "争夺法兰西王冠的百年战争"
 PHX_HYW_FRENCH_THRONE_WAR_NAME_MY:0 "争夺法兰西王冠战争"
 PHX_HYW_FRENCH_THRONE_WAR_NAME_BASE:0 "法兰西王冠"
 PHX_HYW_FRENCH_THRONE_CB_NAME:0 "宣称法兰西王位"
 phx_hyw_french_throne_cb_victory_desc:0 "英格兰君主夺取法兰西王冠，在王朝凯旋中将海峡两岸合二为一。"
 phx_hyw_french_throne_cb_white_peace_desc:0 "筋疲力尽的两国签下宛如布雷蒂尼和约般的脆弱停战协定，将宿怨留待后世再决。"
 phx_hyw_french_throne_cb_defeat_desc:0 "英格兰的跨海远征被彻底击溃并逐回海峡对岸，瓦卢瓦王朝在法兰西的主权得以稳固。"
 phx_hyw_french_throne_cb_invalidated_desc:0 "争夺法兰西王位的王朝战争已失效。"

 PHX_HYW_AQUITAINE_WAR_NAME:0 "没收阿基坦领地战争"
 PHX_HYW_AQUITAINE_WAR_NAME_MY:0 "没收阿基坦领地战争"
 PHX_HYW_AQUITAINE_WAR_NAME_BASE:0 "没收阿基坦领地"
 PHX_HYW_AQUITAINE_CB_NAME:0 "没收英格兰在[TITLE.GetBaseName]的大陆采邑"
 PHX_HYW_AQUITAINE_CB_NAME_GENERIC:0 "没收英格兰大陆采邑"
 phx_hyw_aquitaine_cb_victory_desc:0 "法兰西王室强制执行封建没收令，收回目标公国内英格兰所据的欧陆领土。"
 phx_hyw_aquitaine_cb_white_peace_desc:0 "没收阿基坦之战陷入僵局，英格兰在欧洲大陆的据点得以保全。"
 phx_hyw_aquitaine_cb_defeat_desc:0 "法兰西王军受挫撤退，英格兰在阿基坦的统治反而愈发嚣张。"
 phx_hyw_aquitaine_cb_invalidated_desc:0 "没收阿基坦领地的战争已不再有效。"

 # === 故事循环 ===
 story_phx_hundred_years_war:0 "百年战争"
 story_phx_hundred_years_war_desc:0 "英格兰金雀花王朝与法兰西瓦卢瓦王朝围绕阿基坦采邑、封建臣服与巴黎圣百合王冠展开的数代死斗。"
 PHX_HYW_STORY_PRACTICAL_INFORMATION_STRING:0 "英法王朝大决战将跨越四个历史阶段：开战升级期（1337–1345）、大战与骑行劫掠期（1346–1360）、查理反攻期（1361–1384）以及后期疲敝与奥尔良圣女转折期（1385年以后）。\n\n旷日持久的英法交战将引发国家厌战并摧残法兰西前线伯爵领，直至一方宣告建立英法双重君主制或宣告光复法兰西。"

 # === 修正 ===
 phx_hyw_longbow_doctrine_modifier:0 "英格兰长弓战法"
 phx_hyw_longbow_doctrine_modifier_desc:0 "在每一座村庄草坪上苦练箭术的自耕农长弓手能倾泻如暴雨般的破甲锥箭，粉碎重骑兵的冲锋。"
 phx_hyw_chevauchee_terror_modifier:0 "骑行劫掠威慑"
 phx_hyw_chevauchee_terror_modifier_desc:0 "机动迅捷的骑马纵队深入敌国腹地焚毁粮仓、席卷乡野，逼迫敌军在不利地形下仓促决战。"
 phx_hyw_flemish_wool_staple_modifier:0 "佛兰德斯羊毛专卖"
 phx_hyw_flemish_wool_staple_modifier_desc:0 "牢牢握住英格兰原毛命脉，令富庶的佛兰德斯纺织名城紧紧依附于威斯敏斯特的财政与海上霸权。"
 phx_hyw_order_of_garter_modifier:0 "最高贵嘉德骑士团"
 phx_hyw_order_of_garter_modifier_desc:0 "在温莎围绕君主立誓结盟的精英骑士兄弟会，将全英格兰的骑士荣光推向新的顶峰。"
 phx_hyw_oriflamme_banner_modifier:0 "圣但尼金焰圣旗"
 phx_hyw_oriflamme_banner_modifier_desc:0 "法兰西神圣的绯红战旗飘扬在王帐之上，号召骑士与市民拼死奋战、绝不留情。"
 phx_hyw_valois_chivalry_modifier:0 "瓦卢瓦骑士大征召"
 phx_hyw_valois_chivalry_modifier_desc:0 "来自法兰西各省的重装披甲骑士响应王室征召令齐聚一堂，板甲耀日、纹章蔽天。"
 phx_hyw_compagnies_ordonnance_modifier:0 "常备敕令骑兵连"
 phx_hyw_compagnies_ordonnance_modifier_desc:0 "由王室发饷的常备重骑兵连与新式攻城火炮取代了涣散的封建征召兵，铸就纪律严明的王国常备军。"
 phx_hyw_estates_general_concessions_modifier:0 "三级会议财政让步"
 phx_hyw_estates_general_concessions_modifier_desc:0 "市民与贵族代表批准的紧急军费解了燃眉之急，却也迫使王权在财政与特权上作出退让。"
 phx_hyw_burgundian_statecraft_modifier:0 "大公国纵横方略"
 phx_hyw_burgundian_statecraft_modifier_desc:0 "从第戎延伸至低地诸邦，巧妙的联姻、奢华的宫廷赞助与老练外交正将勃艮第推向西欧第三强权之列。"
 phx_hyw_breton_succession_divided_modifier:0 "布列塔尼继承分裂"
 phx_hyw_breton_succession_divided_modifier_desc:0 "蒙福尔与布卢瓦两派势同水火，令布列塔尼的城堡与港口沦为外国靠山竞逐的棋盘。"
 phx_hyw_war_exhaustion_modifier:0 "王国战争疲敝"
 phx_hyw_war_exhaustion_modifier_desc:0 "数十年苛重战税、雇佣兵劫掠与壮丁枯竭令领主与农夫皆不堪重负。"
 phx_hyw_devastated_countryside_modifier:0 "满目疮痍的乡野"
 phx_hyw_devastated_countryside_modifier_desc:0 "焦黑的谷仓、遭践踏的农田与荒芜的村落，无声诉说着骑行劫掠与溃兵流寇的铁蹄。"
 phx_hyw_maid_of_orleans_modifier:0 "奥尔良圣女之旗"
 phx_hyw_maid_of_orleans_modifier_desc:0 "一面承载天启预言的农家白旗在法兰西燃起炽烈信念，将绝望化为势不可挡的光复狂潮。"
 phx_hyw_treaty_bretigny_modifier:0 "布雷蒂尼协约"
 phx_hyw_treaty_bretigny_modifier_desc:0 "来之不易的停战协约令劫掠暂歇，使国库得以喘息、边防驻军重整旗鼓。"
 phx_hyw_dual_monarchy_crown_modifier:0 "英法双重君主王冠"
 phx_hyw_dual_monarchy_crown_modifier_desc:0 "英格兰金豹与法兰西圣百合在一顶共主王冠之下交相辉映，统御狭海两岸。"
 phx_hyw_breton_neutrality_modifier:0 "狮与百合间的平衡"
 phx_hyw_breton_neutrality_modifier_desc:0 "审慎的条约与固防的布列塔尼港湾护住了公国自治，令其在两大王国浴血厮杀之际独善其身。"

 # === 部队名称 ===
 phx_hyw_english_longbow_host_name:0 "皇家自耕农长弓军团"
 phx_hyw_french_oriflamme_host_name:0 "圣但尼金焰王室大军"
 phx_hyw_compagnies_ordonnance_host_name:0 "敕令常备骑兵连与皇家炮队"
 phx_hyw_scottish_auld_alliance_host_name:0 "老同盟苏格兰长矛枪阵"
 phx_hyw_valois_chivalry_host_name:0 "瓦卢瓦骑士大征召军"
 phx_hyw_maid_relief_host_name:0 "奥尔良解围义军"

 # === 决议（10项） ===
 phx_hyw_press_french_claim_decision:0 "宣称法兰西王冠"
 phx_hyw_press_french_claim_decision_desc:0 "论血统与法统，巴黎的王座本就当归英格兰王室所有。将金色百合花徽与英格兰金豹并绘于王旗之上、召集各郡长弓精锐，便是向整个基督教世界宣告：圣路易的王冠绝不容瓦卢瓦氏安坐无忧。"
 phx_hyw_press_french_claim_decision_tooltip:0 "正式申明英格兰对法兰西王冠的王朝宣称，并集结跨海长弓远征军。"
 phx_hyw_press_french_claim_decision_confirm:0 "将百合绘入王旗"
 phx_hyw_press_french_claim_effect_tt:0 "集结一支跨海长弓远征军，解锁免威望消耗的法兰西王位宣战机会，并立即决定是否发兵。"

 phx_hyw_found_order_of_garter_decision:0 "创立嘉德骑士团"
 phx_hyw_found_order_of_garter_decision_desc:0 "温莎宫殿中传唱的亚瑟王圆桌传说令渴望扬名海外的英格兰骑士热血沸腾。设立一个直属君主的尊贵骑士兄弟会，必能以荣耀与忠义将王国最骁勇的将领紧紧凝聚于王座周围。"
 phx_hyw_found_order_of_garter_decision_tooltip:0 "在温莎创立英格兰最高骑士勋团，嘉奖王国最杰出的将帅。"
 phx_hyw_found_order_of_garter_decision_confirm:0 "召开首届骑士团大会"
 phx_hyw_found_order_of_garter_effect_tt:0 "正式创立最高贵嘉德骑士团，大幅增强英格兰骑士战力与王室威望。"

 phx_hyw_flemish_wool_embargo_decision:0 "确立佛兰德斯羊毛专卖"
 phx_hyw_flemish_wool_embargo_decision_desc:0 "根特、布鲁日与伊普尔的每一架织布机都离不开英格兰牧场出产的优质羊毛。将羊毛出口收归皇家指定口岸统筹，既可充实威斯敏斯特国库，更能迫使富甲一方的佛兰德斯自治城市倾听英格兰的声音。"
 phx_hyw_flemish_wool_embargo_decision_tooltip:0 "以英格兰羊毛贸易为杠杆，扩充关税收入并扩大对佛兰德斯的外交影响力。"
 phx_hyw_flemish_wool_embargo_decision_confirm:0 "颁布羊毛专卖敕令"
 phx_hyw_flemish_wool_embargo_effect_tt:0 "振兴米德尔塞克斯商贸繁荣，降低跨海航运成本，并博得佛兰德斯方面的敬重。"

 phx_hyw_proclaim_dual_monarchy_decision:0 "宣告英法双重君主制"
 phx_hyw_proclaim_dual_monarchy_decision_desc:0 "从威斯敏斯特教堂到巴黎圣母院，传令官齐声宣告狭海两岸共奉一主。围绕封建臣服与王位法统的百年血仇，终于在英法合璧的王朝大统中画下辉煌句点。"
 phx_hyw_proclaim_dual_monarchy_decision_tooltip:0 "庄严合并英格兰与法兰西双冠，以双重君主制终结百年战争。"
 phx_hyw_proclaim_dual_monarchy_decision_confirm:0 "加冕英法双冠"
 phx_hyw_proclaim_dual_monarchy_effect_tt:0 "以英法双重君主制的胜利正式终结百年战争，并消除王国战争疲敝。"

 phx_hyw_confiscate_aquitaine_decision:0 "没收阿基坦公国"
 phx_hyw_confiscate_aquitaine_decision_desc:0 "法兰西国王绝不能容忍一位桀骜的外国君主盘踞加斯科涅的葡萄园与海港，却公然藐视宗主传唤、庇护王室叛徒。宣告阿基坦采邑依法收归王室，正是巴黎重申古老主权的正义之举。"
 phx_hyw_confiscate_aquitaine_decision_tooltip:0 "宣告英格兰在阿基坦的大陆采邑充公收归法王，并征召瓦卢瓦骑士军。"
 phx_hyw_confiscate_aquitaine_decision_confirm:0 "颁布采邑没收令"
 phx_hyw_confiscate_aquitaine_effect_tt:0 "解锁免威望消耗的没收阿基坦宣战机会，并立即决定是否发兵强制执行。"

 phx_hyw_raise_oriflamme_decision:0 "高扬圣但尼金焰旗"
 phx_hyw_raise_oriflamme_decision_desc:0 "供奉于圣但尼修道院历代法王陵寝之侧的绯红金焰圣旗，唯有在王国生死存亡之际方才请出。当那燕尾火舌般的旗帜在王室大军上空猎猎舒展，全法兰西的骑士都将明白：这是关乎家国存续的决战。"
 phx_hyw_raise_oriflamme_decision_tooltip:0 "自圣但尼迎请神圣金焰旗，在巴黎誓师集结法兰西王室大军。"
 phx_hyw_raise_oriflamme_decision_confirm:0 "迎请圣旗出征"
 phx_hyw_raise_oriflamme_effect_tt:0 "在巴黎编成一支金焰旗王室大军，全面提振法兰西军队的士气与战力。"

 phx_hyw_establish_compagnies_decision:0 "建立常备敕令骑兵连"
 phx_hyw_establish_compagnies_decision_desc:0 "涣散无序的封建征召军与无法无天的雇佣兵团吸干了乡野血汗，却眼睁睁看着一座座城池落入英格兰弓手之手。组建由王室常年发饷的精锐骑兵连与青铜重炮炮队，将为法兰西锻造出欧洲第一支真正的常备王军。"
 phx_hyw_establish_compagnies_decision_tooltip:0 "为法兰西建立常年发饷的常备重骑兵连与皇家攻城炮兵体系。"
 phx_hyw_establish_compagnies_decision_confirm:0 "颁行建军敕令"
 phx_hyw_establish_compagnies_effect_tt:0 "建立常备敕令骑兵连与皇家重炮队，永久提升兵制效率并消除战争疲敝。"

 phx_hyw_expel_english_continent_decision:0 "宣告光复法兰西"
 phx_hyw_expel_english_continent_decision_desc:0 "从诺曼底的港湾到波尔多的河岸码头，圣乔治红十字旗已不再飘扬于任何一座法兰西城头。兰斯与奥尔良的钟声响彻云霄，历经百年烽火的王国虽伤痕累累，却终究重归完整与自由。"
 phx_hyw_expel_english_continent_decision_tooltip:0 "庆贺英格兰势力被彻底逐出欧陆，宣告法兰西赢得百年战争。"
 phx_hyw_expel_english_continent_decision_confirm:0 "敲响光复钟声"
 phx_hyw_expel_english_continent_effect_tt:0 "以法兰西的全面胜利终结百年战争，解除战争疲敝并振兴巴黎与波尔多。"

 phx_hyw_grand_duchy_burgundy_decision:0 "擘画勃艮第第三强权"
 phx_hyw_grand_duchy_burgundy_decision_desc:0 "当威斯敏斯特与巴黎在无休止的战场上耗尽财帛与贵族精英之时，第戎正稳踞欧洲最丰饶的商贸十字路口。凭借华美宫廷、老练外交与严整政务，勃艮第完全能够崛起为左右西欧天平的第三大强权。"
 phx_hyw_grand_duchy_burgundy_decision_tooltip:0 "革新勃艮第宫廷与政务，将公国打造为屹立英法之间的第三强权。"
 phx_hyw_grand_duchy_burgundy_decision_confirm:0 "颁布大公国宪章"
 phx_hyw_grand_duchy_burgundy_effect_tt:0 "确立大公国纵横方略，大幅提升外交威望并推动第戎繁荣发展。"

 phx_hyw_secure_breton_neutrality_decision:0 "维系狮与百合间的平衡"
 phx_hyw_secure_breton_neutrality_decision_desc:0 "花岗岩峭壁与桀骜的航海传统自古守护着布列塔尼。谨守公国特许条约、拒绝沦为巴黎或伦敦任意一方的附庸棋子，白鼬纹章方能在大国铁蹄间长存不倒。"
 phx_hyw_secure_breton_neutrality_decision_tooltip:0 "确立布列塔尼的中立外交平衡，弥合内部分裂并守护公国自治。"
 phx_hyw_secure_breton_neutrality_decision_confirm:0 "签署公国中立盟约"
 phx_hyw_secure_breton_neutrality_effect_tt:0 "化解布列塔尼继承派系裂痕，增强公国防御韧性与对英法两国外交地位。"

 # === 提示 ===
 phx_hyw_aquitaine_forfeit_cb_tt:0 "获得一次免威望消耗对英格兰发动“没收阿基坦”战争的机会。"
 phx_hyw_throne_claim_ready_tt:0 "获得一次免威望消耗对法兰西发动“宣称法兰西王位”战争的机会。"

 # === 事件（26则） ===
 phx_hyw.0001.t:0 "雄狮远眺英吉利海峡"
 phx_hyw.0001.desc:0 "1337年春，咸涩的海风吹拂着威斯敏斯特城头猎猎作响的王旗。海峡彼岸，瓦卢瓦法学家正步步蚕食加斯科涅的司法上诉权，法兰西战船也在暗中窥伺驶往佛兰德斯的羊毛商队。然而你的血脉中流淌着美男子腓力的王统，英格兰长弓手亦早已在苏格兰山坡上证明过令人胆寒的威力。\n\n枢密大臣与领兵宿将齐候圣裁：英格兰是该即刻磨砺紫杉长弓以待欧陆大决战，还是先充实皇家度支府库？"
 phx_hyw.0001.a:0 "操练各郡长弓手——我们的天命在海峡彼岸。"
 phx_hyw.0001.b:0 "先稳固羊毛关税与威斯敏斯特银库。"

 phx_hyw.0002.t:0 "瓦卢瓦的金色圣百合"
 phx_hyw.0002.desc:0 "法兰西王国稳居拉丁基督教世界之首——人烟稠密、葡萄园与大教堂林立，更坐拥全欧最显赫的重装骑士团。然而西南隅却横着一根芒刺：英格兰国王占据波尔多与蓬蒂厄，身为法兰西大封臣却桀骜不驯，甚至觊觎巴黎的王冠本身。\n\n西岱岛宫殿内，诸侯与王室法学家静候瓦卢瓦王座如何回敬英格兰的傲慢。"
 phx_hyw.0002.a:0 "在圣百合旗下大举征召法兰西精锐骑士。"
 phx_hyw.0002.b:0 "先笼络勃艮第与佛兰德斯诸大封臣之心。"

 phx_hyw.0003.t:0 "第戎的葡萄园与雄心"
 phx_hyw.0003.desc:0 "威斯敏斯特与巴黎之间的战云越压越低，途经第戎的每一名使者都在私语大战将至。勃艮第扼守法兰西、帝国与香槟大集市交汇的膏腴要冲。庸主在双王相争中只见祸患，智者却看见壮大家族财力、声望与自主地位的千载良机。"
 phx_hyw.0003.a:0 "充实公国府库，筹划勃艮第独步西欧之路。"
 phx_hyw.0003.b:0 "向瓦卢瓦王室大表忠忱，以换取巴黎厚赏。"

 phx_hyw.0004.t:0 "无嗣的白鼬公旗"
 phx_hyw.0004.desc:0 "从南特到雷恩的布列塔尼海岸间，男爵与船长们无不忧心忡忡。公国尚无无可争议的直系嗣君，各支近亲已开始东望巴黎、北眺伦敦以求靠山。一旦英法两国刀兵相见，布列塔尼的继承难题极可能成为点燃半岛烽火的导火索。"
 phx_hyw.0004.a:0 "恪守布列塔尼古制，令两大王国皆不得越雷池。"
 phx_hyw.0004.b:0 "厚积公国银储，严密戒备海峡航道。"

 phx_hyw.0010.t:0 "没收阿基坦公国"
 phx_hyw.0010.desc:0 "巴黎高等法院御前，王室诉状字字锋利：英格兰王室在吉耶纳屡屡抗拒封建司法，公然庇护法兰西叛臣并私筑边防。依法兰西封建大法，阿基坦一切采邑皆应依法充公收归宗主。\n\n一旦签下没收令，海峡两岸脆弱的和平必将瞬间粉碎，金豹与圣百合的全面大战一触即发。"
 phx_hyw.0010.a:0 "宣告阿基坦充公，即刻挥师直取波尔多！"
 phx_hyw.0010.b:0 "先颁布没收敕令，从容集结王室大军。"
 phx_hyw.0010.c:0 "暂缓没收令，仍以封建臣服谈判周旋。"

 phx_hyw.0011.t:0 "向圣百合王座宣战"
 phx_hyw.0011.desc:0 "快马驿使疾驰入威斯敏斯特，带回巴黎颁布的冰冷敕令：瓦卢瓦朝廷已宣告英格兰世袭的阿基坦领地全部充公！流亡的法兰西豪强与英格兰男爵群情激愤，齐声恳请你以基督教世界最惊世骇俗的壮举回击此辱——正式宣告自己才是法兰西合法君王，挥师踏破瓦卢瓦疆土！"
 phx_hyw.0011.a:0 "以上帝与圣乔治之名——宣称法兰西王位，吹响进军号角！"
 phx_hyw.0011.b:0 "公开宣示王位宣称，先在欧陆广结盟友。"
 phx_hyw.0011.c:0 "谋求和谈保住加斯科涅，暂不争夺巴黎王冠。"

 phx_hyw.0020.t:0 "佛兰德斯羊毛风潮"
 phx_hyw.0020.desc:0 "北海对岸，根特、布鲁日与伊普尔三大毛纺名城陷入沉寂——只要英格兰羊毛货船停航，当地万千织机便立刻停摆。佛兰德斯伯爵虽死忠巴黎，但以雅各布·范·阿尔特费尔德为首的强悍市民领袖已密报威斯敏斯特：只要英格兰重开羊毛供应，佛兰德斯行会便愿倒向英王旗帜。"
 phx_hyw.0020.a:0 "收紧羊毛禁运，力挺阿尔特费尔德与佛兰德斯行会！"
 phx_hyw.0020.b:0 "直接高价售卖羊毛特许状，坐收巨额关税。"

 phx_hyw.0030.t:0 "布列塔尼继承战争"
 phx_hyw.0030.desc:0 "久已潜伏的危机终于在布列塔尼爆发。布卢瓦的查理与让·德·蒙福尔两派党羽各自据守花岗岩坚城，互斥僭位，并争相向巴黎与伦敦求援兵饷。若南特不能及时定鼎乾坤，公国必将沦为英法大国血战的代理人战场。"
 phx_hyw.0030.a:0 "倾向布卢瓦派，依托法兰西庇护。"
 phx_hyw.0030.b:0 "扶持蒙福尔派，借重英格兰海上援军。"
 phx_hyw.0030.c:0 "散财调停，由布列塔尼三级会议公断继承。"

 phx_hyw.0031.t:0 "布列塔尼的代理人暗战"
 phx_hyw.0031.desc:0 "来自布列塔尼的急使接踵而至，恳求资助军饷、战船与精锐将官。半岛正因继承权四分五裂，谁能掌控布雷斯特、瓦讷与南特诸港，谁便握住了扼制英格兰、诺曼底与加斯科涅航线的钥匙。"
 phx_hyw.0031.a:0 "拨发钱粮并派遣将领，倾斜布列塔尼战局。"
 phx_hyw.0031.b:0 "任由布列塔尼自决，保存我军实力于主战场。"

 phx_hyw.0040.t:0 "老同盟的号角"
 phx_hyw.0040.desc:0 "法兰西使节携密封国书与沉甸甸的金袋抵临苏格兰宫廷，带来英格兰主力正深陷海峡彼岸的战报。秉持“老同盟”的古老誓约，巴黎恳请苏格兰越过特威德河南下突袭，迫使威斯敏斯特陷入两线夹击。"
 phx_hyw.0040.a:0 "吹响战笛，挥军杀入诺森伯兰！"
 phx_hyw.0040.b:0 "固守边境防线，让苏格兰休养生息。"

 phx_hyw.0045.t:0 "黑太子的金马刺"
 phx_hyw.0045.desc:0 "伍德斯托克的爱德华不再是端坐观礼台下的幼童，如今他已披坚执锐、步入成年，目光如钢铁般冷峻，胸中燃烧着炽烈的尚武雄心。沙场宿将无不称赞他临阵沉稳，渴望在法兰西骑士面前亲手赢得属于自己的金马刺。"
 phx_hyw.0045.a:0 "命他执掌欧陆先锋，在法兰西战场上博取威名！"
 phx_hyw.0045.b:0 "令他兼修政务与王室治国之道。"

 phx_hyw.0050.t:0 "紫杉长弓与骑行劫掠的硝烟"
 phx_hyw.0050.desc:0 "欧陆战事步入更加酷烈的新阶段。自诺曼底与吉耶纳疾驰而出的英格兰骑行劫掠纵队所过之处谷仓成灰、乡野空荡，公然挑衅法兰西贵族顶着六尺紫杉长弓织成的遮天箭雨发起绝命冲锋。"
 phx_hyw.0050.a:0 "放手展开大范围骑行劫掠，摧毁瓦卢瓦威信！"
 phx_hyw.0050.b:0 "精研长弓手与下马骑士协同的严整防阵。"

 phx_hyw.0055.t:0 "箭雨风暴中的法兰西骑士"
 phx_hyw.0055.desc:0 "诺曼底与皮卡第烽烟四起，英格兰游骑肆意嘲弄高傲的法兰西贵族。年轻男爵们摩拳擦掌，誓要以辉煌的骑枪冲锋踏碎敌阵；而饱经沧桑的老将却痛心疾首地警告：迎着英格兰箭阵仰攻，只会让王国最优秀的骑士白白陈尸泥淖。"
 phx_hyw.0055.a:0 "吹响冲锋号——法兰西重骑岂会畏惧区区贱民弓箭！"
 phx_hyw.0055.b:0 "坚壁清野、据城消耗，以耐心拖垮英军锐气。"

 phx_hyw.0060.t:0 "三级会议与扎克雷起义"
 phx_hyw.0060.desc:0 "连年苛重的战税、巨额赎金与横行乡里的雇佣溃兵终于逼垮了法兰西底层苍生。博韦与巴黎近郊的绝望农夫手持镰刀火把攻打贵族庄园，而三级会议中的市民代表亦趁机向王廷施压，要求交出财政监督权方肯再批一文军饷。"
 phx_hyw.0060.a:0 "向三级会议作出财政让步，安抚城邦与府库。"
 phx_hyw.0060.b:0 "派重骑铁血镇压扎克雷乱民——纲纪绝不可废！"

 phx_hyw.0070.t:0 "英格兰农民起义"
 phx_hyw.0070.desc:0 "为支撑永无止境的法境征战而强征的人头税，在肯特与埃塞克斯点燃了滔天民愤。成千上万怒火中烧的平民高举旗帜进逼伦敦，要求废除农奴制并严惩贪官，泰晤士河畔郊区浓烟滚滚。"
 phx_hyw.0070.a:0 "亲临史密斯菲尔德以王威震慑，铁腕平息叛乱。"
 phx_hyw.0070.b:0 "废止苛酷的人头税，向各郡颁布赈济特许状。"

 phx_hyw.0080.t:0 "奥尔良圣女"
 phx_hyw.0080.desc:0 "在法兰西最为黯淡的寒冬里，一名身着素朴骑装、年方十七的农家少女贞德步入御前，双眼闪烁着不可动摇的炽烈信念。她庄严宣告：上天圣音命她重燃法兰西之魂，将英格兰人逐回大海，重振圣百合王冠的荣光。\n\n老于世故的朝臣暗自哂笑竟有人听信村女狂言；可饱经败绩的将士凝望她那面绣满金色百合的白旗时，竟纷纷热泪盈眶。"
 phx_hyw.0080.a:0 "赐她战甲骏马，由她率领义军驰援奥尔良！"
 phx_hyw.0080.b:0 "先交由神学家详加审验，同时整肃王军士气。"

 phx_hyw.0100.t:0 "威斯敏斯特的百合王旗"
 phx_hyw.0100.desc:0 "在欢呼雷动的人群前，传令官展开了崭新的御用王旗：英格兰金豹与法兰西蓝底圣百合赫然并列。码头之上，自耕农弓手正将一捆捆羽箭搬上待发战船。王朝宣称既已昭告天下，余下的唯有一声开拔令。"
 phx_hyw.0100.a:0 "即刻扬帆渡海——以利剑夺取法兰西王位！"
 phx_hyw.0100.b:0 "令舰队枕戈待旦，择最利天时再行渡海。"

 phx_hyw.0110.t:0 "嘉德骑士团首届盛会"
 phx_hyw.0110.desc:0 "在温莎礼拜堂高耸的彩旗穹顶下，二十四位精挑细选的骑士单膝跪地，接受蓝色嘉德徽带与鎏金勋链。号角声回荡在泰晤士河上空，颂扬荣誉与手足盟誓的歌谣预示着欧陆战场上的赫赫战功。"
 phx_hyw.0110.a:0 "心怀邪念者蒙羞！"

 phx_hyw.0120.t:0 "皇家羊毛专卖令落成"
 phx_hyw.0120.desc:0 "皇家关税官在码头清点堆叠如山的英格兰羊毛大包，来自佛兰德斯的商行买办躬身接受威斯敏斯特拟定的价目。白银源源不断涌入国库，北海诸商贾皆深知英格兰已牢牢扼住羊毛贸易咽喉。"
 phx_hyw.0120.a:0 "羊毛生白银，白银养铁军。"

 phx_hyw.0130.t:0 "英法双重君主加冕"
 phx_hyw.0130.desc:0 "庄严的礼钟从威斯敏斯特一路响彻至巴黎圣母院，英格兰与法兰西两顶王冠同时加冕于同一君主之首。海峡两岸的大领主在金豹与圣百合交织的华盖下俯首称臣，漫长的百年王朝之争就此迎来最辉煌的终章。"
 phx_hyw.0130.a:0 "两国同辉，共奉一主！"

 phx_hyw.0140.t:0 "王室没收敕令颁行"
 phx_hyw.0140.desc:0 "钤盖法兰西国玺的阿基坦采邑没收令已在西岱宫石阶前向全城宣读。驿使南下传谕加斯科涅诸领主，而前线诸将正静候巴黎传令：大军是否即刻越界收地。"
 phx_hyw.0140.a:0 "立刻进军吉耶纳，以刀剑执行王室没收令！"
 phx_hyw.0140.b:0 "敕令既出，先待诸军集结完备再行发兵。"

 phx_hyw.0150.t:0 "圣但尼金焰旗出鞘"
 phx_hyw.0150.desc:0 "在圣但尼大教堂高祭坛前，修道院长郑重将绯红丝绸金焰圣旗交入君王手中。当圣旗在教堂门外迎风招展之际，列阵骑士齐齐平举骑枪致礼——法兰西正披戴守护圣徒的荣光踏上征途。"
 phx_hyw.0150.a:0 "蒙茹瓦，圣但尼！"

 phx_hyw.0160.t:0 "常备敕令骑兵连成军"
 phx_hyw.0160.desc:0 "巴黎郊外的校场上，领受王室常饷的敕令重骑兵方阵进退如风，身侧一字排开由名匠新铸的青铜巨炮。往日屡战屡败的乌合征召兵已成过往云烟，法兰西王冠如今手握足以撼动任何城堡与弓阵的铁血常备军。"
 phx_hyw.0160.a:0 "让英格兰城寨在王室钢铁与硝烟面前颤栗吧！"

 phx_hyw.0170.t:0 "法兰西光复的钟声"
 phx_hyw.0170.desc:0 "从加莱、鲁昂到波尔多的酒商码头，最后一艘英格兰运兵船终于隐没在海峡迷雾之中。卢瓦尔河与塞纳河两岸燃起漫天欢庆篝火，农夫、市民与领主同声欢呼：历经数代血火劫难，法兰西王国终于重获完整与自由！"
 phx_hyw.0170.a:0 "法兰西万世长存！"

 phx_hyw.0180.t:0 "勃艮第大公国之荣光"
 phx_hyw.0180.desc:0 "第戎公爵宫中，画师、编年史家与各国使节无不惊叹于金线挂毯的富丽堂皇，以及公国与列邦缔结的精妙盟约。勃艮第既非俯首帖耳的寻常附庸，亦非冷眼旁观的弱小诸侯，而今已傲然跻身西欧第三强权之列。"
 phx_hyw.0180.a:0 "任由双王血战，勃艮第自成霸业。"

 phx_hyw.0190.t:0 "不屈的白鼬旗帜"
 phx_hyw.0190.desc:0 "南特港内，悬挂黑白白鼬旗的布列塔尼商船扬帆自如，来自巴黎与威斯敏斯特的使节亦不得不郑重承认公国的特许自治。凭借老练的权衡与沉着定力，布列塔尼护住了子民免遭外王铁蹄的肆虐。"
 phx_hyw.0190.a:0 "宁死不辱——布列塔尼自有其道。"
