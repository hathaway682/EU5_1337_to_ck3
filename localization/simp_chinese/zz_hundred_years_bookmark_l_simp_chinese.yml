l_simp_chinese:
 bm_group_generated:0 "1337年"
 bm_group_generated_sub:0 "百年战争"
 bm_generated:0 "百年战争"
 bm_generated_desc:0 "1337年，英法两国的王冠之争正将欧洲推向一场旷日持久的冲突。王位宣称、强大的封臣和变幻莫测的继承，将决定两个王国的命运。"
 bm_hundred_years_edward_iii:0 "国王爱德华三世"
 bm_hundred_years_edward_iii_subheading:0 "英格兰国王"
 bm_hundred_years_edward_iii_desc:0 "爱德华三世统治英格兰，并在海峡对岸拥有领地。他对法兰西王位的宣称将他与腓力六世推向对抗。他能否巩固王朝，并实现自己在法兰西的抱负？"
 bm_hundred_years_black_prince:0 "黑太子爱德华"
 bm_hundred_years_black_prince_subheading:0 "年幼的王子"
 bm_hundred_years_black_prince_desc:0 "爱德华三世的长子年纪尚幼，却已在英格兰西部拥有领地。他的未来掌握在摄政和父亲的王国手中。他能否成长为一位名将？"
 bm_hundred_years_philip_vi:0 "国王腓力六世"
 bm_hundred_years_philip_vi_subheading:0 "幸运者"
 bm_hundred_years_philip_vi_desc:0 "瓦卢瓦的腓力戴着法兰西王冠，但英格兰的爱德华三世对他的王位提出异议。强大的公爵们向他效忠，保卫法兰西需要他们的支持。"
 bm_hundred_years_eudes_iv:0 "公爵厄德四世"
 bm_hundred_years_eudes_iv_subheading:0 "勃艮第公爵"
 bm_hundred_years_eudes_iv_desc:0 "厄德四世是法兰西国王麾下势力强大的封臣，统治着勃艮第。面对即将到来的冲突，他必须保卫领地，确保家族的未来。"
 bm_hundred_years_john_iii:0 "公爵约翰三世"
 bm_hundred_years_john_iii_subheading:0 "好人"
 bm_hundred_years_john_iii_desc:0 "约翰三世在法兰西王室的宗主权下统治布列塔尼。他没有在世的子女，继承问题悬而未决；亲族之间相互竞争的野心正威胁着公国的和平。"
