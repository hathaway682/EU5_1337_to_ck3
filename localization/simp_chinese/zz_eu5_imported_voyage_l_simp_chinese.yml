 nwt_voyage.30.a:0 "相信[nwt_captain.GetFirstName]能渡过风暴。"
 nwt_voyage.30.a.good:0 "船队安然渡过风暴"
 nwt_voyage.30.a.hurt:0 "船长受伤"
 nwt_voyage.30.a.lost:0 "船队覆没"
 nwt_voyage.30.b:0 "寻找避风处，等待海面平静。"
 nwt_voyage.30.b.tt:0 "航程延误约一个半月"
 nwt_voyage.30.desc:0 "消息传来，远洋上空乌云密布。[nwt_captain.GetFirstName]的船队遭遇巨浪，浪头高过桅杆。"
 nwt_voyage.30.t:0 "海上风暴"
 nwt_voyage.31.a:0 "在下一座岛屿采购新鲜水果和补给。"
 nwt_voyage.31.b:0 "船员们必须忍耐。"
 nwt_voyage.31.b.back:0 "船队返航"
 nwt_voyage.31.b.good:0 "船员挺了过来"
 nwt_voyage.31.b.ill:0 "船长患病"
 nwt_voyage.31.desc:0 "数周不见陆地，水手们牙龈出血、旧伤复发。坏血病正在[nwt_captain.GetFirstName]的船队中蔓延。"
 nwt_voyage.31.t:0 "坏血病"
 nwt_voyage.32.a:0 "让[nwt_captain.GetFirstName]以武力维持秩序。"
 nwt_voyage.32.a.good:0 "哗变被镇压"
 nwt_voyage.32.a.lost:0 "哗变者将船长丢入海中"
 nwt_voyage.32.b:0 "许诺船员分享财富。"
 nwt_voyage.32.c:0 "妥协并返航。"
 nwt_voyage.32.c.tt:0 "航行中止，船队返航"
 nwt_voyage.32.desc:0 "水手们坚称大海没有尽头，要求[nwt_captain.GetFirstName]掉头返航，有人甚至拿起了武器。"
 nwt_voyage.32.t:0 "哗变！"
 nwt_voyage.33.a:0 "愿这趟航程继续顺利。"
 nwt_voyage.33.desc:0 "稳定的风日日鼓满船帆，[nwt_captain.GetFirstName]的船队迅速驶过大洋。"
 nwt_voyage.33.t:0 "顺风"
 nwt_voyage.51.a:0 "交换礼物。"
 nwt_voyage.51.b:0 "插上旗帜，宣称这片土地属于王室。"
 nwt_voyage.51.desc:0 "[nwt_captain.GetFirstName]的船抵达海滩时，人们带着食物、棉布和绘有图案的礼物走出树林。他们好奇而无惧。"
 nwt_voyage.51.t:0 "友好的相遇"
 nwt_voyage.52.a:0 "还击！"
 nwt_voyage.52.a.dead:0 "船长身亡"
 nwt_voyage.52.a.hurt:0 "船长受伤"
 nwt_voyage.52.a.win:0 "袭击者被击退"
 nwt_voyage.52.b:0 "退回船上！"
 nwt_voyage.52.c:0 "放下武器，张开双手示意。"
 nwt_voyage.52.c.good:0 "箭雨停息，人们走上前来"
 nwt_voyage.52.c.hurt:0 "箭雨没有停止"
 nwt_voyage.52.desc:0 "[nwt_captain.GetFirstName]的随员刚涉水登岸，箭矢便从幽暗的树林中落向他们。"
 nwt_voyage.52.t:0 "林间飞来的箭"
 nwt_voyage.53.a:0 "接受邀请。"
 nwt_voyage.53.a.good:0 "友好的一夜"
 nwt_voyage.53.a.ill:0 "船长患病"
 nwt_voyage.53.b:0 "拒绝，或许是陷阱。"
 nwt_voyage.53.desc:0 "当地一位首领传来消息：邀请[nwt_captain.GetFirstName]和船队军官前往远离船只的村庄赴宴。"
 nwt_voyage.53.t:0 "酋长的宴席"
 nwt_voyage.54.a:0 "用货物交换黄金。"
 nwt_voyage.54.b:0 "以武力夺取。"
 nwt_voyage.54.b.good:0 "黄金归我们所有"
 nwt_voyage.54.desc:0 "[nwt_captain.GetFirstName]发现有人佩戴黄金饰物。他们说金子来自更内陆的一条河流。"
 nwt_voyage.54.t:0 "河中的黄金"
 nwt_voyage.56.a:0 "用珠饰、刀具和布匹交换食物。"
 nwt_voyage.56.b:0 "拿走所需之物，我们有火枪。"
 nwt_voyage.56.b.bad:0 "村民在夜间持弓箭归来"
 nwt_voyage.56.b.good:0 "村民逃散"
 nwt_voyage.56.desc:0 "附近村民提着木薯、鱼和水果来到海岸，指着水手的刀具与鲜艳布匹。"
 nwt_voyage.56.t:0 "海滩上的交易"
 nwt_voyage.57.a:0 "将船倾侧并刮净船体。"
 nwt_voyage.57.b:0 "时间紧迫，修补后继续前进。"
 nwt_voyage.57.b.bad:0 "漏水损坏了补给"
 nwt_voyage.57.b.good:0 "修补处没有漏水"
 nwt_voyage.57.desc:0 "船蛆蛀穿了木板，水泵日夜不停。木匠说必须把船拖上海滩清理船体，否则无法平安返航。"
 nwt_voyage.57.t:0 "蛀蚀船体"
 nwt_voyage.58.a:0 "让他们走，船上也少几张嘴。"
 nwt_voyage.58.b:0 "把他们锁起来拖回船上。"
 nwt_voyage.58.b.bad:0 "更多人趁乱逃走"
 nwt_voyage.58.b.good:0 "逃兵被抓回，其他人引以为戒"
 nwt_voyage.58.desc:0 "十几名水手溜进了森林。据说他们找到了欢迎他们的村庄，并不愿再回到船上。"
 nwt_voyage.58.t:0 "逃亡的水手"
 nwt_voyage.80.a:0 "减少饮水配给，等待风起。"
 nwt_voyage.80.b:0 "放下小艇，将船拖出无风带。"
 nwt_voyage.80.b.bad:0 "划船的水手精疲力竭"
 nwt_voyage.80.b.good:0 "微风吹来"
 nwt_voyage.80.desc:0 "连续十一天没有一丝风。海面平静如油，水桶里的水开始变质，水手们默默望向地平线。"
 nwt_voyage.80.t:0 "无风的海面"
 nwt_voyage.81.a:0 "跟着鸟群前进！"
 nwt_voyage.81.a.bad:0 "只有茫茫大海"
 nwt_voyage.81.a.good:0 "发现一座盛产水果和淡水的未知岛屿"
 nwt_voyage.81.b:0 "保持航线，我们有目的地。"
 nwt_voyage.81.desc:0 "狂风把[nwt_captain.GetFirstName]的船队吹离了已知航线。瞭望员发现带绿叶的漂木和向西飞去的鸟群，附近可能有未知陆地。"
 nwt_voyage.81.t:0 "偏离航线"
 nwt_voyage.82.a:0 "所有人拿水桶灭火！"
 nwt_voyage.82.a.bad:0 "一半补给被烧毁"
 nwt_voyage.82.a.good:0 "大火被扑灭"
 nwt_voyage.82.b:0 "弃船，将它与船队分离。"
 nwt_voyage.82.desc:0 "补给船舱里的一盏灯倒了。浓烟从舱口涌出，火焰正向火药和物资蔓延。"
 nwt_voyage.82.t:0 "船上起火！"
 nwt_voyage.83.a:0 "这是吉兆，告诉船员们。"
 nwt_voyage.83.b:0 "捕一头，为船队提供食物。"
 nwt_voyage.83.b.bad:0 "巨兽撞碎了一艘小艇"
 nwt_voyage.83.b.good:0 "获得足够数周食用的鲜肉和油脂"
 nwt_voyage.83.desc:0 "巨鲸从船队旁浮出水面，身躯比船还大。水手们有的祈祷，有的伸手拿起鱼叉。"
 nwt_voyage.83.t:0 "深海巨兽"
 nwt_voyage.84.a:0 "装满所有水桶。"
 nwt_voyage.84.b:0 "让船员们上岸休息一周。"
 nwt_voyage.84.desc:0 "瞭望员发现一座青翠岛屿，瀑布流入宁静的海湾。水手们想到干净的水和水果，欢呼起来。"
 nwt_voyage.84.t:0 "淡水岛屿"
 nwt_voyage.85.a:0 "相信星辰和星盘。"
 nwt_voyage.85.a.bad:0 "航向错误，白白耽搁数周"
 nwt_voyage.85.a.good:0 "测算正确"
 nwt_voyage.85.b:0 "听老领航员的。"
 nwt_voyage.85.desc:0 "老领航员坚持船队偏南太远，应当转向。[nwt_captain.GetFirstName]用星盘测量了太阳高度，确信目前航向正确。"
 nwt_voyage.85.t:0 "领航员的争执"
 nwt_voyage.86.a:0 "推出火炮，迎战！"
 nwt_voyage.86.a.good:0 "海盗被击败，他们的船被洗劫"
 nwt_voyage.86.a.hurt:0 "海盗被击退，但付出代价"
 nwt_voyage.86.a.lost:0 "船队被俘"
 nwt_voyage.86.b:0 "扬起所有帆逃走。"
 nwt_voyage.86.b.bad:0 "船队逃脱，但被迫将货物抛入海中"
 nwt_voyage.86.b.good:0 "船队甩掉了追兵"
 nwt_voyage.86.desc:0 "陌生船帆正在迅速接近——那是劫掠往返新大陆船只的海盗，他们没有悬挂正经旗帜。"
 nwt_voyage.86.t:0 "地平线上的帆影"
 nwt_voyage.90.a:0 "公平分配。"
 nwt_voyage.90.b:0 "每一枚钱币都属于王室。"
 nwt_voyage.90.desc:0 "在漫长的归途中，船员数清了舱内的黄金、珍珠和染料。现在他们派代表向[nwt_captain.GetFirstName]询问自己能分得多少。"
 nwt_voyage.90.t:0 "船舱中的宝物"
 nwt_voyage.91.a:0 "减半配给，坚持到最后。"
 nwt_voyage.91.b:0 "吃老鼠，把靴皮煮了。"
 nwt_voyage.91.b.bad:0 "船员开始死去"
 nwt_voyage.91.b.good:0 "他们设法坚持了下来"
 nwt_voyage.91.desc:0 "饼干里满是象鼻虫，饮水也发出臭味。管事说，剩下的食物撑不到船队返航。"
 nwt_voyage.91.t:0 "最后一块饼干"
 nwt_voyage.92.a:0 "靠岸补充淡水，打听消息。"
 nwt_voyage.92.b:0 "离家不远了，继续航行。"
 nwt_voyage.92.desc:0 "大西洋群岛的青翠山峰从海面升起。从这里到家，只需再航行几周。"
 nwt_voyage.92.t:0 "熟悉的岛屿"
 eu5_voyage_abandoned_tt:0 "船队放弃探索，不会获得海图。"
 eu5_voyage_lost_tt:0 "船队覆没，探索失败，不会获得海图。"
 eu5_voyage_captain_loss_tt:0 "船长身亡将使探索失败，船队不会带回海图。"
 eu5_voyage_launch_tt:0 "一名可用的廷臣将率领船队；若无合适人选，将招募一名船长。船队前往所选地区，基本航程为一年。"
 eu5_voyage_delay_10_tt:0 "航程延误10天。"
 eu5_voyage_delay_15_tt:0 "航程延误15天。"
 eu5_voyage_delay_20_tt:0 "航程延误20天。"
 eu5_voyage_delay_25_tt:0 "航程延误25天。"
 eu5_voyage_delay_30_tt:0 "航程延误30天。"
 eu5_voyage_delay_45_tt:0 "航程延误45天。"
