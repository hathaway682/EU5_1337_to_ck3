l_simp_chinese:
 bm_europe_pillars:0 "海格力斯之柱"
 bm_europe_pillars_desc:0 "海峡两岸，卡斯蒂利亚、格拉纳达和摩洛哥的统治者争夺着通向地中海的门户。信仰、贸易与战争将决定两岸的命运。"
 bm_europe_twilight:0 "帝国余晖"
 bm_europe_twilight_desc:0 "巴尔干诸国、拜占庭与崛起中的奥斯曼势力彼此角逐。古老的帝国仍在坚持，而新的力量正寻找机会。"
 bm_europe_northern:0 "北方十字军"
 bm_europe_northern_desc:0 "从神圣罗马帝国到斯堪的纳维亚和波罗的海，君主、骑士团与异教大公争夺权力。北方的信仰与边疆将在冲突中重塑。"
 bm_europe_granada:0 "优素福一世"
 bm_europe_granada_subheading:0 "格拉纳达苏丹"
 bm_europe_granada_desc:0 "优素福一世统治格拉纳达。夹在伊比利亚强邻与海峡对岸盟友之间，他必须为自己的王朝谋求生存。"
 bm_europe_morocco:0 "阿布·哈桑·阿里"
 bm_europe_morocco_subheading:0 "摩洛哥苏丹"
 bm_europe_morocco_desc:0 "马林王朝的阿布·哈桑统治摩洛哥，海峡两岸的局势都牵动着他的王国。"
 bm_europe_teutonic:0 "迪特里希·冯·阿尔滕堡"
 bm_europe_teutonic_subheading:0 "条顿骑士团大团长"
 bm_europe_teutonic_desc:0 "迪特里希领导条顿骑士团，在普鲁士及波罗的海沿岸面对周边统治者与立陶宛的挑战。"
