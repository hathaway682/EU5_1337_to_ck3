l_simp_chinese:
 great_project_type_eu5_colonial_enterprise:0 "殖民事业"
 great_project_type_tooltip_eu5_colonial_enterprise:0 "在荒野建立殖民共和国。"
 great_project_type_eu5_colonial_enterprise_contribution_settlement:0 "建立定居点"
 great_project_type_eu5_colonial_enterprise_contribution_settlement_desc:0 "商人资助殖民地，完工后获得其中的荒野伯爵领。若公国无主或由工程所有者持有，商人将获得该公国；否则将创建新的公国级共和国头衔。"
 great_project_type_eu5_colonial_enterprise_contribution_supplies:0 "补给与贸易"
 great_project_type_eu5_colonial_enterprise_contribution_supplies_desc:0 "资助殖民地的物资和贸易，提升目标公国的税收。参与的商人将成为殖民共和国的贵人。"
 great_project_type_eu5_colonial_enterprise_contribution_settlers:0 "招募移民"
 great_project_type_eu5_colonial_enterprise_contribution_settlers_desc:0 "资助移民前往目标地区，提升繁荣度增长。参与的商人将成为殖民共和国的贵人。"
 great_project_type_eu5_colonial_enterprise_contribution_defenses:0 "殖民防御"
 great_project_type_eu5_colonial_enterprise_contribution_defenses_desc:0 "资助防御设施，提升目标公国的控制力增长。参与的商人将成为殖民共和国的贵人。"
 eu5_colonial_supplies_modifier:0 "殖民补给"
 eu5_colonial_settlers_modifier:0 "移民潮"
 eu5_colonial_defenses_modifier:0 "殖民防御"
 great_project_type_eu5_colonial_enterprise_desc:0 "遥远的边疆呼唤着我们，通过精心的准备和足够的投资，任何不毛之地都将成为我们定居者的乐土。那些通过贸易积累了巨额财富的商人总是乐于资助此事，以将自己的财富转换成土地和权力。"
 eu5_new_world_discovery.0002.t:0 "新大陆的消息"
 eu5_new_world_discovery.0002.desc:0 "来自大西洋彼岸的消息传遍欧洲：航海者抵达了远方的陆地。海洋不再只是疆界，也是一条通向未知海岸的道路。\n\n如今，首都位于欧洲的沿海统治者可以向海外的荒野公国发起殖民工程。"
 eu5_new_world_discovery.0002.a:0 "新的机遇正在海的彼岸等待。"
 eu5_colonial_enterprise_duchy_available_tt:0 "该公国没有正在规划或建设的殖民工程"
