l_simp_chinese:
 great_project_type_eu5_colonial_enterprise:0 "殖民事业"
 great_project_type_tooltip_eu5_colonial_enterprise:0 "在荒野建立殖民共和国。"
 great_project_type_eu5_colonial_enterprise_contribution_settlement:0 "建立定居点"
 great_project_type_eu5_colonial_enterprise_contribution_settlement_desc:0 "建立定居点并为拓荒者筹集资金，吸引愿意在边疆开拓新生活的人们。"
 great_project_type_eu5_colonial_enterprise_contribution_supplies:0 "补给与贸易"
 great_project_type_eu5_colonial_enterprise_contribution_supplies_desc:0 "资助殖民地的物资和贸易，提升目标公国的税收。若由商人建立殖民共和国，参与的其他商人将成为共和国贵人。"
 great_project_type_eu5_colonial_enterprise_contribution_settlers:0 "招募移民"
 great_project_type_eu5_colonial_enterprise_contribution_settlers_desc:0 "资助移民前往目标地区，提升繁荣度增长。若由商人建立殖民共和国，参与的其他商人将成为共和国贵人。"
 great_project_type_eu5_colonial_enterprise_contribution_defenses:0 "殖民防御"
 great_project_type_eu5_colonial_enterprise_contribution_defenses_desc:0 "资助防御设施，提升目标公国的控制力增长。若由商人建立殖民共和国，参与的其他商人将成为共和国贵人。"
 eu5_colonial_supplies_modifier:0 "殖民补给"
 eu5_colonial_settlers_modifier:0 "移民潮"
 eu5_colonial_defenses_modifier:0 "殖民防御"
 great_project_type_eu5_colonial_enterprise_desc:0 "遥远的边疆呼唤着我们，通过精心的准备和足够的投资，任何不毛之地都将成为我们定居者的乐土。那些通过贸易积累了巨额财富的商人总是乐于资助此事，以将自己的财富转换成土地和权力。"
 eu5_new_world_discovery.0002.t:0 "新大陆的消息"
 eu5_new_world_discovery.0002.desc:0 "来自大西洋彼岸的消息传遍欧洲：航海者抵达了远方的陆地。海洋不再只是疆界，也是一条通向未知海岸的道路。\n\n卡斯蒂利亚和葡萄牙的头衔持有者（若存在）将获得整个美洲的海图。领地拥有海岸的统治者，在其文化掌握殖民特许状并发现目标地区后，可以向海外荒野公国发起殖民工程。"
 eu5_new_world_discovery.0002.a:0 "新的机遇正在海的彼岸等待。"
 eu5_colonial_enterprise_duchy_available_tt:0 "该公国没有正在规划或建设的殖民工程"
 eu5_chart_seas_decision:0 "派遣探索船队"
 eu5_chart_seas_decision_desc:0 "已知的海岸之外，是商人和水手口中无边无际的海洋。若能派遣船队穿过迷雾，我们或许能找到新的港湾、航路与机遇。"
 eu5_chart_seas_decision_tooltip:0 "派遣船队探索未知海岸。"
 eu5_chart_seas_decision_confirm:0 "选择航线"
 eu5_colonial_target_valid_tt:0 "目标公国须有荒野且没有正在进行的殖民工程；跨海殖民还需文化掌握殖民特许状，并已发现目标地区。殖民非洲还需掌握疫苗接种。"
 eu5_colonial_exploration.0001.t:0 "驶向未知"
 eu5_colonial_exploration.0001.desc:0 "船只已经整备完毕，水手们等待着命令。天际的海岸尚未绘入海图，而我们必须决定船队将朝哪个方向启航。"
 eu5_colonial_exploration.0001.cancel:0 "暂且搁置。"
 eu5_colonial_exploration.0003.t:0 "船队归航"
 eu5_colonial_exploration.0003.desc:0 "探索船队带回了新的海图。我们现在可以在已发现地区的荒野海岸筹划殖民工程。"
 eu5_colonial_exploration.0003.a:0 "打开海图。"
 eu5_colonial_exploration.0001.europe:0 "欧洲沿岸"
 eu5_colonial_exploration.0001.africa:0 "非洲沿岸"
 eu5_colonial_exploration.0001.asia:0 "亚洲沿岸"
 eu5_colonial_exploration.0001.north_america:0 "北美洲和加勒比"
 eu5_colonial_exploration.0001.south_america:0 "南美洲"
 eu5_colonial_exploration.0001.oceania:0 "大洋洲"
 eu5_colonial_exploration.0004.t:0 "船队未能归来"
 eu5_colonial_exploration.0004.desc:0 "许久没有传来消息后，终于有幸存者抵达港口。船队未能完成探索，此次航程也没有带回可用的海图。"
 eu5_colonial_exploration.0004.a:0 "我们会再次出航。"
 eu5_chart_seas_coast_requirement_tt:0 "你的领地内至少有一个沿海伯爵领"
 eu5_chart_seas_decision_effect_tt:0 "选择探索地区；确定出航后支付150金币。成功完成航行将获得该地区的海图。"
 eu5_chart_seas_voyage_available_tt:0 "当前没有正在进行的探索航行，且仍有未绘制海图的地区"
 eu5_colonial_settlement_investor_tt:0 "工程所有者可凭本人直接持有的接壤领地投资；其封臣可凭本人或下级封臣持有的接壤领地投资。工程所有者的文化掌握殖民特许状后，其庇护的商人也可投资。"
 eu5_colonial_settlement_outcome_tt:0 "主投资者获得目标公国的荒野伯爵领；公国无主或由工程所有者持有时也将获得该公国。有地投资者保留原政体，商人投资者则建立共和国。"
 eu5_colonial_africa_vaccination_tt:0 "殖民非洲内陆需要文化掌握疫苗革新"
 eu5_colonial_africa_unlock_tt:0 "允许在非洲内陆殖民"
