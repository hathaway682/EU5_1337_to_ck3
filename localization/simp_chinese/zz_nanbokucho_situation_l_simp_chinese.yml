l_simp_chinese:
 nanbokucho:0 "南北朝"
 situation_nanbokucho:0 "南北朝"
 situation_nanbokucho_desc:0 "京都与吉野各奉天皇，武家和公卿在两座朝廷之间选择效忠。两派间的战争与交涉将左右天下的命运。\n\n#high 北朝势力：#![EmptyScope.ScriptValue('nanbokucho_north_power')|0]（[EmptyScope.ScriptValue('nanbokucho_north_share')|0]%）\n#high 南朝势力：#![EmptyScope.ScriptValue('nanbokucho_south_power')|0]（[EmptyScope.ScriptValue('nanbokucho_south_share')|0]%）\n仅统计参与局势的家主，每个家族计入一次豪族评分。"
 nanbokucho_japan:0 "日本"
 nanbokucho_participant_group_nanbokucho_north:0 "北朝支持者"
 nanbokucho_participant_group_nanbokucho_south:0 "南朝支持者"
 nanbokucho_participant_group_nanbokucho_unaligned:0 "尚未表态"
 nanbokucho_nanbokucho_north:0 "北朝支持者"
 nanbokucho_nanbokucho_south:0 "南朝支持者"
 nanbokucho_nanbokucho_unaligned:0 "尚未表态"
 nanbokucho_divided:0 "两朝对立"
 nanbokucho_divided_desc:0 "南北两朝各自维系支持者，冲突随时可能扩大。\n\n#high 北朝势力：#![EmptyScope.ScriptValue('nanbokucho_north_power')|0]（[EmptyScope.ScriptValue('nanbokucho_north_share')|0]%）\n#high 南朝势力：#![EmptyScope.ScriptValue('nanbokucho_south_power')|0]（[EmptyScope.ScriptValue('nanbokucho_south_share')|0]%）\n仅统计参与局势的家主，每个家族计入一次豪族评分。"
 situation_nanbokucho_phase_nanbokucho_divided:0 "两朝对立"
 situation_nanbokucho_phase_nanbokucho_divided_desc_short:0 "两朝对立，双方都在争取支持。"
 nanbokucho_warfare:0 "战乱激化"
 nanbokucho_warfare_desc:0 "两派战争冲击领地。任一方的家族豪族评分总和达到两派总分的70%时，将进入该方优势阶段。\n\n#high 北朝势力：#![EmptyScope.ScriptValue('nanbokucho_north_power')|0]（[EmptyScope.ScriptValue('nanbokucho_north_share')|0]%）\n#high 南朝势力：#![EmptyScope.ScriptValue('nanbokucho_south_power')|0]（[EmptyScope.ScriptValue('nanbokucho_south_share')|0]%）\n仅统计参与局势的家主，每个家族计入一次豪族评分。"
 situation_nanbokucho_phase_nanbokucho_warfare:0 "战乱激化"
 situation_nanbokucho_phase_nanbokucho_warfare_desc_short:0 "两派战争冲击领地。任一方的家族豪族评分总和达到两派总分的70%时，将进入该方优势阶段。"
 nanbokucho_rivalry_effects:0 "朝廷声望"
 nanbokucho_warfare_effects:0 "战乱的代价"
 catalyst_nanbokucho_war:0 "两派交战"
 catalyst_nanbokucho_alignment:0 "家族表明立场"
 catalyst_nanbokucho_reconciliation:0 "寻求和解"
 nanbokucho_support_north_decision:0 "支持北朝"
 nanbokucho_support_north_decision_desc:0 "天下不能久无定论。我的家族应当公开选择自己的效忠对象。"
 nanbokucho_support_north_decision_tooltip:0 "宣布家族支持北朝"
 nanbokucho_support_north_decision_confirm:0 "拥护北朝"
 nanbokucho_support_north_effect_tt:0 "你的家族将在局势中支持北朝，并使对立加深。此举不会改变家族集团成员身份。"
 nanbokucho_support_south_decision:0 "支持南朝"
 nanbokucho_support_south_decision_desc:0 "天下不能久无定论。我的家族应当公开选择自己的效忠对象。"
 nanbokucho_support_south_decision_tooltip:0 "宣布家族支持南朝"
 nanbokucho_support_south_decision_confirm:0 "拥护南朝"
 nanbokucho_support_south_effect_tt:0 "你的家族将在局势中支持南朝，并使对立加深。此举不会改变家族集团成员身份。"
 nanbokucho_seek_peace_decision:0 "谋求朝廷和解"
 nanbokucho_seek_peace_decision_desc:0 "战火使天下蒙受苦难。或许，彼此尚有一线商议的机会。"
 nanbokucho_seek_peace_decision_tooltip:0 "为缓和两朝冲突作出努力"
 nanbokucho_seek_peace_decision_confirm:0 "派出使者"
 nanbokucho_seek_peace_effect_tt:0 "推动局势从战乱激化转向两朝对立。"
 nanbokucho_end_division_decision:0 "结束南北朝分裂"
 nanbokucho_end_division_decision_desc:0 "长久以来的争执已到了可以解决的时候。天下与朝廷终将重归一统。"
 nanbokucho_end_division_decision_tooltip:0 "终结南北朝局势"
 nanbokucho_end_division_decision_confirm:0 "宣告统一"
 nanbokucho_end_division_effect_tt:0 "南北朝局势结束。"
 nanbokucho_north_advantage:0 "北朝优势"
 nanbokucho_north_advantage_desc:0 "北朝势力占据上风，其支持者的声望与领地繁荣增长得到提升。若其份额跌破60%，将失去优势。\n\n#high 北朝势力：#![EmptyScope.ScriptValue('nanbokucho_north_power')|0]（[EmptyScope.ScriptValue('nanbokucho_north_share')|0]%）\n#high 南朝势力：#![EmptyScope.ScriptValue('nanbokucho_south_power')|0]（[EmptyScope.ScriptValue('nanbokucho_south_share')|0]%）\n仅统计参与局势的家主，每个家族计入一次豪族评分。"
