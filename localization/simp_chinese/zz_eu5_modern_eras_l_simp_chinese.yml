l_simp_chinese:
 culture_era_eu5_discovery:0 "地理大发现"
 culture_era_eu5_discovery_desc:0 "地理大发现时代的文化与技术发展。"
 innovation_eu5_fort_limit_3_advance:0 "边防司"
 innovation_eu5_fort_limit_3_advance_desc:0 "政府将把要塞的监管权收归至首都的官方机构统一管理，使档案文书、资金调拨及维护指令等事务均纳入单一行政部门的统筹范畴。"
 innovation_eu5_unlock_falconet_advance:0 "长管隼炮"
 innovation_eu5_unlock_falconet_advance_desc:0 "长管隼炮是一种在15世纪发展起来的轻型火炮，是类似“隼炮”的进化版本，具有更强的机动性并能发射更小口径的弹药。"
 innovation_eu5_training_ground:0 "训练场"
 innovation_eu5_training_ground_desc:0 "军队和社会的发展催生了新的制度和方法。"
 innovation_eu5_correct_box_advance_discovery:0 "尉级士官"
 innovation_eu5_correct_box_advance_discovery_desc:0 "随着职业军队的发展，他们的军官领导的队伍越来越大。为了协助他们，中尉负责传达命令，并在战场上领导规模较小的部队。"
 innovation_eu5_matchlock_gun:0 "早期猎枪"
 innovation_eu5_matchlock_gun_desc:0 "枪匠工艺的改良使猎人获得了更顺手的工具，从而能带回更多毛皮与野味。"
 innovation_eu5_regiment_reinforcement_speed_discovery:0 "早期军事后勤"
 innovation_eu5_regiment_reinforcement_speed_discovery_desc:0 "战事的一半问题是后勤保障。士兵在战场上作战，他们的武器和盔甲将磨损，并在敌人的攻击下损毁。建立本地供应仓库及其他后勤手段，使我们能够在短时间内为士兵重新配备新武器。"
 innovation_eu5_government_size_discovery:0 "早期行政容量"
 innovation_eu5_government_size_discovery_desc:0 "我们的领土上有多个行政部门，随着领土的扩展，我们必须对政府进行必要的调整以适应这种增长。"
 innovation_eu5_town_rights_enable:0 "自治特权"
 innovation_eu5_town_rights_enable_desc:0 "毫无疑问，人口与居所的聚集使定居点与乡村截然不同。继承罗马城市自治传统，我们可以赋予这些定居点特殊法律与特权，从而明确差异，并为其居民带来益处。"
 innovation_eu5_basic_financial_instruments:0 "基础金融工具"
 innovation_eu5_basic_financial_instruments_desc:0 "海外贸易带来高风险的同时也带来更高的利润。如信用证之类的金融工具的发展，将有助于减少风险，并增加我们的利润。"
 innovation_eu5_power_projection_advance_4:0 "支配性强权野心"
 innovation_eu5_power_projection_advance_4_desc:0 "我们在外交舞台上的存在散发出一种宏伟和威严的气息。所有与我们接触的人都应当听到我们的声音，并受到我们的影响。"
 innovation_eu5_new_world_crops:0 "新大陆作物"
 innovation_eu5_new_world_crops_desc:0 "新大陆富饶的土地为我们的国家提供了许多宝藏，其中最大的宝藏之一，是由当地原住民作为食物和香料种植的奇异无比的植物。将这些作物引入我们的农田，将为我们的民众提供他们渴望的多样性和新鲜感。"
 innovation_eu5_blast_furnace:0 "高炉"
 innovation_eu5_blast_furnace_desc:0 "高炉通过重新熔炼不同成分的铁、钢、石灰石和木炭，能进一步将生铁精炼为铸铁，这是一种比传统冶金更昂贵的工艺。用这种方法将铸铁制成熟铁，是制造大炮等更复杂产品的绝佳材料。"
 innovation_eu5_burgher_privileges:0 "市民特权"
 innovation_eu5_burgher_privileges_desc:0 "军队和社会的发展催生了新的制度和方法。"
 innovation_eu5_construction_speed_discovery:0 "标准化建材"
 innovation_eu5_construction_speed_discovery_desc:0 "运用近代工艺实现板材与砖块的规格标准化，从而大幅提升建筑施工的便捷性与作业效率。"
 innovation_eu5_trade_range_advance_age_3:0 "先进商船"
 innovation_eu5_trade_range_advance_age_3_desc:0 "随着大型船舶的发展，船员更少，航行时间更长，我们的贸易范围将大大增加。"
 innovation_eu5_print_culture:0 "印刷文化"
 innovation_eu5_print_culture_desc:0 "随着印刷机的发明，知识的传播变得前所未有的容易。新的技术和进展将传遍我国的每个角落，使它变得更强大、更富有。"
 innovation_eu5_overseas_expeditions:0 "海外远征"
 innovation_eu5_overseas_expeditions_desc:0 "军队和社会的发展催生了新的制度和方法。"
 innovation_eu5_open_sea_exploration:0 "远洋探索"
 innovation_eu5_open_sea_exploration_desc:0 "辽阔的海洋给我们带来了巨大的财富和在遥远的海岸进行贸易的新机会。"
 innovation_eu5_colonial_charters:0 "殖民特许状"
 innovation_eu5_colonial_charters_desc:0 "这些新文件将确保我们国家的人民在新大陆未开垦的土地上的开拓权，并赋予殖民地治理新土地的专有权，同时规范他们与本土的关系。"
 innovation_eu5_surgery_advance:0 "外科手术"
 innovation_eu5_surgery_advance_desc:0 "理发外科医生正在开发更复杂的技术来治疗伤病，新的外科器械的开发使手术过程更安全、更有效。结果是，在几年前可能致命的伤病，而现在，这些患者能够存活下来。"
 culture_era_eu5_reformation:0 "宗教改革"
 culture_era_eu5_reformation_desc:0 "宗教改革时代的文化与技术发展。"
 innovation_eu5_fort_limit_4_advance:0 "要塞巡察长"
 innovation_eu5_fort_limit_4_advance_desc:0 "专业的监察官巡行全国，评估各处要塞的驻军、仓储与城防，推行统一规范，以确保每一处设防地点的可靠性。"
 innovation_eu5_artillery_institution_advance:0 "炮兵应用"
 innovation_eu5_artillery_institution_advance_desc:0 "中国宋王朝所研制的火药成为了火炮发明的先决条件，这一战争器械使用火药作为其火力动能的来源。它的使用对石质城堡与防御工事产生了重大威胁。"
 innovation_eu5_barracks:0 "兵营"
 innovation_eu5_barracks_desc:0 "作为军械站的升级，建在城镇中的兵营能更有效地为军队补充兵员。"
 innovation_eu5_correct_box_advance_reformation:0 "团级组织"
 innovation_eu5_correct_box_advance_reformation_desc:0 "职业军队的出现使得我们能够创建一种新型单位——团，它不仅是士兵们永远的家，也是一种高效的战斗编制。"
 innovation_eu5_flintlock_gun:0 "燧发猎枪"
 innovation_eu5_flintlock_gun_desc:0 "优化的燧发机构造配合专用狩猎弹药，使猎人们的捕猎效率显著提升。"
 innovation_eu5_military_administration:0 "军事管理"
 innovation_eu5_military_administration_desc:0 "16世纪以来不断增加的军队数量对国家的行政体制提出了更高的要求。通过创建一个永久性组织来负责军用物资的采购和规划，使得即便在冬季与和平时期也能维持大量的部队。从长远来看，我们可以更廉价地维持一支庞大的军队，并且在战时更有效地补给这些军队。"
 innovation_eu5_generic_bureaucracy_4_advance:0 "行政官僚体系"
 innovation_eu5_generic_bureaucracy_4_advance_desc:0 "随着政府规模的扩大，建立更复杂、更高效的官僚体系也势在必行。通过设立专门的部门来管理特定的治理领域，我们可以确保行政机构平稳高效地运行。"
 innovation_eu5_town_rights_ref_advance:0 "发展首都"
 innovation_eu5_town_rights_ref_advance_desc:0 "随着国家发展，首都亦不断扩张，需要持续修订与更新相关法律。唯有一个制度完善、与其规模和地位相匹配的首都，国家方能继续成长。"
 innovation_eu5_chartered_companies:0 "特许公司"
 innovation_eu5_chartered_companies_desc:0 "世界是广阔的，为了发展我们的贸易有时必须承担相当大的风险。幸运的是，我们国家的商人愿意利用自己的资源来冒这些风险。认可这些由政府通过特许证授予其垄断某些领域并履行近乎政府职能的特权的公司，可以控制和促进我们海外殖民地的商贸发展。"
 innovation_eu5_war_score_reformations_advance:0 "征伐的神圣权力"
 innovation_eu5_war_score_reformations_advance_desc:0 "我们在战场上的胜利不仅仅是战斗计划和战争策略的成功执行，更是神明对我们的眷顾。因此，我们征服并吞并我们为之流血的新领土的权利，是神明希望我们成功的延伸。"
 innovation_eu5_food_advance_reformation:0 "市场农业"
 innovation_eu5_food_advance_reformation_desc:0 "可以引入更新、更好的作物来提高我们农田的生产力。无论是选择更优良的品种，还是用外来产品取而代之，我们都可以轻松地推动粮食产量的增长。"
 innovation_eu5_bole_smelting:0 "山顶吹风冶炼工艺"
 innovation_eu5_bole_smelting_desc:0 "一种在露天环境下冶炼铅的工艺，利用山顶上持续不断的强风将新鲜空气吹入正在熔炼的矿石中。"
 innovation_eu5_rgo_size_advance_reformation:0 "纺车"
 innovation_eu5_rgo_size_advance_reformation_desc:0 "我们学习了到新的、更好的资源利用手段，我们的生产能力将因而大幅提高，从而使我们更加富有。"
 innovation_eu5_construction_speed_reformation:0 "建筑论著"
 innovation_eu5_construction_speed_reformation_desc:0 "一部部凝聚数百年营造智慧的专著得以问世，极大地促进了高效建筑技术的传播与掌握。"
 innovation_eu5_global_trade_routes_advance:0 "海外贸易路线"
 innovation_eu5_global_trade_routes_advance_desc:0 "新发现使世界变得更大，世界也因新出现的、更频繁的贸易路线而变得更小。随着船只不断将货物和人员从遥远的国度运送来回，那些地方实际上比以前更近了。"
 innovation_eu5_scientific_experimentation:0 "科学实验"
 innovation_eu5_scientific_experimentation_desc:0 "世事皆有原因。通过理解每种事物背后的原理，我们可以在类似情况出现时预见其结果。"
 innovation_eu5_letters_of_marque:0 "私掠许可证"
 innovation_eu5_letters_of_marque_desc:0 "海盗行为令人发指。卑鄙的盗贼企图从他人的痛苦中获利。然而，授权舰船袭击我们的敌人却完全是另一回事。"
 innovation_eu5_confessionalism_advance:0 "认信主义"
 innovation_eu5_confessionalism_advance_desc:0 "关于信仰应有何种形式的各种不同解释的越来越多，无论是宗教还是世俗当局都越来越重视明确其特定信仰的形式，并在信仰和生活的各个方面强制执行特定的规则和理念。"
 innovation_eu5_religious_toleration:0 "宗教宽容"
 innovation_eu5_religious_toleration_desc:0 "稳定是扩张的关键前提。如果我们在向外扩张的同时鼓励容忍不同宗教，不仅能让我们国家安定，也能让我们国家成为受迫害的其他国民的避难所。"
 innovation_eu5_development_of_maritime_law:0 "制定海洋法"
 innovation_eu5_development_of_maritime_law_desc:0 "随着越来越多的国家把他们的国民或公民派遣到海外从事贸易活动并长期生活在一起，确定通行的海洋法的基本概念是绝对必要的。诸如“公海”或后来的“主宰海洋”学说为海洋国际法奠定了基础。"
 culture_era_eu5_absolutism:0 "专制主义"
 culture_era_eu5_absolutism_desc:0 "专制主义时代的文化与技术发展。"
 innovation_eu5_fort_limit_5_advance:0 "标准化堡垒工程"
 innovation_eu5_fort_limit_5_advance_desc:0 "国家标准的军事建筑与维修规范的颁布实施，使我们得以对整个要塞体系进行科学规划、设计共享，并实现预期内的维护管理。"
 innovation_eu5_artillery_vs_fort_age_5_absolutism:0 "攻城炮"
 innovation_eu5_artillery_vs_fort_age_5_absolutism_desc:0 "火药促使多种不同类型的武器被制造出来。突破步兵防线所需的力量与摧毁城墙不同，因此在围攻战中必须部署专门的火炮。"
 innovation_eu5_legion_camp:0 "军团营地"
 innovation_eu5_legion_camp_desc:0 "军队和社会的发展催生了新的制度和方法。"
 innovation_eu5_correct_box_advance_absolutism:0 "灵活的战斗编队"
 innovation_eu5_correct_box_advance_absolutism_desc:0 "新的战术已经发展起来，步兵、骑兵和炮兵部队在战场上更加灵活和协调，通常以旅级单位编队。"
 innovation_eu5_line_infantry:0 "线列步兵"
 innovation_eu5_line_infantry_desc:0 "有了刺刀，滑膛枪兵也可以起到长矛兵的作用。这导致长矛被移出了步兵装备列表，同时使得步兵编队的火力也进一步加强。"
 innovation_eu5_improved_supply_lines:0 "改善补给线"
 innovation_eu5_improved_supply_lines_desc:0 "随着齐射战术的发展和战场上火炮的广泛使用，现代战争对我们军队的资源需求越来越多。"
 innovation_eu5_government_size_absolutism:0 "忠心的臣僚"
 innovation_eu5_government_size_absolutism_desc:0 "权力集中在统治者手中使他们能够采取更直接的行动，但他们仍然需要下属来执行这些行动。然而，没有实权、并对统治者保持忠诚的下属，对于宫廷来说越多越好，统治者也不必担心内斗或不满。"
 innovation_eu5_town_rights_abs_advance:0 "辉煌宫廷"
 innovation_eu5_town_rights_abs_advance_desc:0 "作为宫廷所在之地，首都也应沐浴于统治的荣光与壮丽之中。没有任何城镇或城市应在威仪与宏伟程度上与它相较。"
 innovation_eu5_central_bank_advance:0 "中央银行"
 innovation_eu5_central_bank_advance_desc:0 "随着银行系统机构的稳固建立，国家现在可以特许设立一座常设的中央银行，并授权其发行政府债券。这些债券使王室能够迅速从私人投资者那里筹集大笔资金，并通过稳定的利息偿还，而不仅仅依赖阶层的贷款。"
 innovation_eu5_national_sovereignty:0 "国家主权"
 innovation_eu5_national_sovereignty_desc:0 "17世纪上半叶旷日持久的诸多战争导致了以领土完整为基础的国际外交体系的诞生。既非统治者个人也非某些超国家组织，而是国家本身成为了国际舞台的主角，任何国家都无权干涉别国内政。"
 innovation_eu5_food_advance_absolutism:0 "土地专用"
 innovation_eu5_food_advance_absolutism_desc:0 "在近些年之前，土地的所有权及其常规使用，相对来说没太多限制。然而，逐渐出现了一个趋势，人们开始进行特定土地的划界，明确确定专门用于农业的田地的边界和面积。如此，农业生产和效用可以大大加强。"
 innovation_eu5_coke_blast_furnace:0 "焦炭高炉"
 innovation_eu5_coke_blast_furnace_desc:0 "这是一种新型高炉，可以使用焦炭而非木炭作为燃料。这种工艺不仅更经济，还能建造更大的熔炉，不过缺点是焦炭比木炭含有更多的杂质，这个问题有待解决。"
 innovation_eu5_manufactories_advance:0 "工场生产"
 innovation_eu5_manufactories_advance_desc:0 "近年来的技术进步与机械化的推广促进了工场这样的集中大生产设施的兴起。在这样的进步下，生产速度和数量都得到了显著的提高，因而创造了更大的收益。"
 innovation_eu5_construction_speed_absolutism:0 "建筑工程学"
 innovation_eu5_construction_speed_absolutism_desc:0 "随着时代发展，建筑施工已演变为一门融合多学科方法的系统工程学科，其工艺技术也日益精密复杂。"
 innovation_eu5_maritime_advance_age_5:0 "护航船队"
 innovation_eu5_maritime_advance_age_5_desc:0 "随着海上贸易的不断扩大，从更远的地方向本土运送的货物越来越多，数量也越来越大，对更稳定的货物流动的需求也随之增加。组织护航贸易船队可以实现贸易船只的稳定航行。"
 innovation_eu5_scientific_revolution_advance:0 "科学革命"
 innovation_eu5_scientific_revolution_advance_desc:0 "近来，数学、物理学、天文学、生物学和化学的发展不仅对我们周围世界的认知提出了挑战，更是彻底改变了我们的世界观。社会正以前所未有的速度进步，每天都有新的科学发现。"
 innovation_eu5_naval_doctrines_advance:0 "海军学说"
 innovation_eu5_naval_doctrines_advance_desc:0 "近年来，海战发生了许多变化，舰船和舰队变得更大、更专业化。因此，不同国家开始采用不同的战术和学说，来匹配各自的优势或特定的舰队运用方式。"
 innovation_eu5_newspapers_advance:0 "报纸"
 innovation_eu5_newspapers_advance_desc:0 "以石碑或薄板为载体的公告已存在多时。然而，随着印刷机应用在全球传播，民众对于政治、军事和经济信息的需求日益增加。报纸——一种描述时事的定期出版物——将满足这一需求。"
 innovation_eu5_the_constitution:0 "宪政主义"
 innovation_eu5_the_constitution_desc:0 "一种被称为宪政主义的全新哲学概念逐渐兴起，它主张用法律来限制政府权力。这是一个很有趣的想法，但我们认为它难以广泛接受。"
 innovation_eu5_sanitation_advance:0 "公共卫生"
 innovation_eu5_sanitation_advance_desc:0 "定居点正在投资改进卫生措施，例如废物处理和饮水净化系统。这将减少疾病传播，并改善人口的整体健康状况。现代卫生习惯的发展将使人们能够住得更近而不受疾病的影响。"
 culture_era_eu5_revolutions:0 "大革命"
 culture_era_eu5_revolutions_desc:0 "大革命时代的文化与技术发展。"
 innovation_eu5_fort_limit_6_advance:0 "军事工程测量学"
 innovation_eu5_fort_limit_6_advance_desc:0 "通过系统的测绘技术与高效的物资调配，所有军事据点被整合为统一的防御网络；这是官僚体制、新兴学科与国家机器协同运作所取得的成就。"
 innovation_eu5_artillery_vs_fort_age_6_revolutions:0 "先进榴弹炮"
 innovation_eu5_artillery_vs_fort_age_6_revolutions_desc:0 "对介于攻城炮的直线火力与臼炮的高弧度间接火力之间的武器需求，为了满足这一需求，促使我们的军队研发了新型榴弹炮。"
 innovation_eu5_recruitment_center:0 "征兵中心"
 innovation_eu5_recruitment_center_desc:0 "军队和社会的发展催生了新的制度和方法。"
 innovation_eu5_correct_box_advance_revolutions:0 "总参谋部"
 innovation_eu5_correct_box_advance_revolutions_desc:0 "军队规模不断增长，它们在长期战役中的部署更需统筹规划，指派专职军官负责计划和后勤任务的需求日益迫切，以有效协调战场上各支部队的行动。"
 innovation_eu5_long_rifle:0 "长管猎铳"
 innovation_eu5_long_rifle_desc:0 "专为狩猎设计的长管步枪，成为获取毛皮与野味的可靠利器。"
 innovation_eu5_combined_arms_advance_revolutions:0 "兵种联合战术"
 innovation_eu5_combined_arms_advance_revolutions_desc:0 "数世纪以来，兵种联合战术的常态化运用，使其成为战场主流战法。轻装步兵与骑兵负责袭扰敌军、打乱其阵型，同时掩护己方部队的侧翼与后方。重装步兵与骑兵作为主力承担正面攻坚，发起决定性冲锋以击溃敌军。炮兵与辅助部队则在后方远程提供火力支援与后勤保障。"
 innovation_eu5_modern_bureaucracy:0 "现代官僚"
 innovation_eu5_modern_bureaucracy_desc:0 "为了最大限度地控制我们的土地和臣民，我们必须扩大、重组我们的官僚机构并使之专业化。一个稳健的官僚组织可以掌控我们国家的每一部分，并避免对于发明临时解决方案需要。让我们的大学研究考虑最好最有效地统治和管理方法，并鼓励贵族子弟用笔而不是刀剑来为国家服务。"
 innovation_eu5_urbanization:0 "城市化"
 innovation_eu5_urbanization_desc:0 "新兴城市为我们的居民提供了新的机会和安全保障，吸引了越来越多的人离开农村农场，填补新兴现代工厂创造的产业岗位。"
 innovation_eu5_the_gold_standard:0 "金本位"
 innovation_eu5_the_gold_standard_desc:0 "欧洲和中国之间的贸易逆差在欧洲和全世界都造成了白银短缺。如果我们从银本位变为金本位就可以为流通领域提供新的货币并促进贸易发展。"
 innovation_eu5_war_score_revolutions_advance:0 "理性战争条款"
 innovation_eu5_war_score_revolutions_advance_desc:0 "战争总是令人痛苦的丑陋事件，给双方带来痛苦。强调这些事实，并诉诸对方的逻辑和理性，将使我们在谈判不可避免的国界变更时，获得显著优势。"
 innovation_eu5_rotherham_plough:0 "罗瑟拉姆犁"
 innovation_eu5_rotherham_plough_desc:0 "从罗马帝国以来欧洲的犁基本就没变过样。现在，由于设计上的改进，同样的犁可以更轻，减少了牲畜的工作量，使它们能够干更多的活。"
 innovation_eu5_hot_blast_furnace:0 "热风高炉"
 innovation_eu5_hot_blast_furnace_desc:0 "焦炭高炉因焦炭杂质问题使得铸铁含有更多杂质，促使了热风技术的发展。此方法不仅显著减少了焦炭使用，从而提高了铁的质量，还可在有原煤资源时直接使用原煤作为燃料，这在冶铁领域是一项重大进步。"
 innovation_eu5_industrialization_advance:0 "工业革命"
 innovation_eu5_industrialization_advance_desc:0 "工业革命的兴起带来的国际性和持久的变革，不仅改变了商业和贸易，也改变了社会结构本身。动力织布机和蒸汽机等发明将推动人类能力达到前所未有的顶峰。"
 innovation_eu5_construction_speed_revolutions:0 "铸铁结构"
 innovation_eu5_construction_speed_revolutions_desc:0 "随着冶金工艺的进步，特别是锻铁与铸铁技术的革新，诸如支柱、立柱等更为复杂的金属构件得以制造，这显著提升了建筑工程的建设效率。"
 innovation_eu5_maritime_advance_age_6:0 "武装船队"
 innovation_eu5_maritime_advance_age_6_desc:0 "对于任何海盗来说，贸易船队显然都是非常诱人的目标。装满货物和金币的船只是很少有人会放过的战利品。因此，为这些护航船队提供防御武器，以阻止这些袭击至关重要。让贸易船队由护卫舰或其他武装船只陪同，可以确保它们的安全。"
 innovation_eu5_enlightenment_advance:0 "启蒙运动"
 innovation_eu5_enlightenment_advance_desc:0 "在上一个世纪，理性主义和经验主义受到了越来越多的伟大思想家的推崇。理性之光正在缓缓升起，对许多人而言，他们的使命就是马不停蹄地让这束光芒照亮地球的每个角落。"
 innovation_eu5_levee_en_masse_advance:0 "全民动员"
 innovation_eu5_levee_en_masse_advance_desc:0 "战争是一个不断演化的概念，它经历了一代又一代的创新与磨砺。侵略与野心的锻炉呼唤着年轻的躯体作为供养的燃料，而全新的征兵法案将得到起草，以将全国所有未婚男子征募在其麾下，他们的规模将足以屈折历史的进程。"
 innovation_eu5_rights_of_man:0 "人权"
 innovation_eu5_rights_of_man_desc:0 "如今一种人人平等的激进观点占据着革命思想的最前线。来自各地的哲人们通力合作，起草了一份题名为《人权与公民权宣言》的文件。文件宣称如是种种权利乃是普世价值且应当由法律强制贯彻。这可能会在自由民主领域引起广泛的反响，我们可得好好表现以免落后。"
 innovation_eu5_vaccination_advance:0 "疫苗"
 innovation_eu5_vaccination_advance_desc:0 "随着疫苗的发展，医生能够为民众提供对抗致命疾病的免疫力。这些疫苗有助于减少了疾病的传播，并预防流行病的爆发。通过将少量的减毒或灭活细菌或病毒注射到体内，免疫系统能够识别并在再次遇到这种疾病时将其击退。"
 innovation_eu5_joint_stock_companies:0 "股份公司"
 innovation_eu5_joint_stock_companies_desc:0 "随着贸易的发展，风险也随之而来。人们需要新的方法来积累资本和管理风险。在股份制企业中，我们可以和股东共同分担风险。"
 eu5_innovation_unlock_exploration_tt:0 "解锁派遣远洋探索船队的决议"
 eu5_innovation_unlock_colonial_charters_tt:0 "允许跨海殖民及商人参与殖民工程"
 setting_1453_end_date:0 "1836"
 setting_1453_end_date_desc:0 "游戏将于1836年结束。"
