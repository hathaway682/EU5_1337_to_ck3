l_simp_chinese:
 culture_era_eu5_renaissance:0 "文艺复兴"
 culture_era_eu5_renaissance_desc:0 "文艺复兴时代的文化与技术发展。"
 innovation_eu5_government_size_renaissance:0 "常设内阁"
 innovation_eu5_government_size_renaissance_desc:0 "传统上，统治者有一个顾问团，他们在战争与和平方面的决策提供建议。如今，我国的政府变得如此复杂，我们需要一些更为固定的职位来帮助处理日常治理。"
 innovation_eu5_crown_power_advance_renaissance:0 "元首"
 innovation_eu5_crown_power_advance_renaissance_desc:0 "传统的治理方式是基于统治者处理国家不同阶层的能力。然而，现代政府理论确立了统治者在本国的元首地位，我们将不再屈服于其他世俗权力。"
 innovation_eu5_late_feudal_relations:0 "晚期封建关系"
 innovation_eu5_late_feudal_relations_desc:0 "封建制度基于不同等级的贵族向各自领主提供协助和建议的概念，形成了一个历经时代发展的等级制度。"
 innovation_eu5_diplomatic_range_age_1:0 "驻外使节"
 innovation_eu5_diplomatic_range_age_1_desc:0 "国家之间的外交一直很重要。然而，外交关系正在变得更加频繁和复杂，派遣使节远赴海外，以扩大我国的对外关系，也变得越来越普遍。"
 innovation_eu5_spy_construction_renaissance:0 "情报网络"
 innovation_eu5_spy_construction_renaissance_desc:0 "历史上的帝国都广泛使用间谍来获取内部和外部威胁的情报。蒙古人深谙此道，当时他们利用间谍活动来为军事行动做准备并确保成功。"
 innovation_eu5_renaissance_urbanisation:0 "复兴城市规划"
 innovation_eu5_renaissance_urbanisation_desc:0 "在规划过程中专门预留资源开发的专用区域，将使我们的城市中心能够生产出比以前更多的商品。"
 innovation_eu5_construction_speed_renaissance:0 "石匠行会"
 innovation_eu5_construction_speed_renaissance_desc:0 "自由石匠通过行会组织世代相传，以资深匠人指导年轻学徒的传承体系，确保了建筑技艺的薪火相传。"
 innovation_eu5_food_advance_renaissance:0 "精耕农业"
 innovation_eu5_food_advance_renaissance_desc:0 "自有记录以来，农业一直是大多数社会的基础。近年来，一系列技术进步正在发展，改善了我们田地和农场的生产力，并带来了更多的粮食盈余。"
 innovation_eu5_rgo_size_advance_renaissance:0 "磨坊"
 innovation_eu5_rgo_size_advance_renaissance_desc:0 "磨坊自几个世纪前被发现以来一直在使用。然而，我们现在能够开发出更现代、更高效的用于收集原材料的风力和水力磨坊。"
 innovation_eu5_cannon_maker_advance:0 "锻炮作坊"
 innovation_eu5_cannon_maker_advance_desc:0 "专门制作和组装大炮的行会。这些威力强大的武器是攻城和防御的关键。"
 innovation_eu5_banking_advance:0 "银行系统"
 innovation_eu5_banking_advance_desc:0 "借贷自古有之，但并非没有风险。我们可以将这些行为制度化，使借贷在受控和公平的方式下进行。"
 innovation_eu5_merchants_and_trade:0 "商人与贸易"
 innovation_eu5_merchants_and_trade_desc:0 "可能是因为瘟疫和流行病的影响，贸易格局受到了严重的破坏。现在贸易正慢慢开始复苏。"
 innovation_eu5_maritime_advance_age_2:0 "贸易舰队"
 innovation_eu5_maritime_advance_age_2_desc:0 "随着商业的发展，人们需要更快、更高效地运输更多货物。因此，那些投资于海上贸易的人都会不惜一切代价，在力所能及的范围内组建更大的船队。"
 innovation_eu5_renaissance_advance:0 "文艺复兴"
 innovation_eu5_renaissance_advance_desc:0 "我们必须利用并运用遍布我们领土的创新思想和发现，才能保持在技术创新的前沿。"
 innovation_eu5_professional_armies_advance:0 "职业军队"
 innovation_eu5_professional_armies_advance_desc:0 "我们的军队现代化，在很大程度上依赖于我们的征兵和组织中心的运作。我们必须努力保持强大而不含糊的军事组织，减少浪费和冗余。"
 innovation_eu5_supply_depot_advance_age_2_renaissance:0 "补给站"
 innovation_eu5_supply_depot_advance_age_2_renaissance_desc:0 "没有补给，军队无法生存。建立专门提供补给的常设供应仓库可以确保补给线得到持续补充，使我们的军队始终保持最佳状态。"
 innovation_eu5_patron_of_art:0 "赞助艺术"
 innovation_eu5_patron_of_art_desc:0 "我们从此将开始追求建立文化昌盛的社会，我们的艺术巨作将万古流传，成为这一世代的人间奇迹。"
 innovation_eu5_chancery_records:0 "秘书室档案馆"
 innovation_eu5_chancery_records_desc:0 "随着秘书室机构的发展，它们的官僚体系变得更加复杂，管理难度增加，因此需要更高级别的行政机构。于是，秘书室档案馆出现了，它用于保存收到的所有信件以及文吏和书记员签发的所有文件的副本。"
 innovation_eu5_anatomy_advance:0 "人体解剖"
 innovation_eu5_anatomy_advance_desc:0 "医生们对人体解剖学有了更深入的了解，这会促进更有效的伤病治疗。这些知识主要来自于对人类尸体的实际解剖，也有助于改进外科技术，并降低医疗程序的风险。"
 innovation_eu5_pound_lock_canals_advance:0 "船闸运河"
 innovation_eu5_pound_lock_canals_advance_desc:0 "为引导财富、获取食物以及改善货物流通而开凿大地，这一行为早已为我们的民众所熟知。“斜接闸”的发明将有助于为我们的人民提供发展与繁荣所需的条件。"
 culture_era_eu5_discovery:0 "地理大发现"
 culture_era_eu5_discovery_desc:0 "地理大发现时代的文化与技术发展。"
 innovation_eu5_government_size_discovery:0 "早期行政容量"
 innovation_eu5_government_size_discovery_desc:0 "我们的领土上有多个行政部门，随着领土的扩展，我们必须对政府进行必要的调整以适应这种增长。"
 innovation_eu5_crown_power_advance_discovery:0 "治国之道"
 innovation_eu5_crown_power_advance_discovery_desc:0 "我们的统治者成为了领地上的唯一权威，显然需要变革政府结构，因而需要建立相适应的官僚机构加以治理。"
 innovation_eu5_formalized_relations:0 "关系正式化"
 innovation_eu5_formalized_relations_desc:0 "如果我们要保持权力平衡并促进我们的利益，与相关邻国建立正式关系至关重要。"
 innovation_eu5_diplomatic_range_age_2:0 "外交网络"
 innovation_eu5_diplomatic_range_age_2_desc:0 "通过在我国周围维持良好和成熟的外交网络，我们可以利用它向更远的国家派遣使节。"
 innovation_eu5_spy_construction_discovery:0 "改进的间谍组织"
 innovation_eu5_spy_construction_discovery_desc:0 "雇用值得信赖的人作为线人，并将他们安置在信息交汇之处，如此我们可以提高收集敌人及其活动信息的能力。"
 innovation_eu5_town_rights_enable:0 "自治特权"
 innovation_eu5_town_rights_enable_desc:0 "毫无疑问，人口与居所的聚集使定居点与乡村截然不同。继承罗马城市自治传统，我们可以赋予这些定居点特殊法律与特权，从而明确差异，并为其居民带来益处。"
 innovation_eu5_construction_speed_discovery:0 "标准化建材"
 innovation_eu5_construction_speed_discovery_desc:0 "运用近代工艺实现板材与砖块的规格标准化，从而大幅提升建筑施工的便捷性与作业效率。"
 innovation_eu5_new_world_crops:0 "新大陆作物"
 innovation_eu5_new_world_crops_desc:0 "新大陆富饶的土地为我们的国家提供了许多宝藏，其中最大的宝藏之一，是由当地原住民作为食物和香料种植的奇异无比的植物。将这些作物引入我们的农田，将为我们的民众提供他们渴望的多样性和新鲜感。"
 innovation_eu5_rgo_size_advance_discovery:0 "先进开发技术"
 innovation_eu5_rgo_size_advance_discovery_desc:0 "各种矿产的发现和新工具的发明为更高效的资源采集和生产线的加速铺平了道路。"
 innovation_eu5_blast_furnace:0 "高炉"
 innovation_eu5_blast_furnace_desc:0 "高炉通过重新熔炼不同成分的铁、钢、石灰石和木炭，能进一步将生铁精炼为铸铁，这是一种比传统冶金更昂贵的工艺。用这种方法将铸铁制成熟铁，是制造大炮等更复杂产品的绝佳材料。"
 innovation_eu5_basic_financial_instruments:0 "基础金融工具"
 innovation_eu5_basic_financial_instruments_desc:0 "海外贸易带来高风险的同时也带来更高的利润。如信用证之类的金融工具的发展，将有助于减少风险，并增加我们的利润。"
 innovation_eu5_merchant_power_from_maritime_discovery_advance:0 "商人行会"
 innovation_eu5_merchant_power_from_maritime_discovery_advance_desc:0 "商人行会使我国商人组织起来，分享有利可图的贸易路线，并在海外市场中联合力量进行买卖交易。"
 innovation_eu5_maritime_advance_age_3:0 "探索舰队"
 innovation_eu5_maritime_advance_age_3_desc:0 "随着对世界和新大陆知识的传播，人们需要了解更多。从东边的广阔海域到西边的新发现海岸，航行面对的风浪越来越大，因此也需要更大的船队来航行。"
 innovation_eu5_printing_press_advance:0 "印刷机应用"
 innovation_eu5_printing_press_advance_desc:0 "本世纪印刷技术的普及，促进了知识的传播，同时，重要手稿的复制效率的提升，简化了信息的交换过程。"
 innovation_eu5_pike_and_shot_advance:0 "枪刺与射击"
 innovation_eu5_pike_and_shot_advance_desc:0 "一种新的战争形式已经开始发展起来，长枪兵组成方阵，而火绳枪兵则在侧翼和前方展开，并在进入近战阶段时躲在方阵内或后方寻求掩护。"
 innovation_eu5_supply_depot_advance_age_3_discovery:0 "陆军仓库"
 innovation_eu5_supply_depot_advance_age_3_discovery_desc:0 "常备军的发展和部署增加了对武器、制服和其他军事用品的需求，这些物资需要储存在他们的附近。"
 innovation_eu5_new_world_advance:0 "发现新大陆"
 innovation_eu5_new_world_advance_desc:0 "正如佛罗伦萨航海家亚美利哥·韦斯普奇所说，哥伦布发现的土地并不是印度，实际上是一个我们祖先所未知的全新世界，等着被绘制地图和占领。"
 innovation_eu5_explorer_commisions_advance:0 "任命探险家"
 innovation_eu5_explorer_commisions_advance_desc:0 "在我们疆土的外，尚有未经开拓的广袤土地，等待我们占据！招募勇敢的探险家，向未知进发，这对我们而言是一个利润丰厚、至关重要的机会。"
 innovation_eu5_colonial_charters:0 "殖民特许状"
 innovation_eu5_colonial_charters_desc:0 "这些新文件将确保我们国家的人民在新大陆未开垦的土地上的开拓权，并赋予殖民地治理新土地的专有权，同时规范他们与本土的关系。"
 innovation_eu5_surgery_advance:0 "外科手术"
 innovation_eu5_surgery_advance_desc:0 "理发外科医生正在开发更复杂的技术来治疗伤病，新的外科器械的开发使手术过程更安全、更有效。结果是，在几年前可能致命的伤病，而现在，这些患者能够存活下来。"
 culture_era_eu5_reformation:0 "宗教改革"
 culture_era_eu5_reformation_desc:0 "宗教改革时代的文化与技术发展。"
 innovation_eu5_generic_bureaucracy_4_advance:0 "行政官僚体系"
 innovation_eu5_generic_bureaucracy_4_advance_desc:0 "随着政府规模的扩大，建立更复杂、更高效的官僚体系也势在必行。通过设立专门的部门来管理特定的治理领域，我们可以确保行政机构平稳高效地运行。"
 innovation_eu5_crown_power_advance_reformation:0 "教随君定"
 innovation_eu5_crown_power_advance_reformation_desc:0 "虽然我们的统治者对世俗事务的控制力很强，但在王国中控制宗教事务的需求成为一种新的必需。教会与国家必须合二为一。"
 innovation_eu5_subject_income_reformation_advance:0 "结构化臣属义务"
 innovation_eu5_subject_income_reformation_advance_desc:0 "我们与属国之间的指挥链是一条明确的界线，规定了他们对我们的责任。加强这些契约并确保其按时履行，必将为我们的国库带来充实的收入。"
 innovation_eu5_diplomatic_range_age_3:0 "常设使馆"
 innovation_eu5_diplomatic_range_age_3_desc:0 "当前的国际局势要求我们在邻国设立常驻外交机构。这是确保我们在本地区利益得到维护的唯一途径，同时我们也能将影响力扩展到更远的地方。"
 innovation_eu5_spy_construction_reformation:0 "先进的加密技术"
 innovation_eu5_spy_construction_reformation_desc:0 "如果我们想获取敌人的情报，重要的是让他们陷入一种虚假的安全感。只有这样，我们才能收集到详细而准确的信息，进而打击他们的计划。"
 innovation_eu5_town_rights_ref_advance:0 "发展首都"
 innovation_eu5_town_rights_ref_advance_desc:0 "随着国家发展，首都亦不断扩张，需要持续修订与更新相关法律。唯有一个制度完善、与其规模和地位相匹配的首都，国家方能继续成长。"
 innovation_eu5_construction_speed_reformation:0 "建筑论著"
 innovation_eu5_construction_speed_reformation_desc:0 "一部部凝聚数百年营造智慧的专著得以问世，极大地促进了高效建筑技术的传播与掌握。"
 innovation_eu5_food_advance_reformation:0 "市场农业"
 innovation_eu5_food_advance_reformation_desc:0 "可以引入更新、更好的作物来提高我们农田的生产力。无论是选择更优良的品种，还是用外来产品取而代之，我们都可以轻松地推动粮食产量的增长。"
 innovation_eu5_rgo_size_advance_reformation:0 "纺车"
 innovation_eu5_rgo_size_advance_reformation_desc:0 "我们学习了到新的、更好的资源利用手段，我们的生产能力将因而大幅提高，从而使我们更加富有。"
 innovation_eu5_slitting_mills:0 "切割轧机"
 innovation_eu5_slitting_mills_desc:0 "这些新型水磨用来将铁锭切割成更细的铁条。这种工艺更高效地制造铁制工具和机械，因为相比于粗笨的铁锭，铸造工匠如此可以使用更适合其需求的铁条，减少了锻造过程中的废料浪费。"
 innovation_eu5_global_trade_advance:0 "全球贸易"
 innovation_eu5_global_trade_advance_desc:0 "自古以来，跨大陆的商品往来就存在了，而如今，所有贸易正在逐渐形成全球贸易网络的一部分。真正的世界经济体可能还没那么快到来，但有一点我们可以确定：它的第一颗种子已经被种下了。"
 innovation_eu5_merchant_power_from_maritime_reformation_advance:0 "特许商团"
 innovation_eu5_merchant_power_from_maritime_reformation_advance_desc:0 "海外市场的扩张带来更高的成本与风险，促使商人需要结成贸易协会，分担在这些新土地上进行贸易的负担。"
 innovation_eu5_maritime_advance_age_4:0 "全球舰队"
 innovation_eu5_maritime_advance_age_4_desc:0 "随着过去几个世纪中世界各地的最新发现，世界并非越来越大，反而越来越小了。在此之前没有任何联系的国家，现在都在不断地建立外交和商业关系。因此，为了维持所有这些海外联系，我们需要更大更好的舰队。"
 innovation_eu5_scientific_experimentation:0 "科学实验"
 innovation_eu5_scientific_experimentation_desc:0 "世事皆有原因。通过理解每种事物背后的原理，我们可以在类似情况出现时预见其结果。"
 innovation_eu5_combined_arms_advance_reformation:0 "混编部队"
 innovation_eu5_combined_arms_advance_reformation_desc:0 "随着由长期服役士兵组成的常备军大规模建立，战争形态日趋复杂。火枪、火炮等新式武器的出现，促使各国采用全新的作战理念：以辅助部队为支援，推动轻步兵、重步兵、骑兵与炮兵之间的协同作战与均衡部署。"
 innovation_eu5_supply_depot_advance_age_4_reformation:0 "弹药库"
 innovation_eu5_supply_depot_advance_age_4_reformation_desc:0 "火炮在战场和围攻战中的大量部署，促进对弹药和火药的需求，它们的储存仓库的重要性也随之提升。"
 innovation_eu5_confessionalism_advance:0 "认信主义"
 innovation_eu5_confessionalism_advance_desc:0 "关于信仰应有何种形式的各种不同解释的越来越多，无论是宗教还是世俗当局都越来越重视明确其特定信仰的形式，并在信仰和生活的各个方面强制执行特定的规则和理念。"
 innovation_eu5_letters_of_marque:0 "私掠许可证"
 innovation_eu5_letters_of_marque_desc:0 "海盗行为令人发指。卑鄙的盗贼企图从他人的痛苦中获利。然而，授权舰船袭击我们的敌人却完全是另一回事。"
 innovation_eu5_development_of_maritime_law:0 "制定海洋法"
 innovation_eu5_development_of_maritime_law_desc:0 "随着越来越多的国家把他们的国民或公民派遣到海外从事贸易活动并长期生活在一起，确定通行的海洋法的基本概念是绝对必要的。诸如“公海”或后来的“主宰海洋”学说为海洋国际法奠定了基础。"
 innovation_eu5_artillery_institution_advance:0 "炮兵应用"
 innovation_eu5_artillery_institution_advance_desc:0 "中国宋王朝所研制的火药成为了火炮发明的先决条件，这一战争器械使用火药作为其火力动能的来源。它的使用对石质城堡与防御工事产生了重大威胁。"
 culture_era_eu5_absolutism:0 "专制主义"
 culture_era_eu5_absolutism_desc:0 "专制主义时代的文化与技术发展。"
 innovation_eu5_government_size_absolutism:0 "忠心的臣僚"
 innovation_eu5_government_size_absolutism_desc:0 "权力集中在统治者手中使他们能够采取更直接的行动，但他们仍然需要下属来执行这些行动。然而，没有实权、并对统治者保持忠诚的下属，对于宫廷来说越多越好，统治者也不必担心内斗或不满。"
 innovation_eu5_absolute_rulership:0 "专制统治"
 innovation_eu5_absolute_rulership_desc:0 "许多人都想在政府中谋得一个职位，但事实上其中大多数人都希望能不劳而获。一种新的、有趣的专制主义思想正在传播，我们可以借此除掉那些寄生虫并独揽大权。"
 innovation_eu5_subject_loyalty_absolutism:0 "绝对忠诚"
 innovation_eu5_subject_loyalty_absolutism_desc:0 "在我们自己的人民中，我们都不容忍任何异议或叛乱，为什么还要纵容我们的属国呢？"
 innovation_eu5_diplomatic_range_age_5:0 "外交使团"
 innovation_eu5_diplomatic_range_age_5_desc:0 "现代政治的复杂性已不再是单靠一个使节能够处理的任务。为了进一步扩展我们的影响力并保护我们在那些遥远国度的利益，我们将向每个国家派遣完整的专业外交官使团。"
 innovation_eu5_spy_construction_absolutism:0 "扩大全球间谍网络"
 innovation_eu5_spy_construction_absolutism_desc:0 "随着世界上各个帝国和机构的不断扩张，我们需要维持间谍活动，以免落后于竞争对手。"
 innovation_eu5_town_rights_abs_advance:0 "辉煌宫廷"
 innovation_eu5_town_rights_abs_advance_desc:0 "作为宫廷所在之地，首都也应沐浴于统治的荣光与壮丽之中。没有任何城镇或城市应在威仪与宏伟程度上与它相较。"
 innovation_eu5_construction_speed_absolutism:0 "建筑工程学"
 innovation_eu5_construction_speed_absolutism_desc:0 "随着时代发展，建筑施工已演变为一门融合多学科方法的系统工程学科，其工艺技术也日益精密复杂。"
 innovation_eu5_food_advance_absolutism:0 "土地专用"
 innovation_eu5_food_advance_absolutism_desc:0 "在近些年之前，土地的所有权及其常规使用，相对来说没太多限制。然而，逐渐出现了一个趋势，人们开始进行特定土地的划界，明确确定专门用于农业的田地的边界和面积。如此，农业生产和效用可以大大加强。"
 innovation_eu5_rgo_size_advance_absolutism:0 "重农主义"
 innovation_eu5_rgo_size_advance_absolutism_desc:0 "经济思想的最新发展，已将重点从以往重商主义的贸易价值，转向了生产过程本身的价值。因此，生产过程正在稳步改善和进步。"
 innovation_eu5_coke_blast_furnace:0 "焦炭高炉"
 innovation_eu5_coke_blast_furnace_desc:0 "这是一种新型高炉，可以使用焦炭而非木炭作为燃料。这种工艺不仅更经济，还能建造更大的熔炉，不过缺点是焦炭比木炭含有更多的杂质，这个问题有待解决。"
 innovation_eu5_central_bank_advance:0 "中央银行"
 innovation_eu5_central_bank_advance_desc:0 "随着银行系统机构的稳固建立，国家现在可以特许设立一座常设的中央银行，并授权其发行game concept government bonds。这些债券使王室能够迅速从私人投资者那里筹集大笔资金，并通过稳定的利息偿还，而不仅仅依赖阶层的贷款。"
 innovation_eu5_merchant_power_from_maritime_absolutism_advance:0 "商会联盟"
 innovation_eu5_merchant_power_from_maritime_absolutism_advance_desc:0 "随着新的商业与经济理念的兴起，地方商人联合组成了商业网络，促进共同利益，并维护他们的权利不受政治实体和外国影响。"
 innovation_eu5_maritime_advance_age_5:0 "护航船队"
 innovation_eu5_maritime_advance_age_5_desc:0 "随着海上贸易的不断扩大，从更远的地方向本土运送的货物越来越多，数量也越来越大，对更稳定的货物流动的需求也随之增加。组织护航贸易船队可以实现贸易船只的稳定航行。"
 innovation_eu5_scientific_revolution_advance:0 "科学革命"
 innovation_eu5_scientific_revolution_advance_desc:0 "近来，数学、物理学、天文学、生物学和化学的发展不仅对我们周围世界的认知提出了挑战，更是彻底改变了我们的世界观。社会正以前所未有的速度进步，每天都有新的科学发现。"
 innovation_eu5_military_revolution_advance:0 "军事革命"
 innovation_eu5_military_revolution_advance_desc:0 "战争从未改变，变的是如何发动战争。最近在军备领域的发展已经证明：旧有的战术模式已经过时，军队在整体上经历了一场巨变。适应这些变化是保持军事强国地位的唯一途径。"
 innovation_eu5_supply_depot_advance_age_5_absolutism:0 "前线仓库"
 innovation_eu5_supply_depot_advance_age_5_absolutism_desc:0 "陆军现在可以在敌方领土内进行更深入和更长时间的作战，因此有必要在靠近陆军的地方建立并维持前线仓库，同时与后方的补给线相连。"
 innovation_eu5_national_sovereignty:0 "国家主权"
 innovation_eu5_national_sovereignty_desc:0 "17世纪上半叶旷日持久的诸多战争导致了以领土完整为基础的国际外交体系的诞生。既非统治者个人也非某些超国家组织，而是国家本身成为了国际舞台的主角，任何国家都无权干涉别国内政。"
 innovation_eu5_newspapers_advance:0 "报纸"
 innovation_eu5_newspapers_advance_desc:0 "以石碑或薄板为载体的公告已存在多时。然而，随着印刷机应用在全球传播，民众对于政治、军事和经济信息的需求日益增加。报纸——一种描述时事的定期出版物——将满足这一需求。"
 innovation_eu5_the_constitution:0 "宪政主义"
 innovation_eu5_the_constitution_desc:0 "一种被称为宪政主义的全新哲学概念逐渐兴起，它主张用法律来限制政府权力。这是一个很有趣的想法，但我们认为它难以广泛接受。"
 innovation_eu5_sanitation_advance:0 "公共卫生"
 innovation_eu5_sanitation_advance_desc:0 "定居点正在投资改进卫生措施，例如废物处理和饮水净化系统。这将减少疾病传播，并改善人口的整体健康状况。现代卫生习惯的发展将使人们能够住得更近而不受疾病的影响。"
 culture_era_eu5_revolutions:0 "大革命"
 culture_era_eu5_revolutions_desc:0 "大革命时代的文化与技术发展。"
 innovation_eu5_modern_bureaucracy:0 "现代官僚"
 innovation_eu5_modern_bureaucracy_desc:0 "为了最大限度地控制我们的土地和臣民，我们必须扩大、重组我们的官僚机构并使之专业化。一个稳健的官僚组织可以掌控我们国家的每一部分，并避免对于发明临时解决方案需要。让我们的大学研究考虑最好最有效地统治和管理方法，并鼓励贵族子弟用笔而不是刀剑来为国家服务。"
 innovation_eu5_crown_power_advance_revolutions:0 "国家主义"
 innovation_eu5_crown_power_advance_revolutions_desc:0 "随着所有权力在君主的铁腕统治下统一起来，全国的臣民都意识到了归属感。无论君主统治的是哪片领土，他们都是国家及人民的一份子。"
 innovation_eu5_subject_income_revolutions_advance:0 "有偿主权论"
 innovation_eu5_subject_income_revolutions_advance_desc:0 "随着我们周围的世界在各个领域发生巨大变化，现在我们比以往任何时候都更能利用有偿契约来换取对属国存续的支持。"
 innovation_eu5_diplomatic_range_age_6:0 "全球大使馆"
 innovation_eu5_diplomatic_range_age_6_desc:0 "随着各个国家试图进一步扩展它们的影响力，世界各国的互相之间的联系比以往更甚。只有在全球范围内建立常驻大使馆，才能使这种相互联系维持下去。"
 innovation_eu5_spy_construction_revolutions:0 "接触异议者"
 innovation_eu5_spy_construction_revolutions_desc:0 "随着新思想和政治制度在我们已确立的世界中传播，我们需要分配资源支持竞争对手国家的这些异议者，并榨取有价值的信息。"
 innovation_eu5_urbanization:0 "城市化"
 innovation_eu5_urbanization_desc:0 "新兴城市为我们的居民提供了新的机会和安全保障，吸引了越来越多的人离开农村农场，填补新兴现代工厂创造的产业岗位。"
 innovation_eu5_construction_speed_revolutions:0 "铸铁结构"
 innovation_eu5_construction_speed_revolutions_desc:0 "随着冶金工艺的进步，特别是锻铁与铸铁技术的革新，诸如支柱、立柱等更为复杂的金属构件得以制造，这显著提升了建筑工程的建设效率。"
 innovation_eu5_rotherham_plough:0 "罗瑟拉姆犁"
 innovation_eu5_rotherham_plough_desc:0 "从罗马帝国以来欧洲的犁基本就没变过样。现在，由于设计上的改进，同样的犁可以更轻，减少了牲畜的工作量，使它们能够干更多的活。"
 innovation_eu5_rgo_size_advance_revolutions:0 "蒸汽机"
 innovation_eu5_rgo_size_advance_revolutions_desc:0 "蒸汽作为一种驱动机器的动力，自古以来就为人所知。然而，直到最近，物理学和数学的最新进展才使更复杂的蒸汽机得以制造出来，从而为更复杂的机器提供动力，人们才充分认识到它的潜力。这使得所有领域的生产力都大大提高。"
 innovation_eu5_hot_blast_furnace:0 "热风高炉"
 innovation_eu5_hot_blast_furnace_desc:0 "焦炭高炉因焦炭杂质问题使得铸铁含有更多杂质，促使了热风技术的发展。此方法不仅显著减少了焦炭使用，从而提高了铁的质量，还可在有原煤资源时直接使用原煤作为燃料，这在冶铁领域是一项重大进步。"
 innovation_eu5_the_gold_standard:0 "金本位"
 innovation_eu5_the_gold_standard_desc:0 "欧洲和中国之间的贸易逆差在欧洲和全世界都造成了白银短缺。如果我们从银本位变为金本位就可以为流通领域提供新的货币并促进贸易发展。"
 innovation_eu5_merchant_power_from_maritime_revolutions_advance:0 "有限公司"
 innovation_eu5_merchant_power_from_maritime_revolutions_advance_desc:0 "特许公司频繁破产催生了一种新型公司，在这种公司中股东的责任被限定在固定金额内，使贸易合伙风险降低，因而更具吸引力。"
 innovation_eu5_maritime_advance_age_6:0 "武装船队"
 innovation_eu5_maritime_advance_age_6_desc:0 "对于任何海盗来说，贸易船队显然都是非常诱人的目标。装满货物和金币的船只是很少有人会放过的战利品。因此，为这些护航船队提供防御武器，以阻止这些袭击至关重要。让贸易船队由护卫舰或其他武装船只陪同，可以确保它们的安全。"
 innovation_eu5_enlightenment_advance:0 "启蒙运动"
 innovation_eu5_enlightenment_advance_desc:0 "在上一个世纪，理性主义和经验主义受到了越来越多的伟大思想家的推崇。理性之光正在缓缓升起，对许多人而言，他们的使命就是马不停蹄地让这束光芒照亮地球的每个角落。"
 innovation_eu5_napoleonic_warfare:0 "拿破仑战术"
 innovation_eu5_napoleonic_warfare_desc:0 "对我们的陆军来说，围攻是一项耗费时间和金钱的任务。与其将精力分散在各个堡垒上，不如集中策略，一举击溃敌军，以赢得战争。"
 innovation_eu5_supply_depot_advance_age_6_revolutions:0 "战役仓库"
 innovation_eu5_supply_depot_advance_age_6_revolutions_desc:0 "多支军队的长期战役对我们的补给系统施加了额外的压力，因此建立规模更大、建造更快的仓库，对于维持补给至关重要。"
 innovation_eu5_rights_of_man:0 "人权"
 innovation_eu5_rights_of_man_desc:0 "如今一种人人平等的激进观点占据着革命思想的最前线。来自各地的哲人们通力合作，起草了一份题名为《人权与公民权宣言》的文件。文件宣称如是种种权利乃是普世价值且应当由法律强制贯彻。这可能会在自由民主领域引起广泛的反响，我们可得好好表现以免落后。"
 innovation_eu5_separation_of_powers:0 "权力分立"
 innovation_eu5_separation_of_powers_desc:0 "一部关于政治理论的匿名论著出现在人们的视野，虽有各方压力对其打压，但仍未能阻止它在世界范围的传播。书中分析了政府形成的本质——无论是君主制，独裁制，还是民主制。该书还提出应将行政权，立法权，司法权严格地分离开来，以保护人民，限制君权，并理所当然受到了我国臣民的欢迎。除了涉及君权的部分以外，这些想法应该会对我们国家大有裨益。"
 innovation_eu5_vaccination_advance:0 "疫苗"
 innovation_eu5_vaccination_advance_desc:0 "随着疫苗的发展，医生能够为民众提供对抗致命疾病的免疫力。这些疫苗有助于减少了疾病的传播，并预防流行病的爆发。通过将少量的减毒或灭活细菌或病毒注射到体内，免疫系统能够识别并在再次遇到这种疾病时将其击退。"
 innovation_eu5_industrialization_advance:0 "工业革命"
 innovation_eu5_industrialization_advance_desc:0 "工业革命的兴起带来的国际性和持久的变革，不仅改变了商业和贸易，也改变了社会结构本身。动力织布机和蒸汽机等发明将推动人类能力达到前所未有的顶峰。"
