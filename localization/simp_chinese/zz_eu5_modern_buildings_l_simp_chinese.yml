 eu5_falconet:0 "早期攻城炮"
 eu5_falconet_flavor:0 "#F 笨重的铸铁与青铜炮架在粗木炮床上，虽装填迟缓、挪移维艰，但只要轰鸣作响，高耸的石砌城墙便会随之崩裂。#!"
 eu5_falconet_desc:0 "架于粗木炮床上的早期重炮，装填迟缓却威力惊人，足以敲碎高耸的中世纪石墙。"
 eu5_chambered_cannon:0 "攻城炮"
 eu5_chambered_cannon_flavor:0 "#F 铸造精良的青铜长管火炮架上了带轮炮车，炮手得以从容校准仰角，日夜不停地将铁弹砸向城垣根基，直到豁口大开。#!"
 eu5_chambered_cannon_desc:0 "配有带轮炮车的青铜攻城炮，能持续轰击城垣要害，逐步砸开可供步兵突入的缺口。"
 eu5_siege_cannon:0 "改良攻城炮"
 eu5_siege_cannon_flavor:0 "#F 口径齐整、炮架坚固的重型攻城炮依章程配给火药与铁弹，成排齐轰之下，纵是厚土夯筑的棱堡也要化作碎石瓦砾。#!"
 eu5_siege_cannon_desc:0 "规格统一的厚壁重炮，装药与弹道更稳，专用于轰塌修筑严密的棱堡工事。"
 eu5_advanced_howitzer:0 "先进攻城炮"
 eu5_advanced_howitzer_flavor:0 "#F 短身大口径的新式攻城炮能以高弧弹道抛射开花弹，越过外濠与护墙直落要塞腹地，将守军连同工事一并炸得粉碎。#!"
 eu5_advanced_howitzer_desc:0 "新式攻城榴弹炮能以高仰角越墙抛射开花弹，摧毁坚固壁垒后方的守军与工事。"
 eu5_early_field_artillery:0 "早期野战炮"
 eu5_early_field_artillery_flavor:0 "#F 较为轻巧的火炮由骡马牵引随军出征，能在旷野上抢先轰鸣，在两军接战前便撕开敌阵的排面。#!"
 eu5_early_field_artillery_desc:0 "随军机动的早期轻型野战炮，可在旷野列阵轰击，扰乱敌军锋线。"
 eu5_field_artillery:0 "野战炮"
 eu5_field_artillery_flavor:0 "#F 配有前车与炮兵班组的野战炮能迅速在阵线翼侧展开，用贴地弹跳的实心铁弹横扫敌军纵队，硝烟所至无人能立。#!"
 eu5_field_artillery_desc:0 "配备专门挽马与炮手的野战炮兵，能迅速在战场展开，以直瞄炮火轰击敌军纵队。"
 eu5_improved_field_artillery:0 "改良野战炮"
 eu5_improved_field_artillery_flavor:0 "#F 轻量化炮管与精密的瞄准螺杆令炮兵得以跟随步骑同步机动；远射实心弹破阵，近喷霰弹如铁雹横扫冲锋的敌军。#!"
 eu5_improved_field_artillery_desc:0 "炮身更轻且配备精确俯仰机构的改良野战炮，兼擅远距轰击与近距霰弹杀伤。"
 eu5_advanced_field_artillery:0 "先进野战炮"
 eu5_advanced_field_artillery_flavor:0 "#F 数十门火炮聚成一处齐声怒吼，炮车纵横驰骋追逐战机；铁弹与开花弹雨点般倾泻在敌军中军之上，未待刀剑相交便已定鼎胜负。#!"
 eu5_advanced_field_artillery_desc:0 "高度机动的新式野战重炮群，能集中猛烈火力压制战场要冲，瓦解敌军主力。"
 eu5_musketeers:0 "火绳枪兵"
 eu5_musketeers_flavor:0 "#F 手持火绳枪的步卒列阵而立，借着火光与浓烟轮番齐射。纵使披挂重甲的步兵，也难挡铅弹迎面洞穿。#!"
 eu5_line_infantry:0 "线列步兵"
 eu5_line_infantry_flavor:0 "#F 经由严苛操练的燧发枪手排成绵延战线，令行禁止地齐射退敌；一旦敌骑逼近，枪口上雪亮的刺刀便化作密不透风的铁刺枪林。#!"
