l_simp_chinese:
 bm_hundred_years_alfonso:0 "阿方索十一世"
 bm_hundred_years_alfonso_subheading:0 "卡斯蒂利亚国王"
 bm_hundred_years_alfonso_desc:0 "阿方索十一世统治卡斯蒂利亚。伊比利亚的诸王与南方的对手之间，和平从来不是理所当然的。"
 bm_hundred_years_ludwig:0 "路德维希四世"
 bm_hundred_years_ludwig_subheading:0 "神圣罗马皇帝"
 bm_hundred_years_ludwig_desc:0 "路德维希四世身为神圣罗马皇帝，必须在诸侯的利益、王朝的抱负与帝国内部的权力关系之间周旋。"
 bm_hundred_years_john:0 "盲王约翰"
 bm_hundred_years_john_subheading:0 "波希米亚国王"
 bm_hundred_years_john_desc:0 "卢森堡的约翰统治波希米亚，也在欧洲各地的政治与战争中扮演角色。他能为家族留下怎样的基业？"
 bm_hundred_years_charles:0 "卡尔"
 bm_hundred_years_charles_subheading:0 "摩拉维亚的继承人"
 bm_hundred_years_charles_desc:0 "卡尔是波希米亚国王约翰之子，已在摩拉维亚拥有领地。他的王朝道路才刚刚展开。"
 bm_hundred_years_casimir:0 "卡齐米日三世"
 bm_hundred_years_casimir_subheading:0 "波兰国王"
 bm_hundred_years_casimir_desc:0 "卡齐米日三世继承波兰王位，需要巩固王国，并处理与周边强国的关系。"
 bm_hundred_years_gediminas:0 "格迪米纳斯"
 bm_hundred_years_gediminas_subheading:0 "立陶宛大公"
 bm_hundred_years_gediminas_desc:0 "格迪米纳斯统治立陶宛，在波罗的海诸族、邻国与十字军势力之间维护大公国的地位。"
 bm_hundred_years_magnus:0 "马格努斯四世"
 bm_hundred_years_magnus_subheading:0 "瑞典与挪威国王"
 bm_hundred_years_magnus_desc:0 "马格努斯四世同时统治瑞典和挪威。维系横跨斯堪的纳维亚的王权，需要应对两国贵族各自的诉求。"
 bm_hundred_years_dusan:0 "斯特凡·杜尚"
 bm_hundred_years_dusan_subheading:0 "塞尔维亚国王"
 bm_hundred_years_dusan_desc:0 "斯特凡·杜尚统治塞尔维亚。巴尔干局势复杂，拜占庭及邻国都是他必须面对的力量。"
 bm_hundred_years_alexander:0 "伊凡·亚历山大"
 bm_hundred_years_alexander_subheading:0 "保加利亚沙皇"
 bm_hundred_years_alexander_desc:0 "伊凡·亚历山大统治保加利亚，在巴尔干各国之间维护沙皇的权威与领土。"
 bm_hundred_years_basarab:0 "巴萨拉布"
 bm_hundred_years_basarab_subheading:0 "瓦拉几亚领主"
 bm_hundred_years_basarab_desc:0 "巴萨拉布统治瓦拉几亚。身处强邻之间，他必须守住自己的地位与家族的未来。"
 bm_hundred_years_andronikos:0 "安德洛尼卡三世"
 bm_hundred_years_andronikos_subheading:0 "拜占庭皇帝"
 bm_hundred_years_andronikos_desc:0 "安德洛尼卡三世统治拜占庭帝国。帝国面对巴尔干与安纳托利亚的对手，需要谨慎维护残存的权威。"
 bm_hundred_years_orhan:0 "奥尔汗"
 bm_hundred_years_orhan_subheading:0 "奥斯曼统治者"
 bm_hundred_years_orhan_desc:0 "奥尔汗领导奥斯曼势力，面对安纳托利亚的邻国与海峡对岸的拜占庭。"
