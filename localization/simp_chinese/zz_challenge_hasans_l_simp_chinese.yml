 challenge_hasan_buzurg:0 "谢赫大哈散"
 challenge_hasan_buzurg_subheading:0 "札剌亦儿的谢赫"
 challenge_hasan_buzurg_desc:0 "伊儿汗国陷入纷争，大哈散掌握美索不达米亚，并在阿塞拜疆拥有领地。面对汗位之争与地方势力，他能否建立持久的统治？"
 challenge_hasan_kuchak:0 "谢赫小哈散"
 challenge_hasan_kuchak_subheading:0 "出班家族的继承者"
 challenge_hasan_kuchak_desc:0 "小哈散出身出班家族，在大不里士和米亚内拥有领地，目前效忠大哈散。在伊儿汗国的纷争中，他能否重振家族势力？"
