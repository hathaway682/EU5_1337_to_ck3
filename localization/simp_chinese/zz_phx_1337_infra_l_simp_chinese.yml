 # --- 1337 时代历史兵士 ---
 phx_maa_english_longbowmen:0 "英格兰长弓手"
 phx_maa_english_longbowmen_flavor:0 "#F 征募自英格兰与威尔士自耕农的精锐射手，手持六尺紫杉战弓，能以疾风暴雨般的破甲箭雨粉碎重装骑兵的冲锋。#!"

 phx_maa_early_janissaries:0 "早期耶尼切里步兵"
 phx_maa_early_janissaries_flavor:0 "#F 奥斯曼王室直属的常备精锐步兵，历经严酷操练与铁血军纪锻造，是奥斯曼战阵中坚不可摧的核心中军。#!"

 phx_maa_teutonic_ordensritter:0 "条顿骑士团重骑"
 phx_maa_teutonic_ordensritter_flavor:0 "#F 身披白袍黑十字战袍的条顿骑士团修士重骑兵，凭借重甲铁骑的雷霆冲阵纵横波罗的海边疆。#!"

 phx_maa_rtr_hand_cannoners:0 "元末明初神机火铳手"
 phx_maa_rtr_hand_cannoners_flavor:0 "#F 装备元末军器局与红巾义军铸造的青铜手铳，以雷霆万钧的火器齐射震慑敌阵并洞穿重步重骑的铁甲。#!"

 phx_maa_mamluk_royal_guard:0 "马穆鲁克皇家禁卫"
 phx_maa_mamluk_royal_guard_flavor:0 "#F 开罗苏丹麾下精挑细选的钦察与切尔克斯皇家马穆鲁克骑兵，自幼修习骑射与重枪战技，驰骋沙漠与沃野皆所向披靡。#!"

 phx_maa_byz_reformed_tagmata:0 "重编帝国塔格马重步"
 phx_maa_byz_reformed_tagmata_flavor:0 "#F 巴列奥略王朝重整编制的帝国禁卫重步兵，融合罗马古典盾墙纪律与中世纪晚期重装战法，扼守帝国关隘与城垣。#!"

 # --- 1337 历史宝物 ---
 phx_art_palaiologoi_diadem_name:0 "巴列奥略皇冠"
 phx_art_palaiologoi_diadem_desc:0 "君士坦丁堡巴列奥略诸帝佩戴的缀珠皇冠，两侧垂落的珍珠冠缨彰显着新罗马绵延不绝的帝国威仪。"

 phx_art_yuan_jade_seal_name:0 "大元传国御玺"
 phx_art_yuan_jade_seal_desc:0 "以温润和田白玉雕琢、盘龙为钮的传国御玺，象征大都大汗受命于天、统御四海的正统皇权。"

 phx_art_sword_of_osman_name:0 "奥斯曼之剑"
 phx_art_sword_of_osman_desc:0 "奥斯曼历代君主即位时佩挂的圣剑，寄托着奥斯曼家族的加齐武德与开疆拓土的天命。"

 phx_art_oriflamme_name:0 "圣丹尼奥里弗兰军旗"
 phx_art_oriflamme_desc:0 "珍藏于圣丹尼修道院的绯红丝绸战旗，唯当法兰西面临存亡决战时由国王亲展于阵前，昭示决死不降之志。"

 phx_art_st_edward_crown_name:0 "圣爱德华王冠"
 phx_art_st_edward_crown_desc:0 "自忏悔者爱德华时代起供奉于威斯敏斯特修道院的加冕古冠，乃英格兰王国至高无上的王权象征。"

 phx_art_charlemagne_regalia_name:0 "查理曼帝国御宝"
 phx_art_charlemagne_regalia_desc:0 "神圣罗马帝国的八角镶宝皇冠与圣传御宝，昭示帝国皇帝承袭查理曼与古罗马凯撒的至高尊荣。"

 phx_art_st_wenceslas_crown_name:0 "圣瓦茨拉夫王冠"
 phx_art_st_wenceslas_crown_desc:0 "献予波希米亚主保圣人圣瓦茨拉夫的黄金王冠，象征波希米亚王室神圣不可侵犯的统绪与主权。"

 phx_art_teutonic_cross_name:0 "条顿大团长黑十字佩徽"
 phx_art_teutonic_cross_desc:0 "以黑珐琅十字嵌于鎏金鹰徽之上的圣徽，由马尔堡大团长佩挂于胸前，象征条顿骑士团十字军统帅之权柄。"

 phx_art_nemanjic_scepter_name:0 "尼曼雅权杖"
 phx_art_nemanjic_scepter_desc:0 "仿照拜占庭皇室规制铸造的鎏金御杖，见证塞尔维亚尼曼雅王朝问鼎巴尔干霸权的雄心。"

 phx_art_al_nasir_sword_name:0 "马穆鲁克苏丹御剑"
 phx_art_al_nasir_sword_desc:0 "为开罗苏丹纳西尔·穆罕默德精锻的大马士革花纹弯刀，刀身错金铭文璀璨，寒锋凌厉无匹。"

 phx_art_mansa_musa_staff_name:0 "曼萨·穆萨黄金权杖"
 phx_art_mansa_musa_staff_desc:0 "以班布克与布雷金矿纯金铸就的王杖，向天下昭示马里曼萨无与伦比的富庶、虔诚与威望。"

 phx_art_gajah_mada_kris_name:0 "加查·马达马来短剑"
 phx_art_gajah_mada_kris_desc:0 "满者伯夷王庭祭炼的波纹短剑，相传与宰相加查·马达一统努山塔拉的帕拉帕誓言紧密相连。"

