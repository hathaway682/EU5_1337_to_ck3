l_simp_chinese:
 # === 故事循环 ===
 story_phx_byz_civil_war:0 "巴列奥略—坎塔库泽诺斯内战"
 story_phx_byz_civil_war_desc:0 "紫袍之争撕裂了君士坦丁堡朝堂，塞萨洛尼基的激进派揭竿而起，外邦列强正虎视眈眈地环伺着疲敝的边疆。"
 phx_byz_civil_war_story_status:0 "帝国正深陷皇室与坎塔库泽诺斯派系的内耗之中。平息动荡并恢复和平，方能终结这场浩劫。"

 # === 宣战理由 ===
 phx_byz_theme_reconquest_cb:0 "帝国军区光复战争"
 PHX_BYZ_THEME_RECONQUEST_WAR_NAME:0 "$ORDER$$FIRST_ADJ$光复$DEFENDER$之战"
 PHX_BYZ_THEME_RECONQUEST_WAR_NAME_BASE:0 "$FIRST_ADJ$$SECOND_NAME$"
 PHX_BYZ_THEME_RECONQUEST_CB_NAME:0 "光复帝国军区"
 phx_byz_theme_reconquest_cb_victory_desc_attacker:0 "你收复了目标帝国军区，在这片故土上恢复罗马帝国的直接统治。"
 phx_byz_theme_reconquest_cb_victory_desc:0 "[attacker.GetShortUIName|U]收复了目标帝国军区，重树罗马双头鹰旗。"
 phx_byz_theme_reconquest_cb_white_peace_desc:0 "战事在僵持中收场，边疆归属未生变动。"
 phx_byz_theme_reconquest_cb_defeat_desc:0 "罗马远征军受挫败退，[attacker.GetShortUIName]被迫支付赔款并损及皇室威望。"
 phx_byz_theme_reconquest_cb_invalidated_desc:0 "因争议领土易主，本次帝国军区光复战争宣告失效。"

 # === 修正（v0.1 + v1.0） ===
 phx_byz_1337_twilight_modifier:0 "巴列奥略暮影"
 phx_byz_1337_twilight_modifier_desc:0 "连年内战、币制贬值与边疆失地令帝国国库捉襟见肘，旧日军区兵制也已难以为继。"
 phx_byz_kantakouzenos_accord_modifier:0 "巴列奥略—坎塔库泽诺斯协约"
 phx_byz_kantakouzenos_accord_modifier_desc:0 "皇室与大统领家族缔结了庄严的政治默契，令君士坦丁堡的元老朝堂重归稳固。"
 phx_byz_dynastic_centralization_modifier:0 "独裁君主的铁腕宫廷"
 phx_byz_dynastic_centralization_modifier_desc:0 "宫廷重新收拢了对豪门派系的直接控制，以严明法度与凌厉威慑维系皇权。"
 phx_byz_theme_reform_modifier:0 "重整帝国军区"
 phx_byz_theme_reform_modifier_desc:0 "整饬一新的军政辖区将地方赋税重新与常备边军和忠直的军区总督紧密相连。"
 phx_byz_imperial_navy_modifier:0 "复兴帝国德罗蒙舰队"
 phx_byz_imperial_navy_modifier_desc:0 "金角湾重开的皇家船坞再度将罗马战船送入马尔马拉海与爱琴海航道。"
 phx_byz_varangian_revived_modifier:0 "重编瓦兰吉卫队"
 phx_byz_varangian_revived_modifier_desc:0 "手执长斧、宣誓效忠的御前卫士再度肃立在布拉赫奈宫的斑岩殿外。"
 phx_byz_anatolian_themes_restored_modifier:0 "光复小亚细亚腹地"
 phx_byz_anatolian_themes_restored_modifier_desc:0 "随着比提尼亚与小亚细亚西部沃野重归罗马治下，帝国再度焕发出勃勃生机。"
 phx_byz_pentarchy_guardian_modifier:0 "五牧首圣统护法"
 phx_byz_pentarchy_guardian_modifier_desc:0 "古老的使徒牧座皆仰望君士坦丁堡，视之为东方基督教世界不可动摇的盾牌。"
 phx_byz_council_union_modifier:0 "东西教会合一使节"
 phx_byz_council_union_modifier_desc:0 "向拉丁西方递出的和解橄榄枝换来了财帛与雇佣兵契约，但修道院与坊间仍暗流涌动。"
 phx_byz_orthodox_bulwark_modifier:0 "正教不破堡垒"
 phx_byz_orthodox_bulwark_modifier_desc:0 "拒绝在教义上妥协的决断赢得了修士、主教与万千臣民对罗马旗帜的赤诚拥护。"
 phx_byz_balkan_march_modifier:0 "固防帝国边区"
 phx_byz_balkan_march_modifier_desc:0 "修葺一新的堡垒、烽燧与边防驻军令此地足以抵御突如其来的边疆叩关。"
 phx_byz_constantinople_renaissance_modifier:0 "万城之女王的复兴"
 phx_byz_constantinople_renaissance_modifier_desc:0 "重修的港湾、兴旺的作坊与归来的学者正为君士坦丁堡的殿堂注入全新生机。"
 phx_byz_morea_despotate_modifier:0 "摩里亚专制公国"
 phx_byz_morea_despotate_modifier_desc:0 "以米斯特拉斯山城为中枢的伯罗奔尼撒皇家采邑，成为维系希腊学术与南疆防务的坚固堡垒。"
 phx_byz_hesychasm_triumph_modifier:0 "静修派的胜利"
 phx_byz_hesychasm_triumph_modifier_desc:0 "阿索斯山与格里高利·帕拉马斯的静修神学在圣索菲亚确立正统，将修士与万民凝为虔诚一心。"
 phx_byz_humanist_inquiry_modifier:0 "帝国人文学院"
 phx_byz_humanist_inquiry_modifier_desc:0 "古典哲学、天文学与修辞学在皇室庇护下蔚然成风，虽招致保守修道院微词，却广纳四方英才。"
 phx_byz_galata_customs_modifier:0 "收复金角湾关税"
 phx_byz_galata_customs_modifier_desc:0 "帝国税吏再度执掌博斯普鲁斯海峡的商船码头，终结了关税财源外流异邦租界的积弊。"
 phx_byz_zealot_unrest_modifier:0 "狂热派公社动乱"
 phx_byz_zealot_unrest_modifier_desc:0 "激进水手与行会工匠据城抗拒豪门地主，令当地赋税征收与兵役征调陷入瘫痪。"
 phx_byz_praetorian_prefectures_modifier:0 "重设禁卫大区总督府"
 phx_byz_praetorian_prefectures_modifier_desc:0 "东方与伊利里库姆两大民政大区的复兴，将欧亚两洲故土重新织入井然有序的罗马官僚体系。"
 phx_byz_theodosian_walls_modifier:0 "修葺一新的狄奥多西城墙"
 phx_byz_theodosian_walls_modifier_desc:0 "新砌的巨石敌楼、疏浚的护城壕与加固的海防堡垒令万城之女王再度固若金汤。"
 phx_byz_civil_war_scar_modifier:0 "王朝内战创痕"
 phx_byz_civil_war_scar_modifier_desc:0 "党争倾轧、庄园遭劫与猜忌横生，持续消耗着罗马帝国的财力与向心力。"

 # === 部队名称 ===
 phx_byz_varangian_regiment_name:0 "帝国瓦兰吉禁卫军团"
 phx_byz_akritai_vanguard_name:0 "赫勒斯滂边防军先锋"
 phx_byz_turkic_mercenary_band_name:0 "比提尼亚突厥雇佣骑兵"
 phx_byz_serbian_mercenary_band_name:0 "瓦尔达尔重甲雇佣兵团"
 phx_byz_loyalist_levies_name:0 "色雷斯勤王民团"

 # === 决议（10项拜占庭决议） ===
 phx_byz_reform_imperial_themes_decision:0 "重整帝国军区体系"
 phx_byz_reform_imperial_themes_decision_desc:0 "昔日的普罗尼亚采邑已渐渐沦为豪门私产，而边疆要塞却日渐缺饷少兵。唯有重新整编核心行省、确立权责分明的军区体制，罗马国家方能摆脱近数十年来的沉疴。"
 phx_byz_reform_imperial_themes_decision_tooltip:0 "整顿帝国核心行省的军政体制，终结1337年以来的财政与军备颓势。"
 phx_byz_reform_imperial_themes_decision_confirm:0 "颁布军区改革金玺诏书"
 phx_byz_reform_imperial_themes_effect_tt:0 "解除“巴列奥略暮影”困局，在帝国内确立重整后的军区行政体制。"

 phx_byz_rebuild_imperial_navy_decision:0 "复兴帝国德罗蒙舰队"
 phx_byz_rebuild_imperial_navy_decision_desc:0 "长久以来，意大利商船竟在我们的海墙之下左右关税，劫掠者更肆无忌惮地横渡海峡。重开金角湾皇家船坞，方能重夺罗马人对狭海航道的掌控。"
 phx_byz_rebuild_imperial_navy_decision_tooltip:0 "重修君士坦丁堡皇家船坞，重建常备罗马舰队。"
 phx_byz_rebuild_imperial_navy_decision_confirm:0 "新舰下水起航"
 phx_byz_rebuild_imperial_navy_effect_tt:0 "振兴君士坦丁堡港务与市区繁荣，大幅增强帝国海上机动与防务能力。"

 phx_byz_reconstitute_varangians_decision:0 "重编瓦兰吉卫队"
 phx_byz_reconstitute_varangians_decision_desc:0 "无论是外敌君王还是篡位逆臣，昔日无不对皇帝麾下宣誓效忠的北方长斧卫士心生敬畏。自远海重新召募久经沙场的武士赴布拉赫奈宫立誓，必将为皇座铸就一把无坚不摧的利刃。"
 phx_byz_reconstitute_varangians_decision_tooltip:0 "在君士坦丁堡重新召募忠于皇帝本人的精锐御前禁卫军团。"
 phx_byz_reconstitute_varangians_decision_confirm:0 "主持瓦兰吉入卫誓礼"
 phx_byz_reconstitute_varangians_effect_tt:0 "在君士坦丁堡编成一支精锐的瓦兰吉卫队与重装铁甲骑兵御前军团。"

 phx_byz_reclaim_anatolian_heartland_decision:0 "宣告光复小亚细亚腹地"
 phx_byz_reclaim_anatolian_heartland_decision_desc:0 "从尼西亚到爱琴海滨，失落的小亚细亚腹地曾数百年来支撑着罗马军队的兵源与粮饷。如今帝国旌旗再度高扬于马尔马拉海与小亚细亚西部之上，万城之女王理当举行一场堪比科穆宁盛世的凯旋大典。"
 phx_byz_reclaim_anatolian_heartland_decision_tooltip:0 "为收复马尔马拉与小亚细亚西部故土举行盛大的帝国凯旋仪式。"
 phx_byz_reclaim_anatolian_heartland_decision_confirm:0 "举行帝国凯旋大典"
 phx_byz_reclaim_anatolian_heartland_effect_tt:0 "宣告小亚细亚军区正式光复，极大提升帝国声望与正统威仪。"

 phx_byz_church_union_council_decision:0 "召开东西教会大公会议"
 phx_byz_church_union_council_decision_desc:0 "来自拉丁西方的使者频频低语，只要君士坦丁堡愿与罗马教廷弥合裂痕，西方的舰队与军饷便会源源而至。然而大教堂内的主教与京城百姓却严正警告：以信仰作筹码，必将动摇帝国的根本魂魄。"
 phx_byz_church_union_council_decision_tooltip:0 "决断帝国是谋求与西方教会外交合一，还是坚守正教传统绝不妥协。"
 phx_byz_church_union_council_decision_confirm:0 "召集圣主教会议"
 phx_byz_church_union_council_effect_tt:0 "开启圣索菲亚大公会议商议，在“西方外交合一”与“坚守正教本色”间做出抉择。"

 phx_byz_restore_pentarchy_authority_decision:0 "确立五牧首圣统威权"
 phx_byz_restore_pentarchy_authority_decision_desc:0 "随着古老的牧首区相继重归罗马庇护，君士坦丁堡、安条克、耶路撒冷、亚历山大里亚与罗马的声望再度彼此呼应，成为稳固基督教世界的磐石。"
 phx_byz_restore_pentarchy_authority_decision_tooltip:0 "向基督教世界宣告罗马皇帝对古老五牧首圣座的护法威权。"
 phx_byz_restore_pentarchy_authority_decision_confirm:0 "颁布五牧首护法宪章"
 phx_byz_restore_pentarchy_authority_effect_tt:0 "确立帝国对已光复五牧首圣座的护法地位，大幅增进正教威望。"

 phx_byz_establish_morea_despotate_decision:0 "建立摩里亚专制公国"
 phx_byz_establish_morea_despotate_decision_desc:0 "巍峨的米斯特拉斯山城俯瞰着欧罗塔斯河谷，直面伯罗奔尼撒半岛上的法兰克城堡。将拉科尼亚升格为正式的皇家专制公国，能令南希腊化作维系罗马武备与文脉的坚固支点。"
 phx_byz_establish_morea_despotate_decision_tooltip:0 "在米斯特拉斯正式设立摩里亚专制公国，强化南希腊统治与学术复兴。"
 phx_byz_establish_morea_despotate_decision_confirm:0 "敕封摩里亚专制公国"
 phx_byz_establish_morea_despotate_effect_tt:0 "建立摩里亚专制公国，加固拉科尼亚防务并增进帝国文治与正统威望。"

 phx_byz_reclaim_galata_customs_decision:0 "废除热那亚加拉塔特权"
 phx_byz_reclaim_galata_customs_decision_desc:0 "金角湾一水之隔的热那亚加拉塔租界城高池深，所收海商关税竟远超皇帝自家的港埠。废除这些不平等的免税特权，方能令商路财源重新回流君士坦丁堡国库。"
 phx_byz_reclaim_galata_customs_decision_tooltip:0 "重申帝国对金角湾的关税主权，收回热那亚商人的免税特权。"
 phx_byz_reclaim_galata_customs_decision_confirm:0 "施行帝国统一关税"
 phx_byz_reclaim_galata_customs_effect_tt:0 "收复金角湾海商关税，充实君士坦丁堡财政，但会激怒热那亚。"

 phx_byz_hesychast_synod_decision:0 "召开布拉赫奈静修派公会议"
 phx_byz_hesychast_synod_decision_desc:0 "从阿索斯山的石窟到君士坦丁堡的讲堂，神学家与学者们正围绕“神圣非受造之光”与人类理性激辩不休。唯有在布拉赫奈宫召集御前公会议，方能为罗马帝国的精神前路一锤定音。"
 phx_byz_hesychast_synod_decision_tooltip:0 "在布拉赫奈宫召开主教公会议，裁定静修派神学与人文思潮之争。"
 phx_byz_hesychast_synod_decision_confirm:0 "主持布拉赫奈公会议"
 phx_byz_hesychast_synod_effect_tt:0 "召开布拉赫奈公会议，让你在静修派正统与帝国人文学院之间做出抉择。"

 phx_byz_restore_praetorian_prefectures_decision:0 "复兴东方与伊利里库姆大区"
 phx_byz_restore_praetorian_prefectures_decision_desc:0 "随着色雷斯、马其顿、伯罗奔尼撒与马尔马拉沿岸重归双头鹰旗之下，帝国已不再满足于权宜守御。重设古老的东方与伊利里库姆禁卫大区总督府，将向天下昭告新罗马的恢弘治世归来。"
 phx_byz_restore_praetorian_prefectures_decision_tooltip:0 "在光复的欧亚核心行省上重建东方与伊利里库姆禁卫大区总督府。"
 phx_byz_restore_praetorian_prefectures_decision_confirm:0 "颁布大区复置诏书"
 phx_byz_restore_praetorian_prefectures_effect_tt:0 "重设东方与伊利里库姆禁卫大区，大幅提升帝国行政能力与皇权威望。"

 # === 事件（24项拜占庭事件） ===
 phx_byz.0001.t:0 "金角湾上的暮色"
 phx_byz.0001.desc:0 "1337年春，罗马帝国四境皆见风雷。马尔马拉海对岸，突厥骑兵正遥望君士坦丁堡的穹顶；瓦尔达尔河畔，塞尔维亚的雄心蠢蠢欲动；而在城内，商贾多以异邦银币交易，皇家度支簿日渐单薄。\n\n然而狄奥多西三重城墙仍巍然屹立，巴列奥略的双头鹰旗仍在布拉赫奈宫迎风猎猎。此番时局究竟是新罗马的落日余晖，还是凤凰涅槃前的星火，全系于你的决断。"
 phx_byz.0001.a:0 "罗马之鹰历经沧桑，岂会折翼于此。"
 phx_byz.0001.b:0 "先修府库与商路，精兵自会随之而来。"

 phx_byz.0010.t:0 "大统领的谋划"
 phx_byz.0010.desc:0 "在布拉赫奈宫幽静的柱廊间，[kantakouzenos.GetTitledFirstName]将色雷斯与马其顿的舆图摊在御前案上。此人豪富博学，又深得边军将领敬重，此刻愿将家族命运与皇座牢牢绑定；但宫廷密语却屡屡提醒你——权势过重的股肱之臣，他日或许反客为主。"
 phx_byz.0010.a:0 "与坎塔库泽诺斯氏立下正式协约，共扶社稷。"
 phx_byz.0010.b:0 "紫袍独尊，皇帝绝不与豪门分权。"

 phx_byz.0015.t:0 "斑岩殿前的暗流"
 phx_byz.0015.desc:0 "先帝的丧钟余音未散，宫廷回廊间便已暗流汹涌。[kantakouzenos.GetTitledFirstName]手握边军声望，自称受先皇托孤重任；而皇室近臣则力劝你先发制人，趁其尚未换上紫靴便彻底罢黜其党羽。"
 phx_byz.0015.a:0 "顺承先帝遗意，册立[kantakouzenos.GetFirstNameNoTooltip]为帝国首席摄政。"
 phx_byz.0015.b:0 "罢黜其党羽——他若觊觎紫袍，便以刀剑决高下！"
 phx_byz_civil_war_averted_tt:0 "以高昂的政治让步避免或平息公开的王朝内战。"
 phx_byz_civil_war_erupts_tt:0 "点燃巴列奥略—坎塔库泽诺斯内战，启动内战故事循环并引发武装夺位交锋。"

 phx_byz.0020.t:0 "赫勒斯滂对岸的烽烟"
 phx_byz.0020.desc:0 "色雷斯沿岸的烽火台接连回报：比提尼亚海滨烟尘四起，[ottoman_ruler.GetTitledFirstName]正在海峡对岸加紧屯兵筑垒。前线将领警告，倘若奥斯曼人在欧洲海岸站稳脚跟，君士坦丁堡的门户便将洞开无遗。"
 phx_byz.0020.a:0 "加固色雷斯城寨与海峡戍望。"
 phx_byz.0020.b:0 "征召边防军先锋，主动出击遏其锐气。"
 phx_byz.0020.c:0 "遣使周旋，先换取一段喘息之机。"

 phx_byz.0030.t:0 "瓦尔达尔河畔的锋芒"
 phx_byz.0030.desc:0 "塞萨洛尼基传回急报：[serbian_king.GetTitledFirstName]正在高地集结重骑。塞尔维亚朝廷对富饶的马其顿平原虎视眈眈，正试探君士坦丁堡是否尚有铁血护持西疆。"
 phx_byz.0030.a:0 "增派重兵固守色雷斯与马其顿边防。"
 phx_byz.0030.b:0 "以同奉正教之谊遣使修好，化干戈为玉帛。"

 phx_byz.0040.t:0 "万城之女王的曙光"
 phx_byz.0040.desc:0 "帝国大道两旁，石匠们重新雕琢起修缮柱廊的新大理石；金角湾的码头在帝国关旗之下千帆云集。学者们再度汇聚于马格瑙拉宫讲学论道，人们口中谈论的不再只是苟全性命，而是罗马的新生。"
 phx_byz.0040.a:0 "愿新罗马的荣光照耀四海！"

 phx_byz.0050.t:0 "塞萨洛尼基的狂热派"
 phx_byz.0050.desc:0 "急报自帝国第二大城疾驰而来：水手、工匠与自称“狂热派”的激进党人冲破塞萨洛尼基的贵族府邸，在港城墙头升起了自己的旗帜。他们痛斥豪门地主祸国殃民，趁着王朝内战之机建起自治公社，拒绝听命于宫廷旧宦。"
 phx_byz.0050.a:0 "暂且承认其市政特许，待大局初定再作图谋。"
 phx_byz.0050.b:0 "派遣御林军强行镇压狂热派公社。"
 phx_byz_zealot_compromise_tt:0 "容忍塞萨洛尼基公社存续数年，避免国库承受额外军费消耗。"
 phx_byz_zealot_crackdown_tt:0 "以铁血手腕缩短动乱时长，但会立即损耗资金并削弱地方控制力。"

 phx_byz.0055.t:0 "与魔鬼的交易"
 phx_byz.0055.desc:0 "随着罗马军团在色雷斯与马其顿陷入骨肉相残，焦灼的谋士开始低声提议借兵域外。海峡对岸，突厥骑兵垂涎罗马金币与渡口据点；北方高地，塞尔维亚重骑愿以兵戈相助，却索求马其顿重镇作为酬报。请狼入室或可解一时之急，却往往贻害百年。"
 phx_byz.0055.a:0 "召引突厥雇佣骑兵渡海助战。"
 phx_byz.0055.b:0 "向北方延请塞尔维亚重装骑兵。"
 phx_byz.0055.c:0 "异邦兵马绝不可踏上罗马大道——全凭本朝义旅！"
 phx_byz_bargain_ottoman_tt:0 "征调突厥雇佣骑兵参战，同时赋予奥斯曼君主金币与达达尼尔海峡宣称。"
 phx_byz_bargain_serbia_tt:0 "征调塞尔维亚重甲骑兵参战，同时赋予塞尔维亚君主威望与马其顿宣称。"

 phx_byz.0060.t:0 "灰烬与紫袍"
 phx_byz.0060.desc:0 "色雷斯满目疮痍的田野上，内战的号角终于归于沉寂。焚毁的磨坊、空荡的粮仓与惊魂未定的贵族府邸见证着骨肉相残的代价，但君士坦丁堡的皇冠总算重归独尊。眼下更艰巨的考验收拾山河，必须赶在四邻瓜分之前弥合帝国创伤。"
 phx_byz.0060.a:0 "颁布大赦诏书，与民休息以兴复帝都。"
 phx_byz.0060.b:0 "抄没叛党家产，以补国库亏空。"

 phx_byz.0065.t:0 "他泊山之光"
 phx_byz.0065.desc:0 "一场剧烈的神学风暴正席卷君士坦丁堡的修道院与廊柱广场。阿索斯山修士格里高利·帕拉马斯宣称，世人可借静修默祷亲见神圣非受造之光；而来自卡拉布里亚的学者巴拉姆与宫廷人文学者则斥之为愚昧妄说。两派如今齐齐上书御前，恳请皇帝裁断。"
 phx_byz.0065.a:0 "支持格里高利·帕拉马斯与阿索斯山静修修士。"
 phx_byz.0065.b:0 "庇护哲学思辨与宫廷古典学术。"

 phx_byz.0070.t:0 "加拉塔的关税阴影"
 phx_byz.0070.desc:0 "登临布拉赫奈宫露台远眺，反差令人刺目：金角湾对岸的热那亚加拉塔码头吊机林立、货栈盈门、堡垒森严；而帝国自家港埠的税吏却只收得寥寥铜钱。京城商贾纷纷陈情，外邦免税特权正将君士坦丁堡的商脉吸干殆尽。"
 phx_byz.0070.a:0 "减免罗马商港税率，将商船重新吸引回我方码头。"
 phx_byz.0070.b:0 "换取一笔现银，暂且续签热那亚商约。"

 phx_byz.0075.t:0 "特拉比松大科穆宁使节"
 phx_byz.0075.desc:0 "一艘悬挂特拉比松金鹰旗的桨帆船停泊在海墙之下，船上走下满载白银、丝绸与谨慎贺词的本都使节。身为1204年远遁黑海的科穆宁后裔，特拉比松君主至今仍自称皇帝——然而小亚细亚共同的强敌令两座希腊宫廷不得不重新对话。"
 phx_byz.0075.a:0 "礼遇本都来使，重兴黑海商贸往来。"
 phx_byz.0075.b:0 "严正申明世间唯有一位真正的罗马皇帝。"

 phx_byz.0080.t:0 "伯罗奔尼撒的回响"
 phx_byz.0080.desc:0 "米斯特拉斯总督送来密信：亚该亚与阿提卡的法兰克领主们正因意大利宗主鞭长莫及与加泰罗尼亚佣兵横行而四分五裂。当地希腊世家私下向君士坦丁堡探询，帝国的鹰旗是否即将翻越泰格托斯山脉，光复伯罗奔尼撒故土。"
 phx_byz.0080.a:0 "重申帝国对摩里亚与希腊本土的合法主权。"
 phx_byz.0080.b:0 "暂且与拉丁领主维持有利可图的海上和约。"

 phx_byz.0085.t:0 "狄奥多西之石"
 phx_byz.0085.desc:0 "御前工匠总管巡查了黄金门至布拉赫奈宫之间的陆墙，呈上神色凝重的勘图。九百载围城炮火、冬霜与地动已令女墙龟裂、外壕淤塞。重修三重城垣需耗费国库巨资——但只要这道石墙尚在，君士坦丁堡便永不陷落。"
 phx_byz.0085.a:0 "不惜工本，令三重城墙重现昔日雄姿。"
 phx_byz.0085.b:0 "仅修补危墙缺口，余资留作野战军饷。"

 phx_byz.0100.t:0 "重整军区金玺诏书"
 phx_byz.0100.desc:0 "朱红御印落定，快马驿使分赴东西各省，送去重新核定的田亩税册与军籍花名。行省总督自此直隶皇廷与度支衙门，长期因采邑割裂而滋生的废弛之风一扫而空。"
 phx_byz.0100.a:0 "法度与纲纪重归罗马天下。"

 phx_byz.0110.t:0 "金角湾新舰出坞"
 phx_byz.0110.desc:0 "在号角齐鸣与神职人员的祝祷声中，崭新的战船顺着修缮一新的皇家船台滑入博斯普鲁斯海峡。紫底金鹰旗再度主宰欧亚之间的咽喉水道。"
 phx_byz.0110.a:0 "让海峡重新铭记它真正的主人。"

 phx_byz.0120.t:0 "布拉赫奈宫前的长斧"
 phx_byz.0120.desc:0 "身披鎏金锁甲、肩扛长柄战斧的新编瓦兰吉卫士列阵于宫廷中庭，齐声敲响盾牌。他们的誓言不系于任何豪门派系，唯独效忠于独裁君主本人。"
 phx_byz.0120.a:0 "由尔等卫护皇室尊严。"

 phx_byz.0130.t:0 "小亚细亚凯旋大典"
 phx_byz.0130.desc:0 "得胜之师高举缴获的敌军旌旗穿过黄金门，沿着帝国大道在万人欢呼中一路行至圣索菲亚大教堂。古老的小亚细亚腹地再度与君士坦丁堡血脉相连。"
 phx_byz.0130.a:0 "荣耀归于永恒的罗马帝国！"

 phx_byz.0140.t:0 "圣索菲亚大公会议"
 phx_byz.0140.desc:0 "圣索菲亚大教堂巍峨的穹顶之下，都主教、元老与西方使节挑灯激辩至深夜。一派主张以教会合一换取拉丁舰队与军饷驰援边疆；另一派则誓言千年礼仪绝不可屈从于一时权宜。"
 phx_byz.0140.a:0 "谋求与西方合一，借外援以解燃眉之急。"
 phx_byz.0140.b:0 "誓守正教正统，绝不以信仰作交易。"
 phx_byz_church_union_west_tt:0 "借由西方外交渠道获得资金与外援，但会引发国内正教阵营的不满。"
 phx_byz_church_union_east_tt:0 "凝聚正教教士与万民之心，稳固帝国信仰防线。"

 phx_byz.0150.t:0 "五牧首圣座之盾"
 phx_byz.0150.desc:0 "携带着银灯与牧首贺信的使节齐聚君士坦丁堡，重申古老使徒圣座之间的共融。在罗马皇权的庇佑之下，东方基督教世界昔日的庄严气象再度巍然矗立。"
 phx_byz.0150.a:0 "五大圣座重归尊荣与同心。"

 phx_byz.0160.t:0 "米斯特拉斯紫袍山城"
 phx_byz.0160.desc:0 "双头鹰锦旗在米斯特拉斯山城迎风舒展，摩里亚专制公国正式领受帝国金玺宪章。修道院、壁画名师与南疆守军齐聚于此，将伯罗奔尼撒锻造成罗马文明的南方明珠。"
 phx_byz.0160.a:0 "愿米斯特拉斯照耀整个希腊世界。"

 phx_byz.0170.t:0 "重掌自家海港"
 phx_byz.0170.desc:0 "帝国铁链横贯金角湾水道，罗马关税官员在战船舰首护卫下逐船查验货单。尽管热那亚使节怒拂衣袖离宫而去，沉甸甸的金币终于再次源源流入新罗马国库。"
 phx_byz.0170.a:0 "君士坦丁堡绝不再于自家港湾俯首称臣。"

 phx_byz.0180.t:0 "布拉赫奈公会议"
 phx_byz.0180.desc:0 "布拉赫奈宫彩绘穹顶之下檀香袅袅，各地主教、阿索斯长老与宫廷哲人屏息静候独裁君主的最终敕令。御前公会议究竟是将静修神学载入圣典，还是庇护古典人文学院的自由探求，将塑造拜占庭数代人的精神格局。"
 phx_byz.0180.a:0 "签署静修派圣谕，奉之为帝国正统教义。"
 phx_byz.0180.b:0 "庇护人文探求，兴办古典学术学院。"
 phx_byz_hesychasm_triumph_tt:0 "确立静修派为官方正教教义，赢得教士与虔诚信众的热烈拥护。"
 phx_byz_humanist_inquiry_tt:0 "推动人文学术与文化革新，但会引起保守神职人员的不满。"

 phx_byz.0190.t:0 "东西两大禁卫大区"
 phx_byz.0190.desc:0 "在布拉赫奈宫大殿上，新任东方大区与伊利里库姆大区总督庄严接过银质墨盒与委任诏书。从马其顿平原到比提尼亚的橄榄林，古典罗马帝国恢弘精密的行政巨轮再度轰然运转。"
 phx_byz.0190.a:0 "横跨两洲，共奉永恒罗马。"
