l_english:
 pmg_piece.0001.t:0 "Debug: Attached Pieces"
 pmg_piece.0001.desc:0 "Forces one set of bone-attached pieces onto this character, ignoring what they are carrying.\n\nIn play these appear only on ILLUSTRIOUS artifacts, and which set you get is decided by the culture of whoever created the piece - so a world dresses each culture consistently and two cultures differ.\n\nWhat to look for: that every slot the set covers is filled, that the pieces sit ON the body rather than through it or beside it, and that they hold up on a fat or muscular character - a bone-attached piece is rigid and does not follow the body's shape, so pieces against the torso swap to a heavier copy from weight 20 and 40 and 60 and 80. Use the weight options to step through them."
 pmg_piece.0001.a:0 "Wear the 'gothic' set"
 pmg_piece.0001.b:0 "Wear the 'lamellar' set"
 pmg_piece.0001.c:0 "Wear the 'sunburst' set"
 pmg_piece.0001.d:0 "Take them off"
 pmg_piece.0001.e:0 "Gain weight (+20)"
 pmg_piece.0001.f:0 "Lose weight (-20)"
