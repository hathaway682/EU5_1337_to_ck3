l_english:
 bm_japan_two_courts:0 "Two Emperors Beneath Heaven"
 bm_japan_two_courts_desc:0 "In 1337, rival emperors claim authority in Japan. The Ashikaga hold power in Kyoto while Emperor Go-Daigo’s Southern Court resists from Yoshino."
 bm_japan_courts_takauji:0 "Ashikaga Takauji"
 bm_japan_courts_takauji_subheading:0 "Pillar of the Northern Court"
 bm_japan_courts_takauji_desc:0 "Takauji commands the strength of the Ashikaga. The Southern Court resists, and the loyalties of the warrior houses remain uncertain."
 bm_japan_courts_tadayoshi:0 "Ashikaga Tadayoshi"
 bm_japan_courts_tadayoshi_subheading:0 "The Shogunate’s Administrator"
 bm_japan_courts_tadayoshi_desc:0 "Takauji’s brother Tadayoshi helps govern the warrior regime, balancing his brother’s authority and the interests of the great houses."
 bm_japan_courts_moronao:0 "Kō no Moronao"
 bm_japan_courts_moronao_subheading:0 "Ashikaga Retainer"
 bm_japan_courts_moronao_desc:0 "A powerful Ashikaga retainer, Moronao must navigate both the war and rivalries within the warrior government."
 bm_japan_courts_doyo:0 "Sasaki Dōyō"
 bm_japan_courts_doyo_subheading:0 "The Basara Daimyō"
 bm_japan_courts_doyo_desc:0 "Also known as Kyōgoku Dōyō, he moves between court and warrior society in an age of opportunity and conflict."
 bm_japan_courts_go_daigo:0 "Emperor Go-Daigo"
 bm_japan_courts_go_daigo_subheading:0 "The Southern Emperor"
 bm_japan_courts_go_daigo_desc:0 "Go-Daigo maintains his court at Yoshino in opposition to the Northern Court at Kyoto. His cause depends on loyal warriors."
 bm_japan_courts_masatsura:0 "Kusunoki Masatsura"
 bm_japan_courts_masatsura_subheading:0 "Heir of the Kusunoki"
 bm_japan_courts_masatsura_desc:0 "Masatsura inherits his father’s cause. The Southern Court needs loyal warriors, and the future of his house remains to be written."
 bm_japan_courts_yoshisada:0 "Nitta Yoshisada"
 bm_japan_courts_yoshisada_subheading:0 "Southern Court Commander"
 bm_japan_courts_yoshisada_desc:0 "Yoshisada supports Go-Daigo against the Ashikaga. Can he turn the war in the Southern Court’s favor?"
 bm_japan_courts_akiie:0 "Kitabatake Akiie"
 bm_japan_courts_akiie_subheading:0 "Commander of Ōu"
 bm_japan_courts_akiie_desc:0 "Akiie holds power in Ōu and is a key Southern Court commander. Distance and powerful enemies stand between him and the court."
 bm_japan_courts_tokiyuki:0 "Hōjō Tokiyuki"
 bm_japan_courts_tokiyuki_subheading:0 "The Elusive Lord"
 bm_japan_courts_tokiyuki_desc:0 "After the fall of the Kamakura shogunate, young Hōjō Tokiyuki survives amid turmoil. How will he restore his family’s fortunes?"
 eu5_regnal_go_daigo:0 "Go-Daigo"
 eu5_regnal_komyo:0 "Kōmyō"
 k_nancho_throne:0 "Southern Court Throne"
