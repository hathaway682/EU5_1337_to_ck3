 #Andean Hydraulic Engineering (tradition definition from RICE, see common/culture/traditions/zz_rice_andean_hydraulic.txt)
 tradition_RICE_andean_hydraulic_engineering_name:0 "Andean Hydraulic Engineering"
 tradition_RICE_andean_hydraulic_engineering_desc:0 "Having lived in the Andean mountains, from more tropical, wetland climates to drier, arid regions, this culture has mastered using irrigation canals, cisterns, snowmelt, and more, to channel water to where it is needed most in rugged terrain."
