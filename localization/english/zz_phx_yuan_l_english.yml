l_english:
 # === Native Situation: The Red Turban Rebellion ===
 situation_phx_red_turban_rebellion:0 "The Red Turban Rebellion"
 situation_phx_red_turban_rebellion_desc:0 "Floods along the Yellow River, ruined paper currency, and bitter factionalism at Dadu threaten to fracture the Great Yuan. From Maitreya secret societies along the Huai to ambitious warlords of the Yangtze delta, All Under Heaven stands on the brink of a dynastic reckoning."
 situation_type_phx_red_turban_rebellion:0 "The Red Turban Rebellion"
 situation_type_phx_red_turban_rebellion_desc:0 "$situation_phx_red_turban_rebellion_desc$"
 phx_red_turban_rebellion:0 "The Red Turban Rebellion"
 phx_red_turban_rebellion_desc:0 "$situation_phx_red_turban_rebellion_desc$"

 phx_red_turban_rebellion_sub_region_core:0 "China Proper & the Central Plains"
 phx_red_turban_rebellion_sub_region_core_desc:0 "The imperial heartland stretching from Dadu and the Yellow River plains to Jiangnan, where Yuan loyalists and Red Turban contenders vie for the Mandate of Heaven."

 # Participant Groups
 phx_red_turban_rebellion_participant_group_phx_rtr_yuan_court:0 "Great Yuan Court & Loyalist Banners"
 phx_red_turban_rebellion_participant_group_phx_rtr_yuan_court_desc:0 "The Emperor of Great Yuan in Dadu, the imperial ministries, and provincial loyalist commanders striving to hold the realm together."
 phx_red_turban_rebellion_participant_group_phx_rtr_northern_turbans:0 "Northern Red Turbans (Han Song)"
 phx_red_turban_rebellion_participant_group_phx_rtr_northern_turbans_desc:0 "Millennial insurgents of the Huai and Central Plains marching beneath Han Shantong, Liu Futong, and the banner of the restored Great Song."
 phx_red_turban_rebellion_participant_group_phx_rtr_southern_contenders:0 "Southern Contenders (Ming, Han & Zhou)"
 phx_red_turban_rebellion_participant_group_phx_rtr_southern_contenders_desc:0 "Ambitious Jiangnan and Yangtze commanders—Zhu Yuanzhang, Xu Shouhui, Chen Youliang, and Zhang Shicheng—contending to build a lasting new dynasty."
 phx_red_turban_rebellion_phx_rtr_yuan_court:0 "Red Turban Crisis #weak ($PARTICIPANT_GROUP$)#!"
 phx_red_turban_rebellion_phx_rtr_northern_turbans:0 "Red Turban Crisis #weak ($PARTICIPANT_GROUP$)#!"
 phx_red_turban_rebellion_phx_rtr_southern_contenders:0 "Red Turban Crisis #weak ($PARTICIPANT_GROUP$)#!"

 # Situation Phases
 phx_rtr_phase_simmering:0 "Simmering Discontent"
 phx_rtr_phase_simmering_desc:0 "Beneath the lacquered halls of Dadu, currency debasement, suspended examinations, and quiet prophecies along the Huai portend a coming storm."
 phx_rtr_phase_flood_spark:0 "Breach & Spark"
 phx_rtr_phase_flood_spark_desc:0 "The Yellow River has burst its banks across Henan. Massive corvee drafts and the omen of the One-Eyed Stone Man ignite uprisings across the plains."
 phx_rtr_phase_warring_factions:0 "Warring Contenders"
 phx_rtr_phase_warring_factions_desc:0 "Imperial authority shatters south of the Yellow River as Great Song, Great Han, Great Zhou, and Zhu Yuanzhang's Huaisi army clash for supremacy."
 phx_rtr_phase_resolution:0 "Mandate Decided"
 phx_rtr_phase_resolution_desc:0 "The decisive struggle for the Central Plains has yielded a clear victor. Exhausted provinces turn at last from upheaval toward restoration."
 phx_red_turban_rebellion_phx_rtr_phase_simmering_situation_phase:0 "$phx_rtr_phase_simmering$"
 phx_red_turban_rebellion_phx_rtr_phase_flood_spark_situation_phase:0 "$phx_rtr_phase_flood_spark$"
 phx_red_turban_rebellion_phx_rtr_phase_warring_factions_situation_phase:0 "$phx_rtr_phase_warring_factions$"
 phx_red_turban_rebellion_phx_rtr_phase_resolution_situation_phase:0 "$phx_rtr_phase_resolution$"

 # Situation Modifier Sets & Parameters
 phx_rtr_realm_effects:0 "Realm & Governance Effects"
 phx_rtr_military_effects:0 "Military & Mobilization Effects"
 situation_parameter_phx_rtr_param_simmering_unrest:0 "Imperial court reforms or Yellow River catastrophes will determine how swiftly open rebellion erupts."
 situation_parameter_phx_rtr_param_flood_spark:0 "Red Turban leaders may unfurl crimson banners and invoke the Red Turban Uprising Casus Belli."
 situation_parameter_phx_rtr_param_warring_contenders:0 "Rival Han kingdoms and Yuan loyalist warlords fight openly across China Proper for ultimate supremacy."
 situation_parameter_phx_rtr_param_mandate_decided:0 "The Mandate of Heaven settles once more over the Central Plains, ushering in reconstruction."

 # Situation Catalysts
 catalyst_phx_rtr_yellow_river_breach:0 "Yellow River Embankments Breached"
 catalyst_phx_rtr_yellow_river_breach_desc:0 "Catastrophic flooding around Kaifeng devastates Henan and shatters confidence in Dadu."
 catalyst_phx_rtr_jialu_corvee_spark:0 "Yellow River Corvee Mobilization"
 catalyst_phx_rtr_jialu_corvee_spark_desc:0 "Tens of thousands of drafted river laborers unearth the One-Eyed Stone Man and spread the rebel prophecy."
 catalyst_phx_rtr_red_banner_raised:0 "Red Turban Banner Unfurled"
 catalyst_phx_rtr_red_banner_raised_desc:0 "An insurgent commander raises crimson standards and rallies disaffected peasants and boatmen."
 catalyst_phx_rtr_contender_seized_base:0 "Contender Seizes Regional Stronghold"
 catalyst_phx_rtr_contender_seized_base_desc:0 "A Red Turban host captures a strategic prefecture along the Huai or Yangtze."
 catalyst_phx_rtr_contender_proclaimed_realm:0 "Rival Chinese Realm Proclaimed"
 catalyst_phx_rtr_contender_proclaimed_realm_desc:0 "A regional warlord claims a dynastic title, drawing China closer to decisive resolution."
 catalyst_phx_rtr_imperial_reform_stabilization:0 "Imperial Reform & Pacification"
 catalyst_phx_rtr_imperial_reform_stabilization_desc:0 "Decisive fiscal reform, canal dredging, or rebel defeat bolsters the authority of the throne."
 catalyst_phx_rtr_dynastic_mandate_decided:0 "New Dynastic Mandate Proclaimed"
 catalyst_phx_rtr_dynastic_mandate_decided_desc:0 "A victorious sovereign ascends the Altar of Heaven to close the age of turmoil."
 catalyst_phx_rtr_northern_retreat:0 "Imperial Court Retires to the Steppe"
 catalyst_phx_rtr_northern_retreat_desc:0 "With Dadu abandoned for Shangdu, the steppe court concedes the southern heartland."

 # === Great Project: Jia Lu's Yellow River Embankment Works ===
 great_project_type_phx_jialu_yellow_river_works:0 "Jia Lu's Yellow River Embankment Works"
 great_project_type_phx_jialu_yellow_river_works_desc:0 "A monumental hydraulic undertaking to divert the raging Yellow River at Kaifeng, seal the broken dikes with stone gabions and willow fascines, and reopen grain arteries to Dadu—even as immense labor drafts kindle unrest across Henan."
 great_project_type_tooltip_phx_jialu_yellow_river_works:0 "Commission master hydraulic engineer Jia Lu's grand embankment works at Kaifeng to seal the Yellow River breach."
 great_project_type_phx_jialu_yellow_river_works_possessive:0 "Jia Lu's Yellow River Works'"
 great_project_type_phx_jialu_yellow_river_works_contribution_stone_gabions:0 "Stone Gabions & Willow Fascines"
 great_project_type_phx_jialu_yellow_river_works_contribution_stone_gabions_desc:0 "Massive bamboo baskets packed with limestone and woven willow bundles needed to anchor the breached dike against the current."
 great_project_type_phx_jialu_yellow_river_works_contribution_corvee_labor_corps:0 "Conscripted River Labor Corps"
 great_project_type_phx_jialu_yellow_river_works_contribution_corvee_labor_corps_desc:0 "Tens of thousands of provincial laborers drafted from Henan and Hebei to excavate the diversion channel."
 great_project_type_phx_jialu_yellow_river_works_contribution_hydraulic_surveyors:0 "Hydraulic Engineers & Sluice Masters"
 great_project_type_phx_jialu_yellow_river_works_contribution_hydraulic_surveyors_desc:0 "Experienced river inspectors and surveyors who align spillways and reinforce embankments for lasting prosperity."

 # === Story Cycles ===
 story_phx_zhu_rise:0 "Rise of the Hongwu Dragon"
 story_phx_zhu_rise_desc:0 "From an orphaned novice and Huaisi insurgent commander to the master of Jinling and contender for All Under Heaven, Zhu Yuanzhang's destiny unfolds step by step."
 STORY_PHX_ZHU_RISE_INFO:0 "Chart Zhu Yuanzhang's ascent from Guo Zixing's camp through the Huaisi inner circle, Poyang Lake, and the Northern Expedition."
 STORY_PHX_ZHU_STAGE_LABEL:0 "Path to the Mandate"
 STORY_PHX_ZHU_STAGE_MIN:0 "Haozhou Camp"
 STORY_PHX_ZHU_STAGE_MAX:0 "Northern Expedition"

 story_phx_yuan_twilight:0 "Twilight of the Great Yuan"
 story_phx_yuan_twilight_desc:0 "From Bayan's regency and the Yellow River flood to Chaghan Temur's loyalist stand and the fate of Dadu, the Borjigin Son of Heaven faces the gravest trial since Kublai."
 STORY_PHX_YUAN_TWILIGHT_INFO:0 "Navigate palace coups, hydraulic catastrophes, Red Turban rebellions, and loyalist armies to save Great Yuan—or secure the Northern Steppe."
 STORY_PHX_YUAN_STAGE_LABEL:0 "Imperial Crisis"
 STORY_PHX_YUAN_STAGE_MIN:0 "Dadu Regency"
 STORY_PHX_YUAN_STAGE_MAX:0 "Fate of Dadu"

 # === Casus Belli ===
 phx_rtr_uprising_seizure_cb:0 "Red Turban Liberation Uprising"
 PHX_RTR_UPRISING_CB_NAME:0 "Red Turban Uprising for [TITLE.GetBaseNameNoTier]"
 PHX_RTR_UPRISING_WAR_NAME:0 "[ATTACKER.GetFirstNamePossessive] Red Turban Uprising for [TITLE.GetBaseNameNoTier]"
 PHX_RTR_UPRISING_WAR_NAME_BASE:0 "Red Turban Uprising"
 phx_rtr_uprising_seizure_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes the targeted Chinese territories, establishing an independent stronghold and shaking Great Yuan's hold over the Central Plains."
 phx_rtr_uprising_seizure_cb_white_peace_desc:0 "Both sides withdraw from the field in an uneasy stalemate, leaving the targeted lands in [defender.GetShortUINamePossessive] hands."
 phx_rtr_uprising_seizure_cb_defeat_desc:0 "[defender.GetShortUIName|U] crushes the insurgent assault, forcing [attacker.GetShortUIName] to pay reparations and bolstering imperial authority."
 phx_rtr_uprising_seizure_cb_invalidated_desc:0 "The targeted territories have changed hands, rendering this uprising moot."

 # === Modifiers (All 20) ===
 phx_yuan_bayan_regency_modifier:0 "Bayan's Iron Regency"
 phx_yuan_bayan_regency_modifier_desc:0 "The Merkid Grand Chancellor rules Dadu with harsh decrees, suspending the civil examinations and deepening distrust across the southern provinces."
 phx_yuan_chao_inflation_modifier:0 "Zhi-Zheng Paper Currency Strain"
 phx_yuan_chao_inflation_modifier_desc:0 "Unrestrained printing of treasury notes erodes commercial confidence and drains real tax revenue from the realm."
 phx_yuan_zhizheng_reforms_modifier:0 "Zhizheng Court Reforms"
 phx_yuan_zhizheng_reforms_modifier_desc:0 "Restored civil examinations, rectified tax rolls, and balanced court appointments breathe fresh order into imperial governance."
 phx_yuan_yellow_river_flood_modifier:0 "Great Yellow River Breach"
 phx_yuan_yellow_river_flood_modifier_desc:0 "Burst embankments have drowned villages and salt roads across the Central Plains, displacing tens of thousands."
 phx_yuan_jialu_waterworks_modifier:0 "Restored Yellow River Dikes"
 phx_yuan_jialu_waterworks_modifier_desc:0 "Re-engineered channels and stone embankments guide the Yellow River back within safe bounds, reviving the plains."
 phx_yuan_northern_retreat_modifier:0 "Continuity of the Northern Steppe"
 phx_yuan_northern_retreat_modifier_desc:0 "With the imperial court withdrawn beyond the passes to Shangdu, mobile banners regroup across the grasslands."
 phx_rtr_red_turban_zeal_modifier:0 "Red Turban Insurgent Zeal"
 phx_rtr_red_turban_zeal_modifier_desc:0 "Fired by millennial hopes and anger against corruption, volunteer bands march under crimson headbands."
 phx_rtr_zhu_virtuous_discipline_modifier:0 "High Walls and Full Granaries"
 phx_rtr_zhu_virtuous_discipline_modifier_desc:0 "Strict military discipline, stocked storehouses, and pragmatic counsel win the trust of gentry and peasants alike."
 phx_rtr_loyalist_banner_modifier:0 "Imperial Pacification Banner"
 phx_rtr_loyalist_banner_modifier_desc:0 "Seasoned provincial commanders and cavalry retinues rally to suppress rebellion and hold the northern passes."
 phx_rtr_new_dynasty_mandate_modifier:0 "Mandate of the New Dynasty"
 phx_rtr_new_dynasty_mandate_modifier_desc:0 "Having restored order across the Central Plains and Jiangnan, a new imperial house commands the loyalty of All Under Heaven."
 phx_rtr_ming_hongwu_admin_modifier:0 "Hongwu Clean Administration"
 phx_rtr_ming_hongwu_admin_modifier_desc:0 "Strict audits of local magistrates, census registers, and disciplined grain taxation forge a remarkably resilient Chinese state."
 phx_rtr_great_han_river_fleet_modifier:0 "Great Han River Armada"
 phx_rtr_great_han_river_fleet_modifier_desc:0 "Towering multi-decked war junks armed with crossbows and fire-tubes project formidable power down the Yangtze."
 phx_rtr_great_zhou_salt_wealth_modifier:0 "Great Zhou Salt Treasury"
 phx_rtr_great_zhou_salt_wealth_modifier_desc:0 "Mastery of Lianghuai saltpans and Suzhou silk looms fills the coffers of a wealthy Jiangnan state."
 phx_rtr_song_maitreya_fervor_modifier:0 "Song Maitreya Fervor"
 phx_rtr_song_maitreya_fervor_modifier_desc:0 "Devotees of the Luminous King march fearlessly across the Central Plains to restore the sacred heritage of Song."
 phx_yuan_koke_iron_guard_modifier:0 "Koke Temur's Iron Guard"
 phx_yuan_koke_iron_guard_modifier_desc:0 "Disciplined northern horsemen led by Chaghan and Koke Temur form the sharpest remaining sword of the Yuan court."
 phx_rtr_poyang_victory_modifier:0 "Poyang Lake Mastery"
 phx_rtr_poyang_victory_modifier_desc:0 "Having shattered rival river armadas amid fire and smoke on Poyang Lake, your veterans command unmatched awe across Jiangnan."
 phx_rtr_huaisi_generals_modifier:0 "Huaisi Generals & Zhedong Sages"
 phx_rtr_huaisi_generals_modifier_desc:0 "Fierce Huaisi battlefield commanders and learned Zhedong advisors work in harmony to forge a conquering regime."
 phx_rtr_northern_expedition_modifier:0 "Northern Expedition Manifesto"
 phx_rtr_northern_expedition_modifier_desc:0 "Stirring proclamations calling for the restoration of the Central Plains energize disciplined columns marching north toward Dadu."
 phx_yuan_grand_canal_restored_modifier:0 "Grand Canal Restored"
 phx_yuan_grand_canal_restored_modifier_desc:0 "Dredged locks and guarded towpaths carry southern tribute grain smoothly northward, enriching prefectural treasuries."
 phx_rtr_nanjing_imperial_capital_modifier:0 "Jinling Imperial Capital"
 phx_rtr_nanjing_imperial_capital_modifier_desc:0 "Backed by Purple Mountain and guarded by the Yangtze, massive stone walls and newly raised palaces mark Yingtian as a seat of emperors."

 # === Spawned Character Names & Regiments ===
 phx_name_li_shanchang:0 "Li Shanchang"
 phx_name_liu_ji:0 "Liu Ji"
 phx_name_xu_da:0 "Xu Da"
 phx_name_chang_yuchun:0 "Chang Yuchun"
