 phx_yuan_koke_cavalry_name:0 "Koke Temur's Iron Cavalry"
 phx_rtr_insurgent_host_name:0 "Red Turban Righteous Army"
 phx_rtr_huaisi_vanguard_name:0 "Huaisi Vanguard Host"
 phx_rtr_great_han_fleet_name:0 "Great Han River Marines"
 phx_rtr_great_zhou_guard_name:0 "Suzhou Salt Guard"
 phx_rtr_great_song_host_name:0 "Great Song Maitreya Host"
 phx_rtr_northern_expedition_host_name:0 "Northern Expedition Vanguard"
 phx_rtr_yingzhou_host_name:0 "Yingzhou Red Turban Host"
 phx_rtr_tianwan_host_name:0 "Tianwan Yangtze Host"
 phx_rtr_salt_rebels_name:0 "Lianghuai Salt-Smuggler Host"

 # === Decisions (All 13 — Pure Narrative Flavor per AGENTS.md) ===
 phx_yuan_zhizheng_reform_decision:0 "Proclaim the Zhizheng Reforms"
 phx_yuan_zhizheng_reform_decision_desc:0 "Factional vendettas, suspended examinations, and debased paper notes have hollowed out the authority of Dadu. By entrusting pragmatic ministers to restore fiscal discipline and recruit capable scholars, the Son of Heaven may steady the realm before rebellion erupts."
 phx_yuan_zhizheng_reform_decision_tooltip:0 "End the rigid regency and currency crisis through comprehensive court reforms."
 phx_yuan_zhizheng_reform_decision_confirm:0 "Promulgate the Reform Edict"
 phx_yuan_zhizheng_reform_effect_tt:0 "Removes Bayan's regency and paper currency penalties, inaugurating the Zhizheng Reforms."

 phx_yuan_tame_yellow_river_decision:0 "Launch the Yellow River Conservation Works"
 phx_yuan_tame_yellow_river_decision_desc:0 "The broken dikes of Henan have turned fertile prefectures into marshland and severed grain transport to the capital. Mobilizing master hydraulic engineers to rebuild the river embankments can heal the floodlands, though massive labor drafts carry risks of unrest."
 phx_yuan_tame_yellow_river_decision_tooltip:0 "Fund major hydraulic engineering works to seal the Yellow River breach at Kaifeng."
 phx_yuan_tame_yellow_river_decision_confirm:0 "Commission the River Works"
 phx_yuan_tame_yellow_river_effect_tt:0 "Repairs the Yellow River breach at Kaifeng and restores imperial confidence across the plains."

 phx_yuan_commission_loyalist_armies_decision:0 "Commission Imperial Pacification Armies"
 phx_yuan_commission_loyalist_armies_decision_desc:0 "As red banners multiply along the Huai and Yangtze, scattered prefectural garrisons can no longer contain the rising tide. Granting plenipotentiary command to loyal provincial warlords and steppe cavalry will forge a decisive striking force."
 phx_yuan_commission_loyalist_armies_decision_tooltip:0 "Raise an imperial pacification army and empower loyalist commanders against the uprisings."
 phx_yuan_commission_loyalist_armies_decision_confirm:0 "Dispatch the Imperial Seals"
 phx_yuan_commission_loyalist_armies_effect_tt:0 "Musters an elite pacification host and strengthens Chaghan Temur and Koke Temur."

 phx_yuan_northern_retreat_decision:0 "Withdraw to Shangdu and Preserve the Steppe"
 phx_yuan_northern_retreat_decision_desc:0 "Should the southern plains and the gates of Dadu fall beyond reach, the lineage of the Great Khans need not perish beneath palace embers. Retiring beyond the passes to the summer capital of Shangdu preserves the banners of the steppe for another generation."
 phx_yuan_northern_retreat_decision_tooltip:0 "Relocate the imperial seat to Shangdu and rally steppe cavalry for long-term survival."
 phx_yuan_northern_retreat_decision_confirm:0 "Ride North to Shangdu"
 phx_yuan_northern_retreat_effect_tt:0 "Moves the realm capital to Shangdu and raises a steppe keshig guard."

 phx_rtr_raise_red_banner_decision:0 "Raise the Red Turban Banner"
 phx_rtr_raise_red_banner_decision_desc:0 "Floods, corvee levies, and official extortion have pushed the people of the Huai and Yangtze past endurance. Tying crimson cloth around their brows, desperate farmers, boatmen, and salt smugglers wait only for a bold leader to light the spark."
 phx_rtr_raise_red_banner_decision_tooltip:0 "Call the disaffected to arms beneath the Red Turban banner and muster an insurgent host."
 phx_rtr_raise_red_banner_decision_confirm:0 "Unfurl the Crimson Banner"
 phx_rtr_raise_red_banner_effect_tt:0 "Musters a Red Turban volunteer army and ignites open rebellion against the Yuan court."

 phx_rtr_high_walls_grain_decision:0 "Build High Walls, Store Grain, Delay the Crown"
 phx_rtr_high_walls_grain_decision_desc:0 "Rival warlords hasten to drape themselves in imperial yellow while their soldiers plunder the countryside. Wise counselors advise a steadier course: fortify your citadels, fill the granaries, curb looting, and let the Mandate ripen before claiming the throne."
 phx_rtr_high_walls_grain_decision_tooltip:0 "Adopt disciplined administration and economic consolidation to outlast rival contenders."
 phx_rtr_high_walls_grain_decision_confirm:0 "Enact the Grand Strategy"
 phx_rtr_high_walls_grain_effect_tt:0 "Strengthens capital growth, administrative order, and popular support across your holdings."

 phx_rtr_proclaim_new_dynasty_decision:0 "Proclaim the Restoration of the Central Plains"
 phx_rtr_proclaim_new_dynasty_decision_desc:0 "With Jiangnan pacified and the northern heartlands secured beneath righteous banners, the era of chaos draws to a close. Ascending the altar of Heaven to announce a new reign will anchor the realm in renewed legitimacy."
 phx_rtr_proclaim_new_dynasty_decision_tooltip:0 "Celebrate the recovery of the Chinese heartland and establish a new dynastic mandate."
 phx_rtr_proclaim_new_dynasty_decision_confirm:0 "Ascend the Altar of Heaven"
 phx_rtr_proclaim_new_dynasty_effect_tt:0 "Confers the Mandate of a New Dynasty and brings the Red Turban Situation to resolution."

 phx_rtr_seize_yingtian_capital_decision:0 "Establish the Imperial Seat at Yingtian"
 phx_rtr_seize_yingtian_capital_decision_desc:0 "Poets and strategists alike have long praised Jinling as the coiling dragon and crouching tiger of the south. Raising massive walls, imperial ministries, and river arsenals at Yingtian turns the city into an unshakable foundation for unifying China."
 phx_rtr_seize_yingtian_capital_decision_tooltip:0 "Move your capital to Yingtian and transform Jinling into a grand fortified imperial city."
 phx_rtr_seize_yingtian_capital_decision_confirm:0 "Raise the Palaces of Jinling"
 phx_rtr_seize_yingtian_capital_effect_tt:0 "Sets Yingtian as your capital, fortifies it as an imperial metropolis, and inaugurates clean administration."

 phx_rtr_recruit_huaisi_generals_decision:0 "Summon the Huaisi Generals & Zhedong Sages"
 phx_rtr_recruit_huaisi_generals_decision_desc:0 "A single sword may win a skirmish, but founding an empire demands both fearless vanguard captains and far-sighted statesmen. Sending envoys across Huaisi camps and Zhedong academies will draw unmatched talent to your banner."
 phx_rtr_recruit_huaisi_generals_decision_tooltip:0 "Recruit renowned Huaisi military commanders and Zhedong master strategists into your inner circle."
 phx_rtr_recruit_huaisi_generals_decision_confirm:0 "Dispatch the Invitations"
 phx_rtr_recruit_huaisi_generals_effect_tt:0 "Draws Li Shanchang, Liu Ji, Xu Da, and Chang Yuchun into your court and strengthens military command."

 phx_rtr_proclaim_great_han_decision:0 "Proclaim the Great Han Empire"
 phx_rtr_proclaim_great_han_decision_desc:0 "With the middle Yangtze and towering river war-junks at your command, the time for hiding behind shadow patrons has passed. Raising the dragon standard of Great Han announces your bid to dominate the entire river valley."
 phx_rtr_proclaim_great_han_decision_tooltip:0 "Claim the imperial banner of Great Han and muster a formidable Yangtze river armada."
 phx_rtr_proclaim_great_han_decision_confirm:0 "Raise the Banner of Great Han"
 phx_rtr_proclaim_great_han_effect_tt:0 "Establishes the Great Han River Armada and raises a veteran Yangtze assault host."

 phx_rtr_proclaim_great_zhou_decision:0 "Proclaim the Great Zhou Realm"
 phx_rtr_proclaim_great_zhou_decision_desc:0 "Suzhou's silk markets and the salt flats of Lianghuai yield wealth unmatched anywhere in the empire. Crowning yourself sovereign of Great Zhou rallies merchants, gentry, and coastal captains behind a prosperous Jiangnan realm."
 phx_rtr_proclaim_great_zhou_decision_tooltip:0 "Proclaim Great Zhou in Jiangnan to harness Lianghuai salt wealth and Suzhou prosperity."
 phx_rtr_proclaim_great_zhou_decision_confirm:0 "Proclaim Great Zhou"
 phx_rtr_proclaim_great_zhou_effect_tt:0 "Unlocks the Great Zhou Salt Treasury, enriches your capital, and raises a Jiangnan garrison army."

 phx_rtr_proclaim_great_song_decision:0 "Proclaim the Great Song Restoration"
 phx_rtr_proclaim_great_song_decision_desc:0 "For generations the people of the Central Plains have remembered the fallen House of Song and awaited the descent of the Luminous King. Raising the Song imperial banner unites devout Red Turban armies in a fervent crusade northward."
 phx_rtr_proclaim_great_song_decision_tooltip:0 "Restore the imperial mantle of Great Song and ignite Maitreya fervor across the northern plains."
 phx_rtr_proclaim_great_song_decision_confirm:0 "Proclaim the Restored Song"
 phx_rtr_proclaim_great_song_effect_tt:0 "Awakens Song Maitreya Fervor and musters a massive northern Red Turban host."

 phx_yuan_grand_canal_dredging_decision:0 "Dredge and Reopen the Grand Canal"
 phx_yuan_grand_canal_dredging_decision_desc:0 "Silted locks and burned granary stations have starved Dadu of southern rice and driven prices skyward. Restoring the Grand Canal from the Huai to the capital revives imperial logistics and steadies the northern prefectures."
 phx_yuan_grand_canal_dredging_decision_tooltip:0 "Clear silted waterways and restore grain shipments along the Grand Canal to Dadu."
 phx_yuan_grand_canal_dredging_decision_confirm:0 "Reopen the Imperial Waterway"
 phx_yuan_grand_canal_dredging_effect_tt:0 "Restores Grand Canal trade across controlled arterial prefectures and stabilizes imperial governance."

 # === Events (All 32 — Pure Narrative Flavor per AGENTS.md) ===
 phx_yuan.0001.t:0 "Shadows Over the Hall of Dadu"
 phx_yuan.0001.desc:0 "In the spring of 1337, the Great Yuan still stretches from the Siberian taiga to the South Sea, yet fissures run beneath the lacquered pillars of Dadu. Paper notes lose their worth in southern markets, ministries quarrel over grain transport, and the iron-willed chancellor [bayan.GetTitledFirstName] dominates the council chamber.\n\nWhether the dynasty renews its Mandate or slides into great upheaval depends on how deftly the throne navigates the coming decade."
 phx_yuan.0001.a:0 "Keep counsel quietly and prepare trustworthy reformers."
 phx_yuan.0001.b:0 "Let firm decrees awe every province into silence."

 phx_yuan.0005.t:0 "Storm Clouds Along the Huai and Yangtze"
 phx_yuan.0005.desc:0 "Across the tea-houses, salt wharves, and market crossroads of 1337, hushed voices speak of rising grain prices, corrupt tax collectors, and omens along the Yellow River. Whether you intend to defend the throne or seize destiny when the old order cracks, this quiet spring will not last forever."
 phx_yuan.0005.a:0 "Watch the horizon closely and prepare for what comes."

 phx_yuan.0010.t:0 "The Fall of the Iron Chancellor"
 phx_yuan.0010.desc:0 "Whispers in the inner palace have matured into a decisive hour. [toghtogha.GetTitledFirstName] and a coalition of imperial confidants urge you to curtail the overmighty regency, reopen the imperial examinations, and reconcile alienated provincial elites before resentment turns to open sedition."
 phx_yuan.0010.a:0 "Support [toghtogha.GetFirstNameNoTooltip] and inaugurate a new era of governance."
 phx_yuan.0010.b:0 "Stand by the old guard—concession breeds only weakness."

 phx_yuan.0020.t:0 "The Yellow River Bursts Its Banks"
 phx_yuan.0020.desc:0 "Courier after courier gallops into Dadu drenched in mud. The Yellow River has shattered its dikes across Henan, submerging towns, washing away salt stores, and choking the Grand Canal. Worse still, laborers along the embankments murmur a strange rhyme: 'A stone man with a single eye will stir the Yellow River, and All Under Heaven shall rise.'"
 phx_yuan.0020.a:0 "Open imperial granaries to feed the displaced."
 phx_yuan.0020.b:0 "Draft emergency labor from the prefectures to plug the breach."
 phx_yuan_yellow_river_unrest_tt:0 "Sparks widespread unrest across the Huai and Yellow River valleys, enabling the Red Turban uprisings and Jia Lu's Yellow River Great Project."

 phx_yuan.0030.t:0 "The One-Eyed Stone Man"
 phx_yuan.0030.desc:0 "The rhyme once whispered in secret now echoes openly through every county town along the Huai and Yangtze. Flood-ruined peasants, disbanded canal laborers, and ambitious strongmen tie strips of crimson cloth around their foreheads, calling for a new age to sweep away corrupt magistrates."
 phx_yuan.0030.a:0 "Bind the red cloth—the hour of reckoning has arrived!"
 phx_yuan.0030.b:0 "Bide our time and gather coin and steel first."

 phx_yuan.0035.t:0 "Crimson Banners Across the South"
 phx_yuan.0035.desc:0 "Urgent dispatches bearing feathered seals pour into the secretariat. Armed hosts wearing red turbans have seized river crossings from Yingzhou to the middle Yangtze, cutting grain barges bound for Dadu and calling upon prefectures to throw off Yuan rule."
 phx_yuan.0035.a:0 "Sound the drums—the Empire shall not yield without a fight!"

 phx_yuan.0100.t:0 "The Zhizheng Edict"
 phx_yuan.0100.desc:0 "Imperial proclamations posted at every prefectural gate announce the restoration of the civil examinations, audits of corrupt treasuries, and renewed support for public granaries. For the first time in a generation, scholars and merchants speak hopefully of Dadu's governance."
 phx_yuan.0100.a:0 "May good governance restore harmony to the realm."

 phx_yuan.0110.t:0 "Waters Returned to Their Course"
 phx_yuan.0110.desc:0 "After months of timber caissons, stone gabions, and tireless engineering, the roaring breach near Kaifeng is finally sealed. Grain barges once again navigate the restored channels toward the capital."
 phx_yuan.0110.a:0 "Heaven favors those who tame the waters."

 phx_yuan.0120.t:0 "Banners of Imperial Pacification"
 phx_yuan.0120.desc:0 "Armed with imperial patents and fresh remounts, loyalist commanders assemble seasoned cavalry across the northern prefectures, swearing to shatter the insurgent hosts and reopen the southern roads."
 phx_yuan.0120.a:0 "Ride swiftly and restore the Emperor's peace."

 phx_yuan.0130.t:0 "Return to the Summer Capital"
 phx_yuan.0130.desc:0 "North of the Great Wall, the wind sweeps across the broad pastures of Shangdu as the imperial standards are raised anew. Though the southern palaces lie behind, the proud horsemen of the steppe remain unbroken."
 phx_yuan.0130.a:0 "The steppe has always been our true fortress."

 phx_yuan.0200.t:0 "A Sea of Crimson Turbans"
 phx_yuan.0200.desc:0 "From river towns and hill camps alike, thousands answer the call, tying bright red cloth around their brows and raising pikes, crossbows, and fire-lances. What began as a whispered prophecy has become a thunderous host."
 phx_yuan.0200.a:0 "Forward—let the old order tremble!"

 phx_yuan.0210.t:0 "Counsel of the Sages"
 phx_yuan.0210.desc:0 "Beneath lantern light, your strategists lay out a patient blueprint: mend city ramparts, protect peasant harvests from plunder, welcome talented scholars, and let rival warlords exhaust themselves grasping prematurely at imperial titles."
 phx_yuan.0210.a:0 "Patience and discipline shall win the realm."

 phx_yuan.0220.t:0 "A New Mandate Beneath Heaven"
 phx_yuan.0220.desc:0 "Incense rises above the circular altar as officials in ceremonial robes bow before the newly proclaimed dynasty. Decades of flood, famine, and war give way to the promise of a unified, rejuvenated Central Plains."
 phx_yuan.0220.a:0 "May this dynasty endure for ten thousand years!"

 phx_yuan.0230.t:0 "The Dragon Coils at Jinling"
 phx_yuan.0230.desc:0 "From the ridges of Purple Mountain down to the bustling wharves of the Yangtze, banners flutter over newly fortified ramparts. Yingtian stands no longer as a provincial garrison, but as an imperial capital poised to command both Jiangnan and the north."
 phx_yuan.0230.a:0 "Here shall our dynasty strike its deepest roots."

 phx_yuan.0240.t:0 "Generals of Huaisi, Sages of Zhedong"
 phx_yuan.0240.desc:0 "Battle-scarred captains from the Huai valley stand shoulder to shoulder with Confucian scholars summoned from the hills of Zhedong. Together they swear to replace aimless banditry with disciplined conquest and lawful rule."
 phx_yuan.0240.a:0 "With both brush and blade united, none can withstand us."

 phx_yuan.0250.t:0 "War-Junks of the Great Han"
 phx_yuan.0250.desc:0 "Drums thunder along the misty reaches of Wuchang and Jiujiang as red-lacquered tower-ships unfurl the imperial standard of Great Han. From river towns to mountain passes, rival commanders eye your rising armada with dread."
 phx_yuan.0250.a:0 "Who controls the Yangtze commands All Under Heaven!"

 phx_yuan.0260.t:0 "Silk and Salt of the Great Zhou"
 phx_yuan.0260.desc:0 "Bells ring across Suzhou's canals as merchant guilds, salt-fleet captains, and Jiangnan notables acclaim the birth of Great Zhou. Overflowing granaries and silver treasuries proclaim a realm built upon prosperity."
 phx_yuan.0260.a:0 "Let Suzhou flourish while others bleed themselves dry."

 phx_yuan.0270.t:0 "The Luminous King Restores the Song"
 phx_yuan.0270.desc:0 "Smoke of sandalwood and white-lotus incense drifts above tens of thousands of kneeling soldiers. Proclaiming the restoration of Great Song, your banners vow to sweep across the Yellow River and cast down the northern court."
 phx_yuan.0270.a:0 "The Luminous King has descended—march northward!"

 phx_yuan.0280.t:0 "A Thousand Grain Barges Sail North"
 phx_yuan.0280.desc:0 "Sluice gates creak open along the newly dredged Grand Canal as heavily laden tribute junks glide once more toward Dadu. Markets calm, imperial granaries fill, and provinces whisper that the old dynasty may yet endure."
 phx_yuan.0280.a:0 "As long as the canal flows, the throne stands firm."

 phx_yuan.0300.t:0 "Haozhou's Crimson Camp & Lady Ma"
 phx_yuan.0300.desc:0 "Amid famine and wandering smoke along the Huai, the insurgent commander [guo_zixing.GetTitledFirstName] recognizes steel behind your quiet bearing. Within his camp stands his adopted daughter [lady_ma.GetFirstName], praised by all for her steady wisdom and compassion in hard times."
 phx_yuan.0300.desc_fallback:0 "Amid famine and wandering smoke along the Huai, veteran Red Turban commanders at Haozhou recognize steel behind your quiet bearing and offer an alliance sealed by marriage and shared counsel."
 phx_yuan.0300.a:0 "Join the Haozhou banner and seal the marriage alliance."
 phx_yuan.0300.b:0 "Remain beholden to no master and forge my own path."

 phx_yuan.0305.t:0 "Out of the Huai: Striking for a Stronghold"
 phx_yuan.0305.desc:0 "Refugees, blacksmiths, and village elders crowd your encampment as Yuan garrisons along the Huai falter. Your captains point eagerly toward the walled cities of Fengyang and Chuzhou: seize a firm base now, or forever remain a wandering rebel band."
 phx_yuan.0305.a:0 "Raise the banners and storm Fengyang!"
 phx_yuan.0305.b:0 "Drill the recruits further before crossing swords with Dadu."

 phx_yuan.0310.t:0 "Pillars of a Future Empire"
 phx_yuan.0310.desc:0 "Word of your iron discipline and refusal to plunder villages has crossed rivers and mountain passes. Four extraordinary men arrive to pledge their service: the shrewd administrator Li Shanchang, the visionary strategist Liu Ji, the steadfast commander Xu Da, and the fearless vanguard warrior Chang Yuchun."
 phx_yuan.0310.a:0 "Welcome them into the inner council—with such men, Heaven itself is within reach!"
 phx_yuan_0310_recruited_tt:0 "Recruits Li Shanchang, Liu Ji, Xu Da, and Chang Yuchun into your court with steadfast loyalty."

 phx_yuan.0315.t:0 "Crossing the Yangtze at Caishi"
 phx_yuan.0315.desc:0 "Across the broad gray waters of the Yangtze rise the mist-wrapped hills of Jinling. Scouts report that the river ferries at Caishi can be seized in a single swift crossing, opening the road straight to the walls of Yingtian."
 phx_yuan.0315.a:0 "Board the riverboats—Jinling shall be ours!"
 phx_yuan.0315.b:0 "Secure the northern shore before risking the crossing."

 phx_yuan.0320.t:0 "Fire Ships Over Poyang Lake"
 phx_yuan.0320.desc:0 "Towering war-junks chained hull to hull darken the horizon of Poyang Lake as [chen_youliang.GetTitledFirstName] leads the Great Han armada eastward. Outnumbered in heavy vessels, your captains eye the shifting northeast wind and prepare swift fire-barges loaded with reeds, oil, and black powder."
 phx_yuan.0320.desc_fallback:0 "Towering war-junks chained hull to hull darken the horizon of Poyang Lake as the rival Yangtze armada bears down eastward. Outnumbered in heavy vessels, your captains eye the shifting northeast wind and prepare swift fire-barges loaded with reeds, oil, and black powder."
 phx_yuan.0320.a:0 "Ride the northeast wind and unleash the fire-ships!"
 phx_yuan.0320.b:0 "Seal the Hukou narrows and strangle their supply lines."

 phx_yuan.0325.t:0 "The Gates of Suzhou Beckon"
 phx_yuan.0325.desc:0 "With the middle Yangtze contested or broken, only the prosperous canals and silk cities of Wu remain between your realm and complete mastery of the south. Your generals urge a decisive campaign toward Suzhou and Hangzhou."
 phx_yuan.0325.a:0 "Prepare the siege trains for Suzhou and Zhejiang."
 phx_yuan.0325.b:0 "Win over the Jiangnan gentry through trade and leniency."

 phx_yuan.0330.t:0 "The Northern Expedition Manifesto"
 phx_yuan.0330.desc:0 "Beneath fluttering banners on the riverbank, heralds read your grand manifesto to assembled divisions and weeping townsfolk alike: 'Expel the northern court, restore China, establish righteous laws, and deliver the people from distress.' The road to Kaifeng and Dadu lies open."
 phx_yuan.0330.a:0 "Sound the trumpets—march north to reclaim the Central Plains!"
 phx_yuan.0330.b:0 "Pause to restock granaries before the final campaign."

 phx_yuan.0340.t:0 "Iron Cavalry of the Loyalist Banners"
 phx_yuan.0340.desc:0 "While southern prefectures slip into flames, the formidable northern commanders [chaghan_temur.GetTitledFirstName] and [koke_temur.GetTitledFirstName] assemble disciplined cavalry corps across Henan and Shanxi, offering Dadu its fiercest shield against the Red Turban tide."
 phx_yuan.0340.desc_fallback:0 "While southern prefectures slip into flames, loyal northern generals across Henan and Shanxi assemble disciplined cavalry corps, offering Dadu its fiercest shield against the Red Turban tide."
 phx_yuan.0340.a:0 "Grant them imperial authority and reinforce their iron guard."
 phx_yuan.0340.b:0 "Keep provincial warlords on a short leash lest they overshadow the throne."

 phx_yuan.0350.t:0 "Jia Lu's Dikes Hold—Yet Fire Burns Below"
 phx_yuan.0350.desc:0 "Cheers echo along the newly raised stone dikes of Kaifeng as the Yellow River surrenders at last to Jia Lu's channels. Yet even as court scribes celebrate the feat, anxious officers whisper of a one-eyed stone statue unearthed in the mud—and of thousands of exhausted laborers slipping away into the night with red bands tied around their brows."
 phx_yuan.0350.a:0 "Celebrate the engineering triumph and watch the Huai closely."
 phx_yuan.0350.b:0 "Distribute extra silver and grain to calm the returning laborers."
 phx_yuan_0350_labor_spark_tt:0 "Though Kaifeng's flood is conquered, resentment among conscripted laborers fuels the Red Turban flame."

 phx_yuan.0360.t:0 "White Lotus Smoke Over Yingzhou"
 phx_yuan.0360.desc:0 "Under cover of night along the Huai, [liu_futong.GetTitledFirstName] and thousands of oath-bound followers light incense, bind crimson cloth across their foreheads, and proclaim that the Luminous King has come to restore the House of Song. The prefectural gates of Bozhou stand within striking distance."
 phx_yuan.0360.desc_fallback:0 "Under cover of night along the Huai, thousands of oath-bound followers light incense, bind crimson cloth across their foreheads, and proclaim that the Luminous King has come to restore the House of Song. The prefectural gates of Bozhou stand within striking distance."
 phx_yuan.0360.a:0 "Strike Bozhou and ignite the northern uprising!"
 phx_yuan.0360.b:0 "Preach the coming age quietly until our numbers double."

 phx_yuan.0370.t:0 "Storm on the Middle Yangtze"
 phx_yuan.0370.desc:0 "From Qishui to the river crossings of Wuchang, restless boatmen and ironworkers rally to the crimson banner of Tianwan. Yet at your shoulder, the ambitious captain [chen_youliang.GetTitledFirstName] watches every victory with calculating eyes, dreaming already of an empire of his own."
 phx_yuan.0370.desc_fallback:0 "From Qishui to the river crossings of Wuchang, restless boatmen and ironworkers rally to the crimson banner of Tianwan, while ambitious lieutenants eye the river forts and dream of founding an empire of their own."
 phx_yuan.0370.a:0 "Unleash the river hosts upon Wuchang!"
 phx_yuan.0370.b:0 "Rein in overmighty lieutenants before marching farther."

 phx_yuan.0380.t:0 "The Eighteen Salt Captains Rise"
 phx_yuan.0380.desc:0 "Pushed to breaking by oppressive salt monopolies and corrupt Yuan inspectors, eighteen hardened boat-captains gather around your banner along the coastal flats of Gaoyou. With silver in your chests and river barges ready, the wealthy city of Suzhou beckons across the delta."
 phx_yuan.0380.a:0 "Burn the tax ledgers and strike for Suzhou!"
 phx_yuan.0380.b:0 "Smuggle more silver and weapons before declaring open war."

 phx_yuan.0390.t:0 "Night Flight Beyond the Passes"
 phx_yuan.0390.desc:0 "Smoke rises over the southern approaches as the walls of Dadu slip from Borjigin hands. In the chill before dawn, imperial guards saddle swift steppe horses at the northern gate, ready to escort the Son of Heaven back across the passes toward Shangdu and the unconquered grasslands."
 phx_yuan.0390.a:0 "Ride north to Shangdu—the lineage of the Great Khans endures!"
 phx_yuan.0390.b:0 "Swear an oath upon the steppe winds to reclaim Dadu!"
