l_english:
 gen_struggle_0:0 "The Quarrel of Petchick-Bukon"
 gen_struggle_0_desc:0 "Petchick-Bukon has never belonged to one people. Muskogee, Chickasaw Choctaw, Timucua, Cherokee, Haudenosaunee, Wendat, Iroquoian, Lenape, Massachusett, Dhegiha, Myaamia, Chiwere, Tutelo, Abenakian, Powhatan, Shawnee, Anishinabe, Natchez, Skarureh, Kentaientonga, Honniasont, Erielhonan and Dakota all count it home, and none of them can hold it alone. They do not share a faith either: Elkonnowa, Chandaninha, Voihigue, Quigaoguiha, Whitsari, Waslondhe, Saseskinan, Tsta, Nejupogus, Karnenay and Pakurdy all claim ground here. Every generation decides again whether that means killing or living alongside."
 gen_struggle_0_phase_concord:0 "The Quiet Years"
 gen_struggle_0_phase_concord_desc:0 "For now, Muskogee, Chickasaw Choctaw, Timucua, Cherokee, Haudenosaunee, Wendat, Iroquoian, Lenape, Massachusett, Dhegiha, Myaamia, Chiwere, Tutelo, Abenakian, Powhatan, Shawnee, Anishinabe, Natchez, Skarureh, Kentaientonga, Honniasont, Erielhonan and Dakota are neighbours rather than rivals. Marriages cross the old lines, and a stranger would need telling that there was ever a quarrel here."
 gen_struggle_0_phase_accommodation:0 "Wary Ground"
 gen_struggle_0_phase_accommodation_desc:0 "Too much blood, too recently. Nobody trusts anybody, but the wars have grown expensive enough that the borders are being respected on purpose."
 gen_struggle_0_phase_ambition:0 "Opportunity"
 gen_struggle_0_phase_ambition_desc:0 "The killing has stopped and the coveting has not. Old claims are dusted off, quiet arrangements are made, and everyone waits to see who moves first."
 gen_struggle_0_phase_bloodshed:0 "Open Enmity"
 gen_struggle_0_phase_bloodshed_desc:0 "Grievance has outrun memory. Muskogee, Chickasaw Choctaw, Timucua, Cherokee, Haudenosaunee, Wendat, Iroquoian, Lenape, Massachusett, Dhegiha, Myaamia, Chiwere, Tutelo, Abenakian, Powhatan, Shawnee, Anishinabe, Natchez, Skarureh, Kentaientonga, Honniasont, Erielhonan and Dakota raid, seize and settle scores in the open, and outsiders who take land here find it ungovernable."
 gen_struggle_0_ending_dominance_decision:0 "Dominion over Petchick-Bukon"
 gen_struggle_0_ending_dominance_decision_desc:0 "The question of who Petchick-Bukon belongs to has an answer, and it is you. The other claimants are not gone — nobody in a quarrel this old is ever quite gone — but they answer to your court now, and the arguing has moved indoors. What your house does with that is its own business; the struggle is over."
 gen_struggle_0_ending_dominance_decision_tooltip:0 "End the struggle by holding the region against all comers."
 gen_struggle_0_ending_dominance_decision_confirm:0 "End the Quarrel of Petchick-Bukon"
 gen_struggle_0_ending_dominance_decision_phase_tt:0 "The struggle is in open enmity, or you completely control Petchick-Bukon"
 gen_struggle_0_ending_dominance_decision_hold_tt:0 "You hold at least half the counties of Petchick-Bukon"
 gen_struggle_0_ending_dominance_decision_rivals_tt:0 "No other involved ruler holds more than a quarter of Petchick-Bukon"
 gen_struggle_0_ending_status_quo_decision:0 "The Standing Truce"
 gen_struggle_0_ending_status_quo_decision_desc:0 "Nothing was settled. Muskogee, Chickasaw Choctaw, Timucua, Cherokee, Haudenosaunee, Wendat, Iroquoian, Lenape, Massachusett, Dhegiha, Myaamia, Chiwere, Tutelo, Abenakian, Powhatan, Shawnee, Anishinabe, Natchez, Skarureh, Kentaientonga, Honniasont, Erielhonan and Dakota still want what they always wanted, and the borders still run where they ran when their grandfathers drew them. What changed is the arithmetic: taking one more valley now costs more than the valley is worth, and everybody has quietly worked that out at once."
 gen_struggle_0_ending_status_quo_decision_tooltip:0 "End the struggle by outlasting it. Nobody wins; the borders stand."
 gen_struggle_0_ending_status_quo_decision_confirm:0 "End the Quarrel of Petchick-Bukon"
 gen_struggle_0_ending_status_quo_decision_phase_tt:0 "The struggle is in wary peace"
 gen_struggle_0_ending_status_quo_decision_hold_tt:0 "You hold less than half the counties of Petchick-Bukon"
 gen_struggle_0_ending_status_quo_decision_rivals_tt:0 "No other involved ruler holds more than half of Petchick-Bukon"
 gen_struggle_0_ending_status_quo_decision_peace_tt:0 "No two involved independent rulers are at war with each other"
 gen_struggle_0_ending_concord_decision:0 "The Reconciling"
 gen_struggle_0_ending_concord_decision_desc:0 "A traveller through Petchick-Bukon would need telling that there had ever been a quarrel. Muskogee, Chickasaw Choctaw, Timucua, Cherokee, Haudenosaunee, Wendat, Iroquoian, Lenape, Massachusett, Dhegiha, Myaamia, Chiwere, Tutelo, Abenakian, Powhatan, Shawnee, Anishinabe, Natchez, Skarureh, Kentaientonga, Honniasont, Erielhonan and Dakota marry each other, bury each other, and argue about taxes rather than about ancestry. The old grievance has not been forgiven so much as forgotten, which lasts considerably longer."
 gen_struggle_0_ending_concord_decision_tooltip:0 "End the struggle by making its peoples one another's kin."
 gen_struggle_0_ending_concord_decision_confirm:0 "End the Quarrel of Petchick-Bukon"
 gen_struggle_0_ending_concord_decision_phase_tt:0 "The struggle is in concord"
 gen_struggle_0_ending_concord_decision_hold_tt:0 "You hold less than half the counties of Petchick-Bukon"
 gen_struggle_0_ending_concord_decision_allies_tt:0 "Every other involved independent ruler is your ally or thinks well of you"
 gen_struggle_0_ending_foothold_decision:0 "A Foothold in Petchick-Bukon"
 gen_struggle_0_ending_foothold_decision_desc:0 "None of it was ever your quarrel. Muskogee, Chickasaw Choctaw, Timucua, Cherokee, Haudenosaunee, Wendat, Iroquoian, Lenape, Massachusett, Dhegiha, Myaamia, Chiwere, Tutelo, Abenakian, Powhatan, Shawnee, Anishinabe, Natchez, Skarureh, Kentaientonga, Honniasont, Erielhonan and Dakota had been at it for generations before your banners came over the border, and the argument does not end because anybody was persuaded — it ends because the ground it was about is yours, and the men who would carry it on now answer to your sheriffs. They will remember this differently than you will."
 gen_struggle_0_ending_foothold_decision_tooltip:0 "End the struggle from outside it, by taking enough of the region that the quarrel is no longer the locals' to have."
 gen_struggle_0_ending_foothold_decision_confirm:0 "End the Quarrel of Petchick-Bukon"
 gen_struggle_0_ending_foothold_decision_phase_tt:0 "The struggle is in open enmity or in restless ambition"
 gen_struggle_0_ending_foothold_decision_outsider_tt:0 "You take no part in the struggle, and your seat lies outside Petchick-Bukon"
 gen_struggle_0_ending_foothold_decision_hold_tt:0 "You hold at least a third of the counties of Petchick-Bukon"
 gen_struggle_0_ending_foothold_decision_seat_tt:0 "You completely control a duchy of Petchick-Bukon, and have held it for 15 years"

