l_english:
 great_project_type_eu5_colonial_enterprise:0 "Colonial Enterprise"
 great_project_type_tooltip_eu5_colonial_enterprise:0 "Establish a colonial republic in the wilderness."
 great_project_type_eu5_colonial_enterprise_contribution_settlement:0 "Establish Settlements"
 great_project_type_eu5_colonial_enterprise_contribution_settlement_desc:0 "A merchant finances the colony and receives its wilderness counties upon completion. The merchant also receives the duchy if it is unheld or held by the project owner; otherwise, a new duchy-tier republic title is created."
 great_project_type_eu5_colonial_enterprise_contribution_supplies:0 "Supplies and Trade"
 great_project_type_eu5_colonial_enterprise_contribution_supplies_desc:0 "Finance supplies and trade, increasing tax in the target duchy. Merchant contributors become patricians of the colonial republic."
 great_project_type_eu5_colonial_enterprise_contribution_settlers:0 "Recruit Settlers"
 great_project_type_eu5_colonial_enterprise_contribution_settlers_desc:0 "Finance migration, increasing prosperity growth in the target duchy. Merchant contributors become patricians of the colonial republic."
 great_project_type_eu5_colonial_enterprise_contribution_defenses:0 "Colonial Defenses"
 great_project_type_eu5_colonial_enterprise_contribution_defenses_desc:0 "Finance defenses, increasing control growth in the target duchy. Merchant contributors become patricians of the colonial republic."
 eu5_colonial_supplies_modifier:0 "Colonial Supplies"
 eu5_colonial_settlers_modifier:0 "Colonial Settlers"
 eu5_colonial_defenses_modifier:0 "Colonial Defenses"
 great_project_type_eu5_colonial_enterprise_desc:0 "Distant frontiers beckon. With careful preparation and sufficient investment, even the most barren lands can become a haven for our settlers. Merchants who have amassed great wealth through trade are always eager to finance such ventures, turning their riches into land and power."
 eu5_new_world_discovery.0002.t:0 "News of a New World"
 eu5_new_world_discovery.0002.desc:0 "News from beyond the Atlantic spreads across Europe: sailors have reached distant lands. The ocean is no longer merely a boundary, but a road to unknown shores.\n\nThe holders of Castile and Portugal, if any, gain charts of the whole of the Americas. Rulers with capitals in Europe and coastal land may launch colonial projects in discovered overseas wilderness duchies once their culture knows Pilot Books."
 eu5_new_world_discovery.0002.a:0 "New opportunities await across the sea."
 eu5_colonial_enterprise_duchy_available_tt:0 "No colonial enterprise is being planned or built in this duchy"
 eu5_chart_seas_decision:0 "Send an Expedition of Discovery"
 eu5_chart_seas_decision_desc:0 "Once your culture knows Pilot Books, finance a year-long voyage to chart an overseas region. The chart is recorded on your primary title."
 eu5_chart_seas_decision_tooltip:0 "Spend 150 gold to chart a region for overseas colonization."
 eu5_chart_seas_decision_confirm:0 "Choose a route"
 eu5_colonial_target_valid_tt:0 "The duchy must contain wilderness and have no active colonial project. Overseas colonization also requires Pilot Books and a chart of the target region."
 eu5_colonial_exploration.0001.t:0 "Sailing into the Unknown"
 eu5_colonial_exploration.0001.desc:0 "Our ships are ready. Choose an uncharted region; the voyage will take one year and cost 150 gold."
 eu5_colonial_exploration.0001.cancel:0 "Perhaps another time."
 eu5_colonial_exploration.0003.t:0 "The Expedition Returns"
 eu5_colonial_exploration.0003.desc:0 "Our expedition has returned with new charts. We may now plan colonial projects on wilderness coasts in the discovered region."
 eu5_colonial_exploration.0003.a:0 "Unroll the charts."
 eu5_colonial_exploration.0001.europe:0 "European coasts"
 eu5_colonial_exploration.0001.africa:0 "African coasts"
 eu5_colonial_exploration.0001.asia:0 "Asian coasts"
 eu5_colonial_exploration.0001.north_america:0 "North America and the Caribbean"
 eu5_colonial_exploration.0001.south_america:0 "South America"
 eu5_colonial_exploration.0001.oceania:0 "Oceania"
 eu5_colonial_exploration.0001.atlantic:0 "Atlantic islands"
