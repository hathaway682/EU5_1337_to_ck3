l_english:
 great_project_type_eu5_colonial_enterprise:0 "Colonial Enterprise"
 great_project_type_tooltip_eu5_colonial_enterprise:0 "Establish a colonial republic in the wilderness."
 great_project_type_eu5_colonial_enterprise_contribution_settlement:0 "Establish Settlements"
 great_project_type_eu5_colonial_enterprise_contribution_settlement_desc:0 "Finance settlements and attract pioneers willing to build a new life on the frontier."
 great_project_type_eu5_colonial_enterprise_contribution_supplies:0 "Supplies and Trade"
 great_project_type_eu5_colonial_enterprise_contribution_supplies_desc:0 "Finance supplies and trade, increasing tax in the target duchy. If the principal investor is a merchant who establishes a republic, other merchant contributors become its patricians."
 great_project_type_eu5_colonial_enterprise_contribution_settlers:0 "Recruit Settlers"
 great_project_type_eu5_colonial_enterprise_contribution_settlers_desc:0 "Finance migration, increasing prosperity growth in the target duchy. If the principal investor is a merchant who establishes a republic, other merchant contributors become its patricians."
 great_project_type_eu5_colonial_enterprise_contribution_defenses:0 "Colonial Defenses"
 great_project_type_eu5_colonial_enterprise_contribution_defenses_desc:0 "Finance defenses, increasing control growth in the target duchy. If the principal investor is a merchant who establishes a republic, other merchant contributors become its patricians."
 eu5_colonial_supplies_modifier:0 "Colonial Supplies"
 eu5_colonial_settlers_modifier:0 "Colonial Settlers"
 eu5_colonial_defenses_modifier:0 "Colonial Defenses"
 great_project_type_eu5_colonial_enterprise_desc:0 "Distant frontiers beckon. With careful preparation and sufficient investment, even the most barren lands can become a haven for our settlers. Merchants who have amassed great wealth through trade are always eager to finance such ventures, turning their riches into land and power."
 eu5_new_world_discovery.0002.t:0 "News of a New World"
 eu5_new_world_discovery.0002.desc:0 "News from beyond the Atlantic spreads across Europe: sailors have reached distant lands. The ocean is no longer merely a boundary, but a road to unknown shores.\n\nThe holders of Castile and Portugal, if any, gain charts of the whole of the Americas. Rulers with coastal land may launch colonial projects in discovered overseas wilderness duchies once their culture knows Colonial Charters."
 eu5_new_world_discovery.0002.a:0 "New opportunities await across the sea."
 eu5_colonial_enterprise_duchy_available_tt:0 "No colonial enterprise is being planned or built in this duchy"
 eu5_chart_seas_decision:0 "Send an Expedition of Discovery"
 eu5_chart_seas_decision_desc:0 "Beyond the familiar coasts lies an ocean of sailors’ tales and merchants’ ambitions. A fleet sent through the mist may find new harbors, sea routes, and opportunities."
 eu5_chart_seas_decision_tooltip:0 "Send ships to explore an unknown coast."
 eu5_chart_seas_decision_confirm:0 "Choose a route"
 eu5_colonial_target_valid_tt:0 "The duchy must contain wilderness and have no active colonial project. Overseas colonization also requires Colonial Charters and a chart of the target region."
 eu5_colonial_exploration.0001.t:0 "Sailing into the Unknown"
 eu5_colonial_exploration.0001.desc:0 "The ships have been prepared and the sailors await their orders. Beyond the horizon lie coasts absent from our charts, and we must choose where the fleet will sail."
 eu5_colonial_exploration.0001.cancel:0 "Perhaps another time."
 eu5_colonial_exploration.0003.t:0 "The Expedition Returns"
 eu5_colonial_exploration.0003.desc:0 "Our expedition has returned with new charts. We may now plan colonial projects on wilderness coasts in the discovered region."
 eu5_colonial_exploration.0003.a:0 "Unroll the charts."
 eu5_colonial_exploration.0001.europe:0 "European coasts"
 eu5_colonial_exploration.0001.africa:0 "African coasts"
 eu5_colonial_exploration.0001.asia:0 "Asian coasts"
 eu5_colonial_exploration.0001.north_america:0 "North America and the Caribbean"
 eu5_colonial_exploration.0001.south_america:0 "South America"
 eu5_colonial_exploration.0001.oceania:0 "Oceania"
 eu5_colonial_exploration.0004.t:0 "The Fleet Fails to Return"
 eu5_colonial_exploration.0004.desc:0 "After a long silence, survivors have finally reached port. The expedition failed to complete its voyage and brought back no usable chart."
 eu5_colonial_exploration.0004.a:0 "We shall sail again."
 eu5_chart_seas_coast_requirement_tt:0 "Your realm contains at least one coastal county"
 eu5_chart_seas_decision_effect_tt:0 "Choose a region to explore; pay 150 gold when the voyage is launched. A successful expedition charts that region."
 eu5_chart_seas_voyage_available_tt:0 "No expedition is underway and at least one region remains uncharted"
 eu5_colonial_settlement_investor_tt:0 "The project owner may invest if they personally hold bordering land; their vassals may invest if they or their own vassals hold bordering land. Merchants under the project owner may also invest once the owner’s culture has Colonial Charters."
 eu5_colonial_settlement_outcome_tt:0 "The principal investor receives the wilderness counties and, if unheld or held by the project owner, the duchy. A bordering landed investor retains their government; a merchant establishes a republic."
