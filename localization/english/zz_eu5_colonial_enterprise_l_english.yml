l_english:
 great_project_type_eu5_colonial_enterprise:0 "Colonial Enterprise"
 great_project_type_tooltip_eu5_colonial_enterprise:0 "Establish a colonial republic in the wilderness."
 great_project_type_eu5_colonial_enterprise_contribution_settlement:0 "Establish Settlements"
 great_project_type_eu5_colonial_enterprise_contribution_settlement_desc:0 "A merchant finances the colony and receives its wilderness counties upon completion. The merchant also receives the duchy if it is unheld or held by the project owner; otherwise, a new duchy-tier republic title is created."
 great_project_type_eu5_colonial_enterprise_contribution_supplies:0 "Supplies and Trade"
 great_project_type_eu5_colonial_enterprise_contribution_supplies_desc:0 "Finance supplies and trade, increasing tax in the target duchy. Merchant contributors become patricians of the colonial republic."
 great_project_type_eu5_colonial_enterprise_contribution_settlers:0 "Recruit Settlers"
 great_project_type_eu5_colonial_enterprise_contribution_settlers_desc:0 "Finance migration, increasing prosperity growth in the target duchy. Merchant contributors become patricians of the colonial republic."
 great_project_type_eu5_colonial_enterprise_contribution_defenses:0 "Colonial Defenses"
 great_project_type_eu5_colonial_enterprise_contribution_defenses_desc:0 "Finance defenses, increasing control growth in the target duchy. Merchant contributors become patricians of the colonial republic."
 eu5_colonial_supplies_modifier:0 "Colonial Supplies"
 eu5_colonial_settlers_modifier:0 "Colonial Settlers"
 eu5_colonial_defenses_modifier:0 "Colonial Defenses"
 great_project_type_eu5_colonial_enterprise_desc:0 "Establish a colonial republic over five years. The duchy must contain wilderness and border the realm; from 12 October 1492, rulers with capitals in Europe and coastal land may target coastal wilderness duchies overseas."
 eu5_new_world_discovery.0002.t:0 "News of a New World"
 eu5_new_world_discovery.0002.desc:0 "News from beyond the Atlantic spreads across Europe: sailors have reached distant lands. The ocean is no longer merely a boundary, but a road to unknown shores.\n\nRulers with capitals in Europe and coastal land may now launch colonial projects in coastal wilderness duchies overseas."
 eu5_new_world_discovery.0002.a:0 "New opportunities await across the sea."
 eu5_colonial_enterprise_duchy_available_tt:0 "No colonial enterprise is being planned or built in this duchy"
