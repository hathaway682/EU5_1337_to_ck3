 gen_religion_29_desc:0 "Followers of Retaman keep faith with a host of gods, each owed their due, though all bow before Kharman. The Mardad is its holy book, and the Japours who teach from it gather the faithful in their Seids. Those who live well are believed to join Kharman in Nibafa when they die. Every believer is expected to make the pilgrimage to its holy sites at least once in their life."
