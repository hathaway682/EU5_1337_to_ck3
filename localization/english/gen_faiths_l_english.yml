 mandean_group_adj:0 "Mandaean"
 mandean_group_desc:0 "Mandaean honours a great pantheon under Lolas, beside whom Enilip rules the field of battle and Joan the harvest. Its priests, the Silips, lead worship in temples called Lonys and guard the scriptures known as the Pelearia. The righteous are promised Phimeon, while the wicked are cast down into Cathe. It draws no distinction between men and women in matters of faith or rule."
