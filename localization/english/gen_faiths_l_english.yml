 ijaw_religion_desc:0 "Ijaw is a distinct tradition within African Folk Religions. It has never been gathered into a formal church, and each community keeps the rites in its own way. Its adherents are known for belief in the cycle of rebirth, taxing the unbelievers under its rule and shrines to the household gods in every home. Pilgrims travel to AntoMi, Bemareric and Anname to pray."
