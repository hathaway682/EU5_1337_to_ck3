 gen_religion_11_desc:0 "Quqipo honours a great pantheon under Jojji, beside whom Bbud rules the field of battle and Munyi the harvest. Its priests, the Azhys, lead worship in temples called Mugayis and guard the scriptures known as the Shyvie. The righteous are promised Ssyqi, while the wicked are cast down into Bbujjo. Every believer is expected to make the pilgrimage to its holy sites at least once in their life."
