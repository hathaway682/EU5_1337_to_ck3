 gen_religion_56_desc:0 "Granor teaches that Mart alone is divine, and that every other power mortals worship is a delusion or a devil. The Ruth is its holy book, and the Isollens who teach from it gather the faithful in their Marts. Those who live well are believed to join Mart in Agnes when they die. It tolerates no other faith, and counts every unbeliever an enemy of Mart."
