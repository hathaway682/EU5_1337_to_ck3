 hussite_desc:0 "Hussitism is a distinct tradition within Christianity. It has never been gathered into a formal church, and each community keeps the rites in its own way. It is set apart by belief in the cycle of rebirth, taxing the unbelievers under its rule and shrines to the household gods in every home. Its holiest places include AntoMi, Bemareric and Anname."
