 gen_religion_55_desc:0 "Tasuarman honours a great pantheon under Vishengsasuarman, beside whom Pavarman rules the field of battle and Kutihpanaraha_sa the harvest. Its priests, the Rapulapas, lead worship in temples called Ke_viraydavars and guard the scriptures known as the Surendrana. The righteous are promised La_k_thevi, while the wicked are cast down into Sakrantidavarma. Every believer is expected to make the pilgrimage to its holy sites at least once in their life."
