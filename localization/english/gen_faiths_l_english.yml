 yazidi_group_adj:0 "Yazidi"
 yazidi_group_desc:0 "Yazidi honours a great pantheon under Lolas, beside whom Enilip rules the field of battle and Joan the harvest. The Pelearia is its holy book, and the Silips who teach from it gather the faithful in their Lonys. The righteous are promised Phimeon, while the wicked are cast down into Cathe. It draws no distinction between men and women in matters of faith or rule."
