 gen_religion_12_desc:0 "To the followers of Navniran there is no god but Naria, who shaped the world from nothing and will one day call it to account. The Segar is its holy book, and the Mashangs who teach from it gather the faithful in their Azads. The righteous are promised Shir, while the wicked are cast down into Aynabas. It tolerates no other faith, and counts every unbeliever an enemy of Naria."
