 gen_religion_34_desc:0 "Shyhuo honours a great pantheon under Munyu, beside whom Ssysse rules the field of battle and Nyijji the harvest. Its priests, the Nyibbus, lead worship in temples called Ladas and guard the scriptures known as the Susse. The righteous are promised Shusse, while the wicked are cast down into Qunyi. It is famously tolerant, and regards other faiths as different paths to the same truth."
