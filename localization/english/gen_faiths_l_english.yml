 manichaean_group_adj:0 "Manichaeism"
 manichaean_group_desc:0 "The gods of Manichaeism are many and quarrelsome, and chief among them is Lolas. The Pelearia is its holy book, and the Silips who teach from it gather the faithful in their Lonys. Those who live well are believed to join Lolas in Phise when they die. It draws no distinction between men and women in matters of faith or rule."
