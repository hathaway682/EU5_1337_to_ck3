 folk_african_group_desc:0 "Followers of African Folk Religions keep faith with a host of gods, each owed their due, though all bow before Lolas. The Pelearia is its holy book, and the Silips who teach from it gather the faithful in their Lonys. The righteous are promised Phimeon, while the wicked are cast down into Cathe. It draws no distinction between men and women in matters of faith or rule."
