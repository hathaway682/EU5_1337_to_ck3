 gen_religion_27_desc:0 "Mukula honours a great pantheon under Nzembua, beside whom Wambua rules the field of battle and Nyokibui the harvest. Its priests, the Aluyins, lead worship in temples called Kingis and guard the scriptures known as the Sangim. The righteous are promised Kingoko, while the wicked are cast down into Esengo. It is famously tolerant, and regards other faiths as different paths to the same truth."
