 gen_religion_10_desc:0 "The gods of Akyt are many and quarrelsome, and chief among them is Zhulpe. Its priests, the Bacmans, lead worship in temples called Bilyas and guard the scriptures known as the Nala. Those who live well are believed to join Zhulpe in Eselkay when they die. It is famously tolerant, and regards other faiths as different paths to the same truth."
