l_english:
 # === Casus Belli ===
 PHX_HYW_FRENCH_THRONE_WAR_NAME:0 "Hundred Years' War for the Crown of France"
 PHX_HYW_FRENCH_THRONE_WAR_NAME_MY:0 "War for the Crown of France"
 PHX_HYW_FRENCH_THRONE_WAR_NAME_BASE:0 "Crown of France"
 PHX_HYW_FRENCH_THRONE_CB_NAME:0 "Claim the French Throne"
 phx_hyw_french_throne_cb_victory_desc:0 "The English monarch seizes the Crown of France, uniting the two realms in dynastic triumph."
 phx_hyw_french_throne_cb_white_peace_desc:0 "Both exhausted realms sign a precarious truce akin to Brétigny, leaving the quarrel for another generation."
 phx_hyw_french_throne_cb_defeat_desc:0 "The English invasion is broken and hurled back across the Channel, affirming Valois sovereignty over France."
 phx_hyw_french_throne_cb_invalidated_desc:0 "The dynastic war for the French throne has become invalid."

 PHX_HYW_AQUITAINE_WAR_NAME:0 "Confiscation of Aquitaine"
 PHX_HYW_AQUITAINE_WAR_NAME_MY:0 "Confiscation of Aquitaine"
 PHX_HYW_AQUITAINE_WAR_NAME_BASE:0 "Confiscation of Aquitaine"
 PHX_HYW_AQUITAINE_CB_NAME:0 "Confiscate English Fiefs in [TITLE.GetBaseName]"
 PHX_HYW_AQUITAINE_CB_NAME_GENERIC:0 "Confiscate English Continental Fiefs"
 phx_hyw_aquitaine_cb_victory_desc:0 "The French Crown enforces feudal forfeiture, seizing English-held continental lands in the targeted duchy."
 phx_hyw_aquitaine_cb_white_peace_desc:0 "The confiscation campaign stalls without decisive victory, leaving England's continental enclaves intact."
 phx_hyw_aquitaine_cb_defeat_desc:0 "The French royal host is repulsed, leaving English authority in Aquitaine emboldened."
 phx_hyw_aquitaine_cb_invalidated_desc:0 "The confiscation war over Aquitaine is no longer valid."

 # === Story Cycle ===
 story_phx_hundred_years_war:0 "The Hundred Years' War"
 story_phx_hundred_years_war_desc:0 "A generational struggle between the Plantagenets of England and the Valois of France over Aquitaine, feudal homage, and the sacred lilies of Paris."
 PHX_HYW_STORY_PRACTICAL_INFORMATION_STRING:0 "The dynastic conflict between England and France unfolds across four eras: Opening Escalation (1337–1345), High War & Chevauchées (1346–1360), the Caroline Counteroffensive (1361–1384), and Late-War Exhaustion & Turnaround (1385+).\n\nProlonged Franco-English warfare inflicts war exhaustion and devastates frontline French counties until resolved by proclaiming the Dual Monarchy or the Liberation of France."

 # === Modifiers ===
 phx_hyw_longbow_doctrine_modifier:0 "English Longbow Doctrine"
 phx_hyw_longbow_doctrine_modifier_desc:0 "Yeoman archers drilled on every village green loose clouds of bodkin arrows capable of shattering charging cavalry."
 phx_hyw_chevauchee_terror_modifier:0 "Chevauchée Terror"
 phx_hyw_chevauchee_terror_modifier_desc:0 "Fast-moving mounted columns strike deep into enemy provinces, burning granaries and daring rivals to offer battle."
 phx_hyw_flemish_wool_staple_modifier:0 "Flemish Wool Staple"
 phx_hyw_flemish_wool_staple_modifier_desc:0 "Command of raw English wool binds the wealthy cloth towns of Flanders to Westminster's fiscal and maritime orbit."
 phx_hyw_order_of_garter_modifier:0 "Most Noble Order of the Garter"
 phx_hyw_order_of_garter_modifier_desc:0 "A fellowship of chivalric companions sworn around the sovereign at Windsor elevates knightly honor across the realm."
 phx_hyw_oriflamme_banner_modifier:0 "Oriflamme of Saint-Denis"
 phx_hyw_oriflamme_banner_modifier_desc:0 "The sacred crimson war-banner of France flies from the royal pavilion, summoning knights and townsmen to fight without quarter."
 phx_hyw_valois_chivalry_modifier:0 "Valois Chivalric Muster"
 phx_hyw_valois_chivalry_modifier_desc:0 "Mounted men-at-arms from every French province answer the royal ban, gleaming in plate and heraldic surcoats."
 phx_hyw_compagnies_ordonnance_modifier:0 "Compagnies d'Ordonnance"
 phx_hyw_compagnies_ordonnance_modifier_desc:0 "Salaried royal cavalry companies and modern siege artillery replace erratic feudal levies with a disciplined standing army."
 phx_hyw_estates_general_concessions_modifier:0 "Estates-General Concessions"
 phx_hyw_estates_general_concessions_modifier_desc:0 "Emergency subsidies granted by bourgeois and noble deputies fill the war chest at the cost of royal prerogative."
 phx_hyw_burgundian_statecraft_modifier:0 "Grand Ducal Statecraft"
 phx_hyw_burgundian_statecraft_modifier_desc:0 "From Dijon to the Low Countries, deft marriages, lavish court patronage, and balanced diplomacy raise Burgundy into a third great power."
 phx_hyw_breton_succession_divided_modifier:0 "Breton Succession Divided"
 phx_hyw_breton_succession_divided_modifier_desc:0 "Rival Montfort and Blois factions turn Breton castles and coastal ports into competing strongholds for foreign patrons."
 phx_hyw_war_exhaustion_modifier:0 "War Exhaustion of the Realm"
 phx_hyw_war_exhaustion_modifier_desc:0 "Decades of heavy war taxes, mercenary depredations, and depleted manpower weigh darkly upon lord and peasant alike."
 phx_hyw_devastated_countryside_modifier:0 "Devastated Countryside"
 phx_hyw_devastated_countryside_modifier_desc:0 "Charred barns, trampled harvests, and deserted hamlets mark the passage of raiding columns and routier bands."
 phx_hyw_maid_of_orleans_modifier:0 "Banner of the Maid of Orléans"
 phx_hyw_maid_of_orleans_modifier_desc:0 "A prophetic peasant standard has kindled fierce devotion across France, turning despair into an unstoppable tide of liberation."
 phx_hyw_treaty_bretigny_modifier:0 "Accord of Brétigny"
 phx_hyw_treaty_bretigny_modifier_desc:0 "A hard-won settlement brings respite from raids, letting treasuries recover and garrisons regroup."
 phx_hyw_dual_monarchy_crown_modifier:0 "Crown of the Dual Monarchy"
 phx_hyw_dual_monarchy_crown_modifier_desc:0 "The leopards of England and the golden lilies of France shine side by side beneath a single sovereign diadem."
 phx_hyw_breton_neutrality_modifier:0 "Balance Between Lion and Lily"
 phx_hyw_breton_neutrality_modifier_desc:0 "Careful treaties and fortified Breton ports preserve the Duchy's autonomy while neighboring kingdoms bleed."

 # === Regiments ===
 phx_hyw_english_longbow_host_name:0 "Royal Yeoman Longbow Host"
 phx_hyw_french_oriflamme_host_name:0 "Royal Host of the Oriflamme"
 phx_hyw_compagnies_ordonnance_host_name:0 "Compagnies d'Ordonnance & Royal Train"
 phx_hyw_scottish_auld_alliance_host_name:0 "Border Schiltrons of the Auld Alliance"
 phx_hyw_valois_chivalry_host_name:0 "Grand Ban of Valois Chivalry"
 phx_hyw_maid_relief_host_name:0 "Relief Army of Orléans"

 # === Decisions (10) ===
 phx_hyw_press_french_claim_decision:0 "Assert the Claim to the French Crown"
 phx_hyw_press_french_claim_decision_desc:0 "Through blood and inheritance the Valois throne in Paris belongs by right to England's royal house. By quartering the golden lilies upon our royal standard and summoning the shire bowmen, we announce to Christendom that the crown of Saint Louis shall not rest uncontested."
 phx_hyw_press_french_claim_decision_tooltip:0 "Formally assert England's dynastic claim to the Crown of France and muster an expeditionary longbow host."
 phx_hyw_press_french_claim_decision_confirm:0 "Quarter the Lilies"
 phx_hyw_press_french_claim_effect_tt:0 "Musters an expeditionary longbow army, unlocks a free French Throne war declaration, and opens an immediate choice to invade."

 phx_hyw_found_order_of_garter_decision:0 "Found the Order of the Garter"
 phx_hyw_found_order_of_garter_decision_desc:0 "In the halls of Windsor, stories of Arthur's Round Table stir the blood of young knights eager for renown across the sea. Establishing an exclusive chivalric fellowship bound to the Crown will unite the realm's greatest captains in honor and fidelity."
 phx_hyw_found_order_of_garter_decision_tooltip:0 "Establish England's premier chivalric order at Windsor to honor the realm's finest knights."
 phx_hyw_found_order_of_garter_decision_confirm:0 "Convene the First Chapter"
 phx_hyw_found_order_of_garter_effect_tt:0 "Institutes the Most Noble Order of the Garter, strengthening English knighthood and royal prestige."

 phx_hyw_flemish_wool_embargo_decision:0 "Enforce the Flemish Wool Staple"
 phx_hyw_flemish_wool_embargo_decision_desc:0 "Every loom in Ghent, Bruges, and Ypres turns upon the fleece sheared from English downs. By channeling the wool trade through royal staple ports, Westminster can fill its coffers and compel the rich Flemish communes to heed English counsel."
 phx_hyw_flemish_wool_embargo_decision_tooltip:0 "Leverage English wool exports to boost royal revenue and win diplomatic influence over Flanders."
 phx_hyw_flemish_wool_embargo_decision_confirm:0 "Seal the Wool Staple"
 phx_hyw_flemish_wool_embargo_effect_tt:0 "Enriches Middlesex customs, eases Channel crossings, and draws Flemish sympathy toward England."

 phx_hyw_proclaim_dual_monarchy_decision:0 "Proclaim the Dual Monarchy"
 phx_hyw_proclaim_dual_monarchy_decision_desc:0 "From Westminster Abbey to Notre-Dame de Paris, heralds proclaim a single sovereign over both shores of the Narrow Sea. The bitter quarrel over homage and succession reaches its crowning consummation in a united Anglo-French dynasty."
 phx_hyw_proclaim_dual_monarchy_decision_tooltip:0 "Solemnly unite the Crowns of England and France under a Dual Monarchy, concluding the Hundred Years' War."
 phx_hyw_proclaim_dual_monarchy_decision_confirm:0 "Wear Both Crowns"
 phx_hyw_proclaim_dual_monarchy_effect_tt:0 "Concludes the Hundred Years' War in triumph for the Dual Monarchy and removes war exhaustion."

 phx_hyw_confiscate_aquitaine_decision:0 "Confiscate the Duchy of Aquitaine"
 phx_hyw_confiscate_aquitaine_decision_desc:0 "No king of France can suffer a proud foreign monarch to hold Gascon vineyards and ports while flouting feudal summonses and harboring royal traitors. By proclaiming Aquitaine forfeit to the Crown, Paris reclaims its ancient sovereign rights."
 phx_hyw_confiscate_aquitaine_decision_tooltip:0 "Declare English fiefs in Aquitaine forfeit to the French Crown and summon the Valois host."
 phx_hyw_confiscate_aquitaine_decision_confirm:0 "Pronounce the Forfeiture"
 phx_hyw_confiscate_aquitaine_effect_tt:0 "Prepares a free Aquitaine confiscation war against England and opens an immediate choice to enforce it by arms."

 phx_hyw_raise_oriflamme_decision:0 "Unfurl the Oriflamme of Saint-Denis"
 phx_hyw_raise_oriflamme_decision_desc:0 "Kept beside the tombs of the French kings at the Abbey of Saint-Denis, the scarlet Oriflamme is brought forth only in the realm's gravest hour. When its forked flame ripples above the royal host, every knight of France knows the kingdom fights for survival."
 phx_hyw_raise_oriflamme_decision_tooltip:0 "Bring forth the sacred Oriflamme from Saint-Denis to rally a royal army at Paris."
 phx_hyw_raise_oriflamme_decision_confirm:0 "Raise the Sacred Banner"
 phx_hyw_raise_oriflamme_effect_tt:0 "Musters a royal Oriflamme army in Paris and emboldens French commanders across the realm."

 phx_hyw_establish_compagnies_decision:0 "Establish the Compagnies d'Ordonnance"
 phx_hyw_establish_compagnies_decision_desc:0 "Undisciplined feudal levies and lawless mercenary bands have bled the countryside dry while yielding castle after castle to English archers. Creating salaried royal cavalry companies backed by master bronze gunners will forge Europe's first standing crown army."
 phx_hyw_establish_compagnies_decision_tooltip:0 "Institute a permanent salaried standing army and royal siege artillery train for France."
 phx_hyw_establish_compagnies_decision_confirm:0 "Issue the Royal Ordinance"
 phx_hyw_establish_compagnies_effect_tt:0 "Creates permanent standing Compagnies d'Ordonnance with royal bombards and ends war exhaustion."

 phx_hyw_expel_english_continent_decision:0 "Proclaim the Liberation of France"
 phx_hyw_expel_english_continent_decision_desc:0 "From the harbors of Normandy to the river quays of Bordeaux, the red cross of Saint George no longer flies over French ramparts. Bells ring from Reims to Orléans as the kingdom emerges scarred yet sovereign from a century of fire."
 phx_hyw_expel_english_continent_decision_tooltip:0 "Celebrate the complete expulsion of English rule from France, concluding the Hundred Years' War."
 phx_hyw_expel_english_continent_decision_confirm:0 "Ring the Bells of Liberation"
 phx_hyw_expel_english_continent_effect_tt:0 "Concludes the Hundred Years' War in French victory, ends war exhaustion, and revives Paris and Bordeaux."

 phx_hyw_grand_duchy_burgundy_decision:0 "Chart the Third Power of Burgundy"
 phx_hyw_grand_duchy_burgundy_decision_desc:0 "While Westminster and Paris consume their treasure and flower of nobility upon endless battlefields, Dijon sits astride Europe's richest crossroads. Through princely patronage, shrewd diplomacy, and disciplined administration, Burgundy can rise as the arbiter of the West."
 phx_hyw_grand_duchy_burgundy_decision_tooltip:0 "Elevate Burgundy's court and statecraft into a formidable third power between England and France."
 phx_hyw_grand_duchy_burgundy_decision_confirm:0 "Enact the Grand Ducal Charter"
 phx_hyw_grand_duchy_burgundy_effect_tt:0 "Establishes Grand Ducal Statecraft and spurs the prosperity of Dijon."

 phx_hyw_secure_breton_neutrality_decision:0 "Balance Between Lion and Lily"
 phx_hyw_secure_breton_neutrality_decision_desc:0 "Granite headlands and fierce maritime independence have guarded Brittany since ancient days. By holding fast to ducal treaties and refusing to become a mere pawn of either Paris or London, the ermine banner may endure unbroken."
 phx_hyw_secure_breton_neutrality_decision_tooltip:0 "Consolidate Breton diplomatic neutrality to mend internal division and shield the Duchy."
 phx_hyw_secure_breton_neutrality_decision_confirm:0 "Seal the Ducal Compact"
 phx_hyw_secure_breton_neutrality_effect_tt:0 "Ends Breton factional division and strengthens ducal defense and diplomacy."

 # === Tooltips ===
 phx_hyw_aquitaine_forfeit_cb_tt:0 "Grants a prestige-free Confiscation of Aquitaine war declaration against England."
 phx_hyw_throne_claim_ready_tt:0 "Grants a prestige-free Claim the French Throne war declaration against France."

 # === Events (26) ===
 phx_hyw.0001.t:0 "The Lion Gazes Across the Channel"
 phx_hyw.0001.desc:0 "Spring 1337 arrives with salt winds whipping the banners above Westminster. Across the Narrow Sea, Valois jurists chip away at Gascon appeals while French galleys shadow the wool ships bound for Flanders. Yet in your veins flows the blood of Philip the Fair, and England's archers have already proved their dread power upon Scottish hillsides.\n\nCounsellors and war captains await your word: shall England sharpen its yew bows for the reckoning in France, or fill the royal exchequer first?"
 phx_hyw.0001.a:0 "Drill the shire archers—our destiny lies across the Channel."
 phx_hyw.0001.b:0 "Secure the wool customs and Westminster's silver first."

 phx_hyw.0002.t:0 "The Golden Lilies of Valois"
 phx_hyw.0002.desc:0 "The Kingdom of France stands first among the realms of Latin Christendom—populous, rich in vineyards and cathedral towns, and crowned by the finest mounted chivalry in Europe. Yet a thorn festers in the southwest: the King of England holds Bordeaux and Ponthieu as an unruly peer who whispers claims to the very throne of Paris.\n\nFrom the Île de la Cité, great nobles and royal legists look to see how the Valois Crown will answer English insolence."
 phx_hyw.0002.a:0 "Summon the flower of French chivalry beneath the lilies."
 phx_hyw.0002.b:0 "Bind the great peers of Burgundy and Flanders tightly to Paris."

 phx_hyw.0003.t:0 "Vineyards and Ambition in Dijon"
 phx_hyw.0003.desc:0 "Storm clouds gather between Westminster and Paris, and every envoy riding through Dijon speaks of impending war. Burgundy sits at the crossroads of France, the Empire, and the thriving fairs of Champagne. Where lesser lords see danger in the clash of kings, a shrewd duke sees the chance to enlarge his house's wealth, prestige, and independence."
 phx_hyw.0003.a:0 "Expand our treasury and chart Burgundy's own ascent."
 phx_hyw.0003.b:0 "Make a grand display of Valois loyalty to reap royal gratitude."

 phx_hyw.0004.t:0 "The Ermine Banner Without an Heir"
 phx_hyw.0004.desc:0 "Along the Breton coast from Nantes to Rennes, anxious murmurs pass among barons and sea-captains. Without an undisputed direct heir to the ducal coronet, rival kinsmen look eastward to Paris and northward across the sea to London for patronage. Should the great kingdoms come to blows, Brittany's succession may become the spark that sets the peninsula ablaze."
 phx_hyw.0004.a:0 "Guard Breton custom and keep both crowns at arm's length."
 phx_hyw.0004.b:0 "Fill the ducal coffers and watch the sea-lanes closely."

 phx_hyw.0010.t:0 "The Confiscation of Aquitaine"
 phx_hyw.0010.desc:0 "Before the Parlement of Paris, royal advocates lay out a damning indictment: the English Crown has defied feudal justice in Guyenne, harbored fugitives from the King of France, and armed the coastal marches. By every maxim of French law, the fiefs of Aquitaine stand forfeit to the suzerain.\n\nSigning the decree of confiscation will almost certainly shatter the fragile peace across the Channel and ignite open war between Lion and Lily."
 phx_hyw.0010.a:0 "Declare Aquitaine forfeit and march on Bordeaux at once!"
 phx_hyw.0010.b:0 "Proclaim the confiscation decree and prepare the royal host first."
 phx_hyw.0010.c:0 "Hold back the decree—negotiated homage serves us better."

 phx_hyw.0011.t:0 "The Challenge for the Lilies"
 phx_hyw.0011.desc:0 "Envoys gallop into Westminster bearing the royal writ from Paris: the Valois court has declared your ancestral lands in Aquitaine confiscated to the French Crown. Exiled French magnates and English barons crowd the council chamber in uproar, urging you to answer feudal insult with the boldest gambit in Christendom—to proclaim yourself rightful King of France and carry war onto Valois soil."
 phx_hyw.0011.a:0 "By God and Saint George—claim the French throne and sound the war horns!"
 phx_hyw.0011.b:0 "Assert our rightful claim publicly, then forge continental alliances first."
 phx_hyw.0011.c:0 "Seek a sober settlement to preserve Gascony without crowning ourselves in Paris."

 phx_hyw.0020.t:0 "The Flemish Wool Crisis"
 phx_hyw.0020.desc:0 "Across the North Sea, the great cloth cities of Ghent, Bruges, and Ypres sit silent—their looms starved whenever English wool ships withhold sail. While the Count of Flanders clings to his feudal oath to Paris, energetic burgher leaders led by Jacob van Artevelde whisper that the guilds will gladly align with England if the wool trade flows freely under Westminster's protection."
 phx_hyw.0020.a:0 "Enforce the wool embargo and back Artevelde's Flemish guilds!"
 phx_hyw.0020.b:0 "Sell lucrative wool charters directly and pocket the customs silver."

 phx_hyw.0030.t:0 "The War of the Breton Succession"
 phx_hyw.0030.desc:0 "The long-feared storm has broken over Brittany. Rival partisans of Charles of Blois and Jean de Montfort muster knights behind granite ramparts, each accusing the other of usurpation and appealing to Paris or London for steel and coin. Without decisive steering from Nantes, the duchy risks becoming the cockpit of the wider Anglo-French struggle."
 phx_hyw.0030.a:0 "Back the Blois faction and lean upon French protection."
 phx_hyw.0030.b:0 "Back the Montfort claim and invite English maritime aid."
 phx_hyw.0030.c:0 "Spend ducal silver to broker an impartial Estates settlement."

 phx_hyw.0031.t:0 "The Proxy Struggle for Brittany"
 phx_hyw.0031.desc:0 "Messengers from across Brittany bring urgent pleas for gold, ships, and veteran captains. With rival claimants tearing the peninsula apart, whoever secures the harbors of Brest, Vannes, and Nantes will command the sea-lanes linking England, Normandy, and Gascony."
 phx_hyw.0031.a:0 "Dispatch funds and captains to tip the Breton balance."
 phx_hyw.0031.b:0 "Let the Bretons settle their own quarrel—keep our treasury intact."

 phx_hyw.0040.t:0 "The Auld Alliance Calls"
 phx_hyw.0040.desc:0 "French envoys arrive at the Scottish court bearing sealed letters, heavy pouches of gold, and news that England's armies are tied down across the Channel. Under the ancient bonds of the Auld Alliance, Paris begs Scotland to strike southward across the Tweed and force Westminster to fight on two fronts."
 phx_hyw.0040.a:0 "Sound the war-pipes and march south into Northumberland!"
 phx_hyw.0040.b:0 "Hold the Border marches defensively and rebuild Scotland in peace."

 phx_hyw.0045.t:0 "Spurs of the Black Prince"
 phx_hyw.0045.desc:0 "No longer a boy watching tournaments from the royal pavilion, Edward of Woodstock has come of age with steel in his gaze and restless fire in his spirit. Already seasoned knights whisper of his cool nerve in the saddle and fierce ambition to prove himself against the chivalry of France."
 phx_hyw.0045.a:0 "Let him win his spurs leading the vanguard in France!"
 phx_hyw.0045.b:0 "School him equally in statecraft and the burdens of royal governance."

 phx_hyw.0050.t:0 "Yew Bows and the Smoke of Chevauchée"
 phx_hyw.0050.desc:0 "The war in France enters a ferocious new phase. Fast mounted columns riding out of Normandy and Guyenne leave burning barns and empty granaries in their wake, daring the French nobility to charge headlong into stakes and volley after volley of six-foot English yew bows."
 phx_hyw.0050.a:0 "Unleash sweeping chevauchées to shatter French morale and tribute!"
 phx_hyw.0050.b:0 "Perfect disciplined defensive lines of longbowmen and dismounted knights."

 phx_hyw.0055.t:0 "Chivalry Against the Storm of Arrows"
 phx_hyw.0055.desc:0 "Smoke rises over Normandy and Picardy as English raiders taunt the proud nobility of France. Young barons clamor to ride them down in glorious lance charges, while older captains warn bitterly that charging uphill into English archery stacks the bodies of the kingdom's finest knights."
 phx_hyw.0055.a:0 "Sound the charge—the heavy cavalry of France fears no common bow!"
 phx_hyw.0055.b:0 "Hold the walled cities and starve the raiders through patient attrition."

 phx_hyw.0060.t:0 "Estates-General and the Jacquerie"
 phx_hyw.0060.desc:0 "Years of crushing war taxes, ransoms, and roaming free companies have pushed the French countryside past endurance. In the Beauvaisis and around Paris, desperate peasants arm themselves with scythes and torches against noble manors, while bourgeois deputies in the Estates-General demand oversight of royal finances before voting another livre."
 phx_hyw.0060.a:0 "Concede fiscal oversight to the Estates-General to calm the realm."
 phx_hyw.0060.b:0 "Ride down the Jacquerie with ruthless steel—order must be restored!"

 phx_hyw.0070.t:0 "The Peasants' Revolt"
 phx_hyw.0070.desc:0 "Poll taxes levied to pay for endless campaigns in France have ignited fury across Kent and Essex. Thousands of angry commons march on London waving banners and demanding an end to serfdom and corrupt tax collectors, while smoke curls over the suburbs beyond the Thames."
 phx_hyw.0070.a:0 "Meet the rebels with royal authority and shatter their rising."
 phx_hyw.0070.b:0 "Repeal the hated poll tax and grant emergency relief to the shires."

 phx_hyw.0080.t:0 "The Maid of Orléans"
 phx_hyw.0080.desc:0 "In the darkest winter of the French realm, a seventeen-year-old peasant maiden named Jeanne arrives before your court clad in plain riding coat, her eyes blazing with unshakable conviction. She declares that the voices of heaven have commanded her to lift the siege of French spirits, drive the English back across the sea, and restore the rightful majesty of the lilies.\n\nCynical courtiers murmur at the folly of listening to a village girl—yet hardened soldiers weep at the sight of her white standard embroidered with fleurs-de-lis."
 phx_hyw.0080.a:0 "Give her armor, a warhorse, and the relief host of Orléans!"
 phx_hyw.0080.b:0 "Let learned clerics examine her claims while we rally the royal banner."

 phx_hyw.0100.t:0 "The Lilies Quartered at Westminster"
 phx_hyw.0100.desc:0 "Heralds unfurl the new royal standard before cheering crowds: the golden leopards of England quartered with the azure lilies of France. Down by the quays, yeoman bowmen stow sheaves of arrows aboard waiting cogs. The dynastic claim has been proclaimed—only the hour of invasion remains."
 phx_hyw.0100.a:0 "Set sail at once—claim the French throne by the sword!"
 phx_hyw.0100.b:0 "Hold the fleet ready until the most favorable season."

 phx_hyw.0110.t:0 "The First Chapter of the Garter"
 phx_hyw.0110.desc:0 "Beneath the vaulted banners of Windsor Chapel, twenty-four chosen knights kneel to receive the blue garter and gilded collar of the new chivalric order. Trumpets echo over the Thames as songs of honor and brotherhood promise glory on continental fields."
 phx_hyw.0110.a:0 "Honi soit qui mal y pense!"

 phx_hyw.0120.t:0 "The Royal Wool Staple Sealed"
 phx_hyw.0120.desc:0 "Royal customs inspectors tally towering bales of English wool along the quays while Flemish factors bow deeply to accept the Crown's terms. Silver pours into Westminster's vaults, and merchants across the North Sea acknowledge England's quiet mastery of the wool trade."
 phx_hyw.0120.a:0 "Gold from fleece feeds iron on the field."

 phx_hyw.0130.t:0 "Sovereign of the Dual Monarchy"
 phx_hyw.0130.desc:0 "Solemn bells ring from Westminster to Notre-Dame as the crowns of England and France rest upon one brow. Peers from both sides of the Channel swear fealty beneath a single canopy of leopards and lilies, bringing the long dynastic war to a resplendent close."
 phx_hyw.0130.a:0 "Two realms, one unbroken throne!"

 phx_hyw.0140.t:0 "The Royal Writ of Forfeiture"
 phx_hyw.0140.desc:0 "Stamped with the Great Seal of France, the decree declaring English holdings in Aquitaine forfeit to the Crown is read aloud from the steps of the Palais de la Cité. Messengers ride south toward Gascony while commanders await word on whether royal armies shall cross the border immediately."
 phx_hyw.0140.a:0 "March into Guyenne at once to enforce the Crown's decree!"
 phx_hyw.0140.b:0 "Let the writ stand while our captains complete the muster."

 phx_hyw.0150.t:0 "The Oriflamme Unfurled"
 phx_hyw.0150.desc:0 "From the high altar of Saint-Denis, the Abbot places the crimson silk Oriflamme into royal hands. As the sacred banner catches the wind outside the abbey doors, mounted knights lower their lances in thunderous salute—France rides to war beneath the shield of her patron saint."
 phx_hyw.0150.a:0 "Montjoie Saint-Denis!"

 phx_hyw.0160.t:0 "The Compagnies d'Ordonnance"
 phx_hyw.0160.desc:0 "Along the parade grounds outside Paris, disciplined squadrons of salaried royal gendarmes wheel in crisp formation beside gleaming bronze bombards cast by master founders. Gone are the chaotic levies of past defeats; the Crown of France now commands an army equal to any fortress or bowman in Europe."
 phx_hyw.0160.a:0 "Let English ramparts tremble before royal steel and powder."

 phx_hyw.0170.t:0 "Bells of the Liberation of France"
 phx_hyw.0170.desc:0 "From Calais and Rouen to the wine quays of Bordeaux, the last English transports vanish into the Channel mist. Bonfires blaze along the Loire and the Seine as peasants, burghers, and lords alike rejoice: after generations of blood and ashes, the Kingdom of France stands whole and free."
 phx_hyw.0170.a:0 "France endures forever!"

 phx_hyw.0180.t:0 "Splendor of the Grand Duchy"
 phx_hyw.0180.desc:0 "At the ducal palace in Dijon, painters, chroniclers, and foreign ambassadors marvel at tapestries woven with gold thread and treaties sealed with distant princes. Neither mere vassal nor passive bystander, Burgundy now commands respect across Western Europe as a true third power."
 phx_hyw.0180.a:0 "Let kings contend while Burgundy ascends."

 phx_hyw.0190.t:0 "The Ermine Stands Unbent"
 phx_hyw.0190.desc:0 "In the harbor of Nantes, Breton vessels fly the black-and-white ermine unhindered while envoys from both Paris and Westminster acknowledge the Duchy's chartered rights. By shrewd balance and steady nerve, Brittany has spared its people the worst fury of foreign kings."
 phx_hyw.0190.a:0 "Rather death than dishonor—Brittany keeps her own course."
