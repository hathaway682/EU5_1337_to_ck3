 MOH_HUNDRED_YEARS_WAR_BORDER_RAID_CB_NAME:0 "Border Raid against [DEFENDER.GetPrimaryTitle.GetNameNoTier]"
 MOH_HUNDRED_YEARS_WAR_BORDER_RAID_WAR_NAME:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Border Raid of [TITLE.GetBaseNameNoTier]"
 MOH_HUNDRED_YEARS_WAR_BORDER_RAID_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Border Raid against [DEFENDER.GetPrimaryTitle.GetNameNoTier]"
 moh_hundred_years_war_border_raid_victory_desc:0 "The attacker gains loot based on the target [county|E]'s [prosperity|E]. The county loses [county_control|E] and prosperity and cannot be targeted by another border raid for five years. All titles stay with their current holders."
 moh_hundred_years_war_border_raid_white_peace_desc:0 "The attacker withdraws and loses [prestige|E]."
 moh_hundred_years_war_border_raid_defeat_desc:0 "The raid fails. The attacker loses [prestige|E] and pays reparations to the defender."
 moh_hyw_truce_of_tours:0 "Truce of Tours"
 moh_hyw_maine_truce:0 "Settlement of Maine"
 moh_hyw_maine_lapsed_option:0 "There is nothing left to settle."
 moh_hyw_maine_proposal_tt:0 "Offer [moh_hyw_england.GetTitledFirstName] a three-year [truce|E] in exchange for Maine"
 moh_hyw_maine_accept_offer_tt:0 "Send your answer to the French court. If France agrees, Maine will pass to France and both crowns will observe a three-year [truce|E]"
 moh_hyw_maine_delay_tt:0 "The talks are adjourned. France may raise the matter again later"
 moh_hyw_maine_refusal_tt:0 "France may publicly assert a [claim|E] on Maine"
 moh_hyw_maine_to_anjou_tt:0 "Ask René to take charge of Maine. If he agrees, Maine will pass to France and both crowns will observe a three-year [truce|E]"
 moh_hyw_maine_back_to_france_tt:0 "[moh_hyw_france.GetTitledFirstName] will decide whether to receive Maine directly"
 moh_hyw_maine_interlude_tt:0 "The Hundred Years' War enters the [struggle_england_france_phase_interlude|E] phase"
 Hundred_Years_War_struggle.1100.t:0 "The Keys of Le Mans"
 Hundred_Years_War_struggle.1100.desc:0 "My envoy lays out the letters brought from Maine. Men sworn to England still keep the gates of Le Mans, yet the villages outside send their petitions to us. The seals set at Tours have stilled the fighting for a while. They have done little to settle where these letters belong.\n\n“My liege,” the envoy asks, “if we offer another three years, will they give us the keys?”"
 Hundred_Years_War_struggle.1100.a:0 "Put the question to the English court."
 Hundred_Years_War_struggle.1100.b:0 "This is a poor time to name a price."
 Hundred_Years_War_struggle.1101.t:0 "The Price of Maine"
 Hundred_Years_War_struggle.1101.desc:0 "The envoy of [moh_hyw_france.GetTitledFirstName] brings a proposal: Maine for three years of peace. My chancellor reads it twice. No one at the council table speaks.\n\nAt last one of my lords asks what is to become of the men who hold lands and draw wages at Le Mans by my letters. A councilor leans close. “If you seal this, Your Grace, we shall owe those men an answer.”"
 Hundred_Years_War_struggle.1101.a:0 "Maine is worth three years of peace."
 Hundred_Years_War_struggle.1101.b:0 "Let them wait for our answer."
 Hundred_Years_War_struggle.1101.c:0 "They shall not have my seal."
 Hundred_Years_War_struggle.1102.t:0 "Two Instruments"
 Hundred_Years_War_struggle.1102.desc:0 "The English will deliver Maine if we seal the truce at the same time. My clerk has prepared both copies, but has left a blank in the order of surrender. Into whose hands are the English to deliver Le Mans?"
 Hundred_Years_War_struggle.1102.a:0 "Receive Maine in the name of the Crown."
 Hundred_Years_War_struggle.1102.b:0 "Ask René to take charge of Maine."
 Hundred_Years_War_struggle.1102.c:0 "Leave the parchment unsealed."
 Hundred_Years_War_struggle.1103.t:0 "The Gates of Le Mans"
 Hundred_Years_War_struggle.1103.desc:0 "The order has reached Le Mans, and the keys have been delivered into French hands. The English envoy has set out for home with a sealed copy of the truce."
 Hundred_Years_War_struggle.1103.a:0 "May both crowns remember their seals."
 Hundred_Years_War_struggle.1104.t:0 "An Answer Deferred"
 Hundred_Years_War_struggle.1104.desc:0 "My envoy returns empty-handed. [moh_hyw_england.GetTitledFirstName] must consult the council, I am told. My envoy could not discover when it would next take up the matter."
 Hundred_Years_War_struggle.1104.a:0 "We can afford to wait."
 Hundred_Years_War_struggle.1105.t:0 "England Refuses to Yield Maine"
 Hundred_Years_War_struggle.1105.desc:0 "The parchment comes back without so much as a trace of wax on its folds. “Maine remains in the obedience of England.” That is all my envoy was given to bring home."
 Hundred_Years_War_struggle.1105.a:0 "Put the parchment away."
 Hundred_Years_War_struggle.1105.b:0 "Have my clerks set down our rights in Maine."
 Hundred_Years_War_struggle.1106.t:0 "Anjou and Maine"
 Hundred_Years_War_struggle.1106.desc:0 "A letter has come from [moh_hyw_france.GetTitledFirstName]. England will deliver Maine, and the French court wants me to take charge of Le Mans. The men who hold lands on both sides are already asking where they are to bring their petitions."
 Hundred_Years_War_struggle.1106.a:0 "Tell them I will hear them at Le Mans."
 Hundred_Years_War_struggle.1106.b:0 "Let the Crown receive Maine directly."
 MOH_Hundred_Years_War_struggle_region:0 "France and Britain"
 game_concept_Hundred_Years_War_struggle:0 "Hundred Years' War"
 game_concept_Hundred_Years_War_struggle_desc:0 "The $game_concept_Hundred_Years_War_struggle$ refers to the century-long dynastic conflict between the Kingdom of England and the Kingdom of France. The war began in 1337 when Edward III of the House of Plantagenet, as grandson of the King of France, claimed the French throne in opposition to Philip VI of the House of Valois. Driven by violence born of hatred, truces brokered through diplomacy, and pragmatic alliances between peoples of different [cultures|E] and [faiths|E], the [struggle|E] shifts between [struggle_phase_phases|E]."
 game_concept_struggle_england_france_phase_interlude:0 "Interlude"
 game_concept_struggle_england_france_phase_interlude_desc:0 "The fighting has eased. Envoys cross the Channel while lords restore their estates and towns. White peace and the purchase of a [truce|E] are easier to arrange, and truces last longer.\n\nThe dispute between the two crowns remains. New claims, fortified castles, and broken truces may bring a return to [struggle_england_france_phase_contention|E]."
 game_concept_struggle_england_france_phase_contention:0 "Contention"
 game_concept_struggle_england_france_phase_contention_desc:0 "Garrisons and raiding parties contend along the frontier. Lords raid their enemies' lands while relying on castles and local reinforcements to hold their own.\n\nSuccessful border raids gradually deepen the conflict. Wars between the English and French crowns over key territories give a stronger push toward [struggle_england_france_phase_campaign|E]. Truces, ransoms, and reconciliation favor an [struggle_england_france_phase_interlude|E]."
 game_concept_struggle_england_france_phase_campaign:0 "Campaign"
 game_concept_struggle_england_france_phase_campaign_desc:0 "The two crowns muster their armies to contest the throne and their continental strongholds. Wars cost less to declare, truces are shorter, and mercenaries and sieges are easier to organize. The towns suffer as the fighting continues.\n\nProlonged conflict gradually gives way to [struggle_england_france_phase_contention|E]. Truces, the release of prisoners, and renewed ties may instead bring an [struggle_england_france_phase_interlude|E]."
 Hundred_Years_War_struggle.0501.t:0 "The Hundred Years' War"
 Hundred_Years_War_struggle.0501.desc:0 "Ever since William the Conqueror, Duke of Normandy, seized the throne of England, the two kingdoms of France and Britain, separated only by a narrow sea, have been bound by an inescapable fate. Yet the true spark of conflict came in 1337—when Edward III of the House of Plantagenet, as grandson of King Charles IV of France, openly claimed the French throne, challenging Philip VI of the House of Valois.\n\nFor over a century, the tide of war has turned again and again. The Black Prince's arrows at Poitiers and Crécy shattered the pride of French knighthood, while the mud of Agincourt witnessed the glorious victory of Henry V. Yet the tide was not set in stone—the sudden emergence of Joan of Arc reversed the fortunes of war, rekindling French resistance against all odds.\n\nNow, the war has lasted a hundred years, and both sides are exhausted. The King of England still styles himself King of France, yet his banners fade upon the soil of Normandy and Gascony. The turmoil in this land, known as [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName], will not end until England and France are united, until one side utterly conquers the other, or until a greater third power steps in to claim it all."
 Hundred_Years_War_struggle.0501.a:0 "We shall triumph over our ancient foe!"
 catalyst_usurp_title:0 "Usurp a [title][struggle_catalyst_catalyst|E]"
 catalyst_usurp_title_desc:0 "Usurp a new [title|E] within the [struggle_region|E]"
 catalyst_gain_claim_on_title:0 "Gain a [claim][struggle_catalyst_catalyst|E]"
 catalyst_gain_claim_on_title_desc:0 "Gain a [claim|E] on a [title|E] within the [struggle_region|E]"
 catalyst_MOH_declared_war:0 "Contested a Key Territory [struggle_catalyst_catalyst|E]"
 catalyst_MOH_declared_war_desc:0 "The rulers of England and France begin a [war|E] over the French crown, Normandy, Gascony, Rouen, or Bordeaux"
 moh_hyw_catalyst_border_raid:0 "Successful Border Raid [struggle_catalyst_catalyst|E]"
 moh_hyw_catalyst_border_raid_desc:0 "An involved ruler wins a Border Raid [war|E] in the Hundred Years' War"
 Hundred_Years_War_struggle_ender_name:0 "The End of the $game_concept_Hundred_Years_War_struggle$"
 Hundred_Years_War_struggle_ender_desc:0 "The century-long conflict between the English and the French has finally come to an end. [struggle_ender.GetFirstName] has led [struggle_ender.GetHerHis] people to rule over all peoples in the region of [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]."
 struggle_england_france_ending_total_victory_decision_region_tt:0 "No other realm controls more than 20% of [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]"
 struggle_france_england_ending_regional_decision_region_tt:0 "Control at least 75% of [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]"
 struggle_france_england_ending_france_decision:0 "Total Victory for France"
 struggle_france_england_ending_france_decision_desc:0 "Normandy, Gascony, and Maine are once more under our rule, and England has lost its principal continental strongholds. We can at last bring the rival crown's claim to France to an end and close this long war."
 struggle_france_england_ending_france_decision_tooltip:0 "End the [Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_france_decision_confirm:0 "End the [Hundred_Years_War_struggle|E]"
 struggle_england_france_house_war_modifier:0 "Military Hegemony"
 struggle_england_france_house_war_modifier_desc:0 "Through the efforts of this house, the [Hundred_Years_War_struggle|E] has come to an end. They have since established absolute military supremacy in the [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E] through irresistible military dominance."
 struggle_england_france_house_culture_modifier:0 "Cultural Hegemony"
 struggle_england_france_house_culture_modifier_desc:0 "Through the efforts of this house, the [Hundred_Years_War_struggle|E] has come to an end. They have since established absolute cultural supremacy in the [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E] by spreading and promoting their people's way of life."
 struggle_england_france_house_politics_modifier:0 "Political Hegemony"
 struggle_england_france_house_politics_modifier_desc:0 "Through the efforts of this house, the [Hundred_Years_War_struggle|E] has come to an end. They have since established absolute political supremacy in the [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E] through decisive control and influence over the smaller political entities around them."
 struggle_england_france_modifier_list_tt:0 "Select one of the following modifiers for your [house|E]:\n$EFFECT_LIST_BULLET$[GetStaticModifier('struggle_england_france_house_war_modifier').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetStaticModifier('struggle_england_france_house_culture_modifier').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetStaticModifier('struggle_england_france_house_politics_modifier').GetNameWithTooltip|L]"
 struggle_france_england_ending_england_decision:0 "Total Victory for England"
 struggle_france_england_ending_england_decision_desc:0 "For over a century, the bloody conflict between England and France has raged on, with neither side able to secure a decisive advantage. Now, the banners of the House of Plantagenet fly over the walls of Paris, and the dreams of the House of Valois are crumbling. It is time to bring this unending war to a close—we will prove that the crown of England is superior to the crown of France!"
 struggle_france_england_ending_england_decision_tooltip:0 "End the [Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_england_decision_confirm:0 "End the [Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_union_decision:0 "Anglo-French Union"
 struggle_france_england_ending_union_decision_desc:0 "For over a century, the bloody conflict between France and England has raged on, with neither side able to secure a decisive advantage. Yet in the course of this long war, we have come to realize—the English and the French are not destined to be enemies, but brothers. Two kingdoms, one crown, one destiny. Let the Channel be a bridge, not a barrier; let us build a great realm that spans both shores!"
 struggle_france_england_ending_union_decision_tooltip:0 "End the [Hundred_Years_War_struggle|E]"
 struggle_france_england_ending_union_decision_confirm:0 "Establish the Anglo-French Union"
 struggle_england_france_ending_total_victory_conversion_tt:0 "$task_conversion$ and/or $task_promote_culture$ [councillor_tasks|E] speed in the [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]: #P +50%#!"
 struggle_france_england_ending_regional_decision_heritage_tt:0 "You must hold both [GetTitleByKey('k_england').GetName] and [GetTitleByKey('k_france').GetName][title|E] for at least 10 years"
 france_england_union_tt:0 "You will form a new [empire|E][title|E] that merges [GetTitleByKey('k_england').GetName] and [GetTitleByKey('k_france').GetName], and create a new Anglo-French hybrid [culture|E]. The new [empire|E][title|E] will become the [de_jure|E][liege|E] of all your [kingdoms|E][title|E]"
 struggle_england_france_ending_outsider_decision:0 "Displace the English and the French"
 struggle_england_france_ending_outsider_decision_desc:0 "For over a century, the English and the French have been locked in endless mutual slaughter, with neither side able to gain the upper hand. Proud and weary from their endless feuding, their strength is all but exhausted. Now is the time to strike, to exploit the chaos they have sown—to overthrow them in their heartlands and bring a true new master to this war-torn land!"
 struggle_england_france_ending_outsider_decision_tooltip:0 "End the [Hundred_Years_War_struggle|E]"
 struggle_england_france_ending_outsider_decision_confirm:0 "End the [Hundred_Years_War_struggle|E]"
 struggle_england_france_empire_tt:0 "You cannot hold any [kingdom|E] or [empire|E][title|E] of England or France"
 struggle_england_france_uninvolved_or_external_tt:0 "You are not directly involved in the Hundred Years' War, and your [capital|E] is outside [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]"
 france_england_union_held_france_years:0 "Hold [temp_scope.GetName] for #V 10#! years#weak (Currently [SCOPE.ScriptValue('MOH_french_held_value')|0V])#!"
 france_england_union_held_england_years:0 "Hold [temp_scope.GetName] for #V 10#! years#weak (Currently [SCOPE.ScriptValue('MOH_england_held_value')|0V])#!"
 struggle_france_england_ending_total_victory_decision_region_tt:0 "Other [realm|E]s control no more than 20% of [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName]"
 MOH_hyw_struggle_correct_involvement_tt:0 "You are [struggle_involved|E] in the [Hundred_Years_War_struggle|E]"
 Hundred_Years_War_struggle.1000.t:0 "$struggle_france_england_ending_france_decision$"
 Hundred_Years_War_struggle.1000.desc:0 "The instruments recording the recovery of Normandy, Gascony, and Maine have been filed away. The parchment before me bears the terms prepared by the envoys of both crowns.\n\nThe English royal family will relinquish its claim to the French throne, and our seals will secure the peace to come. Only when the clerk reaches the final line does conversation stir in the hall. Lords who once argued over every castle and crossing can at last discuss the road home."
 Hundred_Years_War_struggle.1000.a:0 "The Hundred Years' War is finally over!"
 Hundred_Years_War_struggle.1000.desc.no_english_crown:0 "The instruments recording the recovery of Normandy, Gascony, and Maine have been filed away. The English crown has no holder, and the armies that once contested France in its name have lost their principal continental strongholds.\n\nI order my clerks to prepare a proclamation for the towns and the courts of the lords. This long contest for the throne can at last be brought to a close."
 truce_hundred_years_war_ended:0 "The Hundred Years' War has ended"
 Hundred_Years_War_struggle.1001.t:0 "$struggle_france_england_ending_france_decision$"
 Hundred_Years_War_struggle.1001.desc:0 "[struggle_ender.GetTitledFirstName] has proclaimed French victory in the Hundred Years' War. Normandy, Gascony, and Maine have been recovered, and England has lost its principal continental strongholds.\n\nThe English royal family has relinquished its claim to the French throne, and the two crowns have agreed to a long truce."
 Hundred_Years_War_struggle.1001.desc.closing:0 "\n\nThe lords of France must now turn to restoring the lands left scarred by the war."
 Hundred_Years_War_struggle.1001.a:0 "The Hundred Years' War is now a matter of history..."
 Hundred_Years_War_struggle.1001.desc.no_english_crown:0 "[struggle_ender.GetTitledFirstName] has proclaimed French victory in the Hundred Years' War. Normandy, Gascony, and Maine have been recovered, and the English crown has no holder.\n\nProclamations are being sent to the courts of the lords, announcing the end of the long contest for the throne."
 Hundred_Years_War_struggle.1002.t:0 "$struggle_france_england_ending_england_decision$"
 Hundred_Years_War_struggle.1002.desc:0 "It is over.\n\nWe have won—the French are defeated.\n\nFor over a century, the bloody conflict between England and France has raged since Edward III claimed the French throne. Through the glorious victories of the Black Prince, the miracle of Agincourt under Henry V, and countless sieges and assaults—we, the English, have emerged victorious from this long war. If only our ancestors—William the Conqueror or Richard the Lionheart—could see our success! Almost no one believed this day would come, but we held firm, and [ROOT.Char.GetFaith.HighGodName] has granted us this hard-won victory.\n\nHaving decided how our rule shall endure, all that remains is to proclaim our triumph."
 Hundred_Years_War_struggle.1002.a:0 "Establish an unassailable military hegemony."
 Hundred_Years_War_struggle.1002.b:0 "Spread and promote our superior culture."
 Hundred_Years_War_struggle.1002.c:0 "Establish an unshakable royal authority."
 Hundred_Years_War_struggle.1003.t:0 "$struggle_france_england_ending_england_decision$"
 Hundred_Years_War_struggle.1003.desc:0 "It is #italic finally#! over.\n\nFor the first time in over a century, England and France are no longer at war or preparing for war. Under the leadership of [struggle_ender.GetTitledFirstName], the English have triumphed over the French. Now, England stands as the mightiest power in [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName], and [struggle_ender.GetSheHe] will surely be remembered as one of the greatest monarchs in English history—perhaps even surpassing William the Conqueror.\n\n"
 Hundred_Years_War_struggle.1003.desc.closing.war:0 "[struggle_ender.GetTitledFirstNameNoTooltip] intends to maintain long-term rule over this region by continuing to employ the proven might of English arms. Only through force can England ensure that no one will ever challenge their authority as the French once did."
 Hundred_Years_War_struggle.1003.desc.closing.culture:0 "[struggle_ender.GetTitledFirstNameNoTooltip] intends to spread and promote English culture among [struggle_ender.GetHerHis] people to dominate this region. [struggle_ender.GetSheHe|U] believes that from the ashes of the Hundred Years' War, a new English world shall grow and flourish."
 Hundred_Years_War_struggle.1003.desc.closing.politics:0 "[struggle_ender.GetTitledFirstNameNoTooltip] intends to use intrigue and political cunning to bend the lesser states to England's will, and to rule this region for the long term. Maintaining control over this region will require a firm and careful approach."
 Hundred_Years_War_struggle.1003.desc.closing:0 "\n\nA new age has dawned. The shape of the future, the fate of the world—all of it belongs to #bold England#!."
 Hundred_Years_War_struggle.1003.a:0 "$Hundred_Years_War_struggle.1002.a$"
 Hundred_Years_War_struggle.1004.t:0 "$struggle_france_england_ending_union_decision$"
 Hundred_Years_War_struggle.1004.desc:0 "It is over.\n\nWe have won—the war is over—#italic forever#!.\n\nFor over a century, the English and the French have slaughtered each other, spilling rivers of blood. They fought over a crown, a few territories, destroying their kingdoms and societies in an endless cycle of violence. Yet [struggle_ender.GetTitledFirstName] saw a future beyond hatred—a future where England and France are not enemies, but brothers.\n\nNow, for the first time, both shores of the Channel are truly united. If only our ancestors could see our success! Almost no one believed this day would come, but we held firm, and [ROOT.Char.GetFaith.HighGodName] has granted us this hard-won victory.\n\nHaving decided how our rule shall endure, all that remains is to proclaim our triumph."
 angevin_decision_hybrid_tt:0 "You have created the Angevin hybrid culture—a unique civilization blending English and French traditions."
 innovation_angevin_chivalry:0 "Angevin Chivalry"
 innovation_angevin_chivalry_desc:0 "Fusing the military traditions of English longbowmen and French heavy cavalry, Angevin knights are capable of both long-range suppression and devastating shock charges on the battlefield."
 innovation_angevin_administration:0 "Angevin Administration"
 innovation_angevin_administration_desc:0 "Combining the English parliamentary tradition with the authority of the French crown, the art of governance in the Angevin Empire strikes a balance between efficiency and legitimacy."
 name_list_angevin:0 "Angevin"
 angevin:0 "Angevin"
 Hundred_Years_War_struggle.1004.a:0 "$Hundred_Years_War_struggle.1002.a$"
 Hundred_Years_War_struggle.1004.b:0 "$Hundred_Years_War_struggle.1002.b$"
 Hundred_Years_War_struggle.1004.c:0 "$Hundred_Years_War_struggle.1002.c$"
 Hundred_Years_War_struggle.1005.t:0 "$struggle_france_england_ending_union_decision$"
 Hundred_Years_War_struggle.1005.desc:0 "It is #italic finally#! over.\n\nFor the first time in over a century, England and France are no longer at war or preparing for war—not because one side has conquered the other, but because #italic hatred itself#! has been overcome. Under the leadership of [struggle_ender.GetTitledFirstName], the united kingdom has brought together the peoples of both shores into a great commonwealth. [struggle_ender.GetSheHe|U] will surely be remembered as one of the greatest monarchs in history—as the reconciler and unifier of two ancient peoples.\n\n"
 Hundred_Years_War_struggle.1005.desc.closing.war:0 "[struggle_ender.GetTitledFirstNameNoTooltip] intends to defend this newborn empire by continuing to employ the proven might of the united kingdom's armies. Only through force can we ensure that no one dares challenge the union of the two shores."
 Hundred_Years_War_struggle.1005.desc.closing.culture:0 "[struggle_ender.GetTitledFirstNameNoTooltip] intends to blend English and French cultures, birthing a new, unified civilization between the two shores. [struggle_ender.GetSheHe|U] believes that from the ashes of the Hundred Years' War, a new Anglo-French world shall grow and flourish."
 Hundred_Years_War_struggle.1005.desc.closing.politics:0 "[struggle_ender.GetTitledFirstNameNoTooltip] intends to use wisdom and diplomacy to bind the nobles and vassals of both shores together beneath the united crown. Maintaining loyalty to this great cause will require firm and careful governance."
 Hundred_Years_War_struggle.1005.desc.closing:0 "\n\nA new age has dawned. The shape of the future, the fate of the world—all of it belongs to #bold [struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip]#!."
 Hundred_Years_War_struggle.1005.a:0 "$Hundred_Years_War_struggle.1002.a$"
 Hundred_Years_War_struggle.1006.t:0 "[struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip] Displaces the English and the French"
 Hundred_Years_War_struggle.1006.desc:0 "It is #italic finally#! over.\n\nFor over a century, the English and the French have slaughtered each other, spilling rivers of blood over a few territories and a crown. They were so consumed by their hatred for one another that they never noticed #italic us#!—the [struggle_ender.GetCulture.GetCollectiveNoun] people of [struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip]—rising from the shadows.\n\nNow, these two once-mighty kingdoms have exhausted themselves in their long war, and we have reaped the rewards. [struggle_ender.GetTitledFirstName] has brought this war-torn region under [struggle_ender.GetHerHis] rule, ending the endless conflict.\n\nThe proud English and the haughty French fought each other for centuries, blind to their own impending fall. Their folly shall be remembered by our people for generations to come.\n\nHaving decided how our rule shall endure, all that remains is to proclaim our triumph."
 Hundred_Years_War_struggle.1006.a:0 "Glory to [struggle_ender.GetFaith.HighGodName]—glory to our new empire!"
 Hundred_Years_War_struggle.1007.t:0 "$Hundred_Years_War_struggle.1006.t$"
 Hundred_Years_War_struggle.1007.desc:0 "For over a century, the English and the French fought each other; for over a century, the two kingdoms slaughtered each other over a few territories; for over a century, the English and the French and their allies destroyed each other's villages and towns in an endless cycle of violence.\n\nNow? They have nothing left but ashes.\n\nHow ironic that in the end, no one truly won—instead, it was the [struggle_ender.GetCulture.GetCollectiveNoun] people of [struggle_ender.GetTitledFirstName] who seized control of [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName] from these two ancient and decaying kingdoms, and established a new power here!\n\nThe English and the French fought each other for centuries, blind to their own impending fall. Their folly shall be replaced by us.\n\nA new age has dawned. The shape of the future, the fate of the world—all of it belongs to #bold [struggle_ender.GetPrimaryTitle.GetNameNoTierNoTooltip]#!."
 struggle_england_france_outsider_victory_tt:0 "Your [empire|E][title|E] becomes the [de_jure|E][liege|E] of all [kingdom|E]s you control within the [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]"
 struggle_england_france_outsier_victory_notification_tt:0 "[struggle_ender.GetPrimaryTitle.GetNameNoTier] becomes the [de_jure|E][liege|E] of all [kingdom|E]s within the [GetGeographicalRegion('MOH_Hundred_Years_War_struggle_region').GetName][region|E]"
 Hundred_Years_War_struggle.1007.a:0 "$Hundred_Years_War_struggle.1002.a$"
