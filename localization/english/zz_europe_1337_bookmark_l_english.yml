l_english:
 bm_hundred_years_alfonso:0 "Alfonso XI"
 bm_hundred_years_alfonso_subheading:0 "King of Castile"
 bm_hundred_years_alfonso_desc:0 "Alfonso XI rules Castile, where rival monarchs and southern powers shape the struggle for Iberia."
 bm_hundred_years_ludwig:0 "Louis IV"
 bm_hundred_years_ludwig_subheading:0 "Holy Roman Emperor"
 bm_hundred_years_ludwig_desc:0 "Emperor Louis IV must balance the interests of imperial princes with his dynasty’s ambitions."
 bm_hundred_years_john:0 "John the Blind"
 bm_hundred_years_john_subheading:0 "King of Bohemia"
 bm_hundred_years_john_desc:0 "John of Luxembourg rules Bohemia and participates in the politics and wars of Europe. What legacy will he leave his house?"
 bm_hundred_years_charles:0 "Charles"
 bm_hundred_years_charles_subheading:0 "Heir in Moravia"
 bm_hundred_years_charles_desc:0 "Charles, son of King John of Bohemia, already holds lands in Moravia. His dynastic path is only beginning."
 bm_hundred_years_casimir:0 "Casimir III"
 bm_hundred_years_casimir_subheading:0 "King of Poland"
 bm_hundred_years_casimir_desc:0 "Casimir III must consolidate Poland and manage its relations with powerful neighbors."
 bm_hundred_years_gediminas:0 "Gediminas"
 bm_hundred_years_gediminas_subheading:0 "Grand Duke of Lithuania"
 bm_hundred_years_gediminas_desc:0 "Gediminas rules Lithuania, defending its position among Baltic peoples, neighboring states and crusading powers."
 bm_hundred_years_magnus:0 "Magnus IV"
 bm_hundred_years_magnus_subheading:0 "King of Sweden and Norway"
 bm_hundred_years_magnus_desc:0 "Magnus IV rules both Sweden and Norway, balancing the interests of nobles across Scandinavia."
 bm_hundred_years_dusan:0 "Stefan Dušan"
 bm_hundred_years_dusan_subheading:0 "King of Serbia"
 bm_hundred_years_dusan_desc:0 "Stefan Dušan rules Serbia amid the rival powers of the Balkans, including Byzantium."
 bm_hundred_years_alexander:0 "Ivan Alexander"
 bm_hundred_years_alexander_subheading:0 "Tsar of Bulgaria"
 bm_hundred_years_alexander_desc:0 "Ivan Alexander rules Bulgaria, defending the tsar’s authority among the powers of the Balkans."
 bm_hundred_years_basarab:0 "Basarab"
 bm_hundred_years_basarab_subheading:0 "Lord of Wallachia"
 bm_hundred_years_basarab_desc:0 "Basarab rules Wallachia. Surrounded by powerful neighbors, he must protect his position and his family’s future."
 bm_hundred_years_andronikos:0 "Andronikos III"
 bm_hundred_years_andronikos_subheading:0 "Byzantine Emperor"
 bm_hundred_years_andronikos_desc:0 "Andronikos III rules Byzantium, confronting rivals in the Balkans and Anatolia."
 bm_hundred_years_orhan:0 "Orhan"
 bm_hundred_years_orhan_subheading:0 "Ottoman Ruler"
 bm_hundred_years_orhan_desc:0 "Orhan leads the Ottomans, facing Anatolian neighbors and Byzantium across the straits."
