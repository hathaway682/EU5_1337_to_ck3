l_english:
 bm_yuan_dynasty:0 "The Great Yuan"
 bm_yuan_dynasty_desc:0 "In 1337, the Yuan still rule a vast China. Ministers, loyalists, merchants and future rebel leaders live beneath the same imperial order; great upheaval lies ahead."
 bm_yuan_koke:0 "Köke Temür"
 bm_yuan_chen_youliang:0 "Chen Youliang"
 bm_yuan_bayan:0 "Bayan"
 bm_yuan_bayan_subheading:0 "Grand Councillor of Yuan"
 bm_yuan_bayan_desc:0 "Bayan occupies the Chancellery and directs affairs for the Yuan court, whose vast dominion faces difficult challenges."
 bm_yuan_han:0 "Han Shantong"
 bm_yuan_han_subheading:0 "White Lotus Leader"
 bm_yuan_han_desc:0 "Han Shantong spreads Maitreyan beliefs. The Red Turban uprising has not yet begun, and his future remains unwritten."
 bm_yuan_zhu:0 "Zhu Yuanzhang"
 bm_yuan_zhu_subheading:0 "A Boy from Fengyang"
 bm_yuan_zhu_desc:0 "Zhu Yuanzhang is still a child, far from becoming the founder of the Ming. What path will he forge in the years ahead?"
 bm_yuan_xu:0 "Xu Shouhui"
 bm_yuan_xu_subheading:0 "Future Lord of Tianwan"
 bm_yuan_xu_desc:0 "Xu Shouhui has yet to establish his realm. His associate Chen Youliang is at his side; their destinies lie ahead."
 bm_yuan_zhang:0 "Zhang Shicheng"
 bm_yuan_zhang_subheading:0 "Salt Merchant of Huaidong"
 bm_yuan_zhang_desc:0 "Zhang Shicheng makes his living as a salt merchant. The future ruler must first find his place in the Yuan economy."
 bm_yuan_chaghan:0 "Chaghan Temur"
 bm_yuan_chaghan_subheading:0 "Loyal Servant of Yuan"
 bm_yuan_chaghan_desc:0 "Chaghan Temur lives with his family under Yuan rule in Henan. He will later become an important commander against the Red Turbans."
 bm_yuan_he:0 "He Zhen"
 bm_yuan_he_subheading:0 "Loyalist of Lingnan"
 bm_yuan_he_desc:0 "He Zhen begins as a Yuan noble in Lingnan. An age of upheaval will bring opportunity and test his loyalty."
 BM_YUAN_RELATION_FOLLOWER:0 "Follower"
