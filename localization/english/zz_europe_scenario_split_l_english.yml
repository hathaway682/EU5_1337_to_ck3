l_english:
 bm_europe_pillars:0 "Pillars of Hercules"
 bm_europe_pillars_desc:0 "Castile, Granada and Morocco contend across the gateway between the Atlantic and the Mediterranean. Faith, trade and war will shape the shores of the strait."
 bm_europe_twilight:0 "Twilight of Empires"
 bm_europe_twilight_desc:0 "Balkan rulers, Byzantium and the rising Ottomans compete for influence. An ancient empire endures while new powers seek their opportunity."
 bm_europe_northern:0 "Northern Crusades"
 bm_europe_northern_desc:0 "From the Holy Roman Empire to Scandinavia and the Baltic, rulers, military orders and pagan grand dukes contend for power and faith."
 bm_europe_granada:0 "Yusuf I"
 bm_europe_granada_subheading:0 "Sultan of Granada"
 bm_europe_granada_desc:0 "Yusuf I rules Granada, navigating the ambitions of Iberian neighbors and allies across the strait."
 bm_europe_morocco:0 "Abu al-Hasan Ali"
 bm_europe_morocco_subheading:0 "Sultan of Morocco"
 bm_europe_morocco_desc:0 "The Marinid ruler Abu al-Hasan governs Morocco, while events on both sides of the strait shape his kingdom’s future."
 bm_europe_teutonic:0 "Dietrich von Altenburg"
 bm_europe_teutonic_subheading:0 "Grand Master of the Teutonic Order"
 bm_europe_teutonic_desc:0 "Dietrich leads the Teutonic Order in Prussia, facing neighboring rulers and Lithuania along the Baltic frontier."
