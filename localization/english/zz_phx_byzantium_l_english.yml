l_english:
 # === Story Cycle ===
 story_phx_byz_civil_war:0 "The Palaiologos–Kantakouzenos Civil War"
 story_phx_byz_civil_war_desc:0 "Rival claimants tear at the purple robe of Constantinople while communes rebel in Thessalonica and foreign powers circle the weakened frontiers."
 phx_byz_civil_war_story_status:0 "The Empire endures the bitter struggle between the imperial palace and the Kantakouzenos faction. Restoring order and securing peace will bring this crisis to an end."

 # === Casus Belli ===
 phx_byz_theme_reconquest_cb:0 "Imperial Theme Reconquest"
 PHX_BYZ_THEME_RECONQUEST_WAR_NAME:0 "$ORDER$$FIRST_ADJ$ Reconquest of $DEFENDER$"
 PHX_BYZ_THEME_RECONQUEST_WAR_NAME_BASE:0 "$FIRST_ADJ$$SECOND_NAME$"
 PHX_BYZ_THEME_RECONQUEST_CB_NAME:0 "Reclaim Imperial Theme"
 phx_byz_theme_reconquest_cb_victory_desc_attacker:0 "You reclaim the targeted imperial theme and restore direct Roman rule over its contested provinces."
 phx_byz_theme_reconquest_cb_victory_desc:0 "[attacker.GetShortUIName|U] reclaims the targeted imperial theme and restores Roman dominion over the province."
 phx_byz_theme_reconquest_cb_white_peace_desc:0 "The campaign ends without territorial change, leaving the frontier contested."
 phx_byz_theme_reconquest_cb_defeat_desc:0 "The Roman advance is thrown back, forcing [attacker.GetShortUIName] to pay reparations and suffer a blow to imperial prestige."
 phx_byz_theme_reconquest_cb_invalidated_desc:0 "The Imperial Theme Reconquest war has become invalid because the disputed lands changed hands."

 # === Modifiers (v0.1 + v1.0) ===
 phx_byz_1337_twilight_modifier:0 "Twilight of the Palaiologoi"
 phx_byz_1337_twilight_modifier_desc:0 "Decades of civil strife, debased coinage, and frontier losses have stretched the imperial fisc and the old thematic levies to their breaking point."
 phx_byz_kantakouzenos_accord_modifier:0 "Palaiologos–Kantakouzenos Concord"
 phx_byz_kantakouzenos_accord_modifier_desc:0 "A solemn understanding binds the imperial throne and the Grand Domestic's house, lending steadiness to the senatorial court."
 phx_byz_dynastic_centralization_modifier:0 "Autokrator's Iron Court"
 phx_byz_dynastic_centralization_modifier_desc:0 "The palace has reasserted direct imperial command over magnate factions, ruling through strict discipline and watchful eyes."
 phx_byz_theme_reform_modifier:0 "Reformed Imperial Themes"
 phx_byz_theme_reform_modifier_desc:0 "Restored military-administrative districts tie provincial revenues directly to disciplined frontier troops and loyal strategoi."
 phx_byz_imperial_navy_modifier:0 "Reborn Imperial Dromon Fleet"
 phx_byz_imperial_navy_modifier_desc:0 "New slipways along the Golden Horn once more send Roman war-galleys patrolling the Marmara and Aegean lanes."
 phx_byz_varangian_revived_modifier:0 "Reconstituted Varangian Guard"
 phx_byz_varangian_revived_modifier_desc:0 "Axe-bearing sworn guardsmen once again stand watch before the porphyry chambers of Blachernae."
 phx_byz_anatolian_themes_restored_modifier:0 "Anatolian Heartland Reclaimed"
 phx_byz_anatolian_themes_restored_modifier_desc:0 "With the fertile valleys of Bithynia and western Asia Minor returned to Roman rule, the Empire breathes with renewed vigor."
 phx_byz_pentarchy_guardian_modifier:0 "Guardian of the Pentarchy"
 phx_byz_pentarchy_guardian_modifier_desc:0 "The ancient apostolic sees look to Constantinople as the steadfast shield of Eastern Christendom."
 phx_byz_council_union_modifier:0 "Envoys of Church Union"
 phx_byz_council_union_modifier_desc:0 "Diplomatic overtures to the Latin West bring gold and mercenary contracts, though murmurs of unease echo through the monasteries."
 phx_byz_orthodox_bulwark_modifier:0 "Unbroken Bulwark of Orthodoxy"
 phx_byz_orthodox_bulwark_modifier_desc:0 "Refusing doctrinal compromise has rallied monks, bishops, and common citizens behind the Roman banner."
 phx_byz_balkan_march_modifier:0 "Fortified Imperial March"
 phx_byz_balkan_march_modifier_desc:0 "Repaired citadels, signal beacons, and frontier garrisons brace this province against sudden incursions."
 phx_byz_constantinople_renaissance_modifier:0 "Renewal of the Queen of Cities"
 phx_byz_constantinople_renaissance_modifier_desc:0 "Restored harbors, bustling workshops, and returning scholars breathe new life into the halls of Constantinople."
 phx_byz_morea_despotate_modifier:0 "Despotate of the Morea"
 phx_byz_morea_despotate_modifier_desc:0 "Centered on the hillside citadel of Mystras, an imperial appanage in the Peloponnese anchors Hellenic learning and southern defense."
 phx_byz_hesychasm_triumph_modifier:0 "Triumph of Hesychasm"
 phx_byz_hesychasm_triumph_modifier_desc:0 "The contemplative theology of Mount Athos and Gregory Palamas reigns supreme in the Great Church, uniting monk and layman in fervent devotion."
 phx_byz_humanist_inquiry_modifier:0 "Imperial Humanist Academies"
 phx_byz_humanist_inquiry_modifier_desc:0 "Classical philosophy, astronomy, and rhetoric flourish under palace patronage, drawing curious minds despite murmurs from conservative cloisters."
 phx_byz_galata_customs_modifier:0 "Reclaimed Golden Horn Customs"
 phx_byz_galata_customs_modifier_desc:0 "Imperial toll-collectors once again command the merchant quays of the Bosporus, ending the ruinous drain of revenue to foreign concessions."
 phx_byz_zealot_unrest_modifier:0 "Zealot Commune Unrest"
 phx_byz_zealot_unrest_modifier_desc:0 "Radical sailors and guildsmen hold the gates in open defiance of aristocratic landlords, disrupting tax rolls and military levies."
 phx_byz_praetorian_prefectures_modifier:0 "Restored Praetorian Prefectures"
 phx_byz_praetorian_prefectures_modifier_desc:0 "Reviving the grand civil prefectures of Oriens and Illyricum weaves Europe and Asia Minor back into a coherent Roman administration."
 phx_byz_theodosian_walls_modifier:0 "Restored Theodosian Walls"
 phx_byz_theodosian_walls_modifier_desc:0 "Freshly dressed ashlar towers, cleared moats, and reinforced sea-bastions render the Queen of Cities a formidable bastion once more."
 phx_byz_civil_war_scar_modifier:0 "Scars of Dynastic Civil War"
 phx_byz_civil_war_scar_modifier_desc:0 "Competing court factions, plundered estates, and mutual suspicion sap the unity and revenues of the Roman realm."

 # === Regiments ===
 phx_byz_varangian_regiment_name:0 "Imperial Varangian Tagma"
 phx_byz_akritai_vanguard_name:0 "Hellespont Akritai Vanguard"
 phx_byz_turkic_mercenary_band_name:0 "Bithynian Auxiliary Horsemen"
 phx_byz_serbian_mercenary_band_name:0 "Vardar Heavy Mercenaries"
 phx_byz_loyalist_levies_name:0 "Loyalist Thracian Militia"

 # === Decisions (10 Byzantium) ===
 phx_byz_reform_imperial_themes_decision:0 "Reform the Imperial Themes"
 phx_byz_reform_imperial_themes_decision_desc:0 "The ancient pronoia grants have frayed into private fiefs while frontier strongholds starve for coin and men. By reorganizing the core provinces under accountable thematic commands, the Roman state can shed the lethargy of recent decades."
 phx_byz_reform_imperial_themes_decision_tooltip:0 "Reorganize the core imperial provinces to end the 1337 fiscal and military malaise."
 phx_byz_reform_imperial_themes_decision_confirm:0 "Issue the Chrysobull of Reform"
 phx_byz_reform_imperial_themes_effect_tt:0 "Ends the Twilight of the Palaiologoi and inaugurates a reformed thematic administration across the Empire."

 phx_byz_rebuild_imperial_navy_decision:0 "Rebuild the Imperial Dromon Fleet"
 phx_byz_rebuild_imperial_navy_decision_desc:0 "For too long Italian galleys have dictated customs at our own sea-walls while raiders cross the straits unchallenged. Reopening the imperial dockyards of the Golden Horn will restore Roman mastery of the narrow seas."
 phx_byz_rebuild_imperial_navy_decision_tooltip:0 "Restore the imperial shipyards of Constantinople and re-establish a permanent Roman fleet."
 phx_byz_rebuild_imperial_navy_decision_confirm:0 "Launch the New Keels"
 phx_byz_rebuild_imperial_navy_effect_tt:0 "Revitalizes Constantinople's maritime quarters and strengthens Roman naval operations."

 phx_byz_reconstitute_varangians_decision:0 "Reconstitute the Varangian Guard"
 phx_byz_reconstitute_varangians_decision_desc:0 "Kings and usurpers alike once trembled before the Emperor's sworn northern axe-men. Summoning seasoned warriors from across the seas to renew their oaths at Blachernae will place an unbreakable blade beside the throne."
 phx_byz_reconstitute_varangians_decision_tooltip:0 "Summon elite sworn guardsmen to Constantinople to serve as the Emperor's personal tagma."
 phx_byz_reconstitute_varangians_decision_confirm:0 "Administer the Varangian Oath"
 phx_byz_reconstitute_varangians_effect_tt:0 "Raises a sworn Varangian and Cataphract household regiment at Constantinople."

 phx_byz_reclaim_anatolian_heartland_decision:0 "Proclaim the Reclamation of Asia Minor"
 phx_byz_reclaim_anatolian_heartland_decision_desc:0 "From Nicaea to the Aegean shore, the lost Anatolian heartland was for centuries the sinew of Roman armies and imperial grain. With imperial banners raised once more over Marmara and western Anatolia, the Queen of Cities may celebrate a triumph worthy of the Komnenoi."
 phx_byz_reclaim_anatolian_heartland_decision_tooltip:0 "Celebrate the recovery of Marmara and western Anatolia with an imperial triumph."
 phx_byz_reclaim_anatolian_heartland_decision_confirm:0 "Hold the Imperial Triumph"
 phx_byz_reclaim_anatolian_heartland_effect_tt:0 "Proclaims the permanent recovery of the Anatolian themes and elevates imperial renown."

 phx_byz_church_union_council_decision:0 "Convene the Council of Church Union"
 phx_byz_church_union_council_decision_desc:0 "Envoys from the Latin West whisper that fleets and subsidies await if Constantinople will mend its rift with the Roman See. Yet within the Great Church, bishops and citizens warn that bartering the faith would shatter the soul of the Empire."
 phx_byz_church_union_council_decision_tooltip:0 "Decide whether the Empire seeks diplomatic union with the West or stands firm in Orthodoxy."
 phx_byz_church_union_council_decision_confirm:0 "Summon the Synod"
 phx_byz_church_union_council_effect_tt:0 "Opens a council deliberation to choose between Western diplomatic union and unwavering Orthodoxy."

 phx_byz_restore_pentarchy_authority_decision:0 "Affirm the Authority of the Pentarchy"
 phx_byz_restore_pentarchy_authority_decision_desc:0 "As ancient patriarchates return beneath Roman protection, the voices of Constantinople, Antioch, Jerusalem, Alexandria, and Rome can once more speak in concert to anchor the Christian world."
 phx_byz_restore_pentarchy_authority_decision_tooltip:0 "Proclaim imperial guardianship over the ancient apostolic sees of the Pentarchy."
 phx_byz_restore_pentarchy_authority_decision_confirm:0 "Proclaim the Pentarchy Charter"
 phx_byz_restore_pentarchy_authority_effect_tt:0 "Establishes imperial guardianship over the recovered sees of the Pentarchy."

 phx_byz_establish_morea_despotate_decision:0 "Establish the Despotate of the Morea"
 phx_byz_establish_morea_despotate_decision_desc:0 "High above the Eurotas valley, the fortified hillside of Mystras looks down upon the Frankish castles of the Peloponnese. Elevating Laconia into a formal imperial Despotate will turn southern Greece into a resilient redoubt of Roman arms and letters."
 phx_byz_establish_morea_despotate_decision_tooltip:0 "Formalize the Despotate of the Morea at Mystras to strengthen southern Greek governance and learning."
 phx_byz_establish_morea_despotate_decision_confirm:0 "Charter the Despotate"
 phx_byz_establish_morea_despotate_effect_tt:0 "Establishes the Despotate of the Morea, fortifying Laconia and boosting imperial scholarship and legitimacy."

 phx_byz_reclaim_galata_customs_decision:0 "Revoke Genoese Galata Privileges"
 phx_byz_reclaim_galata_customs_decision_desc:0 "Across the narrow waters of the Golden Horn, the fortified Genoese quarter of Galata collects far more in maritime tolls than the Emperor's own harbor. Ending these unequal exemptions will restore the lifeblood of trade to Constantinople's fisc."
 phx_byz_reclaim_galata_customs_decision_tooltip:0 "Reassert imperial customs sovereignty over the Golden Horn at the expense of Genoese privileges."
 phx_byz_reclaim_galata_customs_decision_confirm:0 "Enforce Imperial Customs"
 phx_byz_reclaim_galata_customs_effect_tt:0 "Reclaims the maritime customs of the Golden Horn, enriching Constantinople while angering Genoa."

 phx_byz_hesychast_synod_decision:0 "Convene the Hesychast Synod of Blachernae"
 phx_byz_hesychast_synod_decision_desc:0 "From the cells of Mount Athos to the lecture halls of Constantinople, clerics and scholars clash fiercely over the nature of divine illumination and human reason. An imperial synod at Blachernae must settle the spiritual course of the Roman realm."
 phx_byz_hesychast_synod_decision_tooltip:0 "Convene a synod at Blachernae to resolve the Hesychast controversy between mysticism and humanism."
 phx_byz_hesychast_synod_decision_confirm:0 "Open the Blachernae Synod"
 phx_byz_hesychast_synod_effect_tt:0 "Convenes the Synod of Blachernae, allowing you to endorse Hesychasm or imperial humanist inquiry."

 phx_byz_restore_praetorian_prefectures_decision:0 "Restore the Praetorian Prefectures"
 phx_byz_restore_praetorian_prefectures_decision_desc:0 "With Thrace, Macedonia, the Peloponnese, and the shores of Marmara securely reunited under the eagle, the Empire has outgrown makeshift emergency commands. Reviving the ancient Praetorian Prefectures of the East and Illyricum will announce to the world that New Rome governs once more in full majesty."
 phx_byz_restore_praetorian_prefectures_decision_tooltip:0 "Re-establish the Praetorian Prefectures of the East and Illyricum across your reunited European and Anatolian heartlands."
 phx_byz_restore_praetorian_prefectures_decision_confirm:0 "Proclaim the Prefectures"
 phx_byz_restore_praetorian_prefectures_effect_tt:0 "Restores the Praetorian Prefectures of Oriens and Illyricum, elevating imperial governance and prestige."

 # === Events (24 Byzantium) ===
 phx_byz.0001.t:0 "Twilight Over the Golden Horn"
 phx_byz.0001.desc:0 "The spring of 1337 finds the Roman Empire hemmed in on every horizon. Across the narrow waters of the Marmara, Turkish horsemen gaze upon the domes of Constantinople; along the Vardar, Serbian ambitions stir; within the city itself, merchants trade in foreign silver while the treasury ledger grows thin.\n\nYet the triple walls of Theodosius still stand unbroken, and the banners of the Palaiologoi still fly from Blachernae. Whether this hour marks the sunset of New Rome or the ember of a phoenix's rebirth will be decided by the steadiness of your hand."
 phx_byz.0001.a:0 "The eagles of Rome have outlasted worse storms."
 phx_byz.0001.b:0 "First mend the purse, and armies will follow."

 phx_byz.0010.t:0 "The Grand Domestic's Counsel"
 phx_byz.0010.desc:0 "In the quiet colonnades of Blachernae, [kantakouzenos.GetTitledFirstName] lays maps of Thrace and Macedonia before the council table. Wealthy, learned, and commanding the loyalty of seasoned field officers, he offers to bind his house's fortunes squarely to the throne—yet court whisperers warn that a subject so mighty may one day eclipse the sovereign himself."
 phx_byz.0010.a:0 "Seal a formal concord between our houses."
 phx_byz.0010.b:0 "An emperor shares the purple with no magnate."

 phx_byz.0015.t:0 "Shadows Around the Porphyry Throne"
 phx_byz.0015.desc:0 "Scarcely have the funeral bells for the late Autokrator fallen silent than rival whispers fill the palace corridors. [kantakouzenos.GetTitledFirstName] commands the respect of the frontier armies and claims the late emperor's trust, while palace officials urge you to break his faction before he dons the red boots himself."
 phx_byz.0015.a:0 "Confirm [kantakouzenos.GetFirstNameNoTooltip] as chief guardian of the realm."
 phx_byz.0015.b:0 "Dismiss his faction—if he wants the purple, let him fight for it!"
 phx_byz_civil_war_averted_tt:0 "Averts or ends open dynastic civil war through a costly regency concession."
 phx_byz_civil_war_erupts_tt:0 "Ignites the Palaiologos–Kantakouzenos Civil War, initiating its story cycle and provoking an armed claimant challenge."

 phx_byz.0020.t:0 "Fires Across the Hellespont"
 phx_byz.0020.desc:0 "Watchtowers along the Thracian shore report smoke rising from the Bithynian coast, where [ottoman_ruler.GetTitledFirstName] consolidates garrisons within sight of our straits. Captains warn that if the Beylik secures a permanent foothold on the European shore, the approaches to Constantinople itself will lie exposed."
 phx_byz.0020.a:0 "Reinforce the Thracian citadels and strait watches."
 phx_byz.0020.b:0 "Call up the frontier Akritai to strike first."
 phx_byz.0020.c:0 "Send envoys to purchase a season of quiet."

 phx_byz.0030.t:0 "Ambition Along the Vardar"
 phx_byz.0030.desc:0 "Reports from Thessalonica speak of heavy cavalry mustering in the highlands under [serbian_king.GetTitledFirstName]. The Serbian court eyes the rich plains of Macedonia with undisguised hunger, testing whether Constantinople still has the iron to guard its western march."
 phx_byz.0030.a:0 "Strengthen the garrisons guarding Thrace and Macedonia."
 phx_byz.0030.b:0 "Appeal to our shared Orthodox crown and seek an understanding."

 phx_byz.0040.t:0 "Dawn Over the Queen of Cities"
 phx_byz.0040.desc:0 "Along the Mese, masons once more chisel fresh marble for restored porticoes, and merchant keels crowd the piers of the Golden Horn under imperial customs banners. Scholars gather again in the halls of the Magnaura, speaking no longer of survival alone, but of a Roman renewal."
 phx_byz.0040.a:0 "May the light of New Rome shine across the seas!"

 phx_byz.0050.t:0 "The Zealots of Thessalonica"
 phx_byz.0050.desc:0 "Couriers arrive breathless from the second city of the Empire: sailors, artisans, and radical partisans calling themselves the Zealots have stormed the aristocratic mansions of Thessalonica, raising their own banners along the harbor walls. Denouncing wealthy magnates as traitors to the common folk, they govern the city as a defiant commune amid the chaos of our civil strife."
 phx_byz.0050.a:0 "Recognize their municipal charter until calmer days return."
 phx_byz.0050.b:0 "Dispatch imperial guards to break the commune by force."
 phx_byz_zealot_compromise_tt:0 "Leaves the Thessalonican commune intact for several years while preserving imperial coffers."
 phx_byz_zealot_crackdown_tt:0 "Shortens the unrest through harsh military intervention at immediate fiscal and control cost."

 phx_byz.0055.t:0 "The Devil's Bargain"
 phx_byz.0055.desc:0 "With imperial troops locked in fratricidal struggle across Thrace and Macedonia, desperate councillors whisper of foreign blades waiting just beyond our borders. Across the Marmara, Turkish horsemen stand eager for Roman gold and footholds on the straits; to the north, Serbian knights offer steel in exchange for Macedonian towns. Either pact could tip the war—yet history warns that guests invited across Roman walls seldom depart."
 phx_byz.0055.a:0 "Summon Turkish auxiliaries across the straits."
 phx_byz.0055.b:0 "Contract Serbian heavy cavalry from the north."
 phx_byz.0055.c:0 "No foreign host shall march on Roman roads—rely on our own!"
 phx_byz_bargain_ottoman_tt:0 "Brings Turkish mercenary horsemen into the field, while granting the Ottoman ruler gold and a claim on the Dardanelles."
 phx_byz_bargain_serbia_tt:0 "Brings Serbian heavy cavalry into the field, while granting the Serbian ruler prestige and a claim in Macedonia."

 phx_byz.0060.t:0 "Ashes and Purple"
 phx_byz.0060.desc:0 "At last the horns of civil war fall silent across the bruised fields of Thrace. Burnt mills, empty granaries, and watchful noble houses bear witness to the cost of Roman fighting Roman, yet the crown of Constantinople stands undisputed once more. Now comes the harder trial: binding the wounds of the state before our neighbors feast upon the wreckage."
 phx_byz.0060.a:0 "Proclaim a general amnesty and rebuild the Queen of Cities."
 phx_byz.0060.b:0 "Seize the estates of disloyal magnates to refill the fisc."

 phx_byz.0065.t:0 "The Light of Mount Tabor"
 phx_byz.0065.desc:0 "A fierce theological tempest grips the monasteries and porticoes of Constantinople. The Athonite monk Gregory Palamas teaches that through silent Hesychast prayer, mortals may behold the uncreated Light of God—a doctrine derided as rustic superstition by the Calabrian scholar Barlaam and classical humanists at court. Both sides now petition the throne to speak."
 phx_byz.0065.a:0 "Stand with Gregory Palamas and the monks of Mount Athos."
 phx_byz.0065.b:0 "Defend philosophical reason and classical scholarship."

 phx_byz.0070.t:0 "Customs of Galata"
 phx_byz.0070.desc:0 "From the terraces of Blachernae, the contrast is impossible to ignore: across the Golden Horn, Genoese Galata bristles with cranes, full warehouses, and armed towers, while imperial customs collectors along our own docks tally a trickle of copper. Merchants complain that foreign duty exemptions are starving Constantinople of its own trade."
 phx_byz.0070.a:0 "Cut Roman harbor duties to lure merchants back to our quays."
 phx_byz.0070.b:0 "Renew Genoese charters in exchange for immediate silver."

 phx_byz.0075.t:0 "Envoys from the Grand Komnenoi"
 phx_byz.0075.desc:0 "A galley flying the golden eagle of Trebizond drops anchor beneath the sea-walls, bearing Pontic emissaries laden with silver, silk, and cautious compliments. Descended from the proud Komnenoi who fled Constantinople in 1204, the rulers of Trebizond still style themselves emperors—yet shared perils in Anatolia give both Greek courts reason to speak."
 phx_byz.0075.a:0 "Receive them warmly and deepen Black Sea trade ties."
 phx_byz.0075.b:0 "Remind them that there is only one true Roman Emperor."

 phx_byz.0080.t:0 "Echoes of the Peloponnese"
 phx_byz.0080.desc:0 "Letters from our governors at Mystras describe the Frankish baronies of Achaea and Attica fractured by absentee Italian princes and Catalan mercenaries. Local Greek archons quietly sound out Constantinople, asking whether imperial eagles will once more descend from the Taygetos mountains to reclaim the Peloponnese."
 phx_byz.0080.a:0 "Press imperial claims across the Morea and mainland Greece."
 phx_byz.0080.b:0 "Keep a lucrative peace with the Latin lords for now."

 phx_byz.0085.t:0 "Stones of Theodosius"
 phx_byz.0085.desc:0 "Master engineers return from inspecting the land-walls between the Golden Gate and Blachernae with solemn charts. Nine centuries of sieges, winter frosts, and tremors have cracked parapets and silted the outer moat. Restoring the triple curtain will demand heavy outlay from a strained treasury—yet while those stones hold, Constantinople cannot fall."
 phx_byz.0085.a:0 "Spare no expense—restore the triple walls to their ancient strength."
 phx_byz.0085.b:0 "Patch the worst breaches and keep the balance for mobile troops."

 phx_byz.0100.t:0 "The Chrysobull of the New Themes"
 phx_byz.0100.desc:0 "With the imperial seal pressed in vermilion ink, messengers ride west and east bearing the revised cadastres and military rolls. Provincial governors now answer directly to the sacellarius and the throne, restoring order where fragmented grants had long bred neglect."
 phx_byz.0100.a:0 "Discipline returns to the Roman realm."

 phx_byz.0110.t:0 "Keels of the Golden Horn"
 phx_byz.0110.desc:0 "To the thunder of trumpets and the blessing of the clergy, fresh war-galleys slide from the repaired imperial slipways into the Bosporus. Once more the purple standard commands the straits between Europe and Asia."
 phx_byz.0110.a:0 "Let the straits know their rightful master."

 phx_byz.0120.t:0 "Axes Before Blachernae"
 phx_byz.0120.desc:0 "Clad in gilded mail and bearing long-hafted axes upon their shoulders, the newly sworn Varangian guardsmen strike their shields in unison along the palace courtyard. Their oath binds them not to faction or province, but to the person of the Autokrator alone."
 phx_byz.0120.a:0 "Stand watch over the imperial house."

 phx_byz.0130.t:0 "Triumph of the Anatolian Banners"
 phx_byz.0130.desc:0 "Through the Golden Gate rides the victorious host, preceded by captured standards and the cheers of crowds lining the Mese to Hagia Sophia. The ancient heartland of Asia Minor once more beats in union with Constantinople."
 phx_byz.0130.a:0 "Glory to the eternal Roman Empire!"

 phx_byz.0140.t:0 "Deliberations of the Great Church"
 phx_byz.0140.desc:0 "Beneath the soaring dome of Hagia Sophia, metropolitans, senators, and Western legates debate late into the lamplit evening. One party speaks of Latin ships and gold that could shield the frontiers; the other vows that the ancient liturgy must never bend to temporal expediency."
 phx_byz.0140.a:0 "Pursue union with the West to secure foreign aid."
 phx_byz.0140.b:0 "Guard the unbroken Orthodox faith above all else."
 phx_byz_church_union_west_tt:0 "Improves diplomatic leverage with Western powers, at the cost of domestic Orthodox unrest."
 phx_byz_church_union_east_tt:0 "Rallies Orthodox clergy and subjects wholeheartedly behind the throne."

 phx_byz.0150.t:0 "Shield of the Five Sees"
 phx_byz.0150.desc:0 "Envoys bearing silver lamps and patriarchal letters arrive in Constantinople to affirm communion across the ancient apostolic chairs. Beneath imperial protection, the memory of the undivided Christian East stands tall once more."
 phx_byz.0150.a:0 "The ancient sees stand united in majesty."

 phx_byz.0160.t:0 "The Purple Citadel of Mystras"
 phx_byz.0160.desc:0 "Banners of the double-headed eagle unfurl from the ramparts of Mystras as the Despotate of the Morea receives its formal imperial charter. Monasteries, fresco painters, and garrison commanders alike rally around this southern bastion of the Roman commonwealth."
 phx_byz.0160.a:0 "Let Mystras shine as the jewel of Hellas."

 phx_byz.0170.t:0 "Masters of Our Own Harbor"
 phx_byz.0170.desc:0 "Imperial customs chains stretch cleanly across the Golden Horn as Roman officials inspect merchant manifests under the watchful prows of our galleys. Though Genoese envoys storm out of the palace in fury, gold coins once again flow steadily into the treasury of New Rome."
 phx_byz.0170.a:0 "Constantinople is no longer a tributary in its own port."

 phx_byz.0180.t:0 "The Synod of Blachernae"
 phx_byz.0180.desc:0 "Incense curls beneath the painted vaults of Blachernae as bishops, Athonite elders, and imperial philosophers await the final word of the Autokrator. Whether the Tomos enshrines the mystical theology of Hesychasm or protects the broad classical inquiries of court scholars will define Byzantine intellectual life for generations."
 phx_byz.0180.a:0 "Seal the Hesychast Tomos as the faith of the Empire."
 phx_byz.0180.b:0 "Protect humanist inquiry and the academies of classical learning."
 phx_byz_hesychasm_triumph_tt:0 "Enshrines Hesychasm as official Orthodox doctrine, rallying clergy and the pious."
 phx_byz_humanist_inquiry_tt:0 "Fosters humanist scholarship and cultural innovation, though traditionalist clergy murmur."

 phx_byz.0190.t:0 "The Prefectures of East and West"
 phx_byz.0190.desc:0 "In the great hall of Blachernae, newly appointed Praetorian Prefects of the East and of Illyricum receive their silver inkstands and codicils of office. From the plains of Macedonia to the olive groves of Bithynia, the machinery of late antique Roman governance turns once more with imperial grandeur."
 phx_byz.0190.a:0 "Two continents, one eternal Roman state."
