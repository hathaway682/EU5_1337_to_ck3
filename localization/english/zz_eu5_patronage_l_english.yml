l_english:
 innovation_eu5_patronage:0 "Patronage"
 innovation_eu5_patronage_desc:0 "Rulers, clergy, and wealthy citizens support scholars in their pursuit of knowledge and skill, allowing learning to flourish at court and in the towns."
 eu5_patronage_scholar_tt:0 "Can appoint a Court Scholar"
 eu5_sponsor_research_decision:0 "Sponsor Research"
 eu5_sponsor_research_decision_desc:0 "The advancement of learning depends upon generous patrons. Let us give our scholars the means to pursue new knowledge."
 eu5_sponsor_research_decision_tooltip:0 "Sponsor research by your Court Scholar"
 eu5_research_failure_tt:0 "The research yields no breakthrough"
 eu5_research_success_tt:0 "The research succeeds: your culture discovers an unknown common innovation of its current era, or your house gains a random research modifier for 30 years, or you gain prestige, if none remain"
 eu5_research_critical_tt:0 "A great breakthrough: your culture discovers an unknown common innovation of the next era, or a special innovation in the Age of Revolutions. If none remain, your house gains a random research modifier for 30 years, or you gain prestige"
 eu5_court_scholar_court_position:0 "Court Scholar"
 eu5_court_scholar_court_position_desc:0 "The Court Scholar studies the arts and sciences and helps the ruler advance cultural knowledge."
 eu5_research_treatise_on_prosperity_modifier: "Treatise on Administration"
 eu5_research_treatise_on_prosperity_modifier_desc: "A paper on the value of bureaucracy, with several pointers on how one can ensure a proper line of communication from royalty and all the way down to the local level."
 eu5_research_treatise_on_building_modifier: "Treatise on Management"
 eu5_research_treatise_on_building_modifier_desc: "A treatise on how one should manage their resources to maximize efficiency."
 eu5_research_treatise_on_control_modifier: "Treatise on Authority"
 eu5_research_treatise_on_control_modifier_desc: "A paper on how a leader should approach the task of rulership and cowing rebellions."
 eu5_research_treatise_on_mathematics_modifier: "Monograph in Mathematics"
 eu5_research_treatise_on_mathematics_modifier_desc: "A specialized thesis on mathematics, with several notes on how one can make use of it in one's daily life."
 eu5_research_treatise_on_taxation_modifier: "Treatise on Taxation"
 eu5_research_treatise_on_taxation_modifier_desc: "A long rambling treatise on taxation and what steps one can take to best approach the issue of taxation."
 eu5_research_treatise_on_light_warfare_modifier: "Guide on Skirmishing"
 eu5_research_treatise_on_light_warfare_modifier_desc: "A short thesis on the value of light infantry, and how one can best utilize them."
 eu5_research_treatise_on_heavy_warfare_modifier: "Manual on Defensive Warfare"
 eu5_research_treatise_on_heavy_warfare_modifier_desc: "A treatise on relevant formations for heavy infantry, with a small guide at the end on what sort of drills one can do to achieve greater cohesion in one's army."
 eu5_research_treatise_on_cavalry_modifier: "History of Cavalry Warfare"
 eu5_research_treatise_on_cavalry_modifier_desc: "A long paper on the history of cavalry charges done throughout history, with a focus on how one can turn the tide of battle from horseback."
 eu5_research_treatise_on_siege_modifier: "Manual on Deconstruction"
 eu5_research_treatise_on_siege_modifier_desc: "A short yet concise manual on the nature of sieges, and how one can approach an enemy with or without siege weaponry at hand."
 eu5_research_treatise_on_strategy_modifier: "History of Strategy"
 eu5_research_treatise_on_strategy_modifier_desc: "A long yet approachable treatise on the history of strategy and tactics, with examples going back several centuries."
 innovation_eu5_congreve_rocket:0 "Congreve Rockets"
 innovation_eu5_congreve_rocket_desc:0 "Improved gunpowder rockets can be launched in volleys, bringing their destructive force to the battlefield and the defense of fortifications."
 innovation_eu5_newcomen_steam_engine:0 "Newcomen Steam Engine"
 innovation_eu5_newcomen_steam_engine_desc:0 "Steam-powered pumps drain water from deep mine shafts, allowing miners to reach deposits far below the surface."
 eu5_scientific_experimentation_research_tt:0 "Sponsored research is 10 percentage points less likely to fail and 10 percentage points more likely to achieve a critical success"
 eu5_confessionalism_rite_tt:0 "Allows creation of new rites"
 eu5_rite_creation_innovation_requirement_tt:0 "Your culture has discovered Confessionalism, you are a religious reformer, or your faith is unreformed"
