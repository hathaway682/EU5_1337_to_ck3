l_english:
 # === Modifiers ===
 phx_black_death_outbreak_county_modifier:0 "Shadow of the Great Pestilence"
 phx_black_death_outbreak_county_modifier_desc:0 "Silent lanes, shuttered markets, and overburdened parish bells mark a land gripped by the Black Death."
 phx_black_death_quarantine_modifier:0 "Harbor Chains and Gate Quarantine"
 phx_black_death_quarantine_modifier_desc:0 "Guarded gates, forty-day anchorage holds, and watch-fires slow the contagion even as trade halts at the quay."
 phx_black_death_post_plague_boom_modifier:0 "Post-Plague Commercial Awakening"
 phx_black_death_post_plague_boom_modifier_desc:0 "Scarce labor has spurred freer tenancies, bustling town guilds, and sharper investment across surviving estates."
 phx_schism_avignon_obedience_modifier:0 "Obedience to the Avignon Curia"
 phx_schism_avignon_obedience_modifier_desc:0 "This court recognizes the pontiff on the Rhone, securing fiscal dispensations at the cost of whispers across divided Christendom."
 phx_schism_roman_obedience_modifier:0 "Obedience to the Roman See"
 phx_schism_roman_obedience_modifier_desc:0 "This realm upholds the successor of Saint Peter enthroned in Rome, rallying loyal bishops and devout subjects."
 phx_schism_conciliar_unity_modifier:0 "Champion of Conciliar Unity"
 phx_schism_conciliar_unity_modifier_desc:0 "Having guided the Latin Church out of bitter division, the sovereign commands deep reverence across Catholic courts."
 phx_timur_scourge_modifier:0 "Sword of Transoxiana"
 phx_timur_scourge_modifier_desc:0 "Iron discipline, lightning steppe marches, and terrifying renown propel this warlord's banners across Eurasia."
 phx_timur_samarkand_renaissance_modifier:0 "Turquoise Splendor of Samarkand"
 phx_timur_samarkand_renaissance_modifier_desc:0 "Master masons, calligraphers, and silk caravans drawn from every quarter adorn Samarkand as the jewel of the world."
 phx_ibe_strait_mastery_modifier:0 "Master of the Pillars of Hercules"
 phx_ibe_strait_mastery_modifier_desc:0 "Watchtowers and war-galleys along the narrows command the passage between the Mediterranean and the Western Ocean."
 phx_ibe_atlantic_pioneers_modifier:0 "Atlantic Navigation Schools"
 phx_ibe_atlantic_pioneers_modifier_desc:0 "Cosmographers, pilot books, and lateen-rigged caravels push the frontiers of chart and compass beyond the familiar shores."
 phx_gra_alhambra_golden_age_modifier:0 "Golden Age of the Alhambra"
 phx_gra_alhambra_golden_age_modifier_desc:0 "Carved stucco courtyards, flowing fountains, and learned poets make Granada the luminous jewel of western Islam."
 phx_ita_early_renaissance_patron_modifier:0 "Patron of the Early Renaissance"
 phx_ita_early_renaissance_patron_modifier_desc:0 "Humanist libraries, sculptors' workshops, and merchant banks draw the sharpest minds of Italy to this court."
 phx_ita_condottieri_contracts_modifier:0 "Condottieri War Contracts"
 phx_ita_condottieri_contracts_modifier_desc:0 "Hardened free companies march beneath chartered banners, lending lethal professionalism to the realm's campaigns."
 phx_mam_red_sea_monopoly_modifier:0 "Red Sea Spice Monopoly"
 phx_mam_red_sea_monopoly_modifier_desc:0 "Karimi merchants and Mamluk customs houses channel pepper, silk, and cloves from Aden to Alexandria beneath Cairo's watchful seal."
 phx_dlh_tughluq_turmoil_modifier:0 "Turmoil of the Tughluq Court"
 phx_dlh_tughluq_turmoil_modifier_desc:0 "Ambitious fiscal experiments, token-coin shocks, and distant provincial unrest strain the authority of Delhi."
 phx_dlh_reformed_diwan_modifier:0 "Reformed Tughluq Diwan"
 phx_dlh_reformed_diwan_modifier_desc:0 "Restored silver assessments, audited provincial treasuries, and steadier iqta appointments renew Delhi's imperial sinews."
 phx_vij_hampi_bulwark_modifier:0 "Bulwark of the Tungabhadra"
 phx_vij_hampi_bulwark_modifier_desc:0 "Granite hills, temple banners, and resolute Deccan captains anchor an unyielding southern kingdom around Hampi."
 phx_maj_palapa_oath_modifier:0 "Oath of Palapa"
 phx_maj_palapa_oath_modifier_desc:0 "Bound by solemn vow to unite Nusantara, Majapahit war-junks and envoys project mandala majesty across the spice seas."
 phx_kor_late_goryeo_reform_modifier:0 "Late Goryeo Reform Charter"
 phx_kor_late_goryeo_reform_modifier_desc:0 "Reinvigorated scholar-officials, land audits, and fortified coastal beacons brace the peninsula against court faction and sea-raiders."
 phx_mal_sankore_scholars_modifier:0 "Academy of Sankore"
 phx_mal_sankore_scholars_modifier_desc:0 "Jurists, astronomers, and manuscript copyists gather along the Niger bend, turning Timbuktu into a beacon of learning and wealth."
 phx_eth_solomonic_zeal_modifier:0 "Banner of the Lion of Judah"
 phx_eth_solomonic_zeal_modifier_desc:0 "Highland monasteries and royal chronicles proclaim the unbroken Solomonic covenant, steeling Ethiopia's armies and faithful."

 # === Regiments ===
 phx_timur_samarkand_guard_name:0 "Samarkand Imperial Tumen"
 phx_timur_iranian_host_name:0 "Gurkani Western Host"
 phx_timur_gurkani_tumen_name:0 "Iron Lame's Vanguard"
 phx_timur_gurkani_vanguard_name:0 "Transoxiana Gurkani Host"
 phx_iran_frontier_garrison_name:0 "Zagros Frontier Guard"
 phx_delhi_elephant_host_name:0 "Sultanate War-Elephant Corps"
 phx_eur_strait_vanguard_name:0 "Vanguard of the Strait"
 phx_ita_condottieri_company_name:0 "Chartered Free Company"
 phx_mam_royal_mamluks_name:0 "Citadel Royal Mamluks"
 phx_kor_coastal_garrison_name:0 "Goryeo Coastal Garrison"
 phx_eth_solomonic_guard_name:0 "Highland Guard of Amhara"

 # === Decisions (12) ===
 phx_plague_enact_quarantine_decision:0 "Enact Harbor and Gate Quarantine"
 phx_plague_enact_quarantine_decision_desc:0 "Ships drift into port with half their crews dead below deck, and fearful travelers carry blackened swellings along every high road. By stretching iron chains across the harbor mouth, sealing city gates, and holding incoming cargo for forty days, the realm may spare its heart from the worst of the Great Pestilence."
 phx_plague_enact_quarantine_decision_tooltip:0 "Seal harbors and city gates to shelter the capital from the Black Death."
 phx_plague_enact_quarantine_decision_confirm:0 "Seal the Gates and Harbors"
 phx_plague_enact_quarantine_effect_tt:0 "Institutes strict quarantine cordons across the realm and relieves active plague devastation in the capital."

 phx_schism_convene_constance_council_decision:0 "Champion the Council of Constance"
 phx_schism_convene_constance_council_decision_desc:0 "Rival pontiffs hurl anathemas from Rome and Avignon while kingdoms fracture into competing obediences. Only a general council backed by decisive royal prestige can compel the claimants to step aside and restore one undisputed shepherd to Western Christendom."
 phx_schism_convene_constance_council_decision_tooltip:0 "Sponsor a general church council to end the Western Schism and reunite Catholic Christendom."
 phx_schism_convene_constance_council_decision_confirm:0 "Summon the General Council"
 phx_schism_convene_constance_council_effect_tt:0 "Ends the Western Schism globally and honors you as the champion of conciliar Christian unity."

 phx_ibe_secure_strait_of_gibraltar_decision:0 "Master the Pillars of Hercules"
 phx_ibe_secure_strait_of_gibraltar_decision_desc:0 "For generations, armies and merchant galleys have contested the narrow waters linking Iberia to the Maghreb. Securing the fortress ports on the Strait settles who rules the western Mediterranean gateway and commands the tolls of two continents."
 phx_ibe_secure_strait_of_gibraltar_decision_tooltip:0 "Establish enduring naval and fortress dominance over the Strait of Gibraltar."
 phx_ibe_secure_strait_of_gibraltar_decision_confirm:0 "Proclaim Mastery of the Strait"
 phx_ibe_secure_strait_of_gibraltar_effect_tt:0 "Strengthens maritime projection and enriches the fortified ports commanding the Strait of Gibraltar."

 phx_ibe_sponsor_atlantic_navigators_decision:0 "Sponsor Atlantic Navigation Schools"
 phx_ibe_sponsor_atlantic_navigators_decision_desc:0 "Beyond the Pillars of Hercules stretches the Green Sea of Darkness, where bold captains whisper of distant islands, shifting trade winds, and southern gold. By gathering cartographers, astrolabe makers, and shipwrights under royal charter, the crown can turn untamed ocean currents into highways of empire."
 phx_ibe_sponsor_atlantic_navigators_decision_tooltip:0 "Establish royal navigation academies and portolan cartography to open the Atlantic sea lanes."
 phx_ibe_sponsor_atlantic_navigators_decision_confirm:0 "Charter the Navigation School"
 phx_ibe_sponsor_atlantic_navigators_effect_tt:0 "Advances oceanic pilot books and equips the realm for long-range maritime voyages."

 phx_gra_complete_alhambra_palaces_decision:0 "Crown the Red Fortress of Granada"
 phx_gra_complete_alhambra_palaces_decision_desc:0 "High above the Darro rises the red-walled citadel of the Nasrids, where courtyards of carved plaster, cedar ceilings, and mirrored pools proclaim that Andalusian civilization still blazes with unmatched grace. Completing the royal palaces will anchor Granada's prestige before friend and foe alike."
 phx_gra_complete_alhambra_palaces_decision_tooltip:0 "Complete the monumental palaces of the Alhambra and inaugurate a Nasrid golden age."
 phx_gra_complete_alhambra_palaces_decision_confirm:0 "Unveil the Royal Palaces"
 phx_gra_complete_alhambra_palaces_effect_tt:0 "Completes the Alhambra palace complex, elevating Granada's splendor, learning, and defensive resolve."

 phx_ita_patronize_humanist_renaissance_decision:0 "Patronize the Early Italian Renaissance"
 phx_ita_patronize_humanist_renaissance_decision_desc:0 "In Tuscan workshops and Lombard cloisters, scholars are dusting off ancient Latin manuscripts while painters and architects measure perspective with fresh eyes. Opening the treasury to humanists, poets, and master builders will turn our city into the luminous centerpiece of a reborn age."
 phx_ita_patronize_humanist_renaissance_decision_tooltip:0 "Fund humanist scholars, architects, and artists to lead the Early Italian Renaissance."
 phx_ita_patronize_humanist_renaissance_decision_confirm:0 "Endow the Studios and Libraries"
 phx_ita_patronize_humanist_renaissance_effect_tt:0 "Establishes your court as a premier patron of humanist learning, civic architecture, and banking."

 phx_mam_red_sea_spice_hegemony_decision:0 "Consolidate the Red Sea Spice Monopoly"
 phx_mam_red_sea_spice_hegemony_decision_desc:0 "Every bale of Malabar pepper and Moluccan clove bound for Venetian or Genoese galleys passes beneath the watchful eyes of Cairo's customs officers. Formalizing the crown's partnership with the Karimi spice guilds will secure Egypt's treasury as the indispensable bridge between the Indian Ocean and the Mediterranean."
 phx_mam_red_sea_spice_hegemony_decision_tooltip:0 "Bind the Karimi spice trade and Alexandria customs tightly to the Mamluk crown."
 phx_mam_red_sea_spice_hegemony_decision_confirm:0 "Seal the Spice Charter"
 phx_mam_red_sea_spice_hegemony_effect_tt:0 "Consolidates Egypt's Red Sea spice revenues and spurs growth in Cairo and Alexandria."

 phx_dlh_stabilize_tughluq_sultanate_decision:0 "Reform the Tughluq Diwan"
 phx_dlh_stabilize_tughluq_sultanate_decision_desc:0 "Grandiose decrees, token-copper coinage, and forced marches have left provincial governors mutinous and farmers fleeing the Doab. Restoring sound silver revenue rolls and accountable treasury clerks in Delhi will quiet the murmuring provinces and steady the throne of Hindustan."
 phx_dlh_stabilize_tughluq_sultanate_decision_tooltip:0 "Overhaul Delhi's fiscal chancery to end the Tughluq administrative turmoil."
 phx_dlh_stabilize_tughluq_sultanate_decision_confirm:0 "Promulgate the Diwan Ordinances"
 phx_dlh_stabilize_tughluq_sultanate_effect_tt:0 "Ends the Tughluq Court turmoil and restores disciplined revenue administration from Delhi."

 phx_maj_proclaim_palapa_oath_decision:0 "Proclaim Gajah Mada's Palapa Oath"
 phx_maj_proclaim_palapa_oath_decision_desc:0 "Before the royal assembly of Trowulan, the great minister vows to taste no spiced comforts until every island realm across the archipelagic sea acknowledges Majapahit's mandala radiance. Endorsing this solemn oath will rally Javanese admirals and tributary princes beneath one imperial standard."
 phx_maj_proclaim_palapa_oath_decision_tooltip:0 "Endorse the solemn Palapa Oath to project Majapahit hegemony across Nusantara."
 phx_maj_proclaim_palapa_oath_decision_confirm:0 "Swear the Palapa Oath"
 phx_maj_proclaim_palapa_oath_effect_tt:0 "Rallies Majapahit's fleets and vassals under the Palapa Oath and elevates Trowulan's majesty."

 phx_mal_expand_sankore_university_decision:0 "Endow the Great Mosque and Sankore Academy"
 phx_mal_expand_sankore_university_decision_desc:0 "Salt slabs from the Sahara and alluvial gold from Bure meet along the bend of the Niger, where scholars from Fez, Cairo, and Mecca arrive to copy manuscripts by lamplight. Expanding the madrasas and libraries of Timbuktu will make Mali's renown outlast any single caravan season."
 phx_mal_expand_sankore_university_decision_tooltip:0 "Endow Timbuktu's Sankore scholars and libraries as a center of Islamic learning."
 phx_mal_expand_sankore_university_decision_confirm:0 "Endow the Sankore Academy"
 phx_mal_expand_sankore_university_effect_tt:0 "Transforms Timbuktu into a flourishing academy of jurists, astronomers, and trans-Saharan commerce."

 phx_eth_affirm_solomonic_chronicle_decision:0 "Proclaim the Kebra Nagast"
 phx_eth_affirm_solomonic_chronicle_decision_desc:0 "In the rock-hewn sanctuaries and highland abbeys of Amhara, scribes have gathered the sacred chronicle tracing the Ethiopian crown to King Solomon and the Ark of the Covenant. Proclaiming the Kebra Nagast before nobles and clergy will bind the realm in unshakeable spiritual legitimacy."
 phx_eth_affirm_solomonic_chronicle_decision_tooltip:0 "Solemnly proclaim the Kebra Nagast to affirm Ethiopia's sacred Solomonic lineage."
 phx_eth_affirm_solomonic_chronicle_decision_confirm:0 "Proclaim the Glory of the Kings"
 phx_eth_affirm_solomonic_chronicle_effect_tt:0 "Affirms the Solomonic covenant across Abyssinia, inspiring highland zeal and royal legitimacy."

 phx_timur_claim_samarkand_throne_decision:0 "Proclaim the Gurkani Throne of Samarkand"
 phx_timur_claim_samarkand_throne_decision_desc:0 "From the irrigated orchards of Sogdia to the steppe frontiers of the Oxus, rival begs and waning Chagatayid princes vie for supremacy. Raising the imperial tugh over Samarkand will declare a new Gurkani sovereignty—one forged in iron cavalry and crowned with turquoise domes."
 phx_timur_claim_samarkand_throne_decision_tooltip:0 "Enthrone Samarkand as the imperial capital of the Gurkani realm."
 phx_timur_claim_samarkand_throne_decision_confirm:0 "Ascend the Throne of Samarkand"
 phx_timur_claim_samarkand_throne_effect_tt:0 "Proclaims Gurkani sovereignty in Samarkand and inaugurates the city's architectural renaissance."

 # === Global Crisis Events (phx_glb) ===
 phx_glb.0001.t:0 "The Black Ships of Caffa"
 phx_glb.0001.desc:0 "Grim dispatches race across the sea lanes from the Crimean entrepot of Caffa. Besieged behind its walls, the port was gripped by a swift, blackening malady that felled healthy men in a single night; merchant galleys fleeing south have already carried the sickness past the Bosporus into Mediterranean harbors.\n\nPriests ring alarm bells from sunrise to dusk, and factors lock their warehouses in dread. A pestilence unlike any in living memory is loose upon the world."
 phx_glb.0001.a:0 "May Heaven have mercy upon our ports and towns."
 phx_glb.0001.b:0 "Stretch the harbor chains at once—let no foreign hull land unchecked."
 phx_glb_0001_quarantine_hint_tt:0 "The Harbor and Gate Quarantine decision is now available while the Great Pestilence endures."

 phx_glb.0002.t:0 "Whispers Along the Trade Roads"
 phx_glb.0002.desc:0 "Muleteers and peddlers arriving at the border tolls speak in hushed voices of deserted inns, unharvested grain, and burial trenches outside neighboring market towns. Court physicians debate corrupted airs and dark planetary conjunctions, yet every councillor agrees that the shadow is drawing closer to our own gates."
 phx_glb.0002.a:0 "Stockpile herbs, vinegar, and timber for watch-posts."
 phx_glb.0002.b:0 "Call the realm to fasting and solemn prayer."
 phx_glb_0002_prepare_tt:0 "Places the realm on high alert and enables immediate quarantine measures."

 phx_glb.0003.t:0 "The Pestilence Enters the Gates"
 phx_glb.0003.desc:0 "It has arrived. Overnight, apothecaries report swollen dark lesions in the river quarter, and by noon the death-carts rattle over the cobblestones. Guildmasters demand that strangers be barred at sword-point, priests beg for alms to tend the dying, and panicked courtiers whisper that the only safety lies far away in the hills."
 phx_glb.0003.a:0 "Enforce iron quarantine—seal the gates and isolate the sick."
 phx_glb.0003.b:0 "Open the royal granaries and fund infirmaries for the afflicted."
 phx_glb.0003.c:0 "Withdraw the court to secluded mountain lodges until the air clears."

 phx_glb.0004.t:0 "Harbor Chains and Pest-Houses"
 phx_glb.0004.desc:0 "Watchmen now patrol every postern gate with braziers of pine pitch and juniper smoke, while incoming barges anchor off the shoals for forty silent days. Merchants grumble over rotting cargoes, yet the tolling of funeral bells inside the capital has begun to slow."
 phx_glb.0004.a:0 "Vigilance spares what panic destroys."

 phx_glb.0005.t:0 "The Scarcity of Hands"
 phx_glb.0005.desc:0 "As the burial mounds green over with fresh grass, the surviving realm faces an unexpected upheaval. Fields lie fallow for want of plowmen, and surviving artisans and peasants now demand higher wages, lighter dues, and written town charters. Landlords urge you to clamp down with harsh statutes, while city syndics argue that freer contracts will ignite a richer commercial era."
 phx_glb.0005.a:0 "Charter freer tenancies and encourage urban trade."
 phx_glb.0005.b:0 "Enforce ancient labor statutes and compel obedience on the manors."

 phx_glb.0006.t:0 "Penitents in the Night Streets"
 phx_glb.0006.desc:0 "Torchlit processions of gaunt penitents wind through the alleys, chanting dire hymns and blaming merchants, foreigners, and sinners alike for the wrath upon the land. Nervous burghers bar their shutters and look to the crown to decide whether order or fervor shall govern the streets."
 phx_glb.0006.a:0 "Send the city watch to keep order and disperse the mobs."
 phx_glb.0006.b:0 "Let them pray undisturbed so long as no blood is spilled."
 phx_glb.0006.c:0 "Issue royal writs shielding threatened merchants and workshops."

 phx_glb.0007.t:0 "The Physician's Treatise on Contagion"
 phx_glb.0007.desc:0 "After months observing the pest-houses and harbor cordons, a seasoned court physician presents a careful manuscript cataloging clean water conduits, linen disposal, and forty-day isolation logs. Though the plague's mysteries remain dark, these hard-won lessons may serve future generations."
 phx_glb.0007.a:0 "Copy the treatise and adopt its civic ordinances."
 phx_glb.0007.b:0 "Archive the scroll in the royal library with our gratitude."

 phx_glb.0021.t:0 "The Iron Lame of Samarkand"
 phx_glb.0021.desc:0 "Caravans descending from Transoxiana bring startling news: a scarred Barlas commander named Timur has seized mastery over Samarkand, binding Turco-Mongol horsemen and settled Persian scribes beneath a single ruthless will. Bearing the proud style of Gurkani, he speaks openly of restoring the shattered empire of Chinggis Khan—and his scouts already probe the western passes."
 phx_glb.0021.a:0 "Inspect our frontier citadels and keep the levies ready."
 phx_glb.0021.b:0 "Dispatch courteous envoys with gifts to gauge his ambitions."

 phx_glb.0022.t:0 "Jewel of the World: Samarkand"
 phx_glb.0022.desc:0 "Master tile-makers, silk weavers, armorers, and astronomers stream through the gates of Samarkand beneath your banners. Along the wide boulevards, turquoise domes rise above orchards fed by restored canals, announcing to every emissary from Delhi to Damascus that the center of the world now sits beside the Zeravshan."
 phx_glb.0022.a:0 "Let every horizon tremble at Samarkand's splendor!"

 phx_glb.0023.t:0 "Dust Storms Over Iran and Mesopotamia"
 phx_glb.0023.desc:0 "Riders from Khorasan and Azerbaijan stumble into court with tales of dark horse-tail standards sweeping westward out of Transoxiana. Timur's swift tumens have crossed the Oxus in force, smashing divided Ilkhanid successor courts and threatening the great caravan cities from Tabriz to Baghdad."
 phx_glb.0023.a:0 "Muster the frontier banners—we will not bow to Samarkand."
 phx_glb.0023.b:0 "Send rich tribute and emissaries to turn the storm aside."

 phx_glb.0024.t:0 "Thunder Beyond the Indus"
 phx_glb.0024.desc:0 "Watch-fires flare across the Punjab passes as word reaches Hindustan that Timur's iron horsemen are descending toward the Indo-Gangetic plain. Court commanders warn that the northern conqueror's discipline and fiery stratagems threaten even the proud war-elephants and walls of Delhi."
 phx_glb.0024.a:0 "Array the war-elephants and march north to meet him!"
 phx_glb.0024.b:0 "Fortify the inner treasury and brace for a desperate siege."

 phx_glb.0025.t:0 "The Steppe and the Anatolian Anvil"
 phx_glb.0025.desc:0 "From the Volga steppe to the plateaus of Asia Minor, kings and khans alike watch Timur's banners wheel with terrifying speed. Whether his thunderbolt strikes Sarai or the Ottoman marches of Anatolia, no sovereign between the Danube and the Caspian can ignore the shifting balance of power."
 phx_glb.0025.a:0 "Keep our blades drawn and watch the horizon closely."
 phx_glb.0025.b:0 "Send envoys to turn this upheaval to our diplomatic advantage."

 phx_glb.0026.t:0 "The Gurkani Throne of Samarkand"
 phx_glb.0026.desc:0 "To the booming of kettledrums and the cries of assembled emirs, the black horse-tail standard rises above the citadel of Samarkand. Scholars read your style in Persian and Turki alike: sovereign of Transoxiana, heir to the steppe law, and architect of an empire built to awe the ages."
 phx_glb.0026.a:0 "From Samarkand, the world itself shall be weighed!"

 phx_glb.0030.t:0 "Two Keys, Two Thrones"
 phx_glb.0030.desc:0 "Scarcely has the conclave dispersed than bitter dispute tears the College of Cardinals apart. Dissident prelates denounce the Roman election as coerced and raise a rival claimant in Avignon, each bearing the fisherman's ring and demanding the obedience of kings. Across Latin Christendom, bells toll in confusion as two papacies claim the sole keys of Heaven."
 phx_glb.0030.a:0 "Stand unyielding upon the apostolic rock of Rome."
 phx_glb.0030.b:0 "Rally the curial treasury and allies around Avignon."

 phx_glb.0031.t:0 "The Great Western Schism"
 phx_glb.0031.desc:0 "Two rival legates stand before your throne on the very same morning—one bearing papal bulls sealed in Rome, the other carrying counter-excommunications from Avignon. Bishops look to the crown for guidance, knowing that our choice of obedience will reshape alliances, church revenues, and the conscience of the realm."
 phx_glb.0031.a:0 "Acknowledge the Roman Pontiff as the true Vicar of Christ."
 phx_glb.0031.b:0 "Declare our realm's obedience to the Avignon Curia."
 phx_glb.0031.c:0 "Withhold obedience from both until a General Council speaks."

 phx_glb.0033.t:0 "The Scandal of Three Popes"
 phx_glb.0033.desc:0 "Decades of schism have curdled into farce: an abortive synod meant to heal the Church has only produced a third claimant, leaving Western Christendom mocked by rival bulls and competing taxes. University masters and pious lords now implore the great crowns of Europe to sponsor a decisive General Council at Constance."
 phx_glb.0033.a:0 "Christendom cries out for one shepherd—prepare the council!"
 phx_glb_0033_constance_hint_tt:0 "Eligible Catholic sovereigns can now end the Western Schism via the Champion the Council of Constance decision."

 phx_glb.0035.t:0 "One Shepherd, One Flock"
 phx_glb.0035.desc:0 "After months of tireless diplomacy, solemn depositions, and midnight conclaves beneath your royal safe-conduct, white smoke rises at last over the council hall. Rival claims are laid aside, a single undisputed pontiff ascends Saint Peter's chair, and envoys across Europe hail your crown as the savior of Christian unity."
 phx_glb.0035.a:0 "Te Deum laudamus—the Church stands whole once more!"

 # === Regional Eurasia & Africa Events (phx_eur) ===
 phx_eur.0001.t:0 "The Pillars of the Strait"
 phx_eur.0001.desc_castile:0 "The spring of 1337 finds the Crown of Castile poised upon a razor's edge. Across the Andalusian frontier, Granadan raiders test the border castles while Marinid ships gather across the Strait; at home, proud magnates still test the steel of your royal authority. Master the southern marches, and the fate of all Iberia lies open before you."
 phx_eur.0001.desc_granada:0 "Between the snow-crowned Sierra Nevada and the glittering sea lies Granada, last sovereign jewel of al-Andalus. Castilian knights press from the north while Marinid sultans offer fickle shelter from across the Strait. Only sharp statecraft, mountain fortresses, and the undimmed brilliance of your court can keep the Nasrid banner flying."
 phx_eur.0001.desc_morocco:0 "From the cedar halls of Fez to the fortresses facing Gibraltar, Marinid banners command the Maghreb. Across the narrow blue water, Castilian kings dream of sealing the Strait forever while Granada looks south for deliverance. Strike boldly across the Pillars of Hercules, and the western Mediterranean will remember Marinid might."
 phx_eur.0001.a:0 "Sharpen our steel—the Strait belongs to the bold."
 phx_eur.0001.b:0 "Fill the treasury and fortify our coastal cities first."

 phx_eur.0005.t:0 "Drums Along the Rio Salado"
 phx_eur.0005.desc:0 "Warships crowd the narrows between Africa and Andalusia as banners converge upon the southern riverbanks. Both Christian and Muslim captains know that a single decisive campaign along the approaches to Gibraltar could settle mastery of the Strait for a generation."
 phx_eur.0005.a:0 "Muster the frontier horsemen and march for the Strait!"
 phx_eur.0005.b:0 "Proclaim a sacred vigil to rally the faithful behind our cause."

 phx_eur.0010.t:0 "Blood of Burgos: The Castilian Succession"
 phx_eur.0010.desc:0 "Bitter whispers divide the royal court between defenders of unbending legitimate rule and great magnates rallying behind ambitious kinsmen of the Trastamara line. Every council meeting feels like a prelude to civil war, forcing the crown to choose between iron severity and costly reconciliation."
 phx_eur.0010.a:0 "Break the magnates' insolence—Castile answers to one crown alone."
 phx_eur.0010.b:0 "Summon the Cortes and purchase noble harmony with charters."

 phx_eur.0020.t:0 "Florins, Marble, and Humanist Letters"
 phx_eur.0020.desc:0 "Along the piazzas of northern Italy, banking ledgers clink beside masons' chisels and booksellers' stalls. Poets recover the cadence of ancient Rome while commune signori and merchant republics measure power not merely in lances, but in gold florins, civic beauty, and renown."
 phx_eur.0020.a:0 "Sponsor the scholars and master builders of our city."
 phx_eur.0020.b:0 "Expand the banking houses and guild custom duties."

 phx_eur.0025.t:0 "Banners of the Condottieri"
 phx_eur.0025.desc:0 "Veteran captains of fortune—Germans, Bretons, and hard-bitten Lombards alike—have camped outside the walls, offering sealed contracts of service in exchange for regular coin. Hiring a chartered condottieri company promises immediate battlefield edge, yet civic elders warn that mercenaries love gold far more than any flag."
 phx_eur.0025.a:0 "Seal the condottieri contract and put them under our standard."
 phx_eur.0025.b:0 "Decline their blades—trust our own citizens and bannermen."

 phx_eur.0030.t:0 "The Citadel of Cairo"
 phx_eur.0030.desc:0 "Beneath the soaring minarets of Cairo, spice ships unload Eastern riches along the Nile while mounted Mamluk emirs drill in the hippodrome below the Citadel. Yet wealth and splendor also breed fierce rivalries among the royal barracks, requiring a steady hand to balance trade, diplomacy, and the sword."
 phx_eur.0030.a:0 "Invest in Cairo's bazaars and Nile customs houses."
 phx_eur.0030.b:0 "Inspect the royal barracks and expand the Mamluk guard."

 phx_eur.0035.t:0 "Fractured Banners of Hulegu"
 phx_eur.0035.desc:0 "Since the death of Abu Sa'id without an heir, the great Ilkhanate has splintered into rival camps from Tabriz to Baghdad. Jalayirid, Chobanid, and Khorasani emirs each parade their own Chinggisid puppets, daring the throne to prove whether Mongol Persia can still be held together."
 phx_eur.0035.a:0 "Assert imperial supremacy and dare the rebellious emirs to test us."
 phx_eur.0035.b:0 "Negotiate quietly with Baghdad and Tabriz to buy time."

 phx_eur.0040.t:0 "The Brilliant Storm of Delhi"
 phx_eur.0040.desc:0 "Few courts on earth dazzle visitors like Delhi, where scholars from Persia, Africa, and Hindustan debate philosophy beneath gilded arches. Yet ambitious fiscal reforms, brass token coins, and forced southern marches have stirred fierce resentment across the provinces, testing whether brilliance can outrun rebellion."
 phx_eur.0040.a:0 "Press the royal revenue levies—an empire demands iron boldness."
 phx_eur.0040.b:0 "Ease taxes in the Doab and steady the capital's markets."

 phx_eur.0045.t:0 "Watchfires Above the Tungabhadra"
 phx_eur.0045.desc_delhi:0 "Courier pigeons from the Deccan bring grave tidings: southern chieftains and Sangama brothers have raised independent banners along the Tungabhadra River, turning fortress towns into defiant strongholds beyond Delhi's immediate grasp."
 phx_eur.0045.desc_vijayanagara:0 "Among the towering granite boulders above the Tungabhadra, watch-fires blaze around the rising bastions of Hampi. As Delhi's distant grip falters in the south, Karnataka's warriors and temple patrons rally behind the Sangama standard to forge an enduring Deccan bulwark."
 phx_eur.0045.a:0 "Raise the banners and fortify the highland passes!"
 phx_eur.0045.b:0 "Secure local allies and fill the war chest first."

 phx_eur.0050.t:0 "Tribhuwana and the Vision of Nusantara"
 phx_eur.0050.desc:0 "In the red-brick pavilions of Trowulan, spice-laden sails arrive from Bali, Sumatra, and the eastern isles while court ministers speak of uniting the entire archipelago under Majapahit's mandala radiance. With disciplined fleets and bold counsel beside the throne, Java stands ready to command the southern seas."
 phx_eur.0050.a:0 "Embrace the grand design for Nusantara's unity."
 phx_eur.0050.b:0 "Enrich Trowulan's royal granaries and merchant piers first."

 phx_eur.0055.t:0 "Kaesong Between the Yuan Court and Reform"
 phx_eur.0055.desc:0 "In the palace halls of Kaesong, ministers tread carefully between deference to the Great Yuan court in the north and mounting calls at home to restore Korean royal dignity, curb landed magnates, and renew Confucian and Buddhist scholarship across the peninsula."
 phx_eur.0055.a:0 "Back the reform-minded scholars and tighten royal administration."
 phx_eur.0055.b:0 "Keep careful diplomatic balance while strengthening the treasury."

 phx_eur.0056.t:0 "Coastal Beacons Against the Wokou"
 phx_eur.0056.desc:0 "Smoke columns rise along the southern bays as swift Wokou pirate fleets raid coastal granaries and tax barges bound for Kaesong. Provincial commanders urge immediate reorganization of the garrisons and archery corps, while reformers warn that without clean administration, the coastline will never rest safe."
 phx_eur.0056.a:0 "Raise elite bowmen and overhaul the coastal defense charter."
 phx_eur.0056.b:0 "Rebuild the inland storehouses and fortify Kaesong's approaches."

 phx_eur.0060.t:0 "Gold of Bure, Ink of Timbuktu"
 phx_eur.0060.desc:0 "Years after Mali's legendary pilgrimage amazed Cairo and Mecca, trans-Saharan caravans still wind southward bearing salt, brassware, and precious books in exchange for West African gold. Along the Niger, scholars and architects await royal patronage to crown Timbuktu as a wonder of the learned world."
 phx_eur.0060.a:0 "Endow the mosques and bookshops of Timbuktu."
 phx_eur.0060.b:0 "Collect the caravan tariffs and strengthen the imperial purse."

 phx_eur.0065.t:0 "The Lion of Judah: Triumphs of Amda Seyon"
 phx_eur.0065.desc:0 "From the misty plateaus of Amhara to the trade tracks descending toward the Red Sea, royal drums echo across the Ethiopian highlands. Monastic chroniclers extol the Solomonic line as God's chosen shield, while frontier captains stand ready to carry the cross-topped banners against every rival along the Horn."
 phx_eur.0065.a:0 "Muster the highland warriors beneath the Solomonic standard!"
 phx_eur.0065.b:0 "Patronize the highland abbeys and royal chroniclers."

 phx_eur.0101.t:0 "Master of the Pillars of Hercules"
 phx_eur.0101.desc:0 "Beacon fires gleam from fortified headlands overlooking the narrow sea, and passing merchant captains dip their sails to your customs galleys. No fleet now crosses between the Mediterranean and the Atlantic without reckoning with your banner."
 phx_eur.0101.a:0 "Two seas bow before the guardian of the Strait."

 phx_eur.0102.t:0 "Caravels Beyond the Horizon"
 phx_eur.0102.desc:0 "Inside the newly chartered navigation hall, master pilots unroll vellum portolan charts criss-crossed with compass roses while shipwrights test sharper keels and lateen sails in the estuary. The vast Western Ocean no longer looks like the edge of the world, but a road waiting to be sailed."
 phx_eur.0102.a:0 "Set the compass—new horizons await our sails!"

 phx_eur.0103.t:0 "Splendor of the Red Fortress"
 phx_eur.0103.desc:0 "Sunlight slants across slender marble columns and calligraphy-laced arches into tranquil courtyards of myrtle and flowing water. Envoys from Christendom and the Maghreb alike walk the halls of the Alhambra in awed silence, beholding the pinnacle of Andalusian grace."
 phx_eur.0103.a:0 "There is no victor but God—may Granada endure!"

 phx_eur.0104.t:0 "Dawn of the Italian Renaissance"
 phx_eur.0104.desc:0 "Scaffolding comes down from a luminous new loggia while humanist orators read newly translated classics before cheering citizens and visiting bankers. Across the peninsula, princes and republics alike look toward your city as the model of a reborn age of art and intellect."
 phx_eur.0104.a:0 "Let beauty and learning outlive every sword."

 phx_eur.0105.t:0 "Lords of the Red Sea Spice Lanes"
 phx_eur.0105.desc:0 "From Suez to Alexandria, the scent of pepper, ginger, and cinnamon fills the vaulted royal fondacos. Venetian and Genoese factors line up with bags of gold ducats to buy from the Sultan's sealed warehouses, cementing Egypt's mastery of the Eastern trade."
 phx_eur.0105.a:0 "The wealth of the Indies flows through Cairo's gates."

 phx_eur.0106.t:0 "Order Restored to the Tughluq Diwan"
 phx_eur.0106.desc:0 "Fresh silver coinage rings cleanly across the bazaars of Delhi as provincial collectors submit audited ledgers to the reorganized Diwan. With reckless decrees abandoned and disciplined officials restored, the vast machinery of Hindustan turns smoothly once again."
 phx_eur.0106.a:0 "Sound coin and fair measure keep an empire whole."

 phx_eur.0107.t:0 "The Palapa Oath of Nusantara"
 phx_eur.0107.desc:0 "Beneath gilded parasols and drifting incense in Trowulan, the great oath rings out before vassal lords and sea captains from across the islands. Drums thunder over the harbor as Majapahit's fleet raises crimson-and-white pennants to fulfill the vow of archipelagic unity."
 phx_eur.0107.a:0 "Until all Nusantara stands united beneath our mandala!"

 phx_eur.0108.t:0 "Lanterns of Sankore and Timbuktu"
 phx_eur.0108.desc:0 "Beneath the warm earthen towers of Timbuktu, thousands of students gather in shaded courtyards where scholars debate law, medicine, and the stars. Gold may draw caravans across the dunes, yet it is the ink of Sankore that carries Mali's fame across the world."
 phx_eur.0108.a:0 "Gold fades, but wisdom shines forever."

 phx_eur.0109.t:0 "Glory of the Kings: The Kebra Nagast"
 phx_eur.0109.desc:0 "Chanted in Ge'ez beneath embroidered ceremonial umbrellas, the verses of the Kebra Nagast ring across the plateau as nobles, abbots, and provincial governors renew their oaths to the Solomonic throne. Ethiopia stands proud as a fortress of ancient faith."
 phx_eur.0109.a:0 "Long live the covenant of the Lion of Judah!"
