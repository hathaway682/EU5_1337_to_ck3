l_english:
 bm_group_generated:0 "1337"
 bm_group_generated_sub:0 "The Hundred Years’ War"
 bm_hundred_years_edward_iii:0 "King Edward III"
 bm_hundred_years_edward_iii_subheading:0 "King of England"
 bm_hundred_years_edward_iii_desc:0 "Edward III rules England and holds lands across the Channel. His claim to the French crown threatens to bring him into conflict with Philip VI. Can he secure his dynasty and press his ambitions in France?"
 bm_hundred_years_black_prince:0 "Edward, the Black Prince"
 bm_hundred_years_black_prince_subheading:0 "The Young Prince"
 bm_hundred_years_black_prince_desc:0 "The eldest son of Edward III is still a child, but already holds lands in the west of England. His future lies in the hands of his regent and his father’s kingdom. Can he grow into a commander worthy of his future reputation?"
 bm_hundred_years_philip_vi:0 "King Philip VI"
 bm_hundred_years_philip_vi_subheading:0 "The Fortunate"
 bm_hundred_years_philip_vi_desc:0 "Philip of Valois wears the French crown, but Edward III of England disputes his right to it. Powerful dukes owe him allegiance, and the defense of France will demand their loyalty."
 bm_hundred_years_eudes_iv:0 "Duke Eudes IV"
 bm_hundred_years_eudes_iv_subheading:0 "Duke of Burgundy"
 bm_hundred_years_eudes_iv_desc:0 "Eudes IV governs Burgundy as a powerful vassal of the French king. Amid the gathering conflict, he must protect his lands and secure the future of his house."
 bm_hundred_years_john_iii:0 "Duke John III"
 bm_hundred_years_john_iii_subheading:0 "The Good"
 bm_hundred_years_john_iii_desc:0 "John III rules Brittany under the French crown. With no surviving children, his succession is uncertain; the rival ambitions of his relatives threaten the peace of the duchy."
