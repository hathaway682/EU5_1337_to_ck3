 # --- 1337 Era Men-at-Arms ---
 phx_maa_english_longbowmen:0 "English Longbowmen"
 phx_maa_english_longbowmen_flavor:0 "#F Drawn from the yeomanry of England and Wales, these disciplined archers loose storms of bodkin arrows from six-foot yew warbows capable of shattering charging heavy cavalry.#!"

 phx_maa_early_janissaries:0 "Early Janissaries"
 phx_maa_early_janissaries_flavor:0 "#F The elite standing infantry of the House of Osman, forged through strict drill and unswerving loyalty to serve as the decisive core of Ottoman battle lines.#!"

 phx_maa_teutonic_ordensritter:0 "Teutonic Ordensritter"
 phx_maa_teutonic_ordensritter_flavor:0 "#F Clad in white mantles emblazoned with the black cross, the heavily armored brother-knights of the Teutonic Order deliver devastating lance charges across the Baltic frontier.#!"

 phx_maa_rtr_hand_cannoners:0 "Shenji Hand-Cannoners"
 phx_maa_rtr_hand_cannoners_flavor:0 "#F Armed with cast-bronze huochong hand cannons forged in late-Yuan and Red Turban arsenals, these shock gunners unleash thunderous volleys that punch through heavy armor.#!"

 phx_maa_mamluk_royal_guard:0 "Mamluk Royal Guard"
 phx_maa_mamluk_royal_guard_flavor:0 "#F The Sultan's elite Kipchak and Circassian royal mamluks, masters of both the heavy lance and composite bow trained from youth in the furusiyya martial arts of Cairo.#!"

 phx_maa_byz_reformed_tagmata:0 "Reformed Imperial Tagmata"
 phx_maa_byz_reformed_tagmata_flavor:0 "#F Reconstituted heavy infantry of the Palaiologan imperial guard, combining classical Roman shield-wall discipline with late-medieval arms to hold the bastions of the Empire.#!"

 # --- 1337 Historical Artifacts ---
 phx_art_palaiologoi_diadem_name:0 "Diadem of the Palaiologoi"
 phx_art_palaiologoi_diadem_desc:0 "The jeweled imperial stemma worn by the Palaiologan Basileis of Constantinople, hung with pearl pendilia that recall the unbroken majesty of New Rome."

 phx_art_yuan_jade_seal_name:0 "Imperial Jade Seal of the Great Yuan"
 phx_art_yuan_jade_seal_desc:0 "Carved from lustrous white Hetian jade and crowned with coiled dragons, this sovereign seal affirms the Mandate of Heaven exercised by the Great Khan at Dadu."

 phx_art_sword_of_osman_name:0 "Sword of Osman"
 phx_art_sword_of_osman_desc:0 "The sacred ceremonial blade girded upon the ruler of the House of Osman at accession, embodying the ghazi spirit and martial destiny of the Ottoman realm."

 phx_art_oriflamme_name:0 "The Oriflamme of Saint-Denis"
 phx_art_oriflamme_desc:0 "The crimson silk war-banner kept at the Abbey of Saint-Denis and unfurled by the Kings of France in moments of mortal peril, signaling that no quarter shall be given."

 phx_art_st_edward_crown_name:0 "Crown of St. Edward"
 phx_art_st_edward_crown_desc:0 "The venerable coronation crown of the Kings of England, treasured at Westminster Abbey since the days of Edward the Confessor as the supreme emblem of English kingship."

 phx_art_charlemagne_regalia_name:0 "Imperial Regalia of Charlemagne"
 phx_art_charlemagne_regalia_desc:0 "The octagonal jeweled Reichskrone and sacred insignia of the Holy Roman Empire, proclaiming the Emperor's succession from Charlemagne and the Caesars of Rome."

 phx_art_st_wenceslas_crown_name:0 "Crown of Saint Wenceslas"
 phx_art_st_wenceslas_crown_desc:0 "The golden royal crown dedicated to Saint Wenceslas, patron of Bohemia, symbolizing the enduring sovereignty and sanctity of the Bohemian Crown."

 phx_art_teutonic_cross_name:0 "Grand Master's Teutonic Cross"
 phx_art_teutonic_cross_desc:0 "An enameled black cross potent set within gold filigree and the imperial eagle, worn by the Hochmeister at Marienburg as the badge of the Teutonic Order's crusading authority."

 phx_art_nemanjic_scepter_name:0 "Scepter of the Nemanjići"
 phx_art_nemanjic_scepter_desc:0 "A gilded ceremonial scepter wrought in the imperial Byzantine fashion for the Nemanjić monarchs of Serbia, testifying to their ambition for Balkan hegemony."

 phx_art_al_nasir_sword_name:0 "Mamluk Sword of al-Nasir"
 phx_art_al_nasir_sword_desc:0 "A finely watered Damascus shamshir inlaid with gold calligraphy for Sultan al-Nasir Muhammad of Cairo, renowned for its balance and fearsome cutting edge."

 phx_art_mansa_musa_staff_name:0 "Golden Staff of Mansa Musa"
 phx_art_mansa_musa_staff_desc:0 "Cast from the famed alluvial gold of Bambuk and Bure, this royal staff proclaims the unmatched wealth, piety, and authority of the Mansa of Mali."

 phx_art_gajah_mada_kris_name:0 "Kris of Gajah Mada"
 phx_art_gajah_mada_kris_desc:0 "A sinuous, pamor-forged ceremonial kris consecrated in the Majapahit court, associated with the iron will of Mahapatih Gajah Mada and his Palapa oath to unite Nusantara."

