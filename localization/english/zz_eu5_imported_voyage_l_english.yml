 nwt_voyage.30.a:0 "Trust [nwt_captain.GetFirstName] to ride it out."
 nwt_voyage.30.a.good:0 "The fleet comes through"
 nwt_voyage.30.a.hurt:0 "The captain is hurt"
 nwt_voyage.30.a.lost:0 "The fleet is lost"
 nwt_voyage.30.b:0 "Run for shelter and wait for calm seas."
 nwt_voyage.30.b.tt:0 "The voyage is delayed by about a month and a half"
 nwt_voyage.30.desc:0 "A dispatch tells of black skies over the open ocean. [nwt_captain.GetFirstName]'s fleet is caught in a great storm, with waves higher than the masts."
 nwt_voyage.30.t:0 "Storm at Sea"
 nwt_voyage.31.a:0 "Pay for fresh fruit and stores at the next island."
 nwt_voyage.31.b:0 "The crews must endure."
 nwt_voyage.31.b.back:0 "The fleet turns back"
 nwt_voyage.31.b.good:0 "The crews pull through"
 nwt_voyage.31.b.ill:0 "The captain falls ill"
 nwt_voyage.31.desc:0 "Weeks out of sight of land, the sailors' gums bleed and their old wounds open. Scurvy is spreading through [nwt_captain.GetFirstName]'s crews."
 nwt_voyage.31.t:0 "Scurvy"
 nwt_voyage.32.a:0 "[nwt_captain.GetFirstName] will keep order by force."
 nwt_voyage.32.a.good:0 "The mutiny is crushed"
 nwt_voyage.32.a.lost:0 "The mutineers set the captain adrift"
 nwt_voyage.32.b:0 "Promise the crews a share of the riches."
 nwt_voyage.32.c:0 "Give in and turn for home."
 nwt_voyage.32.c.tt:0 "The voyage is abandoned and the ships sail home"
 nwt_voyage.32.desc:0 "The sailors swear the ocean has no end. They demand that [nwt_captain.GetFirstName] turn the ships for home, and some have taken up arms."
 nwt_voyage.32.t:0 "Mutiny!"
 nwt_voyage.33.a:0 "God favours this voyage."
 nwt_voyage.33.desc:0 "Steady winds fill the sails day after day, and [nwt_captain.GetFirstName]'s fleet makes swift progress across the ocean."
 nwt_voyage.33.t:0 "Fair Winds"
 nwt_voyage.51.a:0 "Exchange gifts."
 nwt_voyage.51.b:0 "Plant our banner and claim this land for the crown."
 nwt_voyage.51.desc:0 "When [nwt_captain.GetFirstName]'s boats reached the beach, people came out of the trees with food, cotton and painted gifts. They seem curious and unafraid."
 nwt_voyage.51.t:0 "A Friendly Meeting"
 nwt_voyage.52.a:0 "Fight back!"
 nwt_voyage.52.a.dead:0 "The captain is killed"
 nwt_voyage.52.a.hurt:0 "The captain is wounded"
 nwt_voyage.52.a.win:0 "The attackers are driven off"
 nwt_voyage.52.b:0 "Back to the boats!"
 nwt_voyage.52.c:0 "Lay down the weapons and show open hands."
 nwt_voyage.52.c.good:0 "The arrows stop, and the people come forward"
 nwt_voyage.52.c.hurt:0 "The arrows keep coming"
 nwt_voyage.52.desc:0 "No sooner had [nwt_captain.GetFirstName]'s men waded ashore than arrows began to fall among them from the dark trees."
 nwt_voyage.52.t:0 "Arrows from the Treeline"
 nwt_voyage.53.a:0 "Accept the invitation."
 nwt_voyage.53.a.good:0 "A night of friendship"
 nwt_voyage.53.a.ill:0 "The captain falls ill"
 nwt_voyage.53.b:0 "Refuse. It may be a trap."
 nwt_voyage.53.desc:0 "A local chief has sent word: [nwt_captain.GetFirstName] and [nwt_captain.GetHerHis] officers are invited to a feast in his village, far from the ships."
 nwt_voyage.53.t:0 "The Chief's Feast"
 nwt_voyage.54.a:0 "Trade our goods for their gold."
 nwt_voyage.54.b:0 "Take it by force."
 nwt_voyage.54.b.good:0 "The gold is ours"
 nwt_voyage.54.desc:0 "[nwt_captain.GetFirstName] has seen people wearing ornaments of gold. They say it comes from a river further inland."
 nwt_voyage.54.t:0 "Gold in the River"
 nwt_voyage.56.a:0 "Trade beads, knives and cloth for food."
 nwt_voyage.56.b:0 "Take what we need. We have the guns."
 nwt_voyage.56.b.bad:0 "They come back at night with arrows"
 nwt_voyage.56.b.good:0 "The villagers flee"
 nwt_voyage.56.desc:0 "People from a nearby village have come down to the shore with baskets of cassava, fish and fruit. They point at the sailors' knives and bright cloth."
 nwt_voyage.56.t:0 "Trading on the Beach"
 nwt_voyage.57.a:0 "Careen the ships and scrape the hulls."
 nwt_voyage.57.b:0 "No time. Patch them and press on."
 nwt_voyage.57.b.bad:0 "A leak spoils the stores"
 nwt_voyage.57.b.good:0 "The patches hold"
 nwt_voyage.57.desc:0 "Shipworm has eaten into the planks, and the pumps run day and night. The carpenter says the ships must be hauled onto the beach and scraped, or they will not survive the voyage home."
 nwt_voyage.57.t:0 "Worm in the Hulls"
 nwt_voyage.58.a:0 "Let them go. Fewer mouths to feed."
 nwt_voyage.58.b:0 "Drag them back in chains."
 nwt_voyage.58.b.bad:0 "More slip away in the confusion"
 nwt_voyage.58.b.good:0 "They are brought back, and the rest take note"
 nwt_voyage.58.desc:0 "A dozen sailors have slipped away into the forest. Word is they have found a village that welcomed them, and they mean never to see a ship again."
 nwt_voyage.58.t:0 "Deserters"
 nwt_voyage.80.a:0 "Cut the water ration and wait for the wind."
 nwt_voyage.80.b:0 "Lower the boats and tow the ships out of the calm."
 nwt_voyage.80.b.bad:0 "Men collapse at the oars"
 nwt_voyage.80.b.good:0 "A breeze finds them"
 nwt_voyage.80.desc:0 "For eleven days not a breath of wind has touched the sails. The sea lies flat as oil under a white sun, the water casks are going green, and the men stare at the horizon in silence."
 nwt_voyage.80.t:0 "Becalmed"
 nwt_voyage.81.a:0 "Follow the birds!"
 nwt_voyage.81.a.bad:0 "Nothing but empty sea"
 nwt_voyage.81.a.good:0 "An unknown island, rich in fruit and water"
 nwt_voyage.81.b:0 "Hold the course. We have a coast to reach."
 nwt_voyage.81.desc:0 "A gale has carried [nwt_captain.GetFirstName]'s ships far from any chart. Now the lookouts report driftwood with green leaves and flocks of birds flying west at dusk: there may be land nobody has ever marked."
 nwt_voyage.81.t:0 "Blown Off Course"
 nwt_voyage.82.a:0 "All hands to the buckets!"
 nwt_voyage.82.a.bad:0 "Half the stores burn"
 nwt_voyage.82.a.good:0 "The fire is put out"
 nwt_voyage.82.b:0 "Abandon her and cut her loose."
 nwt_voyage.82.desc:0 "A lantern fell in the hold of the supply ship. Smoke pours from the hatches and the flames are creeping toward the powder and the ship's stores."
 nwt_voyage.82.t:0 "Fire Aboard!"
 nwt_voyage.83.a:0 "A sign of God's favour. Tell the men."
 nwt_voyage.83.b:0 "Harpoon one for the cooking pots."
 nwt_voyage.83.b.bad:0 "The beast smashes a boat"
 nwt_voyage.83.b.good:0 "Fresh meat and oil for weeks"
 nwt_voyage.83.desc:0 "Great whales rise beside the fleet, larger than the ships themselves, spouting fountains into the air. Some sailors cross themselves, others reach for the harpoons."
 nwt_voyage.83.t:0 "Leviathans of the Deep"
 nwt_voyage.84.a:0 "Fill every barrel and cask."
 nwt_voyage.84.b:0 "Let the men rest ashore for a week."
 nwt_voyage.84.desc:0 "The lookout spots a green island with a waterfall tumbling into a quiet bay. The men cheer at the thought of clean water and fruit."
 nwt_voyage.84.t:0 "An Island of Fresh Water"
 nwt_voyage.85.a:0 "Trust the stars and the astrolabe."
 nwt_voyage.85.a.bad:0 "Weeks lost on a wrong heading"
 nwt_voyage.85.a.good:0 "The reckoning was right"
 nwt_voyage.85.b:0 "Listen to the old pilot."
 nwt_voyage.85.desc:0 "The old pilot swears the fleet has sailed too far south and must turn. [nwt_captain.GetFirstName] has taken the height of the sun with the astrolabe and is sure of the course. The crew listens to every word."
 nwt_voyage.85.t:0 "The Navigators Quarrel"
 nwt_voyage.86.a:0 "Run out the guns and fight!"
 nwt_voyage.86.a.good:0 "The corsairs are beaten and their ship plundered"
 nwt_voyage.86.a.hurt:0 "They are driven off, at a cost"
 nwt_voyage.86.a.lost:0 "The fleet is taken"
 nwt_voyage.86.b:0 "Crowd on sail and flee."
 nwt_voyage.86.b.bad:0 "We escape, but throw cargo overboard to do it"
 nwt_voyage.86.b.good:0 "They lose sight of us"
 nwt_voyage.86.desc:0 "Strange sails are closing fast: corsairs who prey on ships coming and going from the new lands. They fly no honest flag."
 nwt_voyage.86.t:0 "Sails on the Horizon"
 nwt_voyage.90.a:0 "Share it out fairly."
 nwt_voyage.90.b:0 "Every coin belongs to the crown."
 nwt_voyage.90.desc:0 "On the long way home the crew has counted the gold, pearls and dyes in the hold. Now a delegation stands before [nwt_captain.GetFirstName] asking what share is theirs."
 nwt_voyage.90.t:0 "Treasure in the Hold"
 nwt_voyage.91.a:0 "Half rations to the end."
 nwt_voyage.91.b:0 "Eat the rats and boil the boot leather."
 nwt_voyage.91.b.bad:0 "Men begin to die"
 nwt_voyage.91.b.good:0 "Somehow they hold on"
 nwt_voyage.91.desc:0 "The biscuit is full of weevils and the water stinks. The steward says what is left will not last until home."
 nwt_voyage.91.t:0 "The Last Biscuit"
 nwt_voyage.92.a:0 "Put in for fresh water and news."
 nwt_voyage.92.b:0 "Home is close. Sail on."
 nwt_voyage.92.desc:0 "The green peaks of the Atlantic islands rise from the sea. From here, home is only a few weeks away."
 nwt_voyage.92.t:0 "Familiar Islands"
 eu5_voyage_abandoned_tt:0 "The expedition turns back without a chart."
 eu5_voyage_lost_tt:0 "The fleet is lost and the expedition returns no chart."
 eu5_voyage_captain_loss_tt:0 "The captain’s death ends the expedition without a chart."
 eu5_voyage_launch_tt:0 "An available courtier will captain the expedition; if none is available, a captain is recruited. The base voyage takes one year."
 eu5_voyage_delay_10_tt:0 "The voyage is delayed by 10 days."
 eu5_voyage_delay_15_tt:0 "The voyage is delayed by 15 days."
 eu5_voyage_delay_20_tt:0 "The voyage is delayed by 20 days."
 eu5_voyage_delay_25_tt:0 "The voyage is delayed by 25 days."
 eu5_voyage_delay_30_tt:0 "The voyage is delayed by 30 days."
 eu5_voyage_delay_45_tt:0 "The voyage is delayed by 45 days."
