 nanbokucho_divided:0 "Rival Courts"
 nanbokucho_divided_desc:0 "Both courts gather support while the conflict threatens to spread.\n\n#high Northern power:#! [EmptyScope.ScriptValue('nanbokucho_north_power')|0] ([EmptyScope.ScriptValue('nanbokucho_north_share')|0]%)\n#high Southern power:#! [EmptyScope.ScriptValue('nanbokucho_south_power')|0] ([EmptyScope.ScriptValue('nanbokucho_south_share')|0]%)\nOnly participating house heads count; each contributes their house power score once."
