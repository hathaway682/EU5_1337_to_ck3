l_english:
 nanbokucho:0 "The Northern and Southern Courts"
 situation_nanbokucho:0 "The Northern and Southern Courts"
 situation_nanbokucho_desc:0 "Rival emperors hold court in Kyoto and Yoshino. Warriors and courtiers must choose their loyalties as war and negotiation shape Japan’s future.\n\n#high Northern power:#! [EmptyScope.ScriptValue('nanbokucho_north_power')|0] ([EmptyScope.ScriptValue('nanbokucho_north_share')|0]%)\n#high Southern power:#! [EmptyScope.ScriptValue('nanbokucho_south_power')|0] ([EmptyScope.ScriptValue('nanbokucho_south_share')|0]%)\nOnly participating house heads count; each contributes their house power score once."
