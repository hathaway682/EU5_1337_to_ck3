l_english:
 culture_era_eu5_discovery:0 "Age of Discovery"
 culture_era_eu5_discovery_desc:0 "Cultural and technological developments during the Age of Discovery."
 innovation_eu5_fort_limit_3_advance:0 "Defense Bureau"
 innovation_eu5_fort_limit_3_advance_desc:0 "The crown estate centralizes oversight of fortifications under a formal bureau in the capital, consolidating records, funds, and maintenance orders into a single administrative authority."
 innovation_eu5_unlock_falconet_advance:0 "Falconet"
 innovation_eu5_unlock_falconet_advance_desc:0 "The Falconet is a light cannon developed in the 15th century as an evolution of the similar falcon, being more mobile while firing smaller caliber shots."
 innovation_eu5_training_ground:0 "Training Grounds"
 innovation_eu5_training_ground_desc:0 "New institutions and techniques emerge as society and its armies develop."
 innovation_eu5_correct_box_advance_discovery:0 "Lieutenants"
 innovation_eu5_correct_box_advance_discovery_desc:0 "As our professional armies grow, the commissioned officers that lead them are commanding increasingly bigger formations. To assist them, we will create the rank of lieutenant. These officers take charge of transmitting orders from command, and also lead smaller units on the battlefield."
 innovation_eu5_matchlock_gun:0 "Early Hunting Guns"
 innovation_eu5_matchlock_gun_desc:0 "Improvements to the weapons produced by our gunsmiths will also provide our hunters with better tools to bring home ample furs and wild game."
 innovation_eu5_regiment_reinforcement_speed_discovery:0 "Early Military Logistics"
 innovation_eu5_regiment_reinforcement_speed_discovery_desc:0 "Logistics are half the battle. As soldiers fight, their weaponry and armor will lose their durability, and possibly even break under the enemy onslaught. Establishing local supply depots, as well as employing other logistic methods, allows us to re-equip our soldiers in record time."
 innovation_eu5_government_size_discovery:0 "Early Administrative Capacity"
 innovation_eu5_government_size_discovery_desc:0 "Our domain consists of many administrative sectors, and as we expand it, we must make the necessary adjustments to our government to account for this growth. "
 innovation_eu5_town_rights_enable:0 "Borough Privileges"
 innovation_eu5_town_rights_enable_desc:0 "It is unquestionable that any substantial aglomeration of people and residences makes a settlement quite different from the countryside. Inheriting from the traditions of Roman self-administrated cities, we can provide such settlements with special laws and privileges, thus making the difference more clear and providing advantages for their populace."
 innovation_eu5_basic_financial_instruments:0 "Basic Financial Instruments"
 innovation_eu5_basic_financial_instruments_desc:0 "Overseas trade is very risky, but also highly profitable. The development of financial instruments like letters of credit will help reduce that risk and increase our profits."
 innovation_eu5_power_projection_advance_4:0 "Domineering External Influence"
 innovation_eu5_power_projection_advance_4_desc:0 "Our presence at the diplomatic tables always conveys an air of grandeur and prestige. Our voice and influence shall resonate with all those with whom we engage."
 innovation_eu5_new_world_crops:0 "New World Crops"
 innovation_eu5_new_world_crops_desc:0 "The bountiful lands of the New World have provided many treasures to our country. One of the most important discoveries is that of the strange, exotic plants cultivated as food and spices by the natives of those lands. Growing those crops in our fields will provide our population with the dietary variety and novelty they crave."
 innovation_eu5_blast_furnace:0 "Blast Furnace"
 innovation_eu5_blast_furnace_desc:0 "A more expensive method than traditional metallurgy, the use of blast furnaces allows us to further refine pig iron into cast iron by re-melting it with different quantities of iron, steel, limestone, and charcoal. Cast iron made into wrought iron this way creates an excellent material for making complex products such as cannon."
 innovation_eu5_burgher_privileges:0 "Burgher Privileges"
 innovation_eu5_burgher_privileges_desc:0 "New institutions and techniques emerge as society and its armies develop."
 innovation_eu5_construction_speed_discovery:0 "Standardized Planks and Bricks"
 innovation_eu5_construction_speed_discovery_desc:0 "The standardization of plank and brick production using more modern techniques aims to enable easier construction."
 innovation_eu5_trade_range_advance_age_3:0 "Improved Trade Ships"
 innovation_eu5_trade_range_advance_age_3_desc:0 "We have developed larger ships that require a smaller crew to sail, and which can travel farther without needing to stop. This should greatly increase the range of our trade efforts as a result."
 innovation_eu5_print_culture:0 "Print Culture"
 innovation_eu5_print_culture_desc:0 "With the invention of the printing press, the spread of knowledge has never been easier. New techniques and advances will reach every corner of our nation and make it grow stronger and richer."
 innovation_eu5_overseas_expeditions:0 "Overseas Expeditions"
 innovation_eu5_overseas_expeditions_desc:0 "New institutions and techniques emerge as society and its armies develop."
 innovation_eu5_open_sea_exploration:0 "Open Sea Exploration"
 innovation_eu5_open_sea_exploration_desc:0 "The vast seas promise us great riches and new opportunities for trade on distant shores."
 innovation_eu5_colonial_charters:0 "Colonial Charters"
 innovation_eu5_colonial_charters_desc:0 "These new documents will ensure the rights of our countrymen when they settle the untamed New World. They give our colonies the exclusive right of governing these new lands and regulate their relationship with the mother country."
 innovation_eu5_surgery_advance:0 "Surgery"
 innovation_eu5_surgery_advance_desc:0 "Barber-surgeons are developing more sophisticated techniques for treating injuries and illnesses, and the invention of new surgical instruments makes procedures safer and more effective. As a result, patients are surviving injuries and illnesses that would have been fatal just a few years ago."
 culture_era_eu5_reformation:0 "Reformation"
 culture_era_eu5_reformation_desc:0 "Cultural and technological developments during the Reformation."
 innovation_eu5_fort_limit_4_advance:0 "Inspectors General"
 innovation_eu5_fort_limit_4_advance_desc:0 "Professional inspectors travel the realm to evaluate garrisons, stores, and walls, enforcing consistent standards and ensuring the reliability of each fortified place."
 innovation_eu5_artillery_institution_advance:0 "Siege Artillery"
 innovation_eu5_artillery_institution_advance_desc:0 "The invention of gunpowder in Sòng CHI has led to the development of a new device that employs its firepower in warfare: the artillery. These weapons pose a serious threat to stone-built castles and other fortifications."
 innovation_eu5_barracks:0 "Barracks"
 innovation_eu5_barracks_desc:0 "The Barracks are a more efficient way of increasing the manpower we need for our armies by replacing the Armory in towns and cities."
 innovation_eu5_correct_box_advance_reformation:0 "Regimental Organization"
 innovation_eu5_correct_box_advance_reformation_desc:0 "Professional armies have made it possible to create a new type of unit, the regiment, which not only is a permanent position for soldiers, but also a useful battle formation."
 innovation_eu5_flintlock_gun:0 "Improved Hunting Guns"
 innovation_eu5_flintlock_gun_desc:0 "With the development of improved flintlock guns and special ammunition for hunting, our hunters will be even more capable of bagging their prey."
 innovation_eu5_military_administration:0 "Military Administration"
 innovation_eu5_military_administration_desc:0 "The ever-increasing armies of the 16th century have imposed equally heightened demands on national administrations. By creating a permanent organization charged with military supply strategy and operation, and by keeping more troops on the rolls even during winter or peacetime, we will ultimately be able to field large armies more cheaply and to support those armies more efficiently."
 innovation_eu5_generic_bureaucracy_4_advance:0 "Executive Bureaucracy"
 innovation_eu5_generic_bureaucracy_4_advance_desc:0 "As governments grow, so too does the need for a more complex and efficient bureaucracy. By creating specialized departments to handle specific aspects of governance, we can ensure that our administration runs smoothly and effectively."
 innovation_eu5_town_rights_ref_advance:0 "Developed Capital"
 innovation_eu5_town_rights_ref_advance_desc:0 "As our country grows, so does our capital, requiring constant revision and update of the laws affecting it. Only with a functioning capital, with laws and privileges perfectly suited to its size and importance, can our country continue growing."
 innovation_eu5_chartered_companies:0 "Chartered Companies"
 innovation_eu5_chartered_companies_desc:0 "The world is a big place, and in order to develop our global trade, we must take some serious risks. Luckily there are merchant in our country willing to do so, using mostly their own capital. By sanctioning such companies with a government charter giving them special rights to exercise government powers as well as monopolies in certain areas, we can control and encourage commercial development of everything from foreign trade networks to our colonial possessions overseas."
 innovation_eu5_war_score_reformations_advance:0 "Divine Right to Conquer"
 innovation_eu5_war_score_reformations_advance_desc:0 "Victory on the battlefield is the result of more than just good execution of battle plans and war strategies — it is a divine intervention in our favor. Therefore, our right to conquer and annex new territories for which we have spilled blood is an extension of the divine will that champions our supremacy."
 innovation_eu5_food_advance_reformation:0 "Market Agriculture"
 innovation_eu5_food_advance_reformation_desc:0 "New and improved crops can be introduced to increase agricultural productivity. Whether through selective breeding of existing varieties or importing superior foreign cultivars, we can significantly boost our food production."
 innovation_eu5_bole_smelting:0 "Bole Smelting"
 innovation_eu5_bole_smelting_desc:0 "A method where lead is smelted in the open air using the constant strong winds at the top of hills to blow fresh air into the melting ore."
 innovation_eu5_rgo_size_advance_reformation:0 "Spinning Wheels"
 innovation_eu5_rgo_size_advance_reformation_desc:0 "As we learn new and better methods of resource extraction, our production will skyrocket, making us richer in the process!"
 innovation_eu5_construction_speed_reformation:0 "Architectural Treatises"
 innovation_eu5_construction_speed_reformation_desc:0 "The writing of architectural treatises, which often compile centuries-old knowledge, allows for faster learning and dissemination of effective construction techniques."
 innovation_eu5_global_trade_routes_advance:0 "Overseas Trade Routes"
 innovation_eu5_global_trade_routes_advance_desc:0 "The world has become larger, thanks to so many new discoveries, but it has also grown smaller with the proliferation of international trade routes. With ships constantly carrying goods and people to and from far away lands, those distant shores actually seem closer than before."
 innovation_eu5_scientific_experimentation:0 "Scientific Experimentation"
 innovation_eu5_scientific_experimentation_desc:0 "Things happen for a reason. By understanding the explanation behind everything, we can learn what to expect when similar situations arise."
 innovation_eu5_letters_of_marque:0 "Letters of Marque"
 innovation_eu5_letters_of_marque_desc:0 "Piracy is an appalling act. They are naught but worthless thieves looking to profit from the suffering of others! Formally authorizing ships to raid our enemies, however, is another matter entirely, and could be extremely profitable for us."
 innovation_eu5_confessionalism_advance:0 "Confessionalism"
 innovation_eu5_confessionalism_advance_desc:0 "There are a myriad of different interpretations of what the Faith should be, and as such, there has been an increased interest among religious and secular authorities alike to clearly define the methodology of their specific confessions, enforcing their particular rules and views on all aspects of faith and life."
 innovation_eu5_religious_toleration:0 "Religious Toleration"
 innovation_eu5_religious_toleration_desc:0 "Stability in our home regions is the key to our success elsewhere. Expanding outwards while fostering religious tolerance, we not only improve stability at home, but we also make our realm a haven for those fleeing persecution elsewhere."
 innovation_eu5_development_of_maritime_law:0 "Maritime Law"
 innovation_eu5_development_of_maritime_law_desc:0 "With more and more countries sending their subjects or citizens abroad on various trading ventures and with so many living so close to each other for so long times it has become absolutely essential to have at least a basic concept of common laws of the seas. With publications such as 'Mare Liberum' or the later 'De Dominio Maris Dissertatio', the foundations to an international law of the seas have been laid."
 culture_era_eu5_absolutism:0 "Absolutism"
 culture_era_eu5_absolutism_desc:0 "Cultural and technological developments during the Absolutism."
 innovation_eu5_fort_limit_5_advance:0 "Standardized Engineering"
 innovation_eu5_fort_limit_5_advance_desc:0 "National standards for construction and repair are introduced, enabling efficient planning, shared designs, and predictable maintenance across our network of fortresses."
 innovation_eu5_artillery_vs_fort_age_5_absolutism:0 "Siege Cannons"
 innovation_eu5_artillery_vs_fort_age_5_absolutism_desc:0 "Gunpowder has made way for the creation of multiple different types of weapons. Cutting through lines of infantry does not require the same power as breaking down castle walls, and so a specialized type of cannon has to be deployed in sieges."
 innovation_eu5_legion_camp:0 "Legion Camps"
 innovation_eu5_legion_camp_desc:0 "New institutions and techniques emerge as society and its armies develop."
 innovation_eu5_correct_box_advance_absolutism:0 "Flexible Battle Formations"
 innovation_eu5_correct_box_advance_absolutism_desc:0 "New tactics have developed, making for more flexible and coordinated infantry, cavalry, and artillery units on the battlefield, usually grouped as brigades."
 innovation_eu5_line_infantry:0 "Line Infantry"
 innovation_eu5_line_infantry_desc:0 "With the invention of bayonets, each musketeer could also function as a pikeman. This allowed pikes to be removed from infantry equipment, and provided infantry formations with more firepower."
 innovation_eu5_improved_supply_lines:0 "Improved Supply Lines"
 innovation_eu5_improved_supply_lines_desc:0 "Modern warfare demands more and more resources for our armies, especially since the development of salvo fire and the widespread use of artillery on the battlefield."
 innovation_eu5_government_size_absolutism:0 "Loyal Subordinates"
 innovation_eu5_government_size_absolutism_desc:0 "Concentrating power in the hands of the rulers allows them to take direct action, but they still need people under them to help carry out those actions. Giving those subordinates no real power, while making them unfailingly loyal to the ruler, allows the crown estate to host more of them without fear of infighting or discontent."
 innovation_eu5_town_rights_abs_advance:0 "Splendorous Court"
 innovation_eu5_town_rights_abs_advance_desc:0 "As the place of our court, our capital should also bask in the glory and magnificence of our rule. No other town or city should come close to it in majesty and grandeur."
 innovation_eu5_central_bank_advance:0 "Central Banking"
 innovation_eu5_central_bank_advance_desc:0 "With the banking institution firmly established, the state can now charter a permanent central bank empowered to issue government bonds. These bonds allow the crown to raise large sums quickly from private investors, repaying them through steady interest rather than relying on estate lending alone."
 innovation_eu5_national_sovereignty:0 "National Sovereignty"
 innovation_eu5_national_sovereignty_desc:0 "The many long wars in the first half of the 17th century have led to an international diplomatic system for which the territorial integrity of states is a cornerstone. States, rather than individual rulers or supra-national groupings, are the actors in the international arena, and no state has the right to intervene in the internal affairs of another."
 innovation_eu5_food_advance_absolutism:0 "Closed Fields"
 innovation_eu5_food_advance_absolutism_desc:0 "Until recently, land ownership and use was relatively common and free. However, there is now an increasing tendency to start a process of specific land delimitation, clearly determining the borders and size of fields exclusively dedicated to agriculture. With this kind of specified use, their production and exploitation can be greatly increased."
 innovation_eu5_coke_blast_furnace:0 "Coke Blast Furnace"
 innovation_eu5_coke_blast_furnace_desc:0 "This is a new type of blast furnace, which uses coke instead of charcoal as its fuel. It is cheaper and allows us to build larger furnaces, although coke has the disadvantage of being less pure than charcoal, which is a problem yet to be addressed."
 innovation_eu5_manufactories_advance:0 "Manufactories"
 innovation_eu5_manufactories_advance_desc:0 "Recent technological advances in mechanization have facilitated the rise of concentrated production facilities in the form of manufactories. These businesses have helped us greatly improve the rate and quality of production."
 innovation_eu5_construction_speed_absolutism:0 "Architectural Engineering"
 innovation_eu5_construction_speed_absolutism_desc:0 "Building construction has become more sophisticated over time, incorporating methods and techniques from a wide range of disciplines, commonly considered a type of engineering."
 innovation_eu5_maritime_advance_age_5:0 "Convoys"
 innovation_eu5_maritime_advance_age_5_desc:0 "As maritime trade expands, with our ships ferrying goods back and forth in greater quantities and to more distant shores than ever before, the need to maintain a consistent flow of commerce also increases. Organizing convoy trade fleets will allow a more stable circulation of trade ships."
 innovation_eu5_scientific_revolution_advance:0 "Scientific Revolution"
 innovation_eu5_scientific_revolution_advance_desc:0 "Recent developments in mathematics, physics, astronomy, biology and chemistry have not only challenged, but completely changed our view of the world around us. Society is progressing at a greater speed than ever before, and more scientific breakthroughs are made every day."
 innovation_eu5_naval_doctrines_advance:0 "Naval Doctrines"
 innovation_eu5_naval_doctrines_advance_desc:0 "Naval warfare has seen many changes in recent years, with ships and fleets both becoming larger and more specialized. As a result of this, different countries are starting to use a variety of tactics and doctrines, tailored to their strong points or their particular way of using their fleets."
 innovation_eu5_newspapers_advance:0 "Newspapers"
 innovation_eu5_newspapers_advance_desc:0 "The concept of announcements being announced or posted where the public may read them is certainly not a new one. However, as the Printing Press becomes more popular around the world, so does the demand for accessible information about politics, war, and the economy. The newspaper - a periodical publication describing current events - shall satisfy this demand."
 innovation_eu5_the_constitution:0 "Constitutionalism"
 innovation_eu5_the_constitution_desc:0 "A new philosophical concept called constitutionalism has been developed, wherein the government accepts legal limits to its power through established law rather than ruling by arbitrary decree. While some may find this idea intriguing, it is obviously not popular with monarchs..."
 innovation_eu5_sanitation_advance:0 "Public Sanitation"
 innovation_eu5_sanitation_advance_desc:0 "Settlements are investing in improved sanitation measures, such as waste disposal and clean water systems. This will reduce the spread of disease, and improve the overall health of the population. The development of modern sanitation practices will make it possible for people to live in closer proximity without succumbing to disease."
 culture_era_eu5_revolutions:0 "Age of Revolutions"
 culture_era_eu5_revolutions_desc:0 "Cultural and technological developments during the Age of Revolutions."
 innovation_eu5_fort_limit_6_advance:0 "Ordnance Surveys"
 innovation_eu5_fort_limit_6_advance_desc:0 "Comprehensive mapping and logistical integration link every fortress into a coherent defensive system; an achievement of bureaucracy, science, and state power working in unison."
 innovation_eu5_artillery_vs_fort_age_6_revolutions:0 "Advanced Howitzers"
 innovation_eu5_artillery_vs_fort_age_6_revolutions_desc:0 "The need for a weapon that fills the niche between the direct fire of siege cannon and the indirect one of the mortars has led our military to develop new howitzers."
 innovation_eu5_recruitment_center:0 "Recruitment Centers"
 innovation_eu5_recruitment_center_desc:0 "New institutions and techniques emerge as society and its armies develop."
 innovation_eu5_correct_box_advance_revolutions:0 "General Staff"
 innovation_eu5_correct_box_advance_revolutions_desc:0 "The growth of armies and their deployment in longer campaigns has created a need to assign designated officers to planning and logistics, focused on effectively coordinating the different corps on the battlefield."
 innovation_eu5_long_rifle:0 "Long Rifle Hunting"
 innovation_eu5_long_rifle_desc:0 "With specific long rifles designed for hunting, our hunters will have a reliable tool for procuring food and furs."
 innovation_eu5_combined_arms_advance_revolutions:0 "Advanced Combined Arms"
 innovation_eu5_combined_arms_advance_revolutions_desc:0 "The regular use of combined arms over several centuries has led to the dominance of this type of warfare. Light infantry and cavalry have the role of weakening and disorganizing enemy forces, while simultaneously screening and protecting their own. Heavy infantry and cavalry bear the brunt of the fighting, seeking decisive charges to rout the enemy, while artillery and auxiliary forces support them from a distance at the rear."
 innovation_eu5_modern_bureaucracy:0 "Modern Bureaucracy"
 innovation_eu5_modern_bureaucracy_desc:0 "In order to best utilize the lands and subjects we control, we must enlarge, reorganize, and professionalize our bureaucracy. We shall create organizations dedicated to administering specific aspects of the state, and thus eliminate the need for ad hoc solutions.\n\nLet us consult with our universities to determine how to most efficiently rule and govern. Meanwhile, we shall encourage our young nobles to serve the state with a pen rather than a sword in hand."
 innovation_eu5_urbanization:0 "Urbanization"
 innovation_eu5_urbanization_desc:0 "The new opportunities and security offered by life in our emerging cities are drawing more and more people off of rural farms and into cities, where they are eager to take up industrial jobs created by the new, modern factories."
 innovation_eu5_the_gold_standard:0 "The Gold Standard"
 innovation_eu5_the_gold_standard_desc:0 "The ongoing trade deficit between europe and CHI has caused a shortage of silver bullion not only in europe, but all over the world. Switching from silver to gold coinage will allow new coins to enter circulation and encourage trade to flow in ever greater amounts."
 innovation_eu5_war_score_revolutions_advance:0 "Arguments of Reason"
 innovation_eu5_war_score_revolutions_advance_desc:0 "Wars are always ugly affairs that bring suffering to both sides. Emphasizing this fact, and appealing to our opposition's reason and logic, will surely give us a significant advantage when negotiating the inevitable border changes."
 innovation_eu5_rotherham_plough:0 "Rotherham Plough"
 innovation_eu5_rotherham_plough_desc:0 "The basic plow in use in europe has been unchanged since Roman times. Now, thanks to an improved design, the same plow can be made much lighter, reducing the strain on draft animals and thereby getting more work out of them."
 innovation_eu5_hot_blast_furnace:0 "Hot Blast Furnace"
 innovation_eu5_hot_blast_furnace_desc:0 "The problems posed by the coke blast furnaces, especially the amount of impurities the coke creates in the final cast iron, has led to the development of the hot blast. It not only greatly reduces the use of coke, therefore improving the quality of the iron, but also allows the use of raw mineral coal as fuel if available, which is a great step forward in iron metallurgy."
 innovation_eu5_industrialization_advance:0 "Industrialization"
 innovation_eu5_industrialization_advance_desc:0 "The Industrial Revolution has brought about permanent change — not just to commerce and business, but to the social fabric of many nations. Inventions such as the power loom and steam engine shall push the capabilities of mankind to its highest zenith yet."
 innovation_eu5_construction_speed_revolutions:0 "Cast Iron Structures"
 innovation_eu5_construction_speed_revolutions_desc:0 "The development of more advanced metallurgy of wrought and cast iron allows for more elaborate metallic structures, such as pillars and columns, which makes building construction much faster."
 innovation_eu5_maritime_advance_age_6:0 "Armed Convoys"
 innovation_eu5_maritime_advance_age_6_desc:0 "Trade convoys are obviously a very juicy target for any pirate. Ships full to the brim with goods and coins are a booty that few will let pass through. Thus, providing those trade convoys with defense armament to deter those attacks is vital. Having the trade fleets be accompanied by frigates or any other armed vessel ensures their safety."
 innovation_eu5_enlightenment_advance:0 "Enlightenment"
 innovation_eu5_enlightenment_advance_desc:0 "The last century has seen Rationalism and Empiricism gain ever-increasing popularity among the greatest minds of the age. The Light of Reason has been lit, and many will not rest until it has been brought to all corners of the earth."
 innovation_eu5_levee_en_masse_advance:0 "Mass Conscription"
 innovation_eu5_levee_en_masse_advance_desc:0 "Warfare is an ever-evolving concept, having been studied and improved upon for generations and generations. To satisfy the need for expansion and provide the fuel necessary to fulfill these ambitions, new nationwide conscription laws will be drafted. We shall raise armies of young, unmarried recruits, the size of which will leave an indelible mark upon history."
 innovation_eu5_rights_of_man:0 "Rights of Man"
 innovation_eu5_rights_of_man_desc:0 "At the forefront of current revolutionary thought is the radical notion of equality for all. Philosophers from around the world have collaborated to create a document entitled the 'Declaration of the Rights of Man and of the Citizen', proclaiming that these rights are universal and should be enforced by law. It is likely that this will be ample fuel for popularizing the concepts of freedom and democracy, and we would do well not to lag behind other nations."
 innovation_eu5_vaccination_advance:0 "Vaccination"
 innovation_eu5_vaccination_advance_desc:0 "With the development of vaccines, physicians are able to provide the populace with immunity against deadly diseases. These vaccines are helping to reduce the spread of disease and prevent epidemics. By injecting a small amount of weakened or dead bacteria or virus into the body, the immune system is able to recognize and fight off the disease if it ever encounters it again."
 innovation_eu5_joint_stock_companies:0 "Joint-Stock Companies"
 innovation_eu5_joint_stock_companies_desc:0 "As trade grew, so did the associated risk. New ways of accumulating capital and managing this risk needed to be developed. In joint stock companies, the burden of enterprise was shared among their many shareholders."
 eu5_innovation_unlock_exploration_tt:0 "Unlocks voyages of exploration"
 eu5_innovation_unlock_colonial_charters_tt:0 "Allows overseas colonization and merchant contributions"
 setting_1453_end_date:0 "1836"
 setting_1453_end_date_desc:0 "The game will end in 1836."
