l_english:
 culture_era_eu5_renaissance:0 "Renaissance"
 culture_era_eu5_renaissance_desc:0 "Cultural and technological developments of the Renaissance."
 innovation_eu5_government_size_renaissance:0 "Permanent Cabinet"
 innovation_eu5_government_size_renaissance_desc:0 "Rulers traditionally had a council of advisors to counsel them through making important decisions. Over time, our government has grown so complex that we need to establish more permanent advisory positions to help us deal with day-to-day governance."
 innovation_eu5_crown_power_advance_renaissance:0 "Sovereignty"
 innovation_eu5_crown_power_advance_renaissance_desc:0 "Traditional governance required rulers to negotiate with estates and balance competing powers. Modern theories of government, however, establish the ruler as supreme authority within the realm — above all other institutions, estates, and subjects, while bowing to no earthly power."
 innovation_eu5_late_feudal_relations:0 "Late Feudal Relations"
 innovation_eu5_late_feudal_relations_desc:0 "Feudalism is built upon the concepts of auxilium and consilium, or military aid and counsel, owed by vassals to their lords. Over this, this has created an intricate hierarchy of rank, privilege, and reciprocal duties."
 innovation_eu5_diplomatic_range_age_1:0 "Foreign Envoys"
 innovation_eu5_diplomatic_range_age_1_desc:0 "Diplomacy between countries has always been important. However, the art of diplomatic maneuvering is growing in intensity and complexity, and it has become common to send our envoys ever further afield than before to expand our foreign relations."
 innovation_eu5_spy_construction_renaissance:0 "Spy Networks"
 innovation_eu5_spy_construction_renaissance_desc:0 "Espionage has been a valuable tool for empires since ancient times. Spycraft allows us to become better informed about both internal and external threats, and to monitor the activities of potentially dangerous states and actors. The Mongols were masters of this art, using espionage to prepare for and secure the success of their military campaigns."
 innovation_eu5_renaissance_urbanisation:0 "Renaissance City Planning"
 innovation_eu5_renaissance_urbanisation_desc:0 "Accounting for dedicated areas for resource exploitation during the planning phase will allow our urban centers to produce more goods than before."
 innovation_eu5_construction_speed_renaissance:0 "Mason Guilds"
 innovation_eu5_construction_speed_renaissance_desc:0 "Freemasons rely on broader associations, known as guilds, to share and preserve their knowledge and experience in a system where veteran masons teach younger apprentices."
 innovation_eu5_food_advance_renaissance:0 "Intensive Agriculture"
 innovation_eu5_food_advance_renaissance_desc:0 "Agriculture is the foundation of most societies. Recent advances have improved the productivity of our fields and farms, creating valuable food surpluses."
 innovation_eu5_rgo_size_advance_renaissance:0 "Mills"
 innovation_eu5_rgo_size_advance_renaissance_desc:0 "Mills have been used since ancient times. However, we are now able to develop more modern and efficient wind and water mills, which in turn improve our production."
 innovation_eu5_cannon_maker_advance:0 "Cannon Maker"
 innovation_eu5_cannon_maker_advance_desc:0 "A guild specialized in crafting and assembling cannons. These powerful weapons are essential for sieges and defense."
 innovation_eu5_banking_advance:0 "Banking"
 innovation_eu5_banking_advance_desc:0 "Moneylending is old as time, but it is not without risks. We can minimize said dangers if we institutionalize those practices and see that money is loaned under controlled and fair stipulations."
 innovation_eu5_merchants_and_trade:0 "Merchants and Trade"
 innovation_eu5_merchants_and_trade_desc:0 "The patterns of trade had been seriously disrupted, possibly due to plagues and pandemics. Now trade is slowly beginning to recover."
 innovation_eu5_maritime_advance_age_2:0 "Trade Fleets"
 innovation_eu5_maritime_advance_age_2_desc:0 "As commerce grows, so does the need to more quickly and efficiently transport greater quantities of goods. As such, those invested in maritime trade will spare no expense in building the bigger fleets they can afford."
 innovation_eu5_renaissance_advance:0 "Renaissance"
 innovation_eu5_renaissance_advance_desc:0 "The waves of innovative thought and discoveries that permeate our realm must be harnessed and utilized if we are to remain at the forefront of technological innovation."
 innovation_eu5_professional_armies_advance:0 "Professional Armies"
 innovation_eu5_professional_armies_advance_desc:0 "The modernization of our armies is largely dependent upon the maintenance of our recruitment and organization centers. We must strive towards preserving a clear and robust military organization, cutting waste and redundancy."
 innovation_eu5_supply_depot_advance_age_2_renaissance:0 "Supply Depots"
 innovation_eu5_supply_depot_advance_age_2_renaissance_desc:0 "No army can survive without supplies. Establishing permanent supply depots dedicated to providing for our fighting forces allows for a continuous feeding of the supply lines, keeping our armies always in peak condition."
 innovation_eu5_patron_of_art:0 "Patron of the Arts"
 innovation_eu5_patron_of_art_desc:0 "Our quest towards cultivating a culturally sophisticated society begins here. Our artistic creations will go down in history as the most marvelous wonders of this era."
 innovation_eu5_chancery_records:0 "Chancery Records"
 innovation_eu5_chancery_records_desc:0 "The growing apparatus of chanceries requires another level of administration, since their bureaucracy is becoming even more complex to manage. This comes in the form of chancery records, an office established to keep all letters received at the chancery, as well as a copy of all the documents issued by its scribes and notaries."
 innovation_eu5_anatomy_advance:0 "Anatomy"
 innovation_eu5_anatomy_advance_desc:0 "Physicians are developing a more advanced understanding of the human body, which is leading to more effective treatments for injuries and diseases. This knowledge, largely gleaned from practical dissections of human cadavers, is also helping to improve surgical techniques and reduce the risks of medical procedures."
 innovation_eu5_pound_lock_canals_advance:0 "Pound Lock Canals"
 innovation_eu5_pound_lock_canals_advance_desc:0 "We have carved into the very face of Earth in order to gain access to food, affluence, and better circulation of goods. The invention of special gates, called 'Mitre Gates', will assist us in providing the necessities for our people to grow and prosper."
 culture_era_eu5_discovery:0 "Age of Discovery"
 culture_era_eu5_discovery_desc:0 "Cultural and technological developments of the Age of Discovery."
 innovation_eu5_government_size_discovery:0 "Early Administrative Capacity"
 innovation_eu5_government_size_discovery_desc:0 "Our domain consists of many administrative sectors, and as we expand it, we must make the necessary adjustments to our government to account for this growth. "
 innovation_eu5_crown_power_advance_discovery:0 "Statecraft"
 innovation_eu5_crown_power_advance_discovery_desc:0 "As our ruler's authority becomes the dominant power in our domain, it highlights the need for a comprehensive government structure, as well as a proper bureaucratic corpus to manage it."
 innovation_eu5_formalized_relations:0 "Formalized Relations"
 innovation_eu5_formalized_relations_desc:0 "Establishing formal relations with neighboring countries of interest is crucial if we are to maintain a balance of power and promote our interests."
 innovation_eu5_diplomatic_range_age_2:0 "Diplomatic Network"
 innovation_eu5_diplomatic_range_age_2_desc:0 "Maintaining an established network of skilled diplomats around us allows us to send envoys to countries even further away."
 innovation_eu5_spy_construction_discovery:0 "Improved Spy Organization"
 innovation_eu5_spy_construction_discovery_desc:0 "By hiring trustworthy individuals as informants and strategically positioning them in situations where clandestine information is shared, we can improve our capability to gather information about our enemies and their activities."
 innovation_eu5_town_rights_enable:0 "Borough Privileges"
 innovation_eu5_town_rights_enable_desc:0 "It is unquestionable that any substantial aglomeration of people and residences makes a settlement quite different from the countryside. Inheriting from the traditions of Roman self-administrated cities, we can provide such settlements with special laws and privileges, thus making the difference more clear and providing advantages for their populace."
 innovation_eu5_construction_speed_discovery:0 "Standardized Planks and Bricks"
 innovation_eu5_construction_speed_discovery_desc:0 "The standardization of plank and brick production using more modern techniques aims to enable easier construction."
 innovation_eu5_new_world_crops:0 "New World Crops"
 innovation_eu5_new_world_crops_desc:0 "The bountiful lands of the New World have provided many treasures to our country. One of the most important discoveries is that of the strange, exotic plants cultivated as food and spices by the natives of those lands. Growing those crops in our fields will provide our population with the dietary variety and novelty they crave."
 innovation_eu5_rgo_size_advance_discovery:0 "Advanced Extraction Techniques"
 innovation_eu5_rgo_size_advance_discovery_desc:0 "The discovery of new minerals and the invention of new tools has resulted in more efficient resource gathering and production line acceleration."
 innovation_eu5_blast_furnace:0 "Blast Furnace"
 innovation_eu5_blast_furnace_desc:0 "A more expensive method than traditional metallurgy, the use of blast furnaces allows us to further refine pig iron into cast iron by re-melting it with different quantities of iron, steel, limestone, and charcoal. Cast iron made into wrought iron this way creates an excellent material for making complex products such as cannon."
 innovation_eu5_basic_financial_instruments:0 "Basic Financial Instruments"
 innovation_eu5_basic_financial_instruments_desc:0 "Overseas trade is very risky, but also highly profitable. The development of financial instruments like letters of credit will help reduce that risk and increase our profits."
 innovation_eu5_merchant_power_from_maritime_discovery_advance:0 "Merchant Guilds"
 innovation_eu5_merchant_power_from_maritime_discovery_advance_desc:0 "The confraternities of merchants allow our traders to organize, share profitable trade route information, and join forces when buying and selling in foreign markets."
 innovation_eu5_maritime_advance_age_3:0 "Exploration Fleets"
 innovation_eu5_maritime_advance_age_3_desc:0 "As our knowledge of the world grows, so does the need to learn even more about it. From the far seas to the east to the new coasts in the west, the length at which we must sail has increased, and thus so has the need for a bigger fleet."
 innovation_eu5_printing_press_advance:0 "Printing Press"
 innovation_eu5_printing_press_advance_desc:0 "The popularization of printing techniques this century has resulted in the wider spread of knowledge, as well as easier exchange of information, by speeding up the duplication of important manuscripts."
 innovation_eu5_pike_and_shot_advance:0 "Pike and Shot"
 innovation_eu5_pike_and_shot_advance_desc:0 "A new type of warfare has emerged on the battlefield: Pikemen form a defensive square, while arquebusiers fan out to the sides and front, retreating behind or inside the square in case the formation enters close combat."
 innovation_eu5_supply_depot_advance_age_3_discovery:0 "Army Depots"
 innovation_eu5_supply_depot_advance_age_3_discovery_desc:0 "The development and deployment of standing armies have increased the demands for weaponry, uniforms, and other military supplies, which should be stored in close proximity to our soldiers."
 innovation_eu5_new_world_advance:0 "New World"
 innovation_eu5_new_world_advance_desc:0 "As the FLO ADJ navigator Amerigo Vespucci says, the lands discovered by Columbus are not the Indies but, in fact, a whole New World unknown to our ancients and waiting to be mapped and claimed."
 innovation_eu5_explorer_commisions_advance:0 "Explorer Commissions"
 innovation_eu5_explorer_commisions_advance_desc:0 "Beyond our shores lie uncharted lands, ripe for the taking! We shall recruit brave explorers to set course for the unknown and bring back exotic goods. This is a vital — and possibly very lucrative — opportunity for us."
 innovation_eu5_colonial_charters:0 "Colonial Charters"
 innovation_eu5_colonial_charters_desc:0 "These new documents will ensure the rights of our countrymen when they settle the untamed New World. They give our colonies the exclusive right of governing these new lands and regulate their relationship with the mother country."
 innovation_eu5_surgery_advance:0 "Surgery"
 innovation_eu5_surgery_advance_desc:0 "Barber-surgeons are developing more sophisticated techniques for treating injuries and illnesses, and the invention of new surgical instruments makes procedures safer and more effective. As a result, patients are surviving injuries and illnesses that would have been fatal just a few years ago."
 culture_era_eu5_reformation:0 "Reformation"
 culture_era_eu5_reformation_desc:0 "Cultural and technological developments of the Reformation."
 innovation_eu5_generic_bureaucracy_4_advance:0 "Executive Bureaucracy"
 innovation_eu5_generic_bureaucracy_4_advance_desc:0 "As governments grow, so too does the need for a more complex and efficient bureaucracy. By creating specialized departments to handle specific aspects of governance, we can ensure that our administration runs smoothly and effectively."
 innovation_eu5_crown_power_advance_reformation:0 "'Cuius Regio, Eius Religio'"
 innovation_eu5_crown_power_advance_reformation_desc:0 "While our ruler has a firm grasp over matters mundane, it is becoming a necessity that they also take control of heavenly concerns. Church and state must become one."
 innovation_eu5_subject_income_reformation_advance:0 "Firmer Financial Control"
 innovation_eu5_subject_income_reformation_advance_desc:0 "The financial responsibilities our subjects have towards us are clearly defined. However, tightening these contracts will ensure timely payments and lead to a healthier treasury."
 innovation_eu5_diplomatic_range_age_3:0 "Embassies"
 innovation_eu5_diplomatic_range_age_3_desc:0 "The current international situation requires that we set up permanent offices for our diplomats in neighboring countries. It is the only way to ensure that our interests are upheld in our region while we extend our reach beyond it."
 innovation_eu5_spy_construction_reformation:0 "Advanced Cryptography"
 innovation_eu5_spy_construction_reformation_desc:0 "If we want to gather intelligence on our enemies, we must improve our skill in cracking and devising secret codes. We shall lull our enemies into a false sense of security by sending what appear to be only ordinary communications, which shall actually contain hidden, encoded information. A pity our enemies will not be clever enough to understand it!"
 innovation_eu5_town_rights_ref_advance:0 "Developed Capital"
 innovation_eu5_town_rights_ref_advance_desc:0 "As our country grows, so does our capital, requiring constant revision and update of the laws affecting it. Only with a functioning capital, with laws and privileges perfectly suited to its size and importance, can our country continue growing."
 innovation_eu5_construction_speed_reformation:0 "Architectural Treatises"
 innovation_eu5_construction_speed_reformation_desc:0 "The writing of architectural treatises, which often compile centuries-old knowledge, allows for faster learning and dissemination of effective construction techniques."
 innovation_eu5_food_advance_reformation:0 "Market Agriculture"
 innovation_eu5_food_advance_reformation_desc:0 "New and improved crops can be introduced to increase agricultural productivity. Whether through selective breeding of existing varieties or importing superior foreign cultivars, we can significantly boost our food production."
 innovation_eu5_rgo_size_advance_reformation:0 "Spinning Wheels"
 innovation_eu5_rgo_size_advance_reformation_desc:0 "As we learn new and better methods of resource extraction, our production will skyrocket, making us richer in the process!"
 innovation_eu5_slitting_mills:0 "Slitting Mills"
 innovation_eu5_slitting_mills_desc:0 "These are a new type of watermills developed for slitting bars of iron into rods. This allows for more efficient development of iron tools and machinery, as it allows casters to use rods that more appropriate for their needs compared to bigger bars, wasting less byproduct in the forging process."
 innovation_eu5_global_trade_advance:0 "Global Trade"
 innovation_eu5_global_trade_advance_desc:0 "Goods have been moved across continents since antiquity, but all trade is now increasingly becoming part of a greater world network. It may still be early to speak of a truly global economy, but surely the first seeds have been sown."
 innovation_eu5_merchant_power_from_maritime_reformation_advance:0 "Merchant Companies"
 innovation_eu5_merchant_power_from_maritime_reformation_advance_desc:0 "The expansion of markets overseas — and the associated expenses and risks — require the creation of merchant associations that share the burden of trading in these new lands."
 innovation_eu5_maritime_advance_age_4:0 "Global Fleets"
 innovation_eu5_maritime_advance_age_4_desc:0 "Given the advances of the last century, it seems like the world has become smaller rather than bigger. Countries that had no contact until now are instead engaging in constant diplomatic and commercial relations. As a result, bigger and better fleets are needed to be able to maintain all those overseas connections."
 innovation_eu5_scientific_experimentation:0 "Scientific Experimentation"
 innovation_eu5_scientific_experimentation_desc:0 "Things happen for a reason. By understanding the explanation behind everything, we can learn what to expect when similar situations arise."
 innovation_eu5_combined_arms_advance_reformation:0 "Combined Arms"
 innovation_eu5_combined_arms_advance_reformation_desc:0 "Warfare is becoming increasingly complex, driven by the widespread adoption of standing armies composed of soldiers hired for permanent service. The introduction of new weapons, such as firearms and cannons, encourages an approach that balances and combines light and heavy infantry, cavalry, and artillery, supported by auxiliary units."
 innovation_eu5_supply_depot_advance_age_4_reformation:0 "Ammunition Depots"
 innovation_eu5_supply_depot_advance_age_4_reformation_desc:0 "Generalized deployment of artillery for battlefields and sieges has created a high demand for the ammunition and gunpowder to fuel them, increasing the importance of storage depots."
 innovation_eu5_confessionalism_advance:0 "Confessionalism"
 innovation_eu5_confessionalism_advance_desc:0 "There are a myriad of different interpretations of what the Faith should be, and as such, there has been an increased interest among religious and secular authorities alike to clearly define the methodology of their specific confessions, enforcing their particular rules and views on all aspects of faith and life."
 innovation_eu5_letters_of_marque:0 "Letters of Marque"
 innovation_eu5_letters_of_marque_desc:0 "Piracy is an appalling act. They are naught but worthless thieves looking to profit from the suffering of others! Formally authorizing ships to raid our enemies, however, is another matter entirely, and could be extremely profitable for us."
 innovation_eu5_development_of_maritime_law:0 "Development of Maritime Law"
 innovation_eu5_development_of_maritime_law_desc:0 "With more and more countries sending their subjects or citizens abroad on various trading ventures and with so many living so close to each other for so long times it has become absolutely essential to have at least a basic concept of common laws of the seas. With publications such as 'Mare Liberum' or the later 'De Dominio Maris Dissertatio', the foundations to an international law of the seas have been laid."
 innovation_eu5_artillery_institution_advance:0 "Siege Artillery"
 innovation_eu5_artillery_institution_advance_desc:0 "The invention of gunpowder in Sòng CHI has led to the development of a new device that employs its firepower in warfare: the artillery. These weapons pose a serious threat to stone-built castles and other fortifications."
 culture_era_eu5_absolutism:0 "Absolutism"
 culture_era_eu5_absolutism_desc:0 "Cultural and technological developments of the Absolutism."
 innovation_eu5_government_size_absolutism:0 "Loyal Subordinates"
 innovation_eu5_government_size_absolutism_desc:0 "Concentrating power in the hands of the rulers allows them to take direct action, but they still need people under them to help carry out those actions. Giving those subordinates no real power, while making them unfailingly loyal to the ruler, allows the crown estate to host more of them without fear of infighting or discontent."
 innovation_eu5_absolute_rulership:0 "Absolute Rulership"
 innovation_eu5_absolute_rulership_desc:0 "Many people demand to be given a role in the government, but mostly because they want to be rewarded without expending much effort. The idea of absolutism has recently piqued our interest, as adopting it would empower us to dispose of those self-serving parasites and rule alone..."
 innovation_eu5_subject_loyalty_absolutism:0 "Absolute Loyalty"
 innovation_eu5_subject_loyalty_absolutism_desc:0 "We tolerate no dissent or revolt. Absolute loyalty is demanded from all subjects, whether they are part of the core citizenry or a conquered group."
 innovation_eu5_diplomatic_range_age_5:0 "Diplomatic Missions"
 innovation_eu5_diplomatic_range_age_5_desc:0 "The complexity of modern politics can no longer be handled by single envoys. To expand our influence even further and protect our interests in those faraway places, we will send skilled teams of expert diplomats to each country."
 innovation_eu5_spy_construction_absolutism:0 "Expand Global Spy Networks"
 innovation_eu5_spy_construction_absolutism_desc:0 "As the various empires and institutions that make up our world continue to expand, we shall need to maintain and perhaps increase espionage if we wish to stay one step ahead of our rivals."
 innovation_eu5_town_rights_abs_advance:0 "Splendorous Court"
 innovation_eu5_town_rights_abs_advance_desc:0 "As the place of our court, our capital should also bask in the glory and magnificence of our rule. No other town or city should come close to it in majesty and grandeur."
 innovation_eu5_construction_speed_absolutism:0 "Architectural Engineering"
 innovation_eu5_construction_speed_absolutism_desc:0 "Building construction has become more sophisticated over time, incorporating methods and techniques from a wide range of disciplines, commonly considered a type of engineering."
 innovation_eu5_food_advance_absolutism:0 "Closed Fields"
 innovation_eu5_food_advance_absolutism_desc:0 "Until recently, land ownership and use was relatively common and free. However, there is now an increasing tendency to start a process of specific land delimitation, clearly determining the borders and size of fields exclusively dedicated to agriculture. With this kind of specified use, their production and exploitation can be greatly increased."
 innovation_eu5_rgo_size_advance_absolutism:0 "Physiocracy"
 innovation_eu5_rgo_size_advance_absolutism_desc:0 "Recent developments in economic thought have shifted the focus from the mercantilist ideals of value lying in trade towards the notion that value lies in the production process itself. As a result, production has been steadily improving and increasing."
 innovation_eu5_coke_blast_furnace:0 "Coke Blast Furnace"
 innovation_eu5_coke_blast_furnace_desc:0 "This is a new type of blast furnace, which uses coke instead of charcoal as its fuel. It is cheaper and allows us to build larger furnaces, although coke has the disadvantage of being less pure than charcoal, which is a problem yet to be addressed."
 innovation_eu5_central_bank_advance:0 "Central Banking"
 innovation_eu5_central_bank_advance_desc:0 "With the banking institution firmly established, the state can now charter a permanent central bank empowered to issue government bonds. These bonds allow the crown to raise large sums quickly from private investors, repaying them through steady interest rather than relying on estate lending alone."
 innovation_eu5_merchant_power_from_maritime_absolutism_advance:0 "Chamber of Commerce"
 innovation_eu5_merchant_power_from_maritime_absolutism_advance_desc:0 "With the emergence of new ideas about commerce and economics, the local businesses have joined together to form a business network that can further their interests and protect their rights against political entities and foreign influences."
 innovation_eu5_maritime_advance_age_5:0 "Convoys"
 innovation_eu5_maritime_advance_age_5_desc:0 "As maritime trade expands, with our ships ferrying goods back and forth in greater quantities and to more distant shores than ever before, the need to maintain a consistent flow of commerce also increases. Organizing convoy trade fleets will allow a more stable circulation of trade ships."
 innovation_eu5_scientific_revolution_advance:0 "Scientific Revolution"
 innovation_eu5_scientific_revolution_advance_desc:0 "Recent developments in mathematics, physics, astronomy, biology and chemistry have not only challenged, but completely changed our view of the world around us. Society is progressing at a greater speed than ever before, and more scientific breakthroughs are made every day."
 innovation_eu5_military_revolution_advance:0 "Military Revolution"
 innovation_eu5_military_revolution_advance_desc:0 "War never changes, but the manner of waging it does. Recent arms developments have proved that the old ways of fighting are obsolete, and armies have experienced a full paradigm shift. Adapting to those changes is the only way to continue being a strong military power."
 innovation_eu5_supply_depot_advance_age_5_absolutism:0 "Forward Depots"
 innovation_eu5_supply_depot_advance_age_5_absolutism_desc:0 "Armies can now penetrate deeper into enemy territory and sustain themselves there for longer periods, making it necessary to build and maintain forward depots closer to them while being linked to rear supply lines."
 innovation_eu5_national_sovereignty:0 "National Sovereignty"
 innovation_eu5_national_sovereignty_desc:0 "The many long wars in the first half of the 17th century have led to an international diplomatic system for which the territorial integrity of states is a cornerstone. States, rather than individual rulers or supra-national groupings, are the actors in the international arena, and no state has the right to intervene in the internal affairs of another."
 innovation_eu5_newspapers_advance:0 "Newspapers"
 innovation_eu5_newspapers_advance_desc:0 "The concept of announcements being announced or posted where the public may read them is certainly not a new one. However, as the Printing Press becomes more popular around the world, so does the demand for accessible information about politics, war, and the economy. The newspaper - a periodical publication describing current events - shall satisfy this demand."
 innovation_eu5_the_constitution:0 "The Constitution"
 innovation_eu5_the_constitution_desc:0 "A new philosophical concept called constitutionalism has been developed, wherein the government accepts legal limits to its power through established law rather than ruling by arbitrary decree. While some may find this idea intriguing, it is obviously not popular with monarchs..."
 innovation_eu5_sanitation_advance:0 "Sanitation"
 innovation_eu5_sanitation_advance_desc:0 "Settlements are investing in improved sanitation measures, such as waste disposal and clean water systems. This will reduce the spread of disease, and improve the overall health of the population. The development of modern sanitation practices will make it possible for people to live in closer proximity without succumbing to disease."
 culture_era_eu5_revolutions:0 "Age of Revolutions"
 culture_era_eu5_revolutions_desc:0 "Cultural and technological developments of the Age of Revolutions."
 innovation_eu5_modern_bureaucracy:0 "Modern Bureaucracy"
 innovation_eu5_modern_bureaucracy_desc:0 "In order to best utilize the lands and subjects we control, we must enlarge, reorganize, and professionalize our bureaucracy. We shall create organizations dedicated to administering specific aspects of the state, and thus eliminate the need for ad hoc solutions.\n\nLet us consult with our universities to determine how to most efficiently rule and govern. Meanwhile, we shall encourage our young nobles to serve the state with a pen rather than a sword in hand."
 innovation_eu5_crown_power_advance_revolutions:0 "Nation"
 innovation_eu5_crown_power_advance_revolutions_desc:0 "After unifying all the powers under the iron fist of our leader, subjects across the nation have suddenly become aware of a sense of belonging. Whatever region our monarchs rule, they are part of the nation and its people all the same."
 innovation_eu5_subject_income_revolutions_advance:0 "Paid Sovereignty"
 innovation_eu5_subject_income_revolutions_advance_desc:0 "The world around us is undergoing tremendous change in all sectors. We can capitalize on this instability by formalizing tributary arrangements with subject nations in exchange for supporting them. Sovereign protection, it turns out, has a price."
 innovation_eu5_diplomatic_range_age_6:0 "Global Embassies"
 innovation_eu5_diplomatic_range_age_6_desc:0 "With every nation trying to expand its reach even farther, the world has become more interconnected than ever before. Only establishing permanent embassies all over the globe can allow this interconnectivity to sustain itself."
 innovation_eu5_spy_construction_revolutions:0 "Contact with Dissidents"
 innovation_eu5_spy_construction_revolutions_desc:0 "As new ideas and political systems raise their heads around the world, there must logically also arise those who protest the status quo. We will need to allocate resources to support these dissenting voices in our rival nations in order to extract valuable information and contribute to their destabilizing effects."
 innovation_eu5_urbanization:0 "Urbanization"
 innovation_eu5_urbanization_desc:0 "The new opportunities and security offered by life in our emerging cities are drawing more and more people off of rural farms and into cities, where they are eager to take up industrial jobs created by the new, modern factories."
 innovation_eu5_construction_speed_revolutions:0 "Cast Iron Structures"
 innovation_eu5_construction_speed_revolutions_desc:0 "The development of more advanced metallurgy of wrought and cast iron allows for more elaborate metallic structures, such as pillars and columns, which makes building construction much faster."
 innovation_eu5_rotherham_plough:0 "Rotherham Plough"
 innovation_eu5_rotherham_plough_desc:0 "The basic plow in use in europe has been unchanged since Roman times. Now, thanks to an improved design, the same plow can be made much lighter, reducing the strain on draft animals and thereby getting more work out of them."
 innovation_eu5_rgo_size_advance_revolutions:0 "Steam Engine"
 innovation_eu5_rgo_size_advance_revolutions_desc:0 "Steam as a means to power a machine has been understood since antiquity. However, its potential had never been fully realized until recently, when the latest advances in physics and mathematics allowed the creation of more sophisticated steam engines, which in turn can power more complex machines. This allows for increased productivity in all fields."
 innovation_eu5_hot_blast_furnace:0 "Hot Blast Furnace"
 innovation_eu5_hot_blast_furnace_desc:0 "The problems posed by the coke blast furnaces, especially the amount of impurities the coke creates in the final cast iron, has led to the development of the hot blast. It not only greatly reduces the use of coke, therefore improving the quality of the iron, but also allows the use of raw mineral coal as fuel if available, which is a great step forward in iron metallurgy."
 innovation_eu5_the_gold_standard:0 "The Gold Standard"
 innovation_eu5_the_gold_standard_desc:0 "The ongoing trade deficit between europe and CHI has caused a shortage of silver bullion not only in europe, but all over the world. Switching from silver to gold coinage will allow new coins to enter circulation and encourage trade to flow in ever greater amounts."
 innovation_eu5_merchant_power_from_maritime_revolutions_advance:0 "Limited Companies"
 innovation_eu5_merchant_power_from_maritime_revolutions_advance_desc:0 "The frequent failures of chartered companies have led to the development of a new business model: limited companies, where shareholder liability is limited to their initial investment. This protection from unlimited debt makes such partnerships far less risky and more attractive to potential investors."
 innovation_eu5_maritime_advance_age_6:0 "Armed Convoys"
 innovation_eu5_maritime_advance_age_6_desc:0 "Trade convoys are obviously a very juicy target for any pirate. Ships full to the brim with goods and coins are a booty that few will let pass through. Thus, providing those trade convoys with defense armament to deter those attacks is vital. Having the trade fleets be accompanied by frigates or any other armed vessel ensures their safety."
 innovation_eu5_enlightenment_advance:0 "Enlightenment"
 innovation_eu5_enlightenment_advance_desc:0 "The last century has seen Rationalism and Empiricism gain ever-increasing popularity among the greatest minds of the age. The Light of Reason has been lit, and many will not rest until it has been brought to all corners of the earth."
 innovation_eu5_napoleonic_warfare:0 "Napoleonic Warfare"
 innovation_eu5_napoleonic_warfare_desc:0 "The wars of this age are decided on the battlefield, not in endless sieges. By drilling our soldiers relentlessly and committing them to bold, concentrated assaults, we can shatter the enemy in a single decisive engagement and win the war outright."
 innovation_eu5_supply_depot_advance_age_6_revolutions:0 "Campaign Depots"
 innovation_eu5_supply_depot_advance_age_6_revolutions_desc:0 "The operation of multiple armies on longer campaigns has put extra stress on our supply systems, making bigger, rapidly constructed depots even more important to sustain them."
 innovation_eu5_rights_of_man:0 "Rights of Man"
 innovation_eu5_rights_of_man_desc:0 "At the forefront of current revolutionary thought is the radical notion of equality for all. Philosophers from around the world have collaborated to create a document entitled the 'Declaration of the Rights of Man and of the Citizen', proclaiming that these rights are universal and should be enforced by law. It is likely that this will be ample fuel for popularizing the concepts of freedom and democracy, and we would do well not to lag behind other nations."
 innovation_eu5_separation_of_powers:0 "Separation of Powers"
 innovation_eu5_separation_of_powers_desc:0 "An incendiary, anonymous treatise on political theory has emerged. Despite efforts to suppress the text, it is spreading quickly across the world. It analyzes the nature of various forms of government, be they monarchies, despotisms, or democracies, and argues for a strict separation of the executive, legislative, and judiciary branches.\n\nThis separation would protect the people and limit monarchical, which is understandably a very popular prospect for many of our subjects. Despite the unfortunate implications for the ruler's authority, these ideas may well benefit our nation greatly."
 innovation_eu5_vaccination_advance:0 "Vaccination"
 innovation_eu5_vaccination_advance_desc:0 "With the development of vaccines, physicians are able to provide the populace with immunity against deadly diseases. These vaccines are helping to reduce the spread of disease and prevent epidemics. By injecting a small amount of weakened or dead bacteria or virus into the body, the immune system is able to recognize and fight off the disease if it ever encounters it again."
 innovation_eu5_industrialization_advance:0 "Industrialization"
 innovation_eu5_industrialization_advance_desc:0 "The Industrial Revolution has brought about permanent change — not just to commerce and business, but to the social fabric of many nations. Inventions such as the power loom and steam engine shall push the capabilities of mankind to its highest zenith yet."
