 kuzhu_form_eastern_japanese_culture_decision_desc: "The culture of Kyoto has long been held by court nobles，devoted to empty ceremony and breeding wastrels. We men of Kanto are diligent and practical，keeping ourselves upright—we must not be counted among them." 
