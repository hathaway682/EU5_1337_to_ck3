 kuzhu_tradition_mengan_mouke_name: "Meng'an Mouke"
 kuzhu_tradition_mengan_mouke_desc: "Soldiers and folk are one, able to till and able to fight；devoted wholly to the state，keeping no private desires."
 tradition_kuzhu_chinese_armoury_name: "Imperial Armoury"
 tradition_kuzhu_chinese_armoury_desc: "Armour and arms，all stored in the arsenal；long blades and strong crossbows，issued by the court."
 tradition_kuzhu_proved_by_sword_name: "Proven by the Sword"
 tradition_kuzhu_proved_by_sword_desc: "Who says kings and lords are born to rule？It is but fortune. The realm has no eternal master, only the strongest may hold it！" 
 tradition_kuzhu_minor_china_name: "Minor China"
 tradition_kuzhu_minor_china_desc: "This culture closely resembles Han culture in every way，and its people consider themselves offspring of Chinese."
 tradition_kuzhu_praise_literature_name: "Select Officials by Literature"
 tradition_kuzhu_praise_literature_desc: "Rule the great realm with letters，not arms. A monarch should weigh the famous scholars of the realm by their literary talent and employ the best."
 culture_parameter_kuzhu_confucian_education_add_merit_level: "The [GetTrait('confucian_education').GetName( GetNullCharacter )] trait provides a [merit_level|E] cap"
