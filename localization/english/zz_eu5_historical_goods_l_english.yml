 eu5_goods_nile_delta_legumes_base_desc:0 "$STATIC_MODIFIER_DESC_nile_delta_rice_base$"
 eu5_goods_nile_delta_rice_base:0 "Fertile Nile Delta"
 eu5_goods_nile_delta_rice_base_desc:0 "The floodplains of the Nile are fertile grounds for all type of crops to grow."
