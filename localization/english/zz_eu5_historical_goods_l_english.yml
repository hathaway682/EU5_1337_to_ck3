l_english:
 eu5_goods_alpujarras_silk_base:0 "Alpujarran Silk"
 eu5_goods_alpujarras_silk_base_desc:0 "The mulberry groves and silkworm sheds of the Alpujarra villages on the southern slopes of the Sierra Nevada supply the raw silk that feeds the looms of Granada and Almería, graded under the strict #italic ḥisba#! inspectorates and bought up by Genoese factors for the markets of Flanders and England."
 eu5_goods_amber_coast_base:0 "Amber Coast"
 eu5_goods_amber_coast_base_desc:0 "The coast of this region has many deposits of amber."
 eu5_goods_bengal_cotton_base:0 "Bengali Cotton Cultivation"
 eu5_goods_bengal_cotton_base_desc:0 "The warm and humid climate of Bengal is ideal for growing fine cotton, making this one of the most productive cotton-growing regions in the world."
 eu5_goods_coffee_yemen_base:0 "Coffee Arabica"
 eu5_goods_coffee_yemen_base_desc:0 "The soil of Yemen produces large quantities of coffee beans."
 eu5_goods_england_wool_base:0 "English Wool Country"
 eu5_goods_england_wool_base_desc:0 "This region produces some of the finest wool in the world, sought after by cloth merchants across Europe."
 eu5_goods_flanders_fine_cloth_base:0 "Flemish Cloth Tradition"
 eu5_goods_flanders_fine_cloth_base_desc:0 "The weavers of Flanders have refined their craft over generations, producing fine cloth of exceptional quality that commands premium prices across Europe."
 eu5_goods_granada_pottery_base:0 "Granadan Pottery"
 eu5_goods_granada_pottery_base_desc:0 "The clay beds along the Darro and the Genil supply the lusterware and #italic cuerda seca#! workshops of the Albaicín, producing tilework, jars, and tableware whose glaze techniques are envied from Cairo to Bruges and whose finest pieces grace the chambers of the Alhambra itself."
 eu5_goods_gujarat_cotton_base:0 "Gujarati Cotton Cultivation"
 eu5_goods_gujarat_cotton_base_desc:0 "Gujarat's fertile plains produce abundant cotton, a cornerstone of the region's textile trade."
 eu5_goods_malaga_sweet_wine_base:0 "Málagan Vineyards and Sugar Mills"
 eu5_goods_malaga_sweet_wine_base_desc:0 "The sugar plantations and vineyards of the coastal #italic vega#! around Málaga, cultivated by Andalusi engineers since the tenth century, supply both their own markets and the Genoese houses that ship the produce to Bruges and Alexandria."
 eu5_goods_newfoundland_fishing_grounds_base:0 "Newfoundland Fishing Grounds"
 eu5_goods_newfoundland_fishing_grounds_base_desc:0 "The waters around the island of Newfoundland are the richest fishing grounds in the entire world."
