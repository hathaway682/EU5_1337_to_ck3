 eu5_goods_skane_herring_market:0 "The Skåne Herring Market"
 eu5_goods_skane_herring_market_desc:0 "Founded around 1200, this is the major market for herring in all of Scandinavia."
 eu5_goods_spice_islands_base:0 "Spice Islands Cloves"
 eu5_goods_spice_islands_base_desc:0 "Cloves, a much-desired spice, are grown in large quantities on this island."
 eu5_goods_tuscany_fine_cloth_base:0 "Tuscan Textile Tradition"
 eu5_goods_tuscany_fine_cloth_base_desc:0 "Florence and Lucca have long been the pre-eminent centers of fine cloth production in Italy, with guilds whose techniques are the envy of Europe."
 eu5_goods_venice_glass_base:0 "Murano Glassmaking Tradition"
 eu5_goods_venice_glass_base_desc:0 "The glassmakers of Murano have mastered techniques passed down through generations, producing glassware of unrivalled quality."
 eu5_goods_yorkshire_cloth_base:0 "Yorkshire Cloth Industry"
 eu5_goods_yorkshire_cloth_base_desc:0 "The towns of Yorkshire and the East Midlands have developed a thriving cloth industry, their weavers skilled in producing quality woollen cloth."
